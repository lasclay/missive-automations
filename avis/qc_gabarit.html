<title>Avis à verser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#EDEFE9; --surface:#FBFCF9; --entete:#E3E7DE; --raye:#F4F6F1;
    --ink:#1A211B; --muted:#5E6A60; --faint:#8A9489;
    --accent:#3D6A4B; --accent-soft:#DCE6DA;
    --flag:#B4531B; --flag-soft:#F6E7DA;
    --line:#D9DED4; --line-firm:#B7C0B3;
    --serif:"Instrument Serif",Georgia,serif;
    --sans:"Karla",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#12160F; --surface:#191E16; --entete:#232A1F; --raye:#1D2319;
      --ink:#E8EDE4; --muted:#9AA697; --faint:#6E7A6C;
      --accent:#87B98F; --accent-soft:#243425;
      --flag:#E08A4C; --flag-soft:#3A2416;
      --line:#2A3126; --line-firm:#3E4739;
    }
  }
  :root[data-theme="dark"]{
    --ground:#12160F; --surface:#191E16; --entete:#232A1F; --raye:#1D2319;
    --ink:#E8EDE4; --muted:#9AA697; --faint:#6E7A6C;
    --accent:#87B98F; --accent-soft:#243425;
    --flag:#E08A4C; --flag-soft:#3A2416;
    --line:#2A3126; --line-firm:#3E4739;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;
       line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{padding:0 20px 80px;max-width:1600px;margin:0 auto}

  header{padding:44px 0 20px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1.02;
     margin:0 0 10px;letter-spacing:-.01em}
  .sous{color:var(--muted);max-width:64ch;margin:0}

  .compte{display:flex;flex-wrap:wrap;margin:22px 0 0;
          border-top:1px solid var(--line-firm);border-bottom:1px solid var(--line-firm)}
  .compte div{flex:1 1 120px;padding:12px 18px 12px 0;border-right:1px solid var(--line)}
  .compte div:last-child{border-right:0}
  .compte .v{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
  .compte .k{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .compte .alerte .v{color:var(--flag)}

  .barre{position:sticky;top:0;z-index:20;background:var(--ground);
         border-bottom:1px solid var(--line-firm);padding:12px 0}
  input[type=search]{width:100%;max-width:420px;font:inherit;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-firm);border-radius:2px;padding:8px 11px}
  input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .filtres{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  button.f{font:inherit;font-size:.8rem;color:var(--muted);background:transparent;
    border:1px solid var(--line-firm);border-radius:2px;padding:4px 10px;cursor:pointer}
  button.f:hover{color:var(--ink);border-color:var(--ink)}
  button.f[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  button.f.alerte[aria-pressed=true]{background:var(--flag);border-color:var(--flag);color:#fff}
  button.f:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sep{width:1px;height:20px;background:var(--line-firm);margin:0 4px}

  .cadre{overflow:auto;max-height:74vh;border:1px solid var(--line-firm);background:var(--surface);
         margin-top:14px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:.82rem}
  thead th{position:sticky;top:0;z-index:2;background:var(--entete);text-align:left;
    font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.05em;
    padding:9px 10px;border-bottom:1px solid var(--line-firm);white-space:nowrap;color:var(--muted)}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even){background:var(--raye)}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr.signale td:first-child{box-shadow:inset 3px 0 0 var(--flag)}
  td.body{min-width:340px;max-width:520px}
  td.title{min-width:140px;max-width:200px;font-weight:500}
  td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  td.rating{font-family:var(--mono);text-align:center;color:var(--accent);font-weight:500}
  td.rating.n4{color:var(--flag)}
  td.nom{white-space:nowrap;min-width:130px}
  td.handle{font-family:var(--mono);font-size:.75rem;white-space:nowrap}
  .marque{display:inline-block;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;
    padding:1px 6px;border:1px solid var(--line-firm);border-radius:2px;color:var(--muted)}
  .marque.cmd{border-color:var(--flag);color:var(--flag)}
  .marque.bout{border-color:var(--accent);color:var(--accent)}
  .vide{padding:40px;text-align:center;color:var(--muted)}
  .note-bas{margin-top:14px;font-size:.82rem;color:var(--muted);max-width:70ch}
</style>

<div class="wrap">
  <header>
    <h1>Avis à verser</h1>
    <p class="sous">Le gabarit d'importation Judge.me, tel qu'il sera versé. Chaque avis n'utilise
      que les mots réellement écrits par la personne. Une ligne par produit : un même avis se publie
      sur chaque fiche que le client a évaluée.</p>
    <div class="compte" id="compte"></div>
  </header>

  <div class="barre">
    <input type="search" id="q" placeholder="Chercher dans le texte, les noms, les produits…" autocomplete="off">
    <div class="filtres" id="filtres">
      <button class="f" data-f="tout" aria-pressed="true">Tout</button>
      <button class="f" data-f="texte" aria-pressed="false">Produit nommé dans le texte</button>
      <button class="f alerte" data-f="commande" aria-pressed="false">Produit déduit de la commande</button>
      <button class="f" data-f="boutique" aria-pressed="false">Avis de boutique</button>
      <button class="f" data-f="n4" aria-pressed="false">Note 4</button>
      <button class="f alerte" data-f="sanscmd" aria-pressed="false">Aucune commande, pas de badge</button>
      <span class="sep"></span>
      <button class="f" id="colonnes" aria-pressed="false">Colonnes vides du gabarit</button>
    </div>
  </div>

  <div class="cadre"><table id="t"><thead></thead><tbody></tbody></table></div>
  <p class="note-bas" id="pied"></p>
</div>

<script id="donnees" type="application/json">__DONNEES__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById("donnees").textContent);
  const COL = D.col, R = D.rows;
  const iSrc = COL.indexOf("_src"), iCmd = COL.indexOf("_cmd");
  const VISIBLES = ["title","body","rating","review_date","reviewer_name","reviewer_email","product_handle","product_id"];
  const VIDES = ["source","curated","reply","reply_date","picture_urls","ip_address","location","metaobject_handle"];
  let filtre = "tout", toutesColonnes = false;

  const idx = {}; COL.forEach((c,i)=>idx[c]=i);
  const g = (r,c) => r[idx[c]] || "";

  const nbAvis = new Set(R.map(r=>g(r,"reviewer_email")+"|"+g(r,"body"))).size;
  const sansCmd = R.filter(r=>r[iCmd]==="non").length;
  document.getElementById("compte").innerHTML = [
    ["Lignes", R.length, false],
    ["Avis", nbAvis, false],
    ["Personnes", new Set(R.map(r=>g(r,"reviewer_email").toLowerCase())).size, false],
    ["Produit déduit", R.filter(r=>r[iSrc]==="commande").length, true],
    ["Avis de boutique", R.filter(r=>r[iSrc]==="boutique").length, false],
  ].map(([k,v,al])=>`<div class="${al&&v?"alerte":""}"><span class="v">${v}</span><span class="k">${k}</span></div>`).join("");

  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function rendre(){
    const terme = document.getElementById("q").value.trim().toLowerCase();
    const cols = toutesColonnes ? COL.filter(c=>!c.startsWith("_")) : VISIBLES;
    const vus = R.filter(r=>{
      if (filtre==="texte" && r[iSrc]!=="texte") return false;
      if (filtre==="commande" && r[iSrc]!=="commande") return false;
      if (filtre==="boutique" && r[iSrc]!=="boutique") return false;
      if (filtre==="n4" && g(r,"rating")!=="4") return false;
      if (filtre==="sanscmd" && r[iCmd]!=="non") return false;
      if (!terme) return true;
      return r.join(" ").toLowerCase().includes(terme);
    });

    document.querySelector("#t thead").innerHTML =
      "<tr>" + cols.map(c=>`<th>${c}</th>`).join("") + "<th>attribution</th></tr>";

    if (!vus.length){
      document.querySelector("#t tbody").innerHTML =
        `<tr><td class="vide" colspan="${cols.length+1}">Aucune ligne ne correspond.</td></tr>`;
    } else {
      document.querySelector("#t tbody").innerHTML = vus.map(r=>{
        const tds = cols.map(c=>{
          const v = g(r,c);
          if (c==="body")   return `<td class="body">${esc(v)}</td>`;
          if (c==="title")  return `<td class="title">${esc(v)}</td>`;
          if (c==="rating") return `<td class="rating ${v==="4"?"n4":""}">${esc(v)}</td>`;
          if (c==="review_date") return `<td class="mono">${esc(v.slice(0,10))}</td>`;
          if (c==="reviewer_name") return `<td class="nom">${esc(v)}</td>`;
          if (c==="reviewer_email") return `<td class="mono">${esc(v)}</td>`;
          if (c==="product_handle"||c==="product_id") return `<td class="handle">${esc(v)}</td>`;
          return `<td class="mono">${esc(v)}</td>`;
        }).join("");
        const m = r[iSrc]==="boutique" ? '<span class="marque bout">boutique</span>'
                : r[iSrc]==="commande" ? '<span class="marque cmd">commande</span>'
                : '<span class="marque">texte</span>';
        return `<tr class="${r[iCmd]==="non"?"signale":""}">${tds}<td>${m}</td></tr>`;
      }).join("");
    }
    document.getElementById("pied").textContent =
      `${vus.length} lignes affichées sur ${R.length}. La bordure orange marque une adresse sans commande retrouvée dans Shopify : ces avis s'importeront sans le badge « acheteur vérifié ».`;
  }

  document.getElementById("filtres").addEventListener("click", e=>{
    const b = e.target.closest("button.f"); if(!b) return;
    if (b.id==="colonnes"){
      toutesColonnes = !toutesColonnes;
      b.setAttribute("aria-pressed", String(toutesColonnes));
    } else {
      filtre = b.dataset.f;
      document.querySelectorAll("button.f[data-f]").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    }
    rendre();
  });
  document.getElementById("q").addEventListener("input", rendre);
  rendre();
})();
</script>
