<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasclay — Shopify → QuickBooks</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1a1d21; --muted: #6b7280; --line: #e3e6ea;
    --accent: #1f6feb; --ok: #157347; --warn: #b45309; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1c1f24; --ink:#e8eaed; --muted:#9aa2ad; --line:#2c3138;
            --accent:#5a9bff; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  header .sub { color:var(--muted); font-size:12px; }
  nav { display:flex; gap:4px; margin-left:auto; }
  nav button { background:transparent; border:1px solid transparent; color:var(--muted); padding:6px 12px; border-radius:7px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--bg); border-color:var(--line); color:var(--ink); font-weight:600; }
  main { padding:20px; max-width:1180px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:14px; margin:0 0 12px; font-weight:650; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .muted { color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:currentColor; }
  .pill.warn { color:var(--warn); border-color:currentColor; }
  .pill.bad { color:var(--bad); border-color:currentColor; }
  button.act { background:var(--accent); color:#fff; border:0; padding:7px 14px; border-radius:7px; cursor:pointer; font:inherit; font-weight:600; }
  button.act:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); padding:6px 12px; border-radius:7px; cursor:pointer; font:inherit; }
  input, select { background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:5px 8px; font:inherit; font-size:13px; max-width:100%; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1 1 200px; }
  .banner { padding:10px 12px; border-radius:8px; border:1px solid var(--line); margin-bottom:12px; font-size:13px; }
  .banner.warn { border-color:var(--warn); color:var(--warn); }
  .banner.bad { border-color:var(--bad); color:var(--bad); }
  .banner.ok { border-color:var(--ok); color:var(--ok); }
  a { color:var(--accent); }
  .clickable { cursor:pointer; }
  .selcol { width:34px; text-align:center; user-select:none; }
  .clickable:hover td { background:rgba(127,127,127,.07); }
  .scroll { overflow-x:auto; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .spinner { color:var(--muted); padding:16px 0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Shopify → QuickBooks</h1>
    <div class="sub" id="status">Chargement…</div>
  </div>
  <nav>
    <button data-tab="payouts" class="on">Versements</button>
    <button data-tab="monthly" title="PayPal, cartes-cadeaux, commandes manuelles — l'écriture qu'A2X faisait une fois par mois">Mensuel</button>
    <button data-tab="mappings">Mappings</button>
    <button data-tab="settings">Réglages</button>
  </nav>
</header>

<main>
  <section id="tab-payouts"></section>
  <section id="tab-monthly" hidden></section>
  <section id="tab-mappings" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => (n < 0 ? "−" : "") + Math.abs(Number(n) || 0).toLocaleString("fr-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const day = (iso) => (iso || "").slice(0, 10);

let secret = localStorage.getItem("a2xSecret") || "";
const state = { accounts: [], taxOptions: [], mappings: null, dirty: new Map() };

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-App-Secret": secret, ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({ error: "Réponse illisible du serveur." }));
  if (!res.ok) throw new Error(body.error || `Erreur ${res.status}`);
  return body;
}

// ------------------------------------------------------------------ onglets

document.querySelectorAll("nav button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
    for (const t of ["payouts", "monthly", "mappings", "settings"]) $("#tab-" + t).hidden = t !== b.dataset.tab;
    if (b.dataset.tab === "mappings" && !state.mappings) loadMappings();
    if (b.dataset.tab === "monthly") loadMonths();
    if (b.dataset.tab === "settings") renderSettings();
  };
});

// ----------------------------------------------------------------- versements

/** Lien direct vers la pièce dans QuickBooks (il faut être connecté à QBO). */
const qboLink = (id) => `https://app.qbo.intuit.com/app/journal?txnId=${encodeURIComponent(id)}`;

/**
 * Une écriture existe déjà : dire QUI l'a faite et vers QUELLE pièce, plutôt
 * qu'un simple « comptabilisé » qu'on lit à tort comme « publié par cette app ».
 */
function postedCell(pos) {
  const who = pos.source === "app"
    ? `<span class="pill ok">publiée ici</span>`
    : `<span class="pill" style="color:var(--accent);border-color:currentColor">faite par A2X</span>`;
  return `${who}
    <a href="${qboLink(pos.id)}" target="_blank" rel="noopener" title="Ouvrir la pièce dans QuickBooks">pièce ${esc(pos.id)}</a>
    <span class="muted"><code>${esc(pos.docNumber)}</code> · ${esc(day(pos.txnDate))} · appariée par ${esc(pos.match)}</span>`;
}

/**
 * Une piste utile plutôt qu'un conseil générique : l'erreur dit déjà d'où vient
 * le blocage, encore faut-il ne pas envoyer l'utilisateur au mauvais endroit.
 */
function hintFor(message) {
  const m = String(message || "");
  if (/invalid_grant|invalid refresh token/i.test(m)) {
    return `Le jeton QuickBooks du finance-proxy est expiré — ce n'est PAS le mot de passe de cette app.
      Il faut refaire l'autorisation Intuit : <code>node qbo_auth.js url</code> puis <code>exchange</code>,
      et remettre le <code>QBO_REFRESH_TOKEN</code> obtenu dans les variables du service finance-proxy.`;
  }
  if (/shopifyPaymentsAccount|read_shopify_payments/i.test(m)) {
    return `L'app Shopify n'a pas la portée <code>read_shopify_payments_payouts</code> dans le jeton.
      Vérifie-la dans Réglages → « Vérifier les portées du jeton ».`;
  }
  if (/mot de passe|401/i.test(m)) return `Va dans <b>Réglages</b> pour saisir le mot de passe de l'interface.`;
  if (/SHOPIFY_STORE|FINANCE_PROXY/i.test(m)) return `Une variable d'environnement manque sur le service Render.`;
  return `Le message ci-dessus vient tel quel du service concerné.`;
}

/**
 * Une composante sans compte bloque la publication — c'est ce que faisait A2X,
 * et c'est voulu : une écriture amputée d'une ligne serait fausse et
 * déséquilibrée. Ce qu'A2X ne faisait pas, c'est proposer le correctif sur
 * place : chaque composante manquante porte son bouton « Créer la règle », qui
 * ajoute la combinaison exacte (type, pays, canal) dans mappings.tsv.
 */
function unmappedBanner(unmapped) {
  if (!unmapped || !unmapped.length) return "";
  const lignes = unmapped.map((u, i) => `
    <div class="row" style="margin:6px 0">
      <span class="num" style="min-width:90px">${money(u.amount)} $</span>
      <span class="grow">${esc(u.description)}</span>
      <select class="fixacct" data-i="${i}" style="max-width:260px">${accountOptions("")}</select>
      <button class="ghost fixgo" data-i="${i}">Créer la règle</button>
    </div>`).join("");
  return `<div class="banner warn"><b>${unmapped.length} composante(s) sans compte — publication bloquée.</b>
    <div class="muted">Choisis le compte, la règle est ajoutée aux mappings et l'écriture est recalculée.</div>
    ${lignes}
    <div id="fixmsg" class="muted"></div></div>`;
}

/** Le menu des comptes QuickBooks, partagé par les mappings et le correctif rapide. */
function accountOptions(selected) {
  return `<option value="">— choisir un compte —</option>` + state.accounts.map((a) =>
    `<option value="${esc(a.num)}" ${String(a.num) === String(selected) ? "selected" : ""}>${esc(a.num)} — ${esc(a.name)}</option>`).join("");
}

/** Branche les boutons « Créer la règle » du bandeau ci-dessus. */
function wireUnmapped(root, unmapped, reload) {
  root.querySelectorAll("button.fixgo").forEach((btn) => {
    btn.onclick = async () => {
      const u = unmapped[Number(btn.dataset.i)];
      const acctNum = root.querySelector(`select.fixacct[data-i="${btn.dataset.i}"]`).value;
      if (!acctNum) { $("#fixmsg").innerHTML = `<span class="pill bad">Choisis d'abord un compte.</span>`; return; }
      btn.disabled = true;
      $("#fixmsg").textContent = "Ajout de la règle…";
      try {
        // Pas de code de taxe transmis : le serveur reprend celui des règles
        // sœurs. Une ligne de paiement en attente n'en porte aucun, une ligne
        // de revenu porte « Détaxé on Sales » — et on ne veut pas y penser ici.
        const r = await api("/mappings/apply", {
          method: "POST",
          body: JSON.stringify({
            category: u.category, details: u.details,
            country: u.country, marketplace: u.marketplace,
            acctNum,
          }),
        });
        state.mappings = null;
        const opt = (state.taxOptions || []).find((o) => o.value === r.tax);
        $("#fixmsg").innerHTML = `<span class="pill ok">Règle ajoutée</span>
          <span class="muted">taxe : ${esc(opt ? opt.label : "aucune")} — recalcul…</span>`;
        reload();
      } catch (e) {
        $("#fixmsg").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
        btn.disabled = false;
      }
    };
  });
}

/**
 * Un déséquilibre n'est presque jamais mystérieux : c'est le total de ce qu'on
 * n'a pas su mapper. Le dire évite de chercher ailleurs — et évite surtout la
 * situation d'avant, où l'écriture s'équilibrait en faisant tomber le manquant
 * dans le compte de change.
 */
function balanceBanner(j) {
  if (j.balanced) return "";
  const manquant = (j.unmapped || []).reduce((t, u) => t + u.amount, 0);
  if (manquant) {
    return `<div class="banner bad">Écriture déséquilibrée de ${money(Math.abs(manquant))} $ —
      c'est exactement le total des composantes sans compte ci-dessous.
      Donne-leur un compte et l'écriture s'équilibrera.</div>`;
  }
  return `<div class="banner bad">Écriture déséquilibrée — publication bloquée.</div>`;
}

/** Le libellé lisible d'un compte QuickBooks, à partir de son Id. */
function acctLabel(id) {
  const a = state.accounts.find((x) => String(x.id) === String(id));
  return a ? `${a.num ? a.num + " : " : ""}${a.name}` : `Compte ${id}`;
}

/**
 * Le tableau de l'écriture, avec le mapping MODIFIABLE sur place.
 *
 * C'est la différence avec A2X : là-bas, corriger un compte voulait dire quitter
 * l'écriture, ouvrir la table des 349 mappings, y retrouver la bonne ligne,
 * revenir, recharger. Ici le menu des comptes est dans la ligne elle-même, et
 * ce qu'on choisit part dans mappings.tsv.
 *
 * Les lignes de contrepartie (arrondi de change, règlement) ne viennent d'aucune
 * règle : leur compte reste en texte, il se change dans config.json.
 */
function journalTable(j) {
  const debit = j.lines.filter((l) => l.posting === "Debit").reduce((t, l) => t + l.amount, 0);
  const credit = j.lines.filter((l) => l.posting === "Credit").reduce((t, l) => t + l.amount, 0);
  const mappable = j.lines.some((l) => l.map);
  return `
    ${mappable ? `<div class="row" style="margin:0 0 10px">
      <span class="muted">Le compte et la taxe se changent directement dans le tableau — c'est enregistré dans les mappings.</span>
      <button class="act" id="savemap" disabled style="margin-left:auto">Enregistrer les mappings</button>
      <span id="mapmsg" class="muted"></span>
    </div>` : ""}
    <div class="scroll"><table>
      <thead><tr><th>Description</th><th>Compte</th><th>Taxe</th><th class="num">Débit</th><th class="num">Crédit</th></tr></thead>
      <tbody>${j.lines.map((l, i) => `
        <tr>
          <td>${esc(l.description)}${fallbackPill(l.map)}</td>
          <td>${l.map
            ? `<select class="lineacct" data-i="${i}" style="max-width:280px">${accountOptions(l.map.acctNum)}</select>`
            : `<span class="muted">${esc(acctLabel(l.accountId))}</span>`}</td>
          <td>${l.map
            ? `<select class="linetax" data-i="${i}" style="max-width:190px">${taxOptionsHtml(l.map.taxValue)}</select>`
            : `<span class="muted">—</span>`}</td>
          <td class="num">${l.posting === "Debit" ? money(l.amount) : ""}</td>
          <td class="num">${l.posting === "Credit" ? money(l.amount) : ""}</td>
        </tr>`).join("")}</tbody>
      <tfoot><tr>
        <th colspan="3">Total</th>
        <th class="num">${money(debit)}</th>
        <th class="num">${money(credit)}</th>
      </tr></tfoot>
    </table></div>`;
}

/**
 * Dire d'où vient le compte quand ce n'est PAS une règle exacte : le modifier
 * créera une règle exacte au lieu de toucher la règle générale, qui sert
 * ailleurs. Sans ce repère, on croit modifier une ligne et on en change dix.
 */
function fallbackPill(map) {
  if (!map || map.fallback === "exact") return "";
  return ` <span class="pill" style="color:var(--muted)"
    title="Aucune règle exacte pour cette combinaison. Le compte vient de « ${esc(map.matched || "")} » (${esc(map.fallback)}). Le changer ici créera une règle exacte, sans toucher la règle générale.">${esc(map.fallback)}</span>`;
}

/** Branche les menus du tableau ci-dessus, et leur enregistrement groupé. */
function wireJournalTable(root, j, reload) {
  const btn = root.querySelector("#savemap");
  const msg = root.querySelector("#mapmsg");
  if (!btn) return;
  const dirty = new Map();

  const touch = (i) => {
    const m = j.lines[i].map;
    const acctNum = root.querySelector(`select.lineacct[data-i="${i}"]`).value;
    const tax = root.querySelector(`select.linetax[data-i="${i}"]`).value;
    if (acctNum === (m.acctNum || "") && tax === (m.taxValue || "")) dirty.delete(i);
    else dirty.set(i, { ...m, acctNum, tax });
    btn.disabled = dirty.size === 0;
    btn.textContent = dirty.size ? `Enregistrer les mappings (${dirty.size})` : "Enregistrer les mappings";
  };
  root.querySelectorAll("select.lineacct, select.linetax")
    .forEach((sel) => (sel.onchange = () => touch(Number(sel.dataset.i))));

  btn.onclick = async () => {
    btn.disabled = true;
    msg.textContent = "Enregistrement…";
    try {
      const faits = [];
      for (const m of dirty.values()) {
        const r = await api("/mappings/apply", { method: "POST", body: JSON.stringify(m) });
        faits.push(r.action.kind);
      }
      state.mappings = null;
      const creees = faits.filter((k) => k === "creee").length;
      msg.innerHTML = `<span class="pill ok">${faits.length} enregistré(s)</span>
        <span class="muted">${creees ? `${creees} règle(s) exacte(s) créée(s), ` : ""}recalcul de l'écriture…</span>`;
      reload();
    } catch (e) {
      msg.innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
      btn.disabled = false;
    }
  };
}

/**
 * Dire quand QuickBooks a refusé le bloc de taxe et qu'on a publié en mode
 * allégé : les montants sont les mêmes, mais autant que ce soit visible.
 */
const taxNote = (mode) =>
  !mode || mode === "full" ? "" :
  ` <span class="muted" title="QuickBooks a refusé le bloc de taxe complet. Les montants sont identiques ; seule l'annotation de taxe de la ligne change.">(taxe : mode ${esc(mode)})</span>`;

async function loadPayouts() {
  const el = $("#tab-payouts");
  el.innerHTML = `<div class="card"><div class="spinner">Chargement des versements Shopify…</div></div>`;
  try {
    const { payouts } = await api("/payouts?limit=30");
    const todo = payouts.filter((p) => !p.posted);
    el.innerHTML = `
      <div class="card">
        <h2>Versements Shopify Payments</h2>
        <div class="row" style="margin-bottom:12px">
          <span class="muted">${todo.length} versement(s) sans écriture.</span>
          <button class="ghost" id="selall" ${todo.length ? "" : "disabled"}>Tout sélectionner</button>
          <button class="act" id="postsel" disabled>Publier la sélection</button>
          <span id="batchmsg" class="muted"></span>
          <span class="muted" style="margin-left:auto">Maj+clic : sélectionner une plage.</span>
        </div>
        <div class="scroll"><table>
          <thead><tr><th class="selcol"></th><th>Versement</th><th>Émis le</th><th>Statut</th>
            <th class="num">Net</th><th>Écriture dans QuickBooks</th></tr></thead>
          <tbody>${payouts.map((p) => `
            <tr data-id="${esc(p.id)}">
              <td class="selcol">${p.posted ? "" : `<input type="checkbox" class="sel" value="${esc(p.id)}">`}</td>
              <td class="clickable open"><code>${esc(p.id)}</code></td>
              <td class="clickable open">${esc(day(p.issuedAt))}</td>
              <td class="muted clickable open">${esc(p.status)}</td>
              <td class="num clickable open">${money(p.net)} ${esc(p.currency)}</td>
              <td>${p.posted ? postedCell(p.posted) : `<span class="pill warn">aucune</span>`}
                  <span class="muted result" data-for="${esc(p.id)}"></span></td>
            </tr>`).join("")}</tbody>
        </table></div>
        ${payouts.length ? "" : `<p class="muted">Aucun versement trouvé.</p>`}
      </div>
      <div id="journal"></div>`;

    el.querySelectorAll("td.open").forEach((td) => (td.onclick = () => loadJournal(td.closest("tr").dataset.id)));

    const boxes = [...el.querySelectorAll("input.sel")];
    const sync = () => {
      const n = boxes.filter((b) => b.checked).length;
      $("#postsel").disabled = n === 0;
      $("#postsel").textContent = n ? `Publier la sélection (${n})` : "Publier la sélection";
    };

    /**
     * Maj+clic : étend la sélection depuis la dernière case cochée jusqu'à
     * celle-ci, comme dans un explorateur de fichiers. Le clic a déjà basculé
     * la case au moment où on arrive ici, donc on recopie simplement son état
     * sur toute la plage — cocher comme décocher.
     */
    let ancre = -1;
    boxes.forEach((b, i) => {
      b.onclick = (ev) => {
        if (ev.shiftKey && ancre >= 0 && ancre !== i) {
          const [a, z] = ancre < i ? [ancre, i] : [i, ancre];
          for (let k = a; k <= z; k++) boxes[k].checked = b.checked;
        }
        ancre = i;
        sync();
      };
    });

    $("#selall").onclick = () => {
      const all = boxes.every((b) => b.checked);
      boxes.forEach((b) => (b.checked = !all));
      $("#selall").textContent = all ? "Tout sélectionner" : "Tout désélectionner";
      ancre = -1;
      sync();
    };

    $("#postsel").onclick = async () => {
      const ids = boxes.filter((b) => b.checked).map((b) => b.value);
      if (!confirm(`Publier ${ids.length} écriture(s) dans QuickBooks ?\n\nCette action crée de vraies écritures comptables.`)) return;
      $("#postsel").disabled = true;
      $("#selall").disabled = true;
      $("#batchmsg").textContent = `Publication de ${ids.length} écriture(s)…`;
      try {
        const r = await api("/payouts/post-batch", { method: "POST", body: JSON.stringify({ ids }) });
        for (const res of r.results) {
          const cell = el.querySelector(`.result[data-for="${CSS.escape(res.id)}"]`);
          if (!cell) continue;
          cell.innerHTML = res.ok
            ? ` <span class="pill ok">créée — pièce ${esc(res.pieceId)}</span>${taxNote(res.taxMode)}`
            : ` <div class="banner ${res.skipped ? "warn" : "bad"}" style="margin:6px 0 0;white-space:pre-wrap">${esc(res.reason)}</div>`;
        }
        $("#batchmsg").innerHTML = `<b>${r.created} créée(s)</b>, ${r.skipped} ignorée(s), ${r.failed} en échec.`;
        setTimeout(loadPayouts, 4000);
      } catch (e) {
        $("#batchmsg").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
        $("#postsel").disabled = false;
        $("#selall").disabled = false;
      }
    };
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="banner bad" style="white-space:pre-wrap">${esc(e.message)}</div>
      <p class="muted">${hintFor(e.message)}</p></div>`;
  }
}

async function loadJournal(id) {
  const el = $("#journal");
  el.innerHTML = `<div class="card"><div class="spinner">Calcul de l'écriture du versement ${esc(id)}…</div></div>`;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  try {
    const d = await api("/payouts/" + encodeURIComponent(id));
    const j = d.journal;
    el.innerHTML = `
      <div class="card">
        <h2>Écriture ${esc(j.docNumber)}</h2>
        <p class="muted">Période ${esc(j.period.start)} → ${esc(j.period.end)} ·
           ${d.counts.transactions} transaction(s), ${d.counts.orders} commande(s) ·
           net déposé ${money(j.settlement)} $ (Shopify annonce ${money(j.payoutNet)} $)</p>

        ${balanceBanner(j)}
        ${unmappedBanner(j.unmapped)}
        ${d.existing ? `<div class="banner ok">Une écriture couvre déjà ce versement —
          ${d.existing.source === "app" ? "publiée par cette app" : "<b>faite par A2X</b>, pas par cette app"} :
          <a href="${qboLink(d.existing.id)}" target="_blank" rel="noopener">pièce ${esc(d.existing.id)}</a>
          <code>${esc(d.existing.docNumber)}</code> du ${esc(d.existing.txnDate)}.
          Son règlement est de ${money(j.settlement)} $, identique au net de ce versement — appariement par ${esc(d.existing.match)}.
          Publier créerait un doublon.</div>`
        : `<div class="banner">Aucune écriture ne correspond au net de ce versement (${money(j.settlement)} $) dans QuickBooks.</div>`}

        ${(d.related || []).length ? `<div class="banner"><b>Pour information</b> — ${d.related.length} écriture(s)
          couvrent la même période mais pour un autre montant. <span class="muted">Ce ne sont pas des correspondances :
          A2X produit plusieurs journaux sur des dates qui se chevauchent.</span>
          ${d.related.map((r) => `<div><a href="${qboLink(r.id)}" target="_blank" rel="noopener">pièce ${esc(r.id)}</a>
            <code>${esc(r.docNumber)}</code> · ${esc(r.txnDate)} · règlement ${money(r.settlement)} $</div>`).join("")}</div>` : ""}

        ${journalTable(j)}

        ${j.notes.length ? `<p class="muted" style="margin-top:12px">${j.notes.map(esc).join("<br>")}</p>` : ""}

        <div class="row" style="margin-top:14px">
          <button class="act" id="post" ${d.existing || !j.balanced || j.unmapped.length ? "disabled" : ""}>Publier dans QuickBooks</button>
          <button class="ghost" id="raw" title="Mêmes colonnes que le « download the raw data » d'A2X">Données brutes (CSV)</button>
          <label class="muted"><input type="checkbox" id="force"> forcer (ignorer les avertissements)</label>
          <span id="postmsg" class="muted"></span>
        </div>
      </div>`;

    wireUnmapped(el, j.unmapped, () => loadJournal(id));
    wireJournalTable(el, j, () => loadJournal(id));

    $("#raw").onclick = async () => {
      const btn = $("#raw");
      btn.disabled = true; btn.textContent = "Extraction…";
      try {
        const r = await api(`/payouts/${encodeURIComponent(id)}/raw`);
        const url = URL.createObjectURL(new Blob([r.csv], { type: "text/csv;charset=utf-8" }));
        const a = document.createElement("a");
        a.href = url; a.download = `${j.docNumber}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) {
        $("#postmsg").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
      }
      btn.disabled = false; btn.textContent = "Données brutes (CSV)";
    };

    // « forcer » lève les avertissements (doublon, composante sans compte) mais
    // jamais le déséquilibre : une écriture déséquilibrée serait refusée par
    // QuickBooks, et le serveur la refuse de toute façon.
    $("#force").onchange = (e) =>
      ($("#post").disabled = !j.balanced || (!e.target.checked && (!!d.existing || !!j.unmapped.length)));
    $("#post").onclick = async () => {
      const btn = $("#post");
      btn.disabled = true;
      $("#postmsg").textContent = "Envoi…";
      try {
        const r = await api(`/payouts/${encodeURIComponent(id)}/post`, {
          method: "POST",
          body: JSON.stringify({ force: $("#force").checked }),
        });
        $("#postmsg").innerHTML = r.created
          ? `<span class="pill ok">créée — pièce ${esc(r.id)}</span>${taxNote(r.taxMode)}`
          : `<span class="pill warn">${esc(r.message)}</span>`;
        loadPayouts();
      } catch (e) {
        $("#postmsg").innerHTML = `<div class="banner bad" style="margin-top:10px;white-space:pre-wrap">${esc(e.message)}</div>`;
        btn.disabled = false;
      }
    };
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="banner bad">${esc(e.message)}</div></div>`;
  }
}

// ------------------------------------- mensuel (hors Shopify Payments)

/**
 * Tout ce qui n'arrive pas par un versement Shopify Payments : PayPal, cartes-
 * cadeaux, commandes manuelles, échanges. A2X en faisait une écriture par mois
 * (« A2XSH-01Jun-01Jul-469 »), en plus des écritures de versement.
 *
 * La liste des mois ne coûte qu'une requête QuickBooks ; le calcul d'un mois
 * balaie les commandes Shopify et prend quelques secondes — d'où les deux temps.
 */
async function loadMonths() {
  const el = $("#tab-monthly");
  el.innerHTML = `<div class="card"><div class="spinner">Lecture des écritures mensuelles déjà comptabilisées…</div></div>`;
  try {
    const { months } = await api("/monthly?months=14");
    el.innerHTML = `
      <div class="card">
        <h2>Écritures mensuelles — hors Shopify Payments</h2>
        <p class="muted">PayPal, cartes-cadeaux, commandes manuelles et échanges ne passent pas par un versement :
           A2X les regroupait en une écriture par mois, datée du 1er. Les commandes déjà réglées par
           Shopify Payments n'y sont jamais reconnues deux fois — leur écriture de versement s'en charge.</p>
        <div class="scroll"><table>
          <thead><tr><th>Mois</th><th>Période</th><th>Écriture</th></tr></thead>
          <tbody>${months.map((m) => `
            <tr data-month="${esc(m.month)}" class="clickable">
              <td><code>${esc(m.month)}</code></td>
              <td class="muted">${esc(m.start)} → ${esc(m.end)}</td>
              <td>${monthStatus(m)}</td>
            </tr>`).join("")}</tbody>
        </table></div>
      </div>
      <div id="monthly"></div>`;
    el.querySelectorAll("tr[data-month]").forEach((tr) => {
      tr.onclick = (e) => { if (e.target.tagName !== "A") loadMonth(tr.dataset.month); };
    });
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="banner bad" style="white-space:pre-wrap">${esc(e.message)}</div>
      <p class="muted">${hintFor(e.message)}</p></div>`;
  }
}

function monthStatus(m) {
  if (m.mine) {
    return `<span class="pill ok">publiée ici</span>
      <a href="${qboLink(m.mine.id)}" target="_blank" rel="noopener">pièce ${esc(m.mine.id)}</a>
      <code>${esc(m.mine.docNumber)}</code>`;
  }
  if (m.a2x.length) {
    return `<span class="pill" style="color:var(--accent);border-color:currentColor">faite${m.a2x.length > 1 ? "s" : ""} par A2X</span>
      <span class="muted">${m.a2x.map((j) => `<a href="${qboLink(j.id)}" target="_blank" rel="noopener">${esc(j.docNumber)}</a>`).join(" · ")}</span>`;
  }
  return `<span class="pill warn">aucune</span>`;
}

async function loadMonth(month) {
  const el = $("#monthly");
  el.innerHTML = `<div class="card"><div class="spinner">Balayage des commandes de ${esc(month)}… (quelques secondes)</div></div>`;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  try {
    const d = await api("/monthly/" + encodeURIComponent(month));
    const j = d.journal;
    el.innerHTML = `
      <div class="card">
        <h2>Écriture ${esc(j.docNumber)}</h2>
        <p class="muted">${esc(j.period.start)} → ${esc(j.period.end)} ·
           ${d.counts.scanned} commande(s) examinée(s), <b>${d.counts.kept}</b> retenue(s) hors Shopify Payments ·
           total ${money(j.total)} $</p>

        ${j.gateways.length ? `<p>${j.gateways.map((g) =>
          `<span class="pill">${esc(g.gateway)} · ${money(g.amount)} $</span>`).join(" ")}</p>` : ""}

        ${!j.lines.length ? `<div class="banner">Rien à comptabiliser pour ce mois : toutes les commandes sont passées par Shopify Payments.</div>` : ""}
        ${balanceBanner(j)}
        ${unmappedBanner(j.unmapped)}
        ${d.existing ? `<div class="banner ok">Ce mois est déjà couvert —
          ${d.existing.source === "app" ? "publié par cette app" : "<b>fait par A2X</b>"} :
          <a href="${qboLink(d.existing.id)}" target="_blank" rel="noopener">pièce ${esc(d.existing.id)}</a>
          <code>${esc(d.existing.docNumber)}</code>${d.a2x.length > 1 ? ` (et ${d.a2x.length - 1} autre(s) écriture(s) mensuelle(s) d'A2X ce mois-là)` : ""}.
          Publier créerait un doublon.</div>` : ""}

        ${j.lines.length ? journalTable(j) : ""}

        ${j.orders.length ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">
          Les ${j.orders.length} commande(s) retenue(s)</summary>
          <div class="scroll" style="margin-top:8px"><table>
            <thead><tr><th>Commande</th><th>Pays</th><th>Canal</th><th>Passerelle</th>
              <th class="num">Encaissé</th><th>Vente reconnue ici</th></tr></thead>
            <tbody>${j.orders.map((o) => `<tr>
              <td><code>${esc(o.name)}</code></td>
              <td class="muted">${esc(o.country)}</td>
              <td class="muted">${esc(o.marketplace)}</td>
              <td class="muted">${esc(o.passerelles.join(", ") || "—")}</td>
              <td class="num">${money(o.encaisse)}</td>
              <td class="muted">${o.reconnue ? "oui" : "non — déjà dans un versement"}</td>
            </tr>`).join("")}</tbody>
          </table></div></details>` : ""}

        ${j.notes.length ? `<p class="muted" style="margin-top:12px">${j.notes.map(esc).join("<br>")}</p>` : ""}

        <div class="row" style="margin-top:14px">
          <button class="act" id="mpost" ${d.existing || !j.balanced || j.unmapped.length || !j.lines.length ? "disabled" : ""}>Publier dans QuickBooks</button>
          <label class="muted"><input type="checkbox" id="mforce"> forcer (ignorer les avertissements)</label>
          <span id="mpostmsg" class="muted"></span>
        </div>
      </div>`;

    wireUnmapped(el, j.unmapped, () => loadMonth(month));
    wireJournalTable(el, j, () => loadMonth(month));
    $("#mforce").onchange = (e) =>
      ($("#mpost").disabled = !j.balanced || !j.lines.length || (!e.target.checked && (!!d.existing || !!j.unmapped.length)));
    $("#mpost").onclick = async () => {
      if (!confirm(`Publier l'écriture mensuelle ${j.docNumber} dans QuickBooks ?\n\nCette action crée une vraie écriture comptable.`)) return;
      $("#mpost").disabled = true;
      $("#mpostmsg").textContent = "Envoi…";
      try {
        const r = await api(`/monthly/${encodeURIComponent(month)}/post`, {
          method: "POST",
          body: JSON.stringify({ force: $("#mforce").checked }),
        });
        $("#mpostmsg").innerHTML = r.created
          ? `<span class="pill ok">créée — pièce ${esc(r.id)}</span>${taxNote(r.taxMode)}`
          : `<span class="pill warn">${esc(r.message)}</span>`;
        loadMonths();
      } catch (e) {
        $("#mpostmsg").innerHTML = `<div class="banner bad" style="margin-top:10px;white-space:pre-wrap">${esc(e.message)}</div>`;
        $("#mpost").disabled = false;
      }
    };
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="banner bad" style="white-space:pre-wrap">${esc(e.message)}</div>
      <p class="muted">${hintFor(e.message)}</p></div>`;
  }
}

// ------------------------------------------------------------------ mappings

async function loadMappings() {
  const el = $("#tab-mappings");
  el.innerHTML = `<div class="card"><div class="spinner">Chargement des mappings…</div></div>`;
  try {
    state.mappings = await api("/mappings");
    renderMappings();
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="banner bad">${esc(e.message)}</div></div>`;
  }
}

/** Les vraies options de taxe de QuickBooks, comme le menu d'A2X. */
function taxOptionsHtml(selected) {
  const opts = (state.mappings && state.mappings.taxOptions) || state.taxOptions || [];
  return `<option value="">— aucune —</option>` + opts.map((o) =>
    `<option value="${esc(o.value)}" ${o.value === selected ? "selected" : ""}>${esc(o.label)}</option>`).join("");
}

function renderMappings() {
  const el = $("#tab-mappings");
  const { mappings, meta, categories } = state.mappings;
  const filter = state.filter || { q: "", category: "" };

  const rows = mappings.filter((m) => {
    if (filter.category && m.category !== filter.category) return false;
    if (!filter.q) return true;
    const hay = `${m.category} ${m.details} ${m.country} ${m.marketplace} ${m.acctNum || ""} ${m.accountName || ""}`.toLowerCase();
    return hay.includes(filter.q.toLowerCase());
  });

  const options = accountOptions;

  el.innerHTML = `
    <div class="card">
      <h2>Mappings de transactions</h2>
      <p class="muted">${meta.counts.rules} règles + ${meta.counts.defaults} règles d'automapping.
         Généré le ${esc((meta.generatedAt || "").slice(0, 16).replace("T", " "))}.
         ${mappings.filter((x) => x.tax).length} ligne(s) portent un code de taxe — les revenus ;
         les lignes de taxe et de frais n'en portent aucun.</p>
      <div class="row" style="margin:12px 0">
        <input class="grow" id="q" placeholder="Filtrer (type, pays, compte…)" value="${esc(filter.q)}">
        <select id="cat">
          <option value="">Toutes les catégories</option>
          ${categories.map((c) => `<option ${c === filter.category ? "selected" : ""}>${esc(c)}</option>`).join("")}
        </select>
        <button class="act" id="save" disabled>Enregistrer</button>
        <span id="savemsg" class="muted"></span>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Catégorie</th><th>Transaction</th><th>Pays</th><th>Marketplace</th><th>Compte</th>
          <th title="Le code de taxe posé sur la ligne, comme dans A2X. « Aucune » pour les lignes de taxe et de frais.">Taxe</th></tr></thead>
        <tbody>${rows.map((m) => `
          <tr data-line="${m.line}">
            <td class="muted">${esc(m.category)}</td>
            <td>${m.kind === "default" ? `<span class="pill">automapping</span>` : esc(m.details)}</td>
            <td class="muted">${esc(m.country === "*" ? "—" : m.country)}</td>
            <td class="muted">${esc(m.marketplace === "*" ? "—" : m.marketplace)}</td>
            <td><select class="acct" data-line="${m.line}">${options(m.acctNum)}</select></td>
            <td><select class="tax" data-line="${m.line}">${taxOptionsHtml(m.tax && m.tax.value)}</select></td>
          </tr>`).join("")}</tbody>
      </table></div>
      <p class="muted" style="margin-top:10px">${rows.length} ligne(s) affichée(s) sur ${mappings.length}.</p>
    </div>`;

  $("#q").oninput = (e) => { state.filter = { ...filter, q: e.target.value }; const p = e.target.selectionStart; renderMappings(); $("#q").focus(); $("#q").setSelectionRange(p, p); };
  $("#cat").onchange = (e) => { state.filter = { ...filter, category: e.target.value }; renderMappings(); };

  const touch = (line) => {
    const acct = el.querySelector(`select.acct[data-line="${line}"]`).value;
    const tax = el.querySelector(`select.tax[data-line="${line}"]`).value;
    state.dirty.set(line, { line: Number(line), acctNum: acct, tax });
    $("#save").disabled = state.dirty.size === 0;
    $("#savemsg").textContent = `${state.dirty.size} modification(s) en attente`;
  };
  el.querySelectorAll("select.acct").forEach((s) => (s.onchange = () => touch(s.dataset.line)));
  el.querySelectorAll("select.tax").forEach((c) => (c.onchange = () => touch(c.dataset.line)));

  $("#save").onclick = async () => {
    $("#save").disabled = true;
    $("#savemsg").textContent = "Enregistrement…";
    try {
      const r = await api("/mappings", { method: "PUT", body: JSON.stringify({ edits: [...state.dirty.values()] }) });
      state.dirty.clear();
      $("#savemsg").innerHTML = `<span class="pill ok">${r.saved} enregistrée(s)</span> <span class="muted">${esc(r.git.reason)}</span>`;
      state.mappings = await api("/mappings");
      const msg = $("#savemsg").innerHTML;
      renderMappings();
      $("#savemsg").innerHTML = msg;
    } catch (e) {
      $("#savemsg").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
      $("#save").disabled = false;
    }
  };
}

// ------------------------------------------------------------------ réglages

function renderSettings() {
  $("#tab-settings").innerHTML = `
    <div class="card">
      <h2>Accès</h2>
      <div class="row">
        <input class="grow" id="secret" type="password" placeholder="Mot de passe de l'interface" value="${esc(secret)}">
        <button class="act" id="savesecret">Retenir</button>
      </div>
      <p class="muted">Le mot de passe est celui de la variable <code>A2X_APP_SECRET</code> du service. Il reste dans ce navigateur.</p>
    </div>
    <div class="card">
      <h2>État du service</h2>
      <div id="health" class="muted">Vérification…</div>
    </div>
    <div class="card">
      <h2>Diagnostic Shopify</h2>
      <p class="muted">Demande un jeton neuf et affiche les portées qu'il contient réellement —
         c'est ce qui distingue « portée pas encore publiée » de « app à réinstaller ».</p>
      <button class="ghost" id="diag">Vérifier les portées du jeton</button>
      <div id="diagout" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>Comptes QuickBooks</h2>
      <p class="muted">${state.accounts.length} compte(s) actifs en mémoire.</p>
      <button class="ghost" id="refreshacct">Recharger depuis QuickBooks</button>
    </div>`;

  $("#savesecret").onclick = () => {
    secret = $("#secret").value.trim();
    localStorage.setItem("a2xSecret", secret);
    boot();
  };
  $("#diag").onclick = async () => {
    $("#diagout").textContent = "Demande d'un jeton neuf…";
    try {
      const d = await api("/shopify");
      const need = [
        ["read_shopify_payments_payouts", d.payouts],
        ["read_shopify_payments_accounts", d.accounts],
      ];
      $("#diagout").innerHTML = `
        <div class="muted">Boutique ${esc(d.store)} · API ${esc(d.apiVersion)} · auth ${esc(d.mode)}</div>
        <div style="margin:8px 0">${need.map(([n, ok]) =>
          `<div>${ok ? '<span class="pill ok">présente</span>' : '<span class="pill bad">ABSENTE</span>'} <code>${esc(n)}</code></div>`).join("")}</div>
        <details><summary class="muted" style="cursor:pointer">Toutes les portées du jeton (${(d.scopes || []).length})</summary>
          <div class="muted" style="margin-top:6px"><code>${(d.scopes || []).map(esc).join("<br>")}</code></div></details>
        ${need.every(([, ok]) => ok) ? "" :
          `<div class="banner warn" style="margin-top:10px">Le jeton ne porte pas les portées de paiement.
           Elles sont pourtant publiées côté app : il faut <b>réinstaller l'app sur la boutique</b>
           (Dev Dashboard → Distribution → custom distribution) pour que la boutique accorde les nouvelles portées.</div>`}`;
    } catch (e) {
      $("#diagout").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
    }
  };
  $("#refreshacct").onclick = async () => {
    const r = await api("/accounts?refresh=1");
    state.accounts = r.accounts;
    state.taxOptions = r.taxOptions || state.taxOptions;
    state.mappings = null;
    renderSettings();
  };
  api("/health").then((h) => {
    $("#health").innerHTML = `
      Shopify : ${h.shopify ? '<span class="pill ok">configuré</span>' : '<span class="pill bad">absent</span>'} ·
      QuickBooks : ${h.qbo ? '<span class="pill ok">configuré</span>' : '<span class="pill bad">absent</span>'} ·
      Sauvegarde GitHub des mappings : ${h.github ? '<span class="pill ok">active</span>' : '<span class="pill warn">inactive</span>'}`;
  }).catch((e) => ($("#health").textContent = e.message));
}

// ---------------------------------------------------------------- démarrage

async function boot() {
  try {
    const h = await api("/health");
    $("#status").textContent = `${h.mappings.counts.total} mappings chargés · remplacement maison d'A2X`;
    const a = await api("/accounts");
    state.accounts = a.accounts;
    state.taxOptions = a.taxOptions || [];
    loadPayouts();
  } catch (e) {
    $("#status").textContent = e.message;
    $("#tab-payouts").innerHTML = `<div class="card"><div class="banner warn">${esc(e.message)} — va dans <b>Réglages</b> pour saisir le mot de passe.</div></div>`;
  }
}
boot();
</script>
</body>
</html>
