# Déploiement Render du clone ShipStation.
#
# Blueprint à appliquer depuis le tableau de bord Render (New → Blueprint), en pointant sur ce
# dépôt. Render suit `main` : la branche de développement doit être fusionnée avant.
#
# Point crucial : le DISQUE PERSISTANT. Sans lui, le disque d'une instance Render est effacé à
# chaque redéploiement — la base SQLite, et donc les 12 460 commandes migrées, disparaîtraient.
# Un disque implique une offre payante ; c'est le prix d'un service partagé.
services:
  - type: web
    name: lasclay-expeditions
    runtime: node
    plan: starter                 # requis pour un disque persistant (le plan gratuit n'en a pas)
    region: ohio
    branch: main
    buildCommand: "true"          # aucune dépendance npm à installer
    startCommand: node --no-warnings shipstation-clone/app/server.js
    healthCheckPath: /healthz

    # Sans ce filtre, TOUT commit sur `main` reconstruit ce service — y compris
    # les commits de données qui ne le concernent pas (état du backlog Facebook,
    # exports Klaviyo, notes SEO). Le dépôt en produit plusieurs par heure ; à
    # six services suivant `main`, les minutes de construction du forfait Render
    # sont épuisées avant la fin du mois et TOUTES les constructions sont
    # annulées, y compris les vraies. Voir RENDER-DEPLOIEMENTS.md.
    #
    # `paths` est une liste blanche : ce qui n'y figure pas ne déclenche RIEN.
    # Le service est autonome (aucun require hors de son dossier) ; si un jour il
    # dépend d'un fichier de la racine, l'ajouter ici, sinon le déploiement
    # partira sans lui.
    buildFilter:
      paths:
        - shipstation-clone/**
        - package.json
        - .node-version
    disk:
      name: donnees
      mountPath: /var/data        # CLONE_DB pointe dedans
      sizeGB: 1                   # ~40 Mo pour 12 000 commandes ; 1 Go voit venir
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"          # version de développement ; node:sqlite exige 22.5 minimum
      - key: CLONE_DB
        value: /var/data/clone.db
      - key: CARRIER_ADAPTER
        value: bouchon            # passer à clickship à réception des identifiants
      - key: CLONE_ALLOW_LABELS
        value: "0"                # "1" seulement quand l'achat réel est voulu
      - key: CLONE_SESSION_HEURES
        value: "12"
      - key: CLONE_2FA_EMETTEUR
        value: Lasclay Expéditions  # nom affiché dans l'app d'authentification

      # Volontairement absentes, leur défaut est le bon en production :
      #   PORT                 fourni par Render
      #   HOST                 0.0.0.0 — restreindre rendrait le service injoignable
      #   CLONE_COOKIE_SECURE  activé ; à 0 les sessions circuleraient en clair
      #   GENERAL_PROXY_URL    l'URL actuelle du proxy
      #   SHOPIFY_API_VERSION  2025-01
      # Liste complète et commentée : shipstation-clone/PARAMETRES.md

      # --- secrets : à saisir dans le tableau de bord, jamais ici ---
      - key: GENERAL_PROXY_SECRET
        sync: false               # migration depuis ShipStation
      - key: CLONE_ADMIN_EMAIL
        sync: false               # courriel du premier administrateur
      - key: CLONE_ADMIN_PASSWORD
        sync: false               # facultatif : sinon un mot de passe est généré dans les logs
      - key: CLICKSHIP_API_KEY
        sync: false               # quand ClickShip aura répondu

      # --- renvoi du suivi aux boutiques (sans eux, les clients perdent leur suivi) ---
      # Shopify : l'app « Render connector » déjà utilisée par support.js et A2X.
      # Jeton court renouvelé tout seul — rien de permanent à stocker ici.
      # Portée à AJOUTER sur l'app : write_merchant_managed_fulfillment_orders
      - key: SHOPIFY_STORE
        sync: false               # lasclay.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ETSY_API_KEY
        sync: false
      - key: ETSY_TOKEN
        sync: false
      - key: ETSY_SHOP_ID
        sync: false
      - key: FAIRE_ACCESS_TOKEN
        sync: false
