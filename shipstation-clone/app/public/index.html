   * Choisir un colis applique ses dimensions — ici aussi.
   *
   * Le correctif n'avait été posé que dans le panneau latéral. Dans l'écran plein, le menu
   * enregistrait bien le type de colis mais laissait les trois champs de taille tels quels :
   * on sélectionnait « 7,5 × 2,5 × 4,5 » et l'écran continuait d'afficher 20 × 20 × 18, donc
   * de coter — et d'acheter — sur les mauvaises dimensions.

  const pkg = $("#cPkg", f);
  if (pkg) pkg.addEventListener("change", async () => {
    const p = (S.refs.packages || []).find((x) => String(x.id) === String(pkg.value));

      $("#cLg", f).value = d.width || "";

  // La balance se lit par WebHID, sans agent local (exigence OBS4). Tant qu'aucune n'est

  $("#cBal", f).onclick = async () => {

  /**
   * L'écran plein cote comme le panneau de droite — mêmes fournisseurs, mêmes tarifs vivants.

   * Il était resté sur l'ancien fonctionnement : liste de services figée, aucun choix de
   * fournisseur, donc aucun moyen d'appeler Freightcom depuis la fiche ouverte par le numéro
   * de commande. Deux écrans qui font le même travail doivent le faire pareil, sans quoi
   * l'un des deux ment.
   */
  async function coter() {
    $("#cCout", f).textContent = "…";
    f.querySelectorAll(".avisPoids").forEach((x) => x.remove());
    try {
      const four = $("#cFour", f) && $("#cFour", f).value;
      const r = await api("/api/shipments/quote", { method: "POST",
        body: { order_id: id, fournisseur: four || undefined } });

          nomF ? nomF.libelle : r.fournisseur || "le fournisseur par défaut"}`;
      }

      const choisi = $("#cSvc", f) && $("#cSvc", f).value;
      const t = r.tarifs.find((x) => String(x.serviceId) === String(choisi))
        || r.recommande || (r.tarifs || [])[0];
      // Hors taxes des deux côtés : les frais de port encaissés le sont, et les taxes se
      // récupèrent en crédits sur intrants.
      const cout = t ? (t.prixHT ?? t.price) : null;
      $("#cCout", f).textContent = t ? money(cout) : "—";
      $("#cArrivee", f).textContent = t?.transitDays ? `Arrivée estimée : ${t.transitDays} j` : "";
      if (t && (o.shipping_paid || 0) < cout) {
        const ecart = Math.round((cout - (o.shipping_paid || 0)) * 100) / 100;
        $("#cCout", f).innerHTML = `${money(cout)} <span class="puce r" title="Livraison facturée ${
          money(o.shipping_paid)}">−${money(ecart)}</span>`;
      }
    } catch (e) {
      // Message actionnable à l'endroit du problème, pas une bannière d'erreur générique.
      $("#cCout", f).textContent = "—";
      // Et la liste de services précédente est effacée : la garder ferait croire que les
      // tarifs d'un fournisseur s'appliquent à celui qu'on vient de choisir.
      if ($("#cSvc", f)) $("#cSvc", f).innerHTML = optionsService(o.service_id || "");
      const nomF = (S.fournisseurs || []).find((x) => x.nom === ($("#cFour", f) && $("#cFour", f).value));
      const lbl = $("#cSvcL", f);
      if (lbl) lbl.textContent = `Service — aucun tarif${nomF ? ` chez ${nomF.libelle}` : ""}`;
      const cible = /poids/i.test(e.message) ? $("#cPds", f).closest(".cPoids") : null;
      if (cible && !cible.nextElementSibling?.classList?.contains("avisPoids")) {

      } else if (!cible) {
        $("#cOut", f).innerHTML = `<div class="avis mini">${esc(e.message)}</div>`;
      }
    }
    // La cotation vient de réécrire la liste des services : le bouton doit suivre la liste
    // qu'elle affiche, pas celle d'avant.
    majAchat(o, "fiche", f);
  }
  coter();
  // Changer de fournisseur recote ; choisir un tarif l'enregistre et met le coût à jour.
  // Sans ça, les deux menus étaient décoratifs — le reproche exact fait au menu Colis.
  const chFour = $("#cFour", f);
  if (chFour) chFour.onchange = () => coter();
  const chSvc = $("#cSvc", f);
  if (chSvc) chSvc.onchange = async () => {

      const r = await api("/api/shipments/quote", { method: "POST",

      $("#cOut", f).innerHTML = tableauTarifs(r, o);
    } catch (e) { $("#cOut", f).innerHTML = `<div class="avis mini">${esc(e.message)}</div>`; }
  };

  $("#cAcheter", f).onclick = async () => {
    if (!S.config.etiquettes_actives) return alert("Achat d'étiquettes désactivé sur ce service.");

    finally { const b = $("#cAcheter", f); if (b) b.disabled = false; }
  };

/**
 * Règle unique d'activation de l'achat d'étiquette — BUG-028.
 *
 * L'audit a trouvé le bouton **actif dans la modale et désactivé dans le panneau latéral**
 * pour la même commande : deux conditions écrites à deux endroits, qui avaient divergé.
 * Une seule fonction désormais, et le motif du refus part en info-bulle plutôt que de
 * laisser un bouton gris sans explication.
 */
/**
 * Peut-on acheter l'étiquette ? — BUG-028.
 *
 * Une seule fonction de décision, appelée par la modale **et** par le panneau latéral. Elles
 * répondaient chacune de leur côté et se contredisaient : le même bouton était actif dans
 * l'une et grisé dans l'autre pour la même commande. Les motifs sont énumérés au complet —
 * un bouton grisé qui ne dit pas ce qui manque oblige à chercher.
 */
function etatAchat(o = null) {
  const manques = [];
  if (!S.config || !S.config.etiquettes_actives)
    manques.push("l'achat d'étiquettes est désactivé sur ce service (CLONE_ALLOW_LABELS)");
  if (o) {
    if (!["awaiting_shipment", "on_hold"].includes(o.status))
      manques.push(`la commande est ${(STATUT_FR[o.status] || o.status).toLowerCase()} — rien à expédier`);
    if (!o.weight_g) manques.push("aucun poids saisi");
    if (!o.service_id) manques.push("aucun service choisi");
    if (!o.package_id) manques.push("aucun type de colis choisi");
    if (!entrepotResolu(o).id) manques.push("aucun emplacement d'expédition");
  }
  return { ok: manques.length === 0, manques,
    motif: manques.length ? "Impossible : " + manques.join(" ; ") + "." : "" };
}

/**
 * Entrepôt d'expédition — BUG-029.
 *
 * La valeur de la commande, à défaut l'entrepôt marqué par défaut. Le panneau latéral
 * présélectionnait la première ligne de la liste et la modale affichait « — défaut — » :
 * selon l'écran emprunté, l'étiquette partait d'un entrepôt différent. Chez Lasclay, le
 * champ personnalisé 3 sert de centre de coût Postes Canada et dépend de cet entrepôt.
 */
function entrepotResolu(o) {
  const liste = S.refs.warehouses || [];
  if (o && o.warehouse_id && liste.some((w) => String(w.id) === String(o.warehouse_id)))
    return { id: o.warehouse_id, source: "commande" };
  const def = liste.find((w) => w.is_default);
  return def ? { id: def.id, source: "defaut" } : { id: null, source: "aucun" };
}

/**
 * Où chaque écran range les champs dont dépend l'achat.
 *
 * La fiche plein écran et le panneau latéral posent les mêmes questions sous des
 * identifiants différents. Une seule table les réconcilie, pour que la décision d'achat
 * reste écrite à un seul endroit.
 */
const CHAMPS_ACHAT = {
  fiche:   { svc: "#cSvc", pkg: "#cPkg", wh: "#cWh", pds: "#cPds", motif: "#cRaisonM" },
  panneau: { svc: "#cs",   pkg: "#cc",   wh: "#cw",  pds: "#cp",   motif: "#cRaisonP" },
};

/**
 * Le bouton d'achat suit ce que l'écran montre, pas la commande telle qu'ouverte.
 *
 * `etatAchat` lisait l'objet capturé au rendu. Choisir un service et un colis les
 * enregistrait bien côté serveur — et laissait le bouton gris sous un bandeau « Il manque :
 * aucun service choisi ; aucun type de colis choisi », alors que les deux menus affichaient
 * le bon choix. Tout était choisi, rien n'était relu : l'achat devenait impossible sans
 * refermer la fiche et la rouvrir.
 *
 * L'état se recalcule donc à partir des champs eux-mêmes, après chaque enregistrement. Ils
 * sont la seule version que la personne voit, et celle qu'elle croit acheter.
 */
function majAchat(o, ou, racine = document) {
  const c = CHAMPS_ACHAT[ou];
  if (!c) return etatAchat(o);
  const vue = { ...o };
  const lu = (r) => { const e = $(c[r], racine); return e ? e.value : undefined; };
  const svc = lu("svc"), pkg = lu("pkg"), wh = lu("wh"), pds = lu("pds");
  if (svc !== undefined) vue.service_id = svc || null;
  if (pkg !== undefined) vue.package_id = pkg || null;
  if (wh !== undefined) vue.warehouse_id = wh || null;
  if (pds !== undefined) vue.weight_g = Number(pds) || 0;
  const e = etatAchat(vue);
  const b = $("#cAcheter", racine);
  if (b) { b.disabled = !e.ok; b.title = e.motif || ""; }
  const m = $(c.motif, racine);
  if (m) {
    m.hidden = e.ok;
    m.innerHTML = e.ok ? "" : `Il manque : ${esc(e.manques.join(" ; "))}.`;
  }
  return e;
}

/**
 * Ce qui manque pour acheter, écrit à l'écran et pas seulement en infobulle : une infobulle
 * ne s'ouvre qu'à la souris, et jamais sur un bouton désactivé dans certains navigateurs.
 */
function motifAchat(o, id) {
  const e = etatAchat(o);
  return `<div class="motifAchat" id="${id}" ${e.ok ? "hidden" : ""}>${
    e.ok ? "" : `Il manque : ${esc(e.manques.join(" ; "))}.`}</div>`;
}

/** Liste d'entrepôts, la valeur résolue présélectionnée — jamais deux rendus divergents. */
function optionsEntrepot(o) {
  const r = entrepotResolu(o);
  return (S.refs.warehouses || []).map((w) =>
    `<option value="${w.id}"${String(w.id) === String(r.id) ? " selected" : ""}>${esc(w.name)}${
      w.is_default && r.source === "defaut" ? " (par défaut)" : ""}</option>`).join("");
}

  ["warranty", "Garantie"], ["changed_mind", "Changement d'avis"],
  ["wrong_item_received", "Mauvais article reçu"], ["rental", "Location"],
  ["damaged", "Endommagé"], ["defective", "Défectueux"], ["arrived_late", "Arrivé trop tard"],
  ["missing_parts", "Pièces manquantes"], ["not_as_described", "Non conforme à la description"],
  ["other", "Autre"], ["exchange", "Échange"],
];

/** Date au format d'un `<input type="date">`, tolérante aux horodatages complets. */
const jour2 = (s) => (s ? String(s).slice(0, 10) : "");

/**
 * Les pays, en deux lettres ISO.
 *
 * Le menu n'offrait que `CA` et `US` : toute autre destination était impossible à saisir
 * dans une commande manuelle, alors que le compte en compte plus de trente. Les codes
 * suffisent en dur — le nom lisible vient d'`Intl.DisplayNames`, qui le rend dans la langue
 * de l'écran sans que le fichier porte deux cent quarante-quatre traductions.
 *
 * Les codes retirés sont ceux que les transporteurs refusent : anciens États (`SU`, `YU`,
 * `ZR`), doublons dépréciés (`UK` pour `GB`), et territoires sans adresse postale (`AQ`,
 * `BV`).
 */
const PAYS_CODES = (
  "AD AE AF AG AI AL AM AO AR AS AT AU AW AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS " +
  "BT BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC " +

  "HK HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ " +

/** Nom du pays dans la langue de l'écran, le code lui-même à défaut. */
const nomPays = (() => {
  const cache = {};
  return (code) => {
    const l = langue() === "fr" ? "fr" : "en";
    try {
      cache[l] ||= new Intl.DisplayNames([l], { type: "region" });
      return cache[l].of(code) || code;
    } catch { return code; }
  };
})();

/**
 * Le menu des pays, trié par nom, Canada et États-Unis en tête.
 *
 * Deux cent quarante-quatre pays dans l'ordre alphabétique mettent le Canada en trente-
 * huitième position, alors qu'il porte la quasi-totalité des envois. Les deux destinations
 * réelles restent aussi à leur place dans la liste : on les trouve des deux façons.
 */
function optionsPays(choisi = "CA") {
  const c0 = String(choisi || "").toUpperCase();
  const tri = [...PAYS_CODES].sort((a, b) => nomPays(a).localeCompare(nomPays(b), "fr"));
  const ligne = (c) => `<option value="${c}"${c === c0 ? " selected" : ""}>${esc(nomPays(c))}</option>`;
  // Un pays absent de la liste — vide, ou un code que la liste ne connaît pas — ne doit pas
  // se faire remplacer en silence par le premier de la liste. Une adresse dont le pays a
  // changé tout seul part chez le mauvais transporteur, et rien à l'écran ne l'a dit.
  const inconnu = c0 && !PAYS_CODES.includes(c0)
    ? `<option value="${esc(c0)}" selected>${esc(c0)} — code inconnu</option>` : "";
  const vide = c0 ? "" : `<option value="" selected>— choisir —</option>`;
  return `${vide}${inconnu}${["CA", "US"].map(ligne).join("")}` +
    `<option disabled>──────────</option>${tri.map(ligne).join("")}`;
}

/**
 * Le champ région : une liste quand on connaît le pays, un champ libre sinon.
 *
 * Taper « Qc », « Que » ou « Quebec » à la main produit trois valeurs dont deux se font
 * refuser à l'achat de l'étiquette, plusieurs écrans plus loin. Le menu ne laisse choisir
 * que ce que le transporteur accepte.
 */
function champRegion(id, pays, valeur = "") {
  const l = SUBDIVISIONS[String(pays || "").toUpperCase()];
  if (!l) return `<input id="${id}" value="${esc(valeur || "")}" placeholder="région / état">`;
  const connu = l.some(([c]) => c === valeur);
  return `<select id="${id}"><option value="">— choisir —</option>${
    l.map(([c, n]) => `<option value="${c}"${c === valeur ? " selected" : ""}>${esc(n)} (${c})</option>`).join("")
  }${valeur && !connu ? `<option value="${esc(valeur)}" selected>${esc(valeur)} — hors liste</option>` : ""}</select>`;
}

/**
 * Rendre le champ région dans son enveloppe, et le refaire à chaque changement de pays.
 *
 * L'enveloppe existe pour que le champ puisse changer de nature — liste ou saisie libre —
 * sans reconstruire le formulaire autour.
 *
 * Une valeur qui existe encore dans le nouveau pays est conservée ; sinon elle est effacée,
 * parce qu'un « QC » resté en place sous un pays devenu « États-Unis » est une adresse
 * fausse qui a l'air remplie.
 */
function brancherRegion(idPays, idRegion, racine = document) {
  const p = $(idPays, racine), z = $(idRegion + "Z", racine);
  if (!p || !z) return;
  const majRegion = () => {
    const actuel = $(idRegion, racine);
    const garde = actuel ? actuel.value : "";
    const pays = p.value.toUpperCase();
    const l = SUBDIVISIONS[pays];
    z.innerHTML = champRegion(idRegion.slice(1), pays, !l || l.some(([c]) => c === garde) ? garde : "");
  };
  p.addEventListener("change", majRegion);
  return majRegion;
}

/**
 * Autocomplétion d'adresse — Google Places, par le serveur.
 *
 * Saisir une adresse à la main, c'est cinq champs, et une faute de frappe dans le code
 * postal ne se voit qu'au refus du transporteur. Ici on tape le début de la rue et les cinq
 * champs se remplissent d'un coup, avec le code postal tel que le transporteur l'attend.
 *
 * Le raccourci ne remplace jamais la saisie : les champs restent modifiables, et si Google
 * n'est pas configuré (`GOOGLE_MAPS_API_KEY` absente côté serveur) ou ne répond pas, le
 * formulaire se comporte exactement comme avant. C'est un accélérateur, pas un passage
 * obligé — une adresse que Google ne connaît pas doit rester saisissable.
 *
 * Le jeton de session est ce qui rend la chose abordable : Google facture toutes les
 * frappes d'une même recherche comme une seule requête si elles le portent. Un jeton neuf
 * après chaque adresse retenue.
 */
function brancherAutoAdresse(ids, racine = document) {
  if (!S.config || !S.config.adresses_auto) return;
  const rue = $(ids.rue, racine);
  if (!rue) return;
  const boite = el('<div class="sugA" hidden></div>');
  (rue.closest("label") || rue.parentNode).appendChild(boite);
  (rue.closest("label") || rue.parentNode).classList.add("sugP");
  rue.setAttribute("autocomplete", "off");

  let jeton = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
  let liste = [], actif = -1, minuteur = null, requete = 0;

  const fermer = () => { boite.hidden = true; boite.innerHTML = ""; liste = []; actif = -1; };

  const dessiner = () => {
    if (!liste.length) return fermer();
    boite.innerHTML = liste.map((s, i) => `<div class="sugI${i === actif ? " actif" : ""}" data-i="${i}">
      <b>${esc(s.principal || s.texte)}</b><span>${esc(s.secondaire || "")}</span></div>`).join("");
    boite.hidden = false;
    boite.querySelectorAll("[data-i]").forEach((n) => {
      n.onmousedown = (e) => { e.preventDefault(); retenir(Number(n.dataset.i)); };
    });
  };

  const chercher = async () => {
    const q = rue.value.trim();
    if (q.length < 3) return fermer();
    const pays = $(ids.pays, racine) ? $(ids.pays, racine).value : "";
    const n = ++requete;
    try {
      const r = await api(`/api/adresses/suggestions?q=${encodeURIComponent(q)}` +
        `&pays=${encodeURIComponent(pays || "")}&jeton=${encodeURIComponent(jeton)}`);
      // Une réponse dépassée ne doit pas écraser une plus récente : on tape plus vite que
      // le réseau ne répond, et la liste se remettrait à afficher les suggestions d'il y a
      // deux lettres.
      if (n !== requete) return;
      liste = r.suggestions || [];
      actif = -1;
      dessiner();
    } catch { fermer(); }
  };

  /** Une suggestion retenue remplit les cinq champs — c'est tout l'intérêt du raccourci. */
  const retenir = async (i) => {
    const s = liste[i];
    if (!s) return;
    fermer();
    const d = await tenter(() => api(`/api/adresses/details?id=${encodeURIComponent(s.id)}` +
      `&jeton=${encodeURIComponent(jeton)}`), { message: "Adresse non lue" });
    // Le jeton de session s'arrête à l'adresse retenue : la suivante en ouvre un autre.
    jeton = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
    if (!d) return;
    const poser = (sel, v) => { const e = $(sel, racine); if (e && v !== undefined && v !== null) e.value = v; };
    rue.value = d.street1 || rue.value;
    poser(ids.rue2, d.street2 || "");
    poser(ids.ville, d.city);
    poser(ids.cp, d.postalCode);
    // Le pays d'abord : c'est lui qui décide de la forme du champ région.
    const p = $(ids.pays, racine);
    if (p && d.country) {
      p.value = d.country;
      p.dispatchEvent(new Event("change", { bubbles: true }));
    }
    poser(ids.region, d.state);
    const r = $(ids.region, racine);
    if (r) r.dispatchEvent(new Event("change", { bubbles: true }));
  };

  rue.addEventListener("input", () => { clearTimeout(minuteur); minuteur = setTimeout(chercher, 250); });
  rue.addEventListener("blur", () => setTimeout(fermer, 150));
  rue.addEventListener("keydown", (e) => {
    if (boite.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); actif = Math.min(actif + 1, liste.length - 1); dessiner(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); actif = Math.max(actif - 1, 0); dessiner(); }
    else if (e.key === "Enter" && actif >= 0) { e.preventDefault(); retenir(actif); }
    else if (e.key === "Escape") fermer();
  });
}

/**
 * Lots — les contenants du tri, et leur traitement.
 *
 * Un lot ouvert reçoit des commandes au fil du tri ; le traiter achète les étiquettes de
 * toutes celles qui y attendent. Chez Lasclay, 96 % des étiquettes du compte audité sont
 * achetées en lot : c'est le chemin principal, pas un cas particulier.
 */
/**
 * Cueillettes transporteur — BUG-051.
 *
 * L'écran manquait entièrement (`GET /api/pickups` → 404) alors que Lasclay a cinq comptes
 * avec ramassage et que c'est un geste quotidien.
 *
 * Une chose est dite partout sur cet écran, et c'est la plus importante : tant qu'aucun
 * identifiant transporteur n'est en place, un ramassage est **noté ici**, pas **confirmé
 * par le transporteur**. Laisser croire qu'un camion viendra parce qu'une ligne existe en
 * base ferait préparer des colis pour rien.
 */
VUES.cueillettes = async () => {
  const d = await api("/api/pickups");
  const aujourdhui = new Date().toISOString().slice(0, 10);
  const demain = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  const attendus = d.pickups.filter(p => p.statut === "demande" || p.statut === "confirme");

  $("#vue").innerHTML = `<h1>Cueillettes transporteur</h1>
    <p class="sous">Programmer, mettre à jour ou annuler un ramassage, pour les
      ${num(d.comptes.length)} comptes du compte Lasclay.</p>
    <div class="carte"><b class="titreCarte">Le camion de la journée</b>
      <div class="doux" style="font-size:12px;margin:3px 0 8px">Un ramassage se demande
        <b>une fois par jour</b>, après l'achat des étiquettes — le transporteur vient à une
        adresse, dans une fenêtre horaire, et prend ce qui est prêt. La question ne se pose
        pas commande par commande. Les envois <b>au dépôt</b> en sont exclus : faire venir un
        camion pour des colis qu'on porte soi-même se facture chez certains transporteurs.</div>
      <div class="barre"><button class="p" id="puJour">Demander le ramassage du jour…</button></div>
      <div id="puJourR">${(() => {
        const r = S.dernierRamassage;
        if (!r) return "";
        return `<div class="avis ${r.confirmation ? "info" : ""}">
          ${num(r.expeditions)} expédition(s) à faire ramasser.
          ${r.confirmation
            ? `Confirmé par le transporteur — <b>${esc(r.confirmation)}</b>.`
            : "<b>Aucune confirmation du transporteur</b> : la demande est notée ici seulement."}
          ${r.avertissement ? `<br><span class="doux">${esc(r.avertissement)}</span>` : ""}</div>`;
      })()}</div></div>
    <div class="barre"><button type="button" id="puNew">Programmer un ramassage à la main…</button>
      <select id="puF"><option value="">Tous les statuts</option>
        ${d.statuts.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select></div>
    <div id="puT"></div>`;

  /*
   * Un seul ramassage pour la journée.
   *
   * Le serveur compte les expéditions non déposées du jour, valide le créneau auprès du
   * transporteur puis l'engage, et note le numéro de confirmation — celui du transporteur,
   * pas le nôtre. Deux demandes le même jour pour le même compte sont refusées : le camion

   * qu'une intention.

  $("#puJour").onclick = () => dialogue("Ramassage du jour", `
    <div class="cGrilleR">
      <label class="champ"><span>Date</span>
        <input type="date" id="pjD" value="${esc(aujourdhui)}"></label>
      <label class="champ"><span>Transporteur</span>
        <select id="pjC"><option value="">Celui des expéditions du jour</option>
          ${d.comptes.map((x) => `<option value="${esc(x.carrier_code)}|${esc(x.compte)}">${esc(x.nom)}</option>`).join("")}</select></label>
      <label class="champ"><span>Prêt à</span><input type="time" id="pjA" value="09:00"></label>
      <label class="champ"><span>Jusqu'à</span><input type="time" id="pjB" value="17:00"></label>
    </div>
    <label class="champ"><span>Contact sur place</span><input id="pjN" placeholder="Nom"></label>
    <label class="champ"><span>Téléphone</span><input id="pjT" placeholder="418-555-0100"></label>
    <label class="champ"><span>Instructions</span><input id="pjI" placeholder="Porte arrière, sonner"></label>
    <p class="doux">Les colis destinés au dépôt au comptoir ne sont pas comptés : le camion
      n'a pas à venir pour eux.</p>`,
    () => {
      const [code, compte] = ($("#pjC").value || "|").split("|");
      return tenter(() => api("/api/pickups/journee", { method: "POST", body: {
        date: $("#pjD").value, carrier_code: code || null, compte: compte || null,
        creneau_debut: $("#pjA").value, creneau_fin: $("#pjB").value,
        contact: $("#pjN").value || null, telephone: $("#pjT").value || null,
        instructions: $("#pjI").value || null } }), {
        message: "Ramassage refusé",
        // Le résultat est retenu AVANT de redessiner : la vue se reconstruit entièrement, et
        // écrire dans l'ancien DOM faisait disparaître la confirmation aussitôt affichée.
        apres: (r) => {

            { type: r.confirmation ? "succes" : "info" });

      return;
    }
    $("#puT").append(table([
      { k: "date", t: "Date", r: p => jour(p.date) + (p.date === aujourdhui ? ' <span class="puce a">aujourd\'hui</span>'
        : p.date === demain ? ' <span class="puce g">demain</span>' : "") },
      { k: "nom", t: "Compte" },
      { k: "creneau", t: "Créneau", r: p => p.creneau_debut ? `${esc(p.creneau_debut)} – ${esc(p.creneau_fin || "…")}` : '<span class="doux">à convenir</span>' },
      { k: "colis", t: "Colis annoncés", n: true, r: p => num(p.colis) },

      { k: "colis_reels", t: "Colis prêts", n: true, r: p => {

          return `${num(p.colis_reels)}${p.colis && ecart ? ` <span class="puce ${ecart > 0 ? "a" : "g"}">${ecart > 0 ? "+" : ""}${num(ecart)}</span>` : ""}`;
        } },
      { k: "statut", t: "Statut", r: p => `<span class="puce ${p.statut === "confirme" ? "v" : p.statut === "annule" ? "r" : p.statut === "effectue" ? "g" : "a"}">${esc(p.statut)}</span>` },
      { k: "confirmation", t: "Confirmation", r: p => p.confirmation
          ? `<span class="sku">${esc(p.confirmation)}</span>`

      { k: "act", t: "", r: p => p.statut === "annule" || p.statut === "effectue" ? ""
          : `<button data-pc="${p.id}">Confirmer…</button> <button class="d" data-pa="${p.id}">Annuler</button>` },
    ], lignes, { cle: "id" }));

    $("#puT").querySelectorAll("[data-pc]").forEach(b => b.onclick = () => {
      dialogue("Confirmer le ramassage", `
        <p>À remplir quand le transporteur a confirmé — par téléphone, par courriel ou par
          son portail. Sans numéro, la ligne reste « noté ici ».</p>
        <label class="champ"><span>Numéro de confirmation</span><input id="puC" placeholder="ex. CP-8841203"></label>`,
        async () => {
          await api("/api/pickups/" + b.dataset.pc, { method: "POST",
            body: { statut: "confirme", confirmation: $("#puC").value.trim() || null } });
          VUES.cueillettes();
        }, "Confirmer");
    });
    $("#puT").querySelectorAll("[data-pa]").forEach(b => b.onclick = () => {
      dialogue("Annuler le ramassage",
        "<p>Le ramassage sera marqué annulé ici. <b>Si le transporteur l'avait confirmé, il faut aussi l'annuler chez lui</b> — le clone ne le fait pas à votre place.</p>",
        async () => {
          await api("/api/pickups/" + b.dataset.pa, { method: "POST", body: { statut: "annule" } });
          VUES.cueillettes();
        }, "Annuler le ramassage");
    });
  };

  $("#puNew").onclick = () => dialogue("Programmer un ramassage", `
    <label class="champ"><span>Compte</span><select id="puA">${
      d.comptes.map((c, i) => `<option value="${i}">${esc(c.nom)}</option>`).join("")}</select></label>
    <div class="grille">
      <label class="champ"><span>Date</span><input type="date" id="puD" value="${demain}" min="${aujourdhui}"></label>
      <label class="champ"><span>Entrepôt</span><select id="puW"><option value="">— défaut —</option>${
        (S.refs.warehouses || []).map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select></label>
      <label class="champ"><span>Créneau — début</span><input type="time" id="pu1"></label>
      <label class="champ"><span>Créneau — fin</span><input type="time" id="pu2"></label>
      <label class="champ"><span>Colis attendus</span><input type="number" id="puN" min="0" value="${num(attendus.length ? 0 : 0)}"></label>
      <label class="champ"><span>Contact sur place</span><input id="puP"></label>
    </div>
    <label class="champ"><span>Instructions</span><input id="puI" placeholder="porte arrière, sonner, colis sur la palette…"></label>`,
    async () => {
      const c = d.comptes[Number($("#puA").value)];

      VUES.cueillettes();

  $("#puF").onchange = () => rendreTable($("#puF").value
    ? d.pickups.filter(p => p.statut === $("#puF").value) : d.pickups);
  rendreTable(d.pickups);
  S.rafraichirEcran = () => VUES.cueillettes();
};

// --------------------------------------------------------------- manifestes
/**
 * Fin de journée — trois défauts relevés à l'audit sur un écran de trois contrôles.
 *
 * Le sélecteur de transporteur n'avait **pas d'option « Tous »**, alors qu'une journée chez
 * Lasclay mêle Postes Canada et Purolator : il fallait clôturer transporteur par
 * transporteur, en devinant lesquels avaient tourné. Le bouton **« Clôturer » restait actif
 * même sans rien à clôturer** : on l'apprenait après le clic, par un message d'erreur. Et
 * il manquait la **séparation ouvertes / clôturées** que ShipStation met en deux onglets,
 * avec la réimpression des documents déjà produits.
 *
 * L'écran s'ouvre donc sur ce qui reste ouvert pour la date choisie, transporteur par
 * transporteur, et le bouton porte le nombre qu'il va traiter.
 */
VUES.manifestes = async () => {
  const date0 = (S.manifDate ||= new Date().toISOString().slice(0, 10));
  let d;
  try { d = await api("/api/manifests?ship_date=" + encodeURIComponent(date0)); }
  catch (e) { $("#vue").innerHTML = ""; return $("#vue").append(panneauErreur(e, () => VUES.manifestes())); }
  const ouv = d.ouvertes || { transporteurs: [], total: 0 };
  const nomTransporteur = (code) =>
    ((S.refs.carriers || []).find((c) => c.code === code) || {}).name || code;

  $("#vue").innerHTML = `<h1>Fin de journée</h1>
    <p class="sous">Clôture des expéditions par transporteur. En drop-off, le document sert de bordereau de dépôt.</p>
    <div class="barre">
      <label class="champ" style="flex:0 0 auto"><span>Date d'expédition</span>
        <input type="date" id="md" value="${esc(date0)}"></label>
      <label class="champ" style="flex:0 0 auto"><span>Transporteur</span>
        <select id="mc"><option value="">Tous les transporteurs</option>

VUES.retours = async () => {
  const d = await api("/api/returns");

    <div class="barre"><button class="p" id="rnew">Nouveau retour</button></div><div id="rt"></div>`;
  /**
   * Nouveau retour — BUG-054 et BUG-055.
   *
   * L'ancienne version faisait `GET /api/orders?q=<champ>&limit=1` puis prenait
   * `orders[0]`. Un champ vide n'étant pas filtrant, le RMA se rattachait à **la première
   * commande de la base**. Une saisie partielle rattachait à la première correspondance,
   * sans le dire. Ici la commande est cherchée, montrée, et confirmée avant d'écrire.
   *
   * Le motif était en texte libre : « taille », « Taille », « trop petit », « TROP PETIT »
   * sont quatre motifs distincts pour qui compte. Les treize motifs de ShipStation sont
   * proposés, avec une précision libre à côté — on garde la nuance sans perdre le
   * dénombrement.
   */
  $("#rnew").onclick = () => {
    let cible = null;
    dialogue("Nouveau retour", `
      <label class="champ"><span>N° de commande</span>
        <input id="ron" placeholder="L-50123" autocomplete="off"></label>
      <div id="ronOut" aria-live="polite"></div>
      <label class="champ"><span>Motif</span><select id="rre">
        <option value="">— choisir —</option>
        ${MOTIFS_RETOUR.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("")}
      </select></label>
      <label class="champ"><span>Précision (facultatif)</span><input id="rno" placeholder="ce que le client a écrit"></label>
      <label class="champ"><span>Résolution</span><select id="rso"><option value="refund">Remboursement</option>
        <option value="exchange">Échange</option><option value="store_credit">Crédit en boutique</option></select></label>`,
      async () => {
        if (!cible) { $("#ronOut").innerHTML = '<div class="avis">Saisir un numéro de commande existant.</div>'; return false; }
        if (!$("#rre").value) { $("#ronOut").innerHTML = '<div class="avis">Choisir un motif.</div>'; return false; }
        await api("/api/returns", { method: "POST", body: { order_id: cible.id,
          reason: $("#rre").value, notes: $("#rno").value || null, resolution: $("#rso").value } });
        VUES.retours();
      }, "Créer",
      (ct) => {
        const champ = ct.querySelector("#ron"), sortie = ct.querySelector("#ronOut");
        let deb;
        const chercher = async () => {
          const v = champ.value.trim();
          cible = null;
          if (!v) { sortie.innerHTML = ""; return; }
          const r = await api("/api/orders?q=" + encodeURIComponent(v) + "&limit=6");
          const exacte = r.orders.find(o => String(o.order_number).toLowerCase() === v.toLowerCase());
          if (exacte) {
            cible = exacte;
            sortie.innerHTML = `<div class="avis info"><b>${esc(exacte.order_number)}</b> —
              ${esc(exacte.customer_name || "")} · ${money(exacte.order_total)} ·
              ${esc(STATUT_FR[exacte.status] || exacte.status)}</div>`;
            return;
          }
          sortie.innerHTML = r.orders.length
            ? `<div class="avis">Aucune correspondance exacte. ${r.orders.length} approchante(s) :
                 ${r.orders.map(o => `<button type="button" class="lienB" data-pick="${esc(o.order_number)}">${esc(o.order_number)}</button>`).join(" · ")}</div>`
            : '<div class="avis">Aucune commande ne porte ce numéro.</div>';
          sortie.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
            champ.value = b.dataset.pick; chercher();
          });
        };
        champ.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(chercher, 250); });
      });
  };
  $("#rt").append(table([
    { k: "rma", t: "RMA" }, { k: "order_number", t: "Commande" }, { k: "customer_name", t: "Client" },
    { k: "reason", t: "Motif", r: r => {
        const m = MOTIFS_RETOUR.find(([v]) => v === r.reason);
        return esc(m ? m[1] : (r.reason || "—")) + (r.notes
          ? ` <button type="button" class="noteB" data-note="${esc(r.notes)}"
               aria-label="Note de migration : ${esc(r.notes)}" title="${esc(r.notes)}">✎</button>` : "");
      } },
    { k: "resolution", t: "Résolution", r: r => esc(({ refund: "Remboursement", exchange: "Échange",
        store_credit: "Crédit en boutique" })[r.resolution] || r.resolution || "—") },
    { k: "requested_at", t: "Demandé", r: r => jour(r.requested_at) },
    { k: "status", t: "Statut", r: r => `<span class="puce ${r.status === "refunded" ? "v" : r.status === "rejected" ? "r" : "a"}">${esc(r.status)}</span>` },
    { k: "act", t: "", r: r => `<select data-rid="${r.id}"><option value="">changer…</option>
      ${["requested","approved","in_transit","received","refunded","rejected"].map(s => `<option>${s}</option>`).join("")}</select>` },
  ], d.returns));
  $("#rt").querySelectorAll("[data-rid]").forEach(s => s.onchange = async () => {
    if (!s.value) return;
    await api("/api/returns/" + s.dataset.rid, { method: "POST", body: { status: s.value } });
    VUES.retours();
  });
};

/**
 * Nom de lot proposé par défaut — jamais un nom déjà porté par un lot ouvert.
 *
 * L'audit relevait que « Créer un lot » proposait `Lot du 2026-08-02`, identique au lot
 * déjà ouvert, et que la liste des lots ouverts n'a aucune colonne d'identifiant pour
 * distinguer les homonymes. Deux lots du même nom dans le panneau gauche, c'est une commande
 * déposée dans le mauvais et découverte à l'expédition. Le serveur refait le même calcul à
 * la création (`nomDeLotLibre`) : la proposition d'ici est un confort, pas la garantie.
 */
function nomDeLotPropose(lots = null) {
  const racine = "Lot du " + new Date().toISOString().slice(0, 10);
  const pris = new Set((lots || LOTS || []).map((l) => (l.name || "").trim()));
  if (!pris.has(racine)) return racine;
  for (let i = 2; i < 200; i++) if (!pris.has(`${racine} (${i})`)) return `${racine} (${i})`;
  return racine;
}

/**
 * Produits, groupes de préréglages et import — §3.5 de l'audit visuel.
 *
 * Le module le plus contrasté de l'audit : l'écran Douanes n'a aucun équivalent chez
 * ShipStation, et à côté le catalogue n'avait **aucun chemin d'import**. Le réparer à la
 * main était chiffré à ~3 800 saisies. Trois manques structurels sont traités ici :
 *
 * 1. **L'import CSV** (avec gabarit téléchargeable et passage à blanc obligatoire avant
 *    écriture). Chez ShipStation c'est l'export qui sert de gabarit ; ici le gabarit existe
 *    même catalogue vide, puisque c'est justement là qu'on en a besoin.
 * 2. **Le rattachement à un groupe de préréglages**, absent de la fiche produit — alors que
 *    ce sont les 4 groupes de Lasclay qui portent *tous* les poids et *toutes* les dimensions
 *    du catalogue (200 g / 460 g / 70 g / 200 g). Sans ce champ, la règle d'héritage était
 *    affirmée dans l'aide et inapplicable à l'écran.
 * 3. **L'affichage de la valeur héritée sous chaque champ vide** (le « Preset - 200 » de
 *    ShipStation). C'est ce qui rend l'héritage vérifiable : un poids vide veut-il dire
 *    « 0 g » ou « 200 g hérités » ? Sans la mention, rien ne permet de trancher.
 *
 * Le formulaire de groupe passe aussi en listes fermées : il exposait `canada_post`,
 * `expedited_parcel`, `package` en saisie libre, où une faute de frappe créait un préréglage
 * silencieusement inopérant.
 */

    <div class="barre" id="pMasse" hidden>
      <b id="pSelN" style="flex:1"></b>
      <button id="pmg">Rattacher à un groupe…</button>
      <button id="pmOn">Activer</button>
      <button class="d" id="pmOff">Désactiver</button>
      <button id="pmX">Tout désélectionner</button></div>
    <div id="pt"></div>
    <div class="pag" id="pPag" hidden>
      <button id="pPrev">◀</button><span id="pInfo" class="doux"></span><button id="pNext">▶</button>
      <select id="pTaille" aria-label="Lignes par page">

  const params = () => new URLSearchParams({

  let derniere = { products: [], total: 0 };
  async function charger() {

    // Catalogue vide : l'audit reprochait un « Aucun résultat » nu là où l'écran Commandes

    // une sortie ; les deux se disent.

          les couches 3 et 4 de l'automatisation ne font rien, et l'écran Douanes affiche un
          zéro qui ne mesure rien.</p>
        <div class="barre" style="justify-content:center">
          <button class="p" id="pv1">Importer un CSV…</button>
          <a class="doux" href="/api/products/template">Télécharger le gabarit</a>
          <button id="pv2">Créer un produit à la main</button></div></div>`;

    $("#pt").append(table([
      { k: "sku", t: "SKU" }, { k: "name", t: "Nom" },
      { k: "weight_g", t: "Poids (g)", n: true, r: (x) => x.weight_g ? num(Math.round(x.weight_g))
        : (x.herite && x.herite.weight_g ? `<span class="doux">${num(x.herite.weight_g)} hérité</span>`
          : '<span class="puce a">—</span>') },
      { k: "dimensions", t: "Dimensions", r: (x) => dimsTexte(x.dimensions)
        || (x.herite && x.herite.dimensions ? `<span class="doux">${esc(dimsTexte(x.herite.dimensions))} hérité</span>` : "—") },
      { k: "preset_group_id", t: "Groupe", r: (x) => x.preset_group_id
        ? esc(nomGroupe(x.preset_group_id)) : '<span class="puce a">aucun</span>' },
      { k: "hs_code", t: "Code SH", r: (x) => x.hs_code ? esc(x.hs_code) : '<span class="puce a">manquant</span>' },
      { k: "country_of_origin", t: "Origine" },
      { k: "upc", t: "UPC", r: (x) => x.upc ? esc(x.upc) : '<span class="doux">—</span>' },
      { k: "warehouse_location", t: "Emplacement" },
      { k: "declared_value", t: "Valeur déclarée", n: true, r: (x) => x.declared_value != null ? money(x.declared_value) : "—" },
      { k: "price", t: "Prix", n: true, r: (x) => money(x.price) },
      { k: "active", t: "Actif", r: (x) => x.active ? '<span class="puce v">oui</span>' : '<span class="puce r">non</span>' },
    ], d.products, {
      sel, onSel: majMasse,
      tri: P.tri, dir: P.dir,
      onTri: (k) => { P.dir = P.tri === k && P.dir === "asc" ? "desc" : "asc"; P.tri = k; P.page = 0; charger(); },
      onLigne: (id) => editerProduit(d.products.find((x) => x.id == id)),
    }));
    majPage(d.total);
    majMasse();
  }

  const dimsTexte = (d) => d && (d.length || d.width || d.height)
    ? `${d.length || 0} × ${d.width || 0} × ${d.height || 0} ${d.unit || "in"}` : "";

  // ------------------------------------------------------------- pagination
  function majPage(total) {
    const p = $("#pPag");
    p.hidden = total <= P.taille;
    const deb = P.page * P.taille + 1, fin = Math.min((P.page + 1) * P.taille, total);
    $("#pInfo").textContent = `${num(deb)} – ${num(fin)} sur ${num(total)}`;
    $("#pPrev").disabled = P.page === 0;
    $("#pNext").disabled = fin >= total;
  }
  $("#pPrev").onclick = () => { if (P.page > 0) { P.page--; charger(); } };
  $("#pNext").onclick = () => { P.page++; charger(); };
  $("#pTaille").onchange = () => { P.taille = Number($("#pTaille").value); P.page = 0; charger(); };

  // --------------------------------------------------------- actions de masse
  function majMasse() {
    $("#pMasse").hidden = !sel.size;
    $("#pSelN").textContent = `${num(sel.size)} produit${sel.size > 1 ? "s" : ""} sélectionné${sel.size > 1 ? "s" : ""}`;
  }
  // La table rappelle `majMasse` directement (option `onSel`) plutôt que par un événement
  // global : revenir dix fois sur Produits laissait sinon dix handlers accrochés à
  // `document`, chacun avec sa fermeture périmée sur un `sel` abandonné.
  $("#pmX").onclick = () => { sel.clear(); charger(); };
  // `tenter` avale l'échec dans un toast et rend `null` : sans ce `=== null ? false`, le
  // dialogue se refermait sur une action qui n'avait rien fait, ce qui se lit comme un succès.
  const masse = async (body, quoi) => {
    const r = await tenter(() => api("/api/products/bulk", { method: "POST", body: { ...body, ids: [...sel] } }), {
      message: "Action de masse impossible",
      apres: (r) => { toast(`${num(r.n)} produit(s) ${quoi}.`, { type: "succes" }); sel.clear(); charger(); },
    });
    return r === null ? false : r;
  };
  $("#pmOn").onclick = () => masse({ active: true }, "activés");
  $("#pmOff").onclick = () => masse({ active: false }, "désactivés");
  $("#pmg").onclick = () => {
    if (!groupes.length) return dialogue("Aucun groupe", `<div class="avis">Aucun groupe de
      préréglages n'existe encore. Créez-en un d'abord : ce sont les groupes qui portent les
      poids et les dimensions du catalogue.</div>`, null, "Fermer");
    dialogue("Rattacher à un groupe", `
      <p class="doux">Les valeurs du groupe s'appliqueront à ces produits partout où leur fiche
        est vide. Un défaut posé sur la fiche l'emporte toujours sur celui du groupe.</p>
      <label class="champ"><span>Groupe</span><select id="mg">
        <option value="">— détacher du groupe —</option>
        ${groupes.map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select></label>`,
      () => masse({ preset_group_id: $("#mg").value ? Number($("#mg").value) : null },
        $("#mg").value ? "rattachés" : "détachés"),
      "Appliquer à la sélection");
  };

  // ------------------------------------------------------------ import CSV
  /**
   * L'import tourne **à blanc d'abord**, sans exception : le bouton d'écriture reste
   * désactivé tant qu'aucun passage à blanc n'a été joué, comme la classification douanière.
   * Écraser 473 fiches saisies à la main est irréversible sans sauvegarde.
   */
  function importer() {
    let blanc = null;
    const c = dialogue("Importer des produits", `
      <p class="doux">Un fichier CSV, une ligne par produit. La colonne <code>sku</code> est
        obligatoire : c'est la clé de rapprochement. Les autres colonnes sont facultatives et
        celles qu'on n'apporte pas ne sont pas touchées.</p>
      <p class="doux" style="font-size:12px">Colonnes reconnues : <code>sku, name, weight_g,
        price, hs_code, country_of_origin, warehouse_location, customs_description,
        declared_value, upc, length, width, height</code> — les en-têtes français
        (<code>nom</code>, <code>poids</code>, <code>code_sh</code>, <code>origine</code>…)
        sont acceptés aussi. <a href="/api/products/template">Télécharger le gabarit</a>.</p>
      <div class="grille">
        <label class="champ"><span>Fichier</span><input type="file" id="if" accept=".csv,text/csv"></label>
        <label class="champ"><span>Si le SKU existe déjà</span><select id="ic">
          <option value="maj">Mettre à jour la fiche</option>
          <option value="ignorer">Ne pas y toucher</option></select></label>
      </div>
      <label class="champ"><span>…ou coller le contenu</span><textarea id="it" style="min-height:110px"
        placeholder="sku,name,weight_g&#10;LAS-MIT-001,Mitaines,200"></textarea></label>
      <div class="barre"><button type="button" class="p" id="ib">Passer à blanc</button>
        <span class="doux" style="font-size:12px">rien n'est écrit tant qu'on n'a pas regardé</span></div>
      <div id="iOut"></div>`,
      async () => {
        if (!blanc) { toast("Passez d'abord l'import à blanc.", { type: "avis" }); return false; }
        const r = await api("/api/products/import", { method: "POST",
          body: { csv: await texte(), collision: $("#ic").value, appliquer: true } });
        toast(`${num(r.crees)} créés, ${num(r.majs)} mis à jour, ${num(r.ignores)} ignorés, ${num(r.refuses.length)} refusés.`,
          { type: "succes" });
        P.page = 0; charger();
      }, "Importer pour de vrai");

    const bOk = $("#dlgO");
    bOk.disabled = true;
    const texte = async () => {
      const f = $("#if", c).files[0];
      return f ? await f.text() : $("#it", c).value;
    };
    $("#if", c).onchange = async () => {
      const f = $("#if", c).files[0];
      if (f) $("#it", c).value = (await f.text()).split(/\r?\n/).slice(0, 12).join("\n");
    };
    $("#ib", c).onclick = async () => {
      const t = await texte();
      if (!t.trim()) return toast("Aucun contenu à importer.", { type: "avis" });
      $("#iOut", c).innerHTML = squelette(2);
      try {
        const r = await api("/api/products/import", { method: "POST",
          body: { csv: t, collision: $("#ic").value, appliquer: false } });
        blanc = r;
        bOk.disabled = false;
        bOk.textContent = `Importer ${num(r.crees + r.majs)} produit${r.crees + r.majs > 1 ? "s" : ""}`;
        $("#iOut", c).innerHTML = `<div class="avis info"><b>${num(r.lus)}</b> lignes lues ·
          <b>${num(r.crees)}</b> à créer · <b>${num(r.majs)}</b> à mettre à jour ·
          ${num(r.ignores)} ignorées · <b>${num(r.refuses.length)}</b> refusées.
          <br><span class="doux">Colonnes reconnues : ${r.colonnes_reconnues.map(esc).join(", ") || "aucune"}.
          Rien n'a encore été écrit.</span></div>
          ${r.refuses.length ? `<div class="tbl" style="max-height:190px"><table>
            <thead><tr><th scope="col">Ligne</th><th scope="col">SKU</th><th scope="col">Motif du refus</th></tr></thead>
            <tbody>${r.refuses.slice(0, 100).map((x) => `<tr><td class="n">${x.ligne}</td>
              <td>${esc(x.sku || "—")}</td><td>${esc(x.motif)}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
      } catch (e) {
        blanc = null; bOk.disabled = true;
        $("#iOut", c).innerHTML = "";
        $("#iOut", c).append(panneauErreur(e, () => $("#ib", c).click(), "Lecture du fichier impossible"));
      }
    };
  }
  $("#pimp").onclick = () => importer();

  // ------------------------------------------------------------ fiche produit
  /**
   * La fiche passe de 8 champs sur un écran à quatre onglets — Général, Expédition, Douane,
   * Inventaire — sur le découpage de ShipStation. Sous chaque champ que le groupe renseigne,
   * une mention `Groupe — …` : c'est le mécanisme qui rend l'héritage vérifiable.
   */
  const editerProduit = (p = {}) => {
    const h = p.herite || {};
    const svc = (S.refs.services || []).filter((x) => !x.hidden);
    const d = p.dimensions || {};
    // La mention héritée affiche le **libellé**, jamais l'identifiant technique : « Preset -
    // Expedited Parcel (Carbon Neutral) » chez ShipStation, pas « 115317 ». Un identifiant
    // affiché à l'opérateur est illisible, et l'audit le reprochait déjà au formulaire de groupe.
    const hint = (v, fmt = (x) => x) => v === undefined || v === null || v === ""
      ? "" : `<span class="herite">Groupe — ${esc(String(fmt(v)))}</span>`;
    const libelle = (liste, cle, v) => {
      const t = (liste || []).find((x) => String(x[cle]) === String(v));
      return t ? (t.name || t.nom) : v;
    };
    const opt = (liste, valeur, vide = "— aucun —") =>
      `<option value="">${vide}</option>` + liste.map(([v, t]) =>
        `<option value="${esc(String(v))}"${String(valeur ?? "") === String(v) ? " selected" : ""}>${esc(t)}</option>`).join("");

    return dialogue(p.id ? `Produit ${p.sku || p.id}` : "Nouveau produit", `
      <div class="onglets" role="tablist">
        ${[["g", "Général"], ["e", "Expédition"], ["d", "Douane"], ["i", "Inventaire"]].map(([k, t], i) =>
          `<button type="button" role="tab" data-o="${k}" class="ong${i ? "" : " actif"}" aria-selected="${!i}">${t}</button>`).join("")}
      </div>

      <section data-p="g">
        <div class="grille">
          <label class="champ"><span>SKU</span><input id="xs" value="${esc(p.sku || "")}"></label>
          <label class="champ"><span>UPC / code-barres</span><input id="xu" value="${esc(p.upc || "")}"
            placeholder="scan inopérant sans UPC"></label>
        </div>
        <label class="champ"><span>Nom</span><input id="xn" value="${esc(p.name || "")}"></label>
        <div class="grille">
          <label class="champ"><span>Prix</span><input type="number" step="0.01" id="xp" value="${p.price ?? ""}"></label>
          <label class="champ"><span>Catégorie</span><input id="xc" value="${esc(p.category || "")}"></label>
          <label class="champ"><span>État</span><select id="xa">
            <option value="1"${p.active === false ? "" : " selected"}>Actif</option>
            <option value="0"${p.active === false ? " selected" : ""}>Inactif</option></select></label>
        </div>
      </section>

      <section data-p="e" hidden>
        <label class="champ"><span>Groupe de préréglages</span>
          <select id="xg">${opt(groupes.map((g) => [g.id, g.name]), p.preset_group_id, "— aucun groupe —")}</select></label>
        <p class="doux" style="font-size:12px;margin:2px 0 10px">Le groupe fournit ce que la fiche
          laisse vide. Un défaut posé ici l'emporte toujours sur celui du groupe.</p>
        <div class="grille">
          <label class="champ"><span>Poids du colis (g)</span>
            <input type="number" id="xw" value="${p.weight_g || ""}">${hint(h.weight_g, (x) => `${x} g`)}</label>
          <label class="champ"><span>Type de colis</span>
            <select id="xk">${opt((S.refs.packages || []).map((x) => [x.id, x.name]), p.default_package)}</select>
            ${hint(h.package_id, (x) => libelle(S.refs.packages, "id", x))}</label>
          <label class="champ"><span>Service par défaut</span>
            <select id="xv">${optionsService(p.default_service || "", { vide: "— choisir —" })}</select></label>
          <label class="champ"><span>Confirmation</span>
            <select id="xf">${opt((S.refs.confirmations || []).map((x) => [x.id, x.nom]), p.confirmation)}</select>
            ${hint(h.confirmation, (x) => libelle(S.refs.confirmations, "id", x))}</label>
        </div>
        <div class="fLab">Dimensions du colis (po)</div>
        <div class="grille" style="grid-template-columns:repeat(3,1fr)">
          <label class="champ"><span>Longueur</span><input type="number" step="0.01" id="xdl" value="${d.length || ""}"></label>
          <label class="champ"><span>Largeur</span><input type="number" step="0.01" id="xdw" value="${d.width || ""}"></label>
          <label class="champ"><span>Hauteur</span><input type="number" step="0.01" id="xdh" value="${d.height || ""}"></label>
        </div>
        ${h.dimensions ? `<span class="herite">Groupe — ${esc(dimsTexte(h.dimensions))}</span>` : ""}
      </section>

      <section data-p="d" hidden>
        <div class="grille">
          <label class="champ"><span>Code SH (6 chiffres)</span>
            <input id="xh" value="${esc(p.hs_code || "")}" placeholder="0000.00" inputmode="numeric">
            ${hint(h.hs_code)}</label>
          <label class="champ"><span>Pays d'origine</span>
            <select id="xo">${opt(PAYS_EXPEDITION.map((x) => [x[0], x[1]]), p.country_of_origin || "CA", "— non déclaré —")}</select>
            ${hint(h.country_of_origin)}</label>
          <label class="champ"><span>Valeur déclarée (CA$)</span>
            <input type="number" step="0.01" id="xdv" value="${p.declared_value ?? ""}">
            ${hint(h.declared_value, (x) => money(x))}</label>
        </div>
        <label class="champ"><span>Description douanière</span>
          <textarea id="xd" style="min-height:64px">${esc(p.customs_description || "")}</textarea></label>
        <p class="doux" style="font-size:12px">Décrivez la matière et l'usage, pas la marque :
          « mitaines tricotées en fibre d'asclépiade » plutôt que « Lasclay Mitaines ». Une
          description vague est le premier motif de retenue en douane.</p>
        ${hint(h.customs_description)}
      </section>

      <section data-p="i" hidden>
        ${p.id ? `<div class="fLab">Stock par entrepôt</div>
          <p class="doux" style="font-size:12px">Le seuil déclenche l'alerte de stock bas.</p>
          ${(S.refs.warehouses || []).length ? (S.refs.warehouses || []).map((w) => {
            const inv = (p.inventory || []).find((i) => i.warehouse_id === w.id) || {};
            return `<div class="grille" style="grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:end">
              <span class="doux">${esc(w.name)}</span>
              <label class="champ"><span>En main</span><input type="number" data-inv="${w.id}" value="${inv.on_hand ?? ""}"></label>
              <label class="champ"><span>Seuil</span><input type="number" data-seuil="${w.id}" value="${inv.low_threshold ?? ""}"></label>
            </div>`; }).join("")
            : '<div class="avis">Aucun entrepôt configuré : le stock n\'a nulle part où être posé.</div>'}
          <hr><div class="fLab">Produit assemblé (bundle)</div>
          <p class="doux" style="font-size:12px">Un SKU vendu comme un tout qui recouvre plusieurs
            produits à prélever. Une ligne par composant : SKU;quantité. Vide = produit simple.</p>
          <textarea id="xb" style="min-height:70px">${esc((p.bundle_items || []).map((i) => `${i.sku};${i.quantity}`).join("\n"))}</textarea>`
        : '<p class="doux">Enregistrez le produit une première fois pour lui poser du stock.</p>'}
      </section>`,
      async () => {
        const dims = ["xdl", "xdw", "xdh"].some((i) => $("#" + i).value)
          ? { length: Number($("#xdl").value) || 0, width: Number($("#xdw").value) || 0,
              height: Number($("#xdh").value) || 0, unit: "in" }
          : null;
        const r = await api("/api/products", { method: "POST", body: {
          ...(p.id ? { external_id: p.external_id } : {}),
          sku: $("#xs").value, name: $("#xn").value, upc: $("#xu").value,
          price: Number($("#xp").value) || 0, category: $("#xc").value,
          active: $("#xa").value === "1",
          preset_group_id: $("#xg").value ? Number($("#xg").value) : null,
          weight_g: Number($("#xw").value) || 0, dimensions: dims,
          default_package: $("#xk").value || null, default_service: $("#xv").value || null,
          hs_code: $("#xh").value, country_of_origin: $("#xo").value,
          declared_value: $("#xdv").value === "" ? null : Number($("#xdv").value),
          customs_description: $("#xd").value,
          is_bundle: p.is_bundle, bundle_items: p.bundle_items,
        } });
        const bt = document.querySelector("#dlgC #xb");
        if (bt) {
          await api("/api/bundles", { method: "POST", body: { sku: $("#xs").value,
            items: bt.value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
              const [sku, q] = l.split(";").map((x) => (x || "").trim());
              return { sku, quantity: Number(q) || 1 };
            }) } });
        }
        for (const inp of document.querySelectorAll("#dlgC [data-inv]")) {
          const w = Number(inp.dataset.inv);
          const seuil = document.querySelector(`#dlgC [data-seuil="${w}"]`);
          if (inp.value === "" && (!seuil || seuil.value === "")) continue;
          await api("/api/inventory", { method: "POST", body: { product_id: r.id, warehouse_id: w,
            on_hand: inp.value === "" ? null : Number(inp.value),
            low_threshold: seuil && seuil.value !== "" ? Number(seuil.value) : null } });
        }
        charger();
      }, "Enregistrer",
      (c) => c.querySelectorAll("[data-o]").forEach((b) => b.onclick = () => {
        c.querySelectorAll("[data-o]").forEach((x) => {
          x.classList.toggle("actif", x === b); x.setAttribute("aria-selected", x === b);
        });
        c.querySelectorAll("[data-p]").forEach((s) => { s.hidden = s.dataset.p !== b.dataset.o; });
      }));
  };
  $("#pnew").onclick = () => editerProduit();

  /** Alias : plusieurs SKU de boutiques différentes désignant la même fiche produit. */
  $("#palias").onclick = async () => {
    const { aliases } = await api("/api/aliases");
    const c = dialogue("Alias de SKU", `
      <p class="doux">Une commande arrivée avec un alias hérite des défauts de la fiche visée —
        poids, douane, service. Utile quand une même chose porte un SKU différent selon le canal.</p>
      ${aliases.length ? `<div class="tbl" style="max-height:220px"><table>
        <thead><tr><th scope="col">Alias</th><th scope="col">Fiche produit</th><th scope="col"><span class="visuellement-cache">Action</span></th></tr></thead><tbody>
        ${aliases.map(a => `<tr><td><code>${esc(a.alias)}</code></td>
          <td>${esc(a.sku)} <span class="doux">${esc(a.name || "")}</span></td>
          <td><button class="d" data-ad="${esc(a.alias)}">Retirer</button></td></tr>`).join("")}
        </tbody></table></div>` : '<p class="doux">Aucun alias.</p>'}
      <hr><div class="grille">
        <label class="champ"><span>Alias (le SKU reçu)</span><input id="aa"></label>
        <label class="champ"><span>SKU de la fiche</span><input id="ab"></label>
      </div>`,
      async () => {
        if (!$("#aa").value.trim() || !$("#ab").value.trim()) return false;
        try { await api("/api/aliases", { method: "POST",
          body: { alias: $("#aa").value.trim(), sku: $("#ab").value.trim() } }); }
        catch (e) { alert(e.message); return false; }
      }, "Ajouter");
    $("#dlgC", document).querySelectorAll("[data-ad]").forEach(b => b.onclick = async () => {
      await api("/api/aliases", { method: "POST", body: { alias: b.dataset.ad, supprimer: true } });
      $("#dlg").close();
    });
  };

  /**
   * Groupes de préréglages — la source unique des poids et des dimensions de Lasclay.
   *
   * Deux corrections de l'audit. Le formulaire était en **saisie libre** avec des identifiants
   * techniques en repère (`canada_post`, `expedited_parcel`, `package`) : une faute de frappe
   * créait un préréglage silencieusement inopérant. Il passe en listes fermées. Et surtout, il
   * n'avait **ni poids ni dimensions** — alors que c'est exactement ce que les 4 groupes du
   * compte portent (200 g / 460 g / 70 g / 200 g ; 7×12×2,25 / 12×6×6 / 7,5×12×1 / 6×9×1 po),
   * les fiches produit étant à 0 g et 0×0×0 et héritant.
   */
  $("#pgrp").onclick = async () => {
    const { groups } = await api("/api/preset-groups");
    groupes = groups;
    const svc = (S.refs.services || []).filter((x) => !x.hidden);
    const resume = (s) => [
      s.weight_g ? `${num(s.weight_g)} g` : null,
      s.dimensions ? dimsTexte(s.dimensions) : null,
      s.service_id ? (svc.find((x) => String(x.id) === String(s.service_id)) || {}).name || s.service_id : null,
      s.package_id ? ((S.refs.packages || []).find((x) => String(x.id) === String(s.package_id)) || {}).name || s.package_id : null,
      (s.customs || {}).hs_code || s.hs_code || null,
    ].filter(Boolean).join(" · ") || "aucun réglage";
    const opt = (liste, valeur, vide) => `<option value="">${vide}</option>` + liste.map(([v, t]) =>
      `<option value="${esc(String(v))}"${String(valeur ?? "") === String(v) ? " selected" : ""}>${esc(t)}</option>`).join("");

    const c = dialogue("Groupes de préréglages", `
      <p class="doux">Un groupe applique ses réglages à tous ses produits. Un défaut posé sur
        une fiche individuelle l'emporte sur celui du groupe — même règle que ShipStation.
        Chez Lasclay ce sont les groupes qui portent les poids et les dimensions du catalogue.</p>
      <div id="gl">${groups.length ? groups.map((g) => `<div class="carte" style="padding:9px">
          <b>${esc(g.name)}</b>
          <button style="float:right" data-ge="${g.id}">Modifier</button>
          <br><span class="doux" style="font-size:12px">${esc(resume(g.settings || {}))}</span>
        </div>`).join("")
        : `<div class="avis"><b>Aucun groupe.</b> Sans groupe, le clone n'a aucun poids ni
           aucune dimension de référence pour coter un envoi : chaque fiche produit doit alors
           porter les siens.</div>`}</div>
      <hr><b id="gTitre">Nouveau groupe</b>
      <input type="hidden" id="gid">
      <label class="champ"><span>Nom</span><input id="gn" placeholder="Mitaines Seules"></label>
      <div class="grille">
        <label class="champ"><span>Poids (g)</span><input type="number" id="gw"></label>
        <label class="champ"><span>Transporteur</span>
          <select id="gc">${opt((S.refs.carriers || []).map((x) => [x.code, x.name]), "", "— aucun —")}</select></label>
        <label class="champ"><span>Service</span>
          <select id="gs">${optionsService("", { vide: "— aucun —" })}</select></label>
        <label class="champ"><span>Type de colis</span>
          <select id="gp">${opt((S.refs.packages || []).map((x) => [x.id, x.name]), "", "— aucun —")}</select></label>
        <label class="champ"><span>Confirmation</span>
          <select id="gf">${opt((S.refs.confirmations || []).map((x) => [x.id, x.nom]), "", "— aucune —")}</select></label>
      </div>
      <div class="fLab">Dimensions (po)</div>
      <div class="grille" style="grid-template-columns:repeat(3,1fr)">
        <label class="champ"><span>Longueur</span><input type="number" step="0.01" id="gdl"></label>
        <label class="champ"><span>Largeur</span><input type="number" step="0.01" id="gdw"></label>
        <label class="champ"><span>Hauteur</span><input type="number" step="0.01" id="gdh"></label>
      </div>
      <div class="fLab">Douane</div>
      <div class="grille">
        <label class="champ"><span>Code SH</span><input id="gh" placeholder="6116.93" inputmode="numeric"></label>
        <label class="champ"><span>Pays d'origine</span>
          <select id="go">${opt(PAYS_EXPEDITION.map((x) => [x[0], x[1]]), "CA", "— non déclaré —")}</select></label>
        <label class="champ"><span>Valeur déclarée (CA$)</span><input type="number" step="0.01" id="gv"></label>
      </div>
      <label class="champ"><span>Description douanière</span><input id="gdd"></label>
      <div id="gErr"></div>`,
      async () => {
        if (!$("#gn").value.trim()) { toast("Le nom du groupe est obligatoire.", { type: "avis" }); return false; }
        const dims = ["gdl", "gdw", "gdh"].some((i) => $("#" + i).value)
          ? { length: Number($("#gdl").value) || 0, width: Number($("#gdw").value) || 0,
              height: Number($("#gdh").value) || 0, unit: "in" }
          : undefined;
        // Le nom est unique en base : une collision remontait le message brut de SQLite dans
        // une alerte native. Elle se dit ici en clair, avec la sortie — ouvrir le groupe qui
        // porte déjà ce nom plutôt que d'en réinventer un.
        const dejaLa = groups.find((x) => x.name.toLowerCase() === $("#gn").value.trim().toLowerCase()
          && String(x.id) !== $("#gid").value);
        if (dejaLa) {
          $("#gErr").innerHTML = `<div class="avis">Un groupe s'appelle déjà
            « ${esc(dejaLa.name)} ». <button type="button" class="lienB" id="gOuvre">L'ouvrir pour
            le modifier</button>, ou donnez un autre nom.</div>`;
          $("#gOuvre").onclick = () => { $("#gErr").innerHTML = ""; $(`[data-ge="${dejaLa.id}"]`, c).click(); };
          return false;
        }
        await api("/api/preset-groups", { method: "POST", body: {
          id: $("#gid").value ? Number($("#gid").value) : undefined,
          name: $("#gn").value.trim(),
          settings: {
            weight_g: $("#gw").value === "" ? undefined : Number($("#gw").value),
            dimensions: dims,
            carrier_code: $("#gc").value || undefined, service_id: $("#gs").value || undefined,
            package_id: $("#gp").value || undefined, confirmation: $("#gf").value || undefined,
            customs: {
              hs_code: $("#gh").value || undefined,
              country_of_origin: $("#go").value || undefined,
              value: $("#gv").value === "" ? undefined : Number($("#gv").value),
              description: $("#gdd").value || undefined,
            },
          } } });
        toast($("#gid").value ? "Groupe mis à jour." : "Groupe créé.", { type: "succes" });
        groupes = (await api("/api/preset-groups")).groups || [];
        charger();
      }, "Créer");

    $("#gl", c).querySelectorAll("[data-ge]").forEach((b) => b.onclick = () => {
      const g = groups.find((x) => x.id == b.dataset.ge);
      const s = g.settings || {}, cu = s.customs || {}, dm = s.dimensions || {};
      $("#gid", c).value = g.id;
      $("#gTitre", c).textContent = `Modifier « ${g.name} »`;
      $("#dlgO").textContent = "Enregistrer";
      $("#gn", c).value = g.name;
      $("#gw", c).value = s.weight_g ?? "";
      for (const [id, v] of [["gc", s.carrier_code], ["gs", s.service_id], ["gp", s.package_id],
        ["gf", s.confirmation], ["go", cu.country_of_origin || s.country_of_origin]])
        $("#" + id, c).value = v ?? "";
      $("#gdl", c).value = dm.length ?? ""; $("#gdw", c).value = dm.width ?? ""; $("#gdh", c).value = dm.height ?? "";
      $("#gh", c).value = cu.hs_code || s.hs_code || "";
      $("#gv", c).value = cu.value ?? "";
      $("#gdd", c).value = cu.description || "";
      $("#gn", c).focus();
    });
  };

  let deb; $("#vue").querySelectorAll(".barre input, .barre select").forEach((i) =>
    i.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(() => { P.page = 0; charger(); }, 250); }));
  await charger();

  // Une ligne d'inventaire ouvre la fiche du produit qu'elle décrit : l'écran Inventaire
  // renvoyait vers la liste des produits sans dire lequel, ce qui obligeait à le rechercher.
  if (S.produitAOuvrir) {
    const id = S.produitAOuvrir; S.produitAOuvrir = null;
    try { editerProduit(await api("/api/products/" + id)); } catch { /* fiche disparue entre-temps */ }
  }
};

/**
 * Fiche client — BUG-065.
 *
 * Aucune ligne n'était ouvrable : 37 158 clients listés, et pas moyen de voir l'adresse,
 * le téléphone ou l'historique de l'un d'eux. Or c'est exactement ce qu'on ouvre quand un
 * client écrit. Les cumuls sont **recalculés depuis les commandes** plutôt que lus dans les
 * champs figés de la fiche : une fiche importée porte les totaux du jour de l'import, qui
 * vieillissent sans que rien ne le dise.
 */
async function ficheClient(id) {
  let d;
  try { d = await api(`/api/customers/${id}`); }
  catch (e) { return dialogue("Fiche indisponible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }
  const c = d.client, a = c.address || {};
  const ecart = Math.abs((c.total_spent || 0) - d.cumul.depense) > 0.01 || (c.order_count || 0) !== d.cumul.commandes;

  dialogue(c.name || c.email || `Client ${id}`, `
    <div class="fDeux">
      <div>
        <div class="fLab">Identité</div>
        <div class="kv"><span>Courriel</span><b>${esc(c.email || "—")}</b></div>
        <div class="kv"><span>Téléphone</span><b>${esc(c.phone || "—")}</b></div>
        <div class="fLab" style="margin-top:10px">Adresse la plus récente</div>
        <div class="adr">${esc(a.street1 || "—")}${a.street2 ? `<br>${esc(a.street2)}` : ""}<br>
          ${esc(a.city || "")} ${esc(a.state || "")} ${esc(a.postalCode || "")}<br>${esc(a.country || "")}</div>
        ${d.adresses.length > 1 ? `<details style="margin-top:6px"><summary class="doux">
          ${d.adresses.length} adresses de livraison distinctes</summary>
          <ul class="doux" style="margin:4px 0 0 16px;font-size:12px">${d.adresses.map(x =>
            `<li>${esc([x.rue, x.ville, x.province, x.cp].filter(Boolean).join(", "))} — ${num(x.n)} envoi(s)</li>`).join("")}</ul>
        </details>` : ""}
      </div>
      <div>
        <div class="fLab">Cumuls — recalculés depuis les commandes</div>
        <div class="kv"><span>Commandes</span><b>${num(d.cumul.commandes)}</b></div>
        <div class="kv"><span>Total dépensé</span><b>${money(d.cumul.depense)}</b></div>
        <div class="kv"><span>Première</span><b>${jour(d.cumul.premiere)}</b></div>
        <div class="kv"><span>Dernière</span><b>${jour(d.cumul.derniere)}</b></div>
        ${ecart ? `<div class="avis" style="margin-top:8px">La fiche importée annonce
          ${num(c.order_count || 0)} commande(s) pour ${money(c.total_spent)} — les commandes
          en base disent autre chose. « Reconstruire depuis les commandes » remet les deux d'accord.</div>` : ""}
      </div>
    </div>
    <div class="fLab" style="margin-top:12px">Historique — ${num(d.total)} commande(s)</div>
    <div class="tbl" style="max-height:44vh"><table>
      <thead><tr><th scope="col">Commande</th><th scope="col">Boutique</th><th scope="col">Date</th>
        <th scope="col" class="n">Lignes</th><th scope="col" class="n">Total</th><th scope="col">Statut</th></tr></thead>
      <tbody>${d.commandes.map(o => `<tr>
        <td><button type="button" class="lienCmd" data-o="${o.id}">${esc(o.order_number)}</button></td>
        <td class="doux">${esc(o.boutique || "—")}</td>
        <td>${jour(o.order_date)}</td>
        <td class="n">${num(o.lignes)}</td>
        <td class="n">${money(o.order_total)}</td>
        <td><span class="puce g">${esc(STATUT_FR[o.status] || o.status)}</span></td></tr>`).join("")}</tbody>
    </table></div>
    ${d.total > d.commandes.length ? `<p class="doux">${num(d.commandes.length)} plus récentes affichées
      sur ${num(d.total)}.</p>` : ""}`,
    null, "Fermer",
    (ct) => ct.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      $("#dlg").close();
      detailCommande(Number(b.dataset.o));
    }));
}

/**
 * Clients — BUG-064.
 *
 * L'écran demandait `limit=300` et n'affichait rien de plus : sur 37 693 clients, il en
 * montrait 0,8 % en annonçant le total complet juste au-dessus. Un client au-delà de la
 * 300e ligne était introuvable autrement qu'en devinant son courriel. Pagination réelle,
 * et le compteur dit quelle tranche est à l'écran.
 */
VUES.clients = async () => {
  const S0 = S.clients = S.clients || { page: 0, taille: 100, tri: "total_spent" };
  $("#vue").innerHTML = `<h1>Clients</h1><p class="sous" id="cr">…</p>
    <div class="barre"><input type="search" id="cq" placeholder="Courriel ou nom">
      <select id="ctri">
        <option value="total_spent">Total dépensé</option>
        <option value="order_count">Nombre de commandes</option>
        <option value="last_order">Dernière commande</option>
        <option value="name">Nom</option>
      </select>
      <button id="crb">Reconstruire depuis les commandes</button>
      <a id="cex" class="doux">Exporter CSV</a></div>
    <div id="ct"></div>
    <div class="pag" id="cpag"></div>`;
  $("#ctri").value = S0.tri;

  async function charger() {
    if (!$("#cq")) return;          // écran quitté entre-temps
    const p = new URLSearchParams({ q: $("#cq").value, sort: S0.tri,
      limit: S0.taille, offset: S0.page * S0.taille });
    const d = await api("/api/customers?" + p);
    const debut = d.total ? S0.page * S0.taille + 1 : 0;
    const fin = Math.min((S0.page + 1) * S0.taille, d.total);
    $("#cr").innerHTML = d.total
      ? `<b>${num(debut)}–${num(fin)}</b> sur <b>${num(d.total)}</b> clients`
      : "Aucun client";
    // L'export porte sur la recherche, pas sur la page : exporter 100 lignes quand on en
    // voit 100 sur 37 693 serait une trappe.
    $("#cex").href = "/api/export/customers?" + new URLSearchParams({ q: $("#cq").value, sort: S0.tri });
    $("#cex").classList.toggle("inerte", !d.total);
    $("#ct").innerHTML = "";
    if (!d.customers.length) {
      $("#ct").append(etatVideG($("#cq").value
        ? { titre: "Aucun client ne correspond", detail: "Essayer une partie du courriel ou du nom." }
        : { titre: "Aucun client", detail: "Les clients se construisent à partir des commandes importées.",
            action: { t: "Reconstruire depuis les commandes", f: () => $("#crb").click() } }));
    } else {
      $("#ct").append(table([
        { k: "name", t: "Nom" }, { k: "email", t: "Courriel" },
        { k: "order_count", t: "Commandes", n: true },
        { k: "total_spent", t: "Total dépensé", n: true, r: c => money(c.total_spent) },
        { k: "first_order", t: "Première", r: c => jour(c.first_order) },
        { k: "last_order", t: "Dernière", r: c => jour(c.last_order) },
        { k: "act", t: "", r: c => `<button type="button" data-cf="${c.id}">Ouvrir</button>` },
      ], d.customers, { cle: "id" }));
      // Ligne entière cliquable, et un bouton pour qui navigue au clavier : une ligne
      // `role=button` sans cible atteignable au Tab n'existe pas pour tout le monde.
      $("#ct").querySelectorAll("[data-cf]").forEach(b => b.onclick = (e) => {
        e.stopPropagation(); ficheClient(Number(b.dataset.cf));
      });
      $("#ct").querySelectorAll("tbody tr[data-id]").forEach(tr =>
        tr.onclick = () => ficheClient(Number(tr.dataset.id)));
    }
    const pages = Math.max(1, Math.ceil(d.total / S0.taille));
    $("#cpag").innerHTML = `
      <button type="button" id="cprev" ${S0.page ? "" : "disabled"}>‹ Précédent</button>
      <span class="doux">page ${num(S0.page + 1)} sur ${num(pages)}</span>
      <button type="button" id="cnext" ${S0.page + 1 < pages ? "" : "disabled"}>Suivant ›</button>`;
    $("#cprev").onclick = () => { S0.page--; charger(); };
    $("#cnext").onclick = () => { S0.page++; charger(); };
  }

  $("#crb").onclick = () => dialogue("Reconstruire les clients",
    `<p>Les fiches clients sont recalculées à partir des commandes : nombre de commandes,
       total dépensé, première et dernière commande, et rattachement des commandes orphelines.</p>
     <p class="doux">Rien n'est supprimé. L'opération porte sur toute la base et peut prendre
       un moment sur un gros historique.</p>`,
    async () => {
      $("#dlgC").innerHTML = '<p class="doux">Reconstruction en cours…</p>';
      try {
        const r = await api("/api/customers/rebuild", { method: "POST" });
        $("#dlgC").innerHTML = `<div class="carte"><b>${num(r.n)} client(s)</b> consolidé(s).</div>`;
        S0.page = 0; charger();
      } catch (e) { $("#dlgC").innerHTML = `<div class="avis">${esc(e.message)}</div>`; }
      return false;
    }, "Reconstruire");

  $("#ctri").onchange = () => { S0.tri = $("#ctri").value; S0.page = 0; charger(); };
  let d; $("#cq").addEventListener("input", () => {
    clearTimeout(d); d = setTimeout(() => { S0.page = 0; charger(); }, 250);
  });
  charger();
};

      <div class="kpi"><div class="v">${num(a.resume.expeditions)}</div><div class="l">expéditions</div></div>
