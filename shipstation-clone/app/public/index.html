<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expéditions — Lasclay</title>
<style>
  /* ---- thème ----
     Clair par défaut, comme ShipStation. Le choix est une préférence d'utilisateur
     (§6.12 : Display Options = portée utilisateur), posée en `data-theme` sur <html> :
     `clair`, `sombre`, ou `systeme` pour suivre le réglage du poste. Le mode sombre
     n'est donc jamais imposé par le système sans que l'utilisateur l'ait demandé. */
  /*
   * Contrastes — BUG-086, valeurs mesurées et non devinées.
   *
   * `--doux` sur `--bg` donnait 4,38 en texte de 12 px : sous le seuil AA de 4,5. Passé à
   * #5c6673, il monte à 5,39 sur le fond de page et 5,83 sur une carte. Les pastilles
   * portent une couleur de texte propre, plus sombre que la couleur de leur famille : elles
   * s'affichent en 10,5 px sur un fond teinté, ce qui est le cas le plus exigeant de
   * l'interface. La pire — la grise, la plus utilisée — passe de 3,96 à 7,64.
   */
  :root {
    --bg:#f5f6f8; --carte:#fff; --bord:#d3d8de; --texte:#181c20; --doux:#5c6673;
    --accent:#1a56db; --vert:#0b7a4b; --ambre:#9a5b06; --rouge:#c0392b; --sel:#eaf1ff; --barre:#1f2937;
    --puce-v:#06603a; --puce-a:#7a4805; --puce-r:#9c2d22; --puce-g:#414952;
    /* Texte posé SUR une couleur pleine. En thème clair les pleins sont sombres, le blanc
       convient (5,4 à 6,2). En thème sombre ils sont clairs : le blanc y tombe à 2,1 sur le
       vert du bouton d'achat. La variable bascule, la règle CSS ne bouge pas (BUG-086). */
    --sur-plein:#ffffff;
    /* Bouton inactif : neutre et lisible. #eef0f3 sur #6a7480 donne 4,6 : 1 — au-dessus
       du seuil AA, et sans aucune parenté avec une couleur d'action. */
    --inactif-fond:#eef0f3; --inactif-texte:#5f6874;
    /* Échelle de rayons — l'audit relevait 5, 6, 7, 9, 11 et 14 px cohabitant, contre
       4 px partout chez ShipStation. Trois crans et une pilule, plutôt qu'une valeur
       unique : un dialogue plein écran et une puce de statut n'ont pas le même rayon
       optique. Ce qui comptait, c'est qu'il y ait une règle. */
    --r1:6px; --r2:9px; --r3:12px; --rp:999px;
    /* Hauteurs de contrôle — l'audit comptait 20, 28, 29, 32 et 34 px sur un seul écran,
       contre 32 px partout chez ShipStation. Deux crans : le cran dense pour les barres
       de filtres et les puces, le cran normal pour tout le reste. Ce sont des `min-height`
       et non des `height` : un bouton qui passe à la ligne reste lisible. */
    --h1:28px; --h2:32px;
    color-scheme: light;
  }
  :root[data-theme="sombre"] {
    --bg:#131619; --carte:#1b1f23; --bord:#2b3137; --texte:#e6e9ec; --doux:#98a1ab;
    --accent:#5b8cf5; --vert:#3dc98a; --ambre:#e0a33e; --rouge:#f0705f; --sel:#1d2740; --barre:#0e1114;
    --puce-v:#3dc98a; --puce-a:#e0a33e; --puce-r:#f0705f; --puce-g:#b6bec8;
    --sur-plein:#10151a;
    --inactif-fond:#23282d; --inactif-texte:#8b949e;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="systeme"] {
      --bg:#131619; --carte:#1b1f23; --bord:#2b3137; --texte:#e6e9ec; --doux:#98a1ab;
      --accent:#5b8cf5; --vert:#3dc98a; --ambre:#e0a33e; --rouge:#f0705f; --sel:#1d2740; --barre:#0e1114;
      --puce-v:#3dc98a; --puce-a:#e0a33e; --puce-r:#f0705f; --puce-g:#b6bec8;
      --sur-plein:#10151a;
    --inactif-fond:#23282d; --inactif-texte:#8b949e;
      color-scheme: dark;
    }
  }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--texte) }
  a { color:var(--accent) }
  /* ---- structure ---- */
  nav a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 16px;
          color:#c7cdd4; text-decoration:none; font-size:13.5px; cursor:pointer }
  nav a:hover { background:rgba(255,255,255,.06); color:#fff }
  /* `border-left` est un vestige d'une navigation verticale abandonnée : sur la barre
     horizontale actuelle il produisait un second indicateur d'onglet actif, en plus du
     soulignement voulu (§4.5). */
  nav a.actif { background:rgba(255,255,255,.10); color:#fff; font-weight:600 }
  nav .grp { padding:12px 16px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:#78828d }
  nav .n { background:rgba(255,255,255,.14); border-radius:var(--r2); padding:0 7px; font-size:11px; font-variant-numeric:tabular-nums }
  h2 { font-size:17px; margin:0 0 3px; font-weight:650 }
  .sous { color:var(--doux); font-size:13px; margin:0 0 14px }
  /* ---- éléments ---- */
  input,select,textarea,button { font:inherit; padding:6px 9px; border:1px solid var(--bord);
    border-radius:var(--r1); background:var(--carte); color:var(--texte) }
  input:not([type=checkbox]):not([type=radio]),select,button { min-height:var(--h2) }
  /* La hauteur du bouton doit être déterministe : sans interligne fixe, elle suit la
     police de chaque contexte et un même écran retombe à trois hauteurs différentes.
     Interligne posé + `min-height` : le cran est atteint par le bas, jamais dépassé. */
  button { line-height:1.15; padding:5px 10px }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; width:100%; min-height:280px }
  button { cursor:pointer } button:hover:not(:disabled) { border-color:var(--accent) }
  /* Un bouton désactivé ne doit pas ressembler à une action disponible. L'ancienne règle
     posait `opacity:.45` sur tous les boutons, y compris le primaire vert plein : le résultat
     était un vert délavé à ~2,05 : 1 de contraste, illisible ET encore engageant. Un bouton
     inactif perd donc sa couleur d'action et devient neutre, en gardant un texte lisible. */
  button:disabled, button.p:disabled, button.v:disabled, button.d:disabled {
    background:var(--inactif-fond); border-color:var(--bord); color:var(--inactif-texte);
    opacity:1; cursor:not-allowed; font-weight:400; box-shadow:none }
  button.p { background:var(--accent); border-color:var(--accent); color:var(--sur-plein); font-weight:600 }
  button.d { border-color:var(--rouge); color:var(--rouge) }
  .barre { display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:10px }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:var(--r2); padding:14px; margin-bottom:12px }
  .grille { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)) }
  .kpi { background:var(--carte); border:1px solid var(--bord); border-radius:var(--r2); padding:12px 14px }
  .kpi .v { font-size:23px; font-weight:660; font-variant-numeric:tabular-nums; letter-spacing:-.4px }
  .kpi .l { color:var(--doux); font-size:12px; margin-top:2px }
  .kpi.vert .v { color:var(--vert) } .kpi.ambre .v { color:var(--ambre) }
  .tbl { background:var(--carte); border:1px solid var(--bord); border-radius:var(--r2); overflow:auto; max-height:66vh }
  /*
   * Piège de défilement — BUG-082.
   *
   * Un tableau à hauteur fixe posé au milieu d'une page longue capte la molette : on croit
   * faire défiler la page et on fait défiler le tableau. Sur l'écran Réglages, cela rendait
   * les blocs Sécurité, Webhooks et Migration — les plus sensibles — littéralement
   * inatteignables à la souris, et `Fin` ne servait à rien puisque le conteneur défilant
   * n'est pas le document. `overscroll-behavior: contain` rend la molette à la page dès que
   * le tableau touche son extrémité ; les tableaux courts n'ont plus d'ascenseur du tout.
   */
  .tbl { overscroll-behavior:contain }
  .ecranReglages .tbl { max-height:none }
  .ecranReglages .tblLong { max-height:52vh }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  th { position:sticky; top:0; background:var(--carte); border-bottom:1px solid var(--bord); text-align:left;
       padding:8px 10px; font-weight:600; white-space:nowrap; z-index:2; cursor:pointer }
  th:hover { color:var(--accent) }
  td { padding:6px 10px; border-bottom:1px solid var(--bord); white-space:nowrap }
  tr.sel td { background:var(--sel) }
  /* Colonnes épinglées : elles restent en place quand la grille défile latéralement. */
  th.pin, td.pin { position:sticky; background:var(--carte); z-index:1 }
  th.pin { z-index:3 }
  th.pin1, td.pin1 { left:26px } th.pin2, td.pin2 { left:170px }
  td.pin { box-shadow:1px 0 0 var(--bord) }
  tr.sel td.pin { background:var(--sel) }
  tr.clic { cursor:pointer } tr.clic:hover td { background:var(--sel) }
  .n, th.n { text-align:right; font-variant-numeric:tabular-nums }
  .puce { font-size:10.5px; padding:1px 7px; border-radius:var(--r2); font-weight:600; display:inline-block; white-space:nowrap }
  /* Les quatre badges ne se distinguaient que par la couleur, à 10,5 px : « complet »,
     « configuré », « variables absentes » et « désactivée » étaient indiscernables en
     niveaux de gris — donc pour un daltonien, et sur une impression noir et blanc. Un
     glyphe préfixe porte l'information une seconde fois, sans couleur. */
  .puce::before { font-weight:700; margin-right:4px; font-size:9.5px }
  /* Pastille de canal de vente : carrée, lisible à 16 px, la lettre porte l'information
     autant que la couleur. `flex:none` l'empêche d'être écrasée dans une ligne serrée. */
  .mk { display:inline-flex; align-items:center; justify-content:center; flex:none;
        width:16px; height:16px; border-radius:4px; font-size:10px; font-weight:700;
        line-height:1; vertical-align:-3px; margin-right:5px; letter-spacing:0 }
  .ssLi .mk { margin-right:6px }
  /* Avec un logo, la pastille n'a plus de fond à elle : l'icône EST la pastille. Le coin
     arrondi reste, il rattache visuellement les deux formes dans une même colonne. */
  .mk.img { background:none; overflow:hidden }
  .mk.img img { width:16px; height:16px; object-fit:contain; display:block }
  /* Aperçu dans les réglages — même image, à une taille où l'on juge ce qu'on dépose. */
  .logoAp { width:32px; height:32px; object-fit:contain; border-radius:6px;
            background:var(--inactif-fond); flex:none }
  /* Une note doit être atteignable autrement qu'en survolant à la souris : bouton réel,
     focusable, activable au doigt, et dont le nom accessible porte déjà le texte (§5.3). */
  .noteB { border:none; background:none; padding:0 3px; cursor:pointer; color:var(--accent);
           font:inherit; min-height:0 }
  button.puce.noteB { border:none; cursor:pointer }
  .puce.v { background:rgba(11,122,75,.15); color:var(--puce-v) }
  .puce.v::before { content:"✓" }
  .puce.a { background:rgba(154,91,6,.16); color:var(--puce-a) }
  .puce.a::before { content:"!" }
  .puce.r { background:rgba(192,57,43,.14); color:var(--puce-r) }
  .puce.r::before { content:"✕" }
  .puce.g { background:rgba(120,130,140,.16); color:var(--puce-g) }
  .puce.g::before { content:"•" }
  .tArt { width:100%; border-collapse:collapse; font-size:13px }
  .tArt th { text-align:left; font-weight:600; color:var(--doux); padding:2px 4px }
  .tArt td { padding:2px 4px }
  .tArt input { width:100%; min-width:52px }
  .tScroll { overflow-x:auto; max-height:46vh; overflow-y:auto }
  .cGrilleR { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px }
  .expQ { margin:0 0 12px } .expQ b { display:block; margin-bottom:4px }
  .expF { max-height:180px; overflow-y:auto; border:1px solid var(--bordure); border-radius:var(--r1); padding:6px }
  .efG { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:start; margin-top:8px }
  .efG select { width:100%; font-size:12.5px }
  .efB { display:flex; flex-direction:column; gap:4px; padding-top:22px }
  .efB button { min-width:34px }
  .doux { color:var(--doux) }
  .avis { padding:9px 12px; border-radius:var(--r1); margin-bottom:12px; font-size:13px;
          background:rgba(154,91,6,.12); color:var(--ambre); border:1px solid rgba(154,91,6,.3) }
  .avis.info { background:rgba(26,86,219,.10); color:var(--accent); border-color:rgba(26,86,219,.3) }
  .onglets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center }
  .ong { padding:4px 11px; border:1px solid var(--bord); border-radius:var(--rp); background:var(--carte);
         cursor:pointer; font-size:12.5px }
  .ong.actif { background:var(--accent); border-color:var(--accent); color:var(--sur-plein); font-weight:600 }
  /* Valeur héritée d'un groupe de préréglages, sous le champ — le « Preset - 200 » de
     ShipStation. Sans elle, un poids vide sur la fiche est indistinguable de « 0 g ». */
  .herite { display:block; font-size:11px; color:var(--doux); margin-top:2px; font-style:italic }
  dialog { border:1px solid var(--bord); border-radius:var(--r3); background:var(--carte); color:var(--texte);
           padding:0; max-width:800px; width:94vw; max-height:88vh }
  dialog h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--bord); font-size:15px }
  dialog .c { padding:14px 16px; overflow:auto; max-height:64vh }
  dialog .f { padding:10px 16px; border-top:1px solid var(--bord); display:flex; gap:8px; justify-content:flex-end }
  dialog::backdrop { background:rgba(0,0,0,.5) }
  label.ch { display:inline-flex; align-items:center; gap:5px; font-size:13px }
  .champ { display:block; margin-bottom:9px } .champ span { display:block; font-size:12px; color:var(--doux); margin-bottom:3px }
  .champ input, .champ select { width:100% }
  /* Suggestions d'adresse : la liste se pose sous le champ, sans pousser le formulaire. */
  .sugP { position:relative }
  .sugA { position:absolute; left:0; right:0; top:100%; z-index:40; max-height:230px; overflow:auto;
    background:var(--carte); border:1px solid var(--bord); border-radius:var(--r1);
    box-shadow:0 6px 18px rgba(0,0,0,.14) }
  .sugI { padding:6px 9px; cursor:pointer; font-size:13px; line-height:1.25 }
  .sugI b { display:block; font-weight:600 }
  .sugI span { color:var(--doux); font-size:12px }
  /* `--sel` est la teinte de sélection du reste de l'écran : la ligne survolée doit se
     lire aussi bien en clair qu'en sombre. */
  .sugI:hover, .sugI.actif { background:var(--sel) }
  .bar { height:7px; background:var(--bord); border-radius:var(--r1); overflow:hidden; margin-top:5px }
  .bar i { display:block; height:100%; background:var(--vert) }

  /* ══════════════════════ écran Commandes — layout ShipStation à 3 colonnes ══════════════════════
     La densité n'est pas un choix esthétique : c'est un outil d'opérateur d'entrepôt, et le
     nombre de commandes visibles d'un coup d'œil détermine la vitesse de tri d'un arriéré. */
  .ss { display:grid; grid-template-columns:196px minmax(0,1fr) 336px; gap:0; height:100%; min-height:0 }
  .ssL { border-right:1px solid var(--bord); background:var(--carte); overflow:auto; padding:8px 0 24px }
  .ssLt { font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--doux);
          padding:12px 12px 5px; font-weight:700 }
  .ssLi { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 12px;
          font-size:13px; cursor:pointer; border-left:3px solid transparent; color:var(--texte) }
  .ssLi:hover { background:var(--sel) }
  .ssLi.actif { background:var(--sel); border-left-color:var(--accent); font-weight:650 }
  .ssLi .n { color:var(--doux); font-size:11.5px; font-variant-numeric:tabular-nums }
  .ssL .vide { padding:6px 12px; font-size:12px; color:var(--doux) }
  .ssLi.enfant { padding-left:26px; font-size:12.5px; color:var(--doux) }
  .ssLi.enfant.actif { color:var(--texte) }
  .ssLi.ajout { color:var(--accent); font-size:12.5px }
  .ssLi.lot .nom { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .ssLi.lot .plus { border:1px solid var(--accent); color:var(--accent); background:var(--carte);
                    border-radius:var(--r1); padding:0 6px; font-size:13px; line-height:16px; margin-left:4px }
  .ssLi.lot .plus:hover { background:var(--accent); color:var(--sur-plein) }
  .lienCmd { color:var(--accent); font-weight:650; cursor:pointer; text-decoration:none }
  .lienCmd:hover { text-decoration:underline }
  .ssC { display:flex; flex-direction:column; min-width:0; overflow:hidden }
  .ssR { border-left:1px solid var(--bord); background:var(--carte); overflow:auto; padding:0 0 60px;
         display:flex; flex-direction:column }

  .ongVues { display:flex; gap:2px; padding:6px 10px 0; overflow-x:auto; border-bottom:1px solid var(--bord); flex:none }
  .ongVues .ong { padding:5px 11px; border:1px solid transparent; border-bottom:none; border-radius:var(--r1) var(--r1) 0 0;
                  font-size:12.5px; cursor:pointer; white-space:nowrap; color:var(--doux) }
  .ongVues .ong i { font-style:normal; opacity:.65; font-variant-numeric:tabular-nums }
  .ongVues .ong:hover { background:var(--sel); color:var(--texte) }
  .ongVues .ong.actif { background:var(--bg); border-color:var(--bord); color:var(--texte); font-weight:650;
                        margin-bottom:-1px; border-bottom:1px solid var(--bg) }

  .barreF, .barreA { display:flex; gap:6px; align-items:center; padding:7px 10px; flex:none;
                     border-bottom:1px solid var(--bord); overflow-x:auto; white-space:nowrap }
  .barreF > *, .barreA > * { flex:none }
  .barreF input, .barreF select, .barreA button { padding:4px 8px; font-size:12.5px; border-radius:var(--r1); min-height:var(--h1) }
  .barreF #fq { min-width:250px }
  .barreF .sep { width:1px; height:20px; background:var(--bord); margin:0 3px; flex:none }
  .barreF button.on { background:var(--sel); border-color:var(--accent); color:var(--accent) }
  .barreA { background:var(--carte) }
  .barreA .nsel { font-size:12.5px; color:var(--doux); min-width:118px }
  .barreA button.v { background:var(--vert); border-color:var(--vert); color:var(--sur-plein); font-weight:650 }

  .grilleWrap { flex:1; overflow:auto; min-height:0 }
  table.tblCmd { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  table.tblCmd th { position:sticky; top:0; z-index:3; background:var(--carte); border-bottom:1px solid var(--bord);
                    text-align:left; padding:7px 9px; font-weight:650; white-space:nowrap; font-size:12px }
  /* Seules les colonnes triables se comportent comme telles : le curseur main sur une colonne
     inerte promet un tri qui n'arrive jamais (BUG-036). */
  table.tblCmd th.triable { cursor:pointer }
  table.tblCmd th.triable:hover { background:var(--sel) }
  button.chev { background:none; border:none; cursor:pointer; color:var(--doux); font:inherit; padding:0 }
  table.tblCmd td { padding:6px 9px; border-bottom:1px solid var(--bord); white-space:nowrap; max-width:320px;
                    overflow:hidden; text-overflow:ellipsis }
  .grilleWrap.dense table.tblCmd td { padding:3px 9px; font-size:12.5px }
  .grilleWrap.dense table.tblCmd th { padding:5px 9px }
  table.tblCmd tr.sel td { background:var(--sel) }
  table.tblCmd tbody tr:hover td { background:var(--sel) }
  table.tblCmd .cx { width:26px; padding-left:8px; padding-right:0 }
  table.tblCmd [data-fig] { position:sticky; left:0; z-index:2; background:var(--carte) }
  .chev { cursor:pointer; color:var(--doux); user-select:none }
  tr.arts td { background:var(--bg); white-space:normal }
  .artL > div, .artG > div { font-size:12.5px; padding:1px 0 }
  .sku { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--doux) }
  .tag { font-size:10.5px; padding:1px 7px; border-radius:var(--r2); font-weight:600; white-space:nowrap;
         background:color-mix(in srgb, var(--c) 20%, transparent); color:var(--c); border:1px solid var(--c) }
  table.tblCmd tr.grp td { background:var(--bg); font-size:12px; color:var(--doux);
                           padding:5px 10px; border-bottom:1px solid var(--bord); position:sticky }
  .ongVues .ong.sauver { color:var(--accent); border-style:dashed; border-color:var(--bord) }
  .pag { display:flex; gap:8px; align-items:center; padding:7px 10px; border-top:1px solid var(--bord); flex:none; font-size:12.5px }
  /* Lien d'export sans rien à exporter : visible mais inopérant, plutôt que disparu. */
  .inerte { opacity:.45; pointer-events:none; cursor:default }
  /* Bandeau de sélection inter-pages : discret quand il ne dit rien, visible dès qu'il
     annonce que la sélection dépasse ce qui est à l'écran (BUG-041). */
  .selTout:empty { display:none }
  .selTout { flex:none; padding:6px 12px; font-size:12.5px; text-align:center;
    background:rgba(26,86,219,.10); color:var(--accent); border-bottom:1px solid var(--bord) }
  .menuF .mi.inactifM { opacity:.42; cursor:default }
  .menuF .mi.inactifM:hover { background:transparent }
  .jal { display:inline-flex; gap:3px; align-items:center; font-size:11px; white-space:nowrap }
  .jal.ok { color:var(--vert) } .jal.non { color:var(--doux) }
  .jal time { font-variant-numeric:tabular-nums }
  .permG { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:2px 12px; margin:6px 0 }
  .permL { padding:3px 0; font-size:12.5px }
  /* Un titre de carte est un titre : `<b>` ne structure rien pour un lecteur d'écran. */
  body.sansPanneau .ssR { display:none }
  body.sansPanneau .ss { grid-template-columns:196px minmax(0,1fr) }
  .pagN { display:inline-flex; align-items:center; gap:4px; color:var(--doux) }
  .pagN input { width:56px; padding:2px 4px; font-size:12.5px; text-align:center }
  .titreCarte { font-size:13px; font-weight:650; margin:0 0 2px }
  .frais { font-size:11.5px; margin-left:2px; white-space:nowrap }
  .ico.tourne { animation:tourner .8s linear infinite }
  @keyframes tourner { to { transform:rotate(360deg) } }
  .vide2 { padding:60px 20px; text-align:center }
  .vide2 button { margin-top:12px }
  .vide3 { padding:28px 16px; color:var(--doux); font-size:13px }

  /* ---- en-tête de l'écran Commandes ---- */
  .enteteE { display:flex; align-items:center; gap:12px; padding:9px 12px; flex:none;
             border-bottom:1px solid var(--bord); background:var(--carte) }
  .enteteE .etqT { font-size:13px; font-weight:600; color:var(--doux) }
  .enteteE .lotChip { font-size:13.5px; font-weight:650; background:var(--sel); color:var(--accent);
                      border:1px solid var(--bord); border-radius:var(--r1); padding:2px 9px }
  .enteteE .lienNote { font-size:12.5px; font-weight:400; color:var(--accent); cursor:pointer; text-decoration:underline }

  /* ---- révision des coûts d'un lot (« Label Batch Status: Cost Review ») ---- */
  .crCarte { border:1px solid var(--bord); border-radius:var(--r2); padding:11px 13px; margin-bottom:10px }
  .crCarte .crT { font-size:13.5px; margin-bottom:7px }
  .crL { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0 }
  .crL span { color:var(--doux) }
  .crL.crTot { border-top:1px solid var(--bord); margin-top:5px; padding-top:6px; font-weight:650 }
  .crL.crTot span { color:var(--texte) }
  .crF summary { display:flex; justify-content:space-between; font-size:13px; cursor:pointer;
                 color:var(--doux); padding:3px 0 }
  .crF summary b { color:var(--texte) }
  .crF > div { font-size:11.5px; padding:3px 0 6px }
  .crNote { font-size:11.5px; color:var(--vert); margin-top:6px }
  .crVert { background:color-mix(in srgb, var(--vert) 9%, transparent); border:1px solid color-mix(in srgb, var(--vert) 30%, transparent);
            border-radius:var(--r2); padding:11px 13px; margin-top:4px }
  .crVert .champ.enLigne { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px }
  .crVert .champ.enLigne > span { font-size:12.5px; color:var(--doux) }
  .crVert .champ.enLigne input { width:170px; padding:4px 7px; font-size:12.5px; border-radius:var(--r1) }
  .enteteE .recharger { font-size:12.5px; color:var(--accent); cursor:pointer }
  .ssRech { padding:10px 12px 8px; border-bottom:1px solid var(--bord) }
  .ssAide { padding:2px 12px 8px; font-size:11px; color:var(--doux); line-height:1.35 }
  .ssRech input { width:100%; padding:5px 8px; font-size:12.5px }
  .ssRech a { display:block; margin-top:5px; font-size:11.5px; color:var(--accent); cursor:pointer }
  .barreF .fpar { font-size:12px; color:var(--doux); font-weight:600 }
  .barreA .nsel { margin-left:auto; font-size:12.5px; color:var(--doux) }

  /* Un seul <h1> par écran (§8.2.6) : correction sémantique, l'échelle visuelle ne bouge pas. */
  #vue > h1, .enteteE h1 { font-size:17px; font-weight:650; margin:0 0 4px }
  .enteteE h1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap }

  /* ---- accessibilité : les contrôles sont de vrais boutons, stylés comme avant ---- */
  button.ssLi, button.ong, button.lienCmd, button.fEdit, button.lienMap, button.lienNote,
  button.lienB, button.recharger {
    font:inherit; background:none; border:none; cursor:pointer; text-align:left }
  button.lienCmd { color:var(--accent); padding:0; font-weight:600 }
  button.lienCmd:hover { text-decoration:underline }
  button.lienB, button.recharger { color:var(--accent); padding:0 }
  button.lienB:hover, button.recharger:hover { text-decoration:underline }
  /* Un anneau de focus visible : sans lui, la tabulation qu'on vient de rétablir reste aveugle. */
  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r1) }

  /* Indicateur non calculable : gris, jamais vert — un zéro sur une table vide n'est pas
     une conformité (BUG-056). */
  .kpi.gris { border-color:var(--bord); opacity:.75 }
  /* Zone de danger : repliée par défaut, bordée de rouge, jamais mêlée aux actions ordinaires. */
  .zoneDanger { border:1px solid var(--rouge); border-radius:var(--r2); padding:0 12px; margin-top:14px;
                background:color-mix(in srgb, var(--rouge) 5%, transparent) }
  .zoneDanger summary { padding:9px 0; cursor:pointer; font-weight:650; font-size:13px; color:var(--rouge) }
  .zoneDanger[open] { padding-bottom:11px }
  .kpi.gris .v { color:var(--doux) }

  option[data-orphelin] { color:var(--rouge); font-weight:650 }
  select:has(option[data-orphelin]:checked) { border-color:var(--rouge); background:color-mix(in srgb, var(--rouge) 8%, transparent) }

  /* ---- états : chargement, erreur, périmé, vide ---- */
  .squelette { padding:10px 12px; display:flex; flex-direction:column; gap:7px }
  .sqL { height:19px; border-radius:var(--r1);
         background:linear-gradient(90deg, var(--bord) 25%, var(--sel) 50%, var(--bord) 75%);
         background-size:200% 100%; animation:sqAnim 1.1s ease-in-out infinite }
  @keyframes sqAnim { 0% { background-position:200% 0 } 100% { background-position:-200% 0 } }
  @media (prefers-reduced-motion: reduce) { .sqL { animation:none } }

  .panErr { border:1px solid var(--rouge); border-radius:var(--r2); padding:16px 18px; margin:14px;
            background:color-mix(in srgb, var(--rouge) 8%, transparent) }
  .panErrT { font-weight:650; font-size:14.5px; margin-bottom:4px }
  .panErrM { font-size:13px; color:var(--doux); margin-bottom:10px }

  .bandPerime { display:flex; align-items:center; gap:10px; padding:7px 12px; font-size:12.5px;
                background:color-mix(in srgb, var(--ambre) 14%, transparent);
                border-bottom:1px solid var(--ambre); color:var(--texte) }
  .bandPerime button { padding:3px 10px; font-size:12px; border-radius:var(--r1); margin-left:auto; min-height:var(--h1) }
  .grilleWrap.perime table.tblCmd { opacity:.55 }
  .pag.perime { opacity:.55 }
  .pag.perime::after { content:"— total possiblement périmé"; color:var(--ambre); font-size:12px }

  #toasts { position:fixed; right:14px; bottom:14px; z-index:120; display:flex;
            flex-direction:column; gap:8px; max-width:420px }
  .toast { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--r2);
           background:var(--carte); border:1px solid var(--bord); font-size:13px;
           box-shadow:0 8px 24px rgba(0,0,0,.18); animation:toastEntre .18s ease-out }
  .toast.erreur { border-color:var(--rouge); background:color-mix(in srgb, var(--rouge) 10%, var(--carte)) }
  .toast.succes { border-color:var(--vert); background:color-mix(in srgb, var(--vert) 10%, var(--carte)) }
  .toast button { padding:2px 9px; font-size:12px; border-radius:var(--r1); cursor:pointer; min-height:var(--h1) }
  .toast .x { border:none; background:none; font-size:16px; color:var(--doux); padding:0 2px }
  .toast.sort { opacity:0; transform:translateY(6px); transition:.24s }
  @keyframes toastEntre { from { opacity:0; transform:translateY(8px) } }

  /* ---- poste de scan ---- */
  .avis.bloquant { border-left:4px solid var(--rouge); font-size:14px; line-height:1.5 }
  .listeAmbigu { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px }
  .listeAmbigu .amb { display:flex; align-items:center; gap:7px; padding:5px 11px; border-radius:var(--r1);
                      cursor:pointer; font-size:13px }
  .listeAmbigu .amb:disabled { opacity:.45; cursor:not-allowed }

  /* Contenu réservé aux lecteurs d'écran : présent dans l'arbre d'accessibilité, invisible. */
  .visuellement-cache { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
                        overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0 }

  /* ---- pastilles de filtre (« Filter By » de ShipStation, §2.4) ---- */
  .barreF .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; font-size:12.5px;
                  border:1px solid var(--bord); border-radius:var(--rp); background:var(--carte); cursor:pointer;
                  color:var(--doux); line-height:1.7 }
  .barreF .chip:hover { border-color:var(--accent); color:var(--texte) }
  .barreF .chip.on { background:var(--sel); border-color:var(--accent); color:var(--accent); font-weight:600 }
  .barreF .chip.on b { font-weight:650; color:var(--texte); max-width:200px; overflow:hidden;
                       text-overflow:ellipsis; white-space:nowrap }
  .barreF .chip.on b::before { content:"·"; margin-right:5px; opacity:.5 }
  .barreF .chip i { font-style:normal; opacity:.6; padding:0 1px; border-radius:var(--r2) }
  .barreF .chip i:hover { opacity:1; background:var(--bord) }
  .barreF .chip.sauv { border-style:dashed }
  .barreF .lien { background:none; border:none; color:var(--accent); cursor:pointer; font-size:12px;
                  text-decoration:underline; padding:0 4px }

  .panF { position:fixed; z-index:90; width:298px; background:var(--carte); border:1px solid var(--bord);
          border-radius:var(--r2); box-shadow:0 12px 32px rgba(0,0,0,.22); overflow:hidden }
  .panF .panT { padding:8px 12px; font-size:12px; font-weight:650; color:var(--doux);
                border-bottom:1px solid var(--bord); background:var(--bg) }
  .panF .panB { padding:11px 12px; display:flex; flex-direction:column; gap:9px }
  .panF .champ { display:flex; flex-direction:column; gap:3px; font-size:12.5px }
  .panF .champ > span { font-size:11.5px; color:var(--doux) }
  .panF .champ input, .panF .champ select { width:100%; padding:4px 7px; font-size:12.5px; border-radius:var(--r1) }
  .panF .ch { display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer }
  .panF .deux { display:grid; grid-template-columns:1fr 1fr; gap:8px }
  .panF .rapides { display:flex; gap:5px; flex-wrap:wrap }
  .panF .rapides button { font-size:11.5px; padding:3px 8px; border-radius:var(--rp); cursor:pointer; min-height:var(--h1) }
  /* ---- sidebar d'expédition (Configure Shipment Widget) ---- */
  .ssR .sec { border-bottom:1px solid var(--bord); padding:11px 13px }
  .ssR h4 { margin:0 0 7px; font-size:13px; font-weight:650; display:flex; gap:6px; align-items:center }
  .ssR .adr { font-size:12.5px; line-height:1.5 }
  .ssR .kv { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2px 0 }
  .ssR .kv span { color:var(--doux) }
  .ssR .champ { margin-bottom:6px } .ssR .champ span { font-size:11px }
  .ssR .champ input, .ssR .champ select { padding:4px 7px; font-size:12.5px }
  .ssR .dims { display:flex; gap:4px; align-items:center; margin-bottom:6px }
  .ssR .dims input { width:100%; padding:4px 6px; font-size:12.5px }
  .ssR .note { font-size:12.5px; background:var(--bg); border-radius:var(--r1); padding:6px 8px; margin-bottom:6px }
  textarea.petit { min-height:56px; font-size:12.5px; margin-bottom:6px }
  .rouge { color:var(--rouge) } .vert { color:var(--vert) }

  .ssR .pied { position:sticky; bottom:0; margin-top:auto; background:var(--carte); border-top:1px solid var(--bord);
               padding:9px 13px; display:flex; gap:6px; z-index:5 }
  .ssR .pied button.v { flex:1; background:var(--vert); border-color:var(--vert); color:var(--sur-plein); font-weight:650 }
  .ssR .autres { margin:6px 0 }
  .ssR .autres summary { cursor:pointer; font-size:12.5px; color:var(--doux); padding:3px 0 }
  .ssR .autres label.ch { display:flex; padding:3px 0; font-size:12.5px }
  .valA { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
          border-radius:50%; font-size:11px; font-weight:700; color:#fff }
  .valA.ok { background:var(--vert) } .valA.warn { background:var(--ambre) } .valA.err { background:var(--rouge) }
  .lienMap { color:var(--ambre); text-decoration:underline; cursor:pointer }
  /* ---- panneau gauche : hiérarchie lisible ---- */
  .ssL { padding:6px 0 30px }
  .ssLt { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--doux);
          padding:16px 12px 6px; font-weight:700; border-top:1px solid var(--bord); margin-top:8px }
  .ssL > div:first-child + .ssLt, .ssL > .ssLt:first-child { border-top:none; margin-top:0; padding-top:10px }
  .ssLi { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 12px;
          font-size:13.5px; cursor:pointer; border-left:3px solid transparent; color:var(--texte); line-height:1.3 }
  .ssLi .n { color:var(--doux); font-size:11.5px; font-variant-numeric:tabular-nums; font-weight:500 }
  .ssLi.actif { background:var(--sel); border-left-color:var(--accent); font-weight:650 }
  .ssLi.actif .n { color:var(--accent) }
  .ssLi.enfant { padding:3px 12px 3px 28px; font-size:12.5px; color:var(--doux); border-left-color:transparent }
  .ssLi.enfant::before { content:""; position:absolute; margin-left:-12px; width:1px; height:16px; background:var(--bord) }
  .ssLi.enfant.actif { color:var(--texte); background:var(--sel) }
  #ssStatuts { padding-bottom:4px }

  /* ---- fiche de commande ---- */
  dialog.large { max-width:1080px }
  /* ---- fiche de commande plein écran (§2.6) ---- */
  .fiche { position:fixed; inset:0; z-index:80; background:var(--bg); display:flex; flex-direction:column }
  .fTete { display:flex; align-items:center; gap:9px; padding:9px 13px; background:var(--carte);
           border-bottom:1px solid var(--bord); flex:none }
  .fTete .fBout { font-size:12px; color:var(--doux); padding:2px 8px; border:1px solid var(--bord); border-radius:var(--rp) }
  .fTete .fNum { font-size:15.5px; font-weight:650 }
  .fTete button { padding:4px 10px; font-size:12.5px; border-radius:var(--r1); min-height:var(--h1) }
  .fTete .fNav { display:flex; gap:2px; margin-left:6px }
  .fTete .fNav button { padding:3px 9px; font-size:15px; line-height:1 }
  .fTete .fFerme { border:none; background:none; font-size:17px; color:var(--doux); cursor:pointer; padding:2px 6px }
  .fTete .fFerme:hover { color:var(--rouge) }

  .fCorps { flex:1; display:grid; grid-template-columns:158px 1fr 328px; min-height:0 }
  .fRail { border-right:1px solid var(--bord); background:var(--carte); overflow:auto; padding:9px 0 }
  .fRailT { font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase;
            color:var(--doux); padding:0 12px 7px }
  .fRailE { padding:8px 12px; border-left:3px solid transparent; display:flex; flex-direction:column; gap:1px;
            font-size:11.5px; cursor:pointer }
  .fRailE:hover { background:var(--sel) }
  .fRailE.actif { border-left-color:var(--accent); background:var(--sel) }
  .fRailE b { font-size:12.5px; font-weight:650 }
  .fRailPlus { display:block; margin:8px 12px; width:calc(100% - 24px); padding:5px; font-size:15px;
               line-height:1; border:1px dashed var(--bord); border-radius:var(--r1); cursor:pointer;
               background:none; color:var(--doux) }
  .fRailPlus:hover { border-color:var(--accent); color:var(--accent) }
  .fRailC { display:flex; align-items:center; gap:6px; padding:6px 12px; font-size:11.5px; color:var(--doux) }
  .fRailC b { font-size:13px; color:var(--texte); font-variant-numeric:tabular-nums }

  .fCentre { overflow:auto; padding:13px; min-width:0 }
  .fCentre .fSec { border:1px solid var(--bord); border-radius:var(--r2); padding:12px 14px; margin-bottom:12px;
                   background:var(--carte) }
  .fCentre .fSec.repli { opacity:.72 }
  .fCentre h4 { margin:0 0 10px; font-size:13.5px; font-weight:650; display:flex; align-items:center; gap:9px }
  .fCentre h4 .cpt { font-size:11px; background:var(--sel); color:var(--accent); border-radius:var(--r2); padding:1px 7px }
  .fCentre h4 .fH4a { margin-left:auto; display:flex; gap:11px }
  .fEdit { font-size:11.5px; color:var(--accent); cursor:pointer; text-decoration:none;
           text-transform:none; letter-spacing:0; font-weight:400 }
  .fEdit:hover { text-decoration:underline }
  .fLab { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
          color:var(--doux); margin:9px 0 4px; display:flex; align-items:center; gap:8px }
  .fLab:first-child { margin-top:0 }
  .fDeux { display:grid; grid-template-columns:1fr 1fr; gap:16px }
  .fTrois { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:9px }
  .fDates { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:7px }
  .fiche .champ { display:flex; flex-direction:column; gap:3px; font-size:12.5px }
  .fiche .champ > span { font-size:11px; color:var(--doux) }
  .fiche .champ input, .fiche .champ select, .fiche .champ textarea {
    width:100%; padding:4px 7px; font-size:12.5px; border-radius:var(--r1); font-family:inherit }
  .fiche .champ button.plein { width:100%; padding:4px 7px; font-size:12.5px; border-radius:var(--r1); text-align:left }
  .fiche .kv { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2px 0 }
  .fiche .kv span { color:var(--doux) }
  .fiche .kv.tot { border-top:1px solid var(--bord); margin-top:3px; padding-top:5px; font-weight:650 }
  /* Remise et remboursement : des montants qui sortent, écrits comme tels. */
  .fiche .kv.rem b { color:var(--vert) }
  .motifAchat { font-size:11.5px; line-height:1.4; color:var(--ambre); padding:4px 0 }
  .avertMontants { margin-top:6px; padding:6px 8px; border-radius:var(--r1); font-size:12px; line-height:1.45;
    background:rgba(154,91,6,.12); border:1px solid rgba(154,91,6,.3); color:var(--ambre) }
  .avertMontants .doux { display:block; margin-top:2px; opacity:.85 }
  /* Ligne dont la quantité courante est tombée à zéro : remboursée, plus à préparer. */
  .fiche tr.ligneAnnulee td { opacity:.55; text-decoration:line-through }
  .fiche .adr { font-size:12.5px; line-height:1.5; margin-top:3px }
  .fiche .barre { display:flex; gap:8px; align-items:center; margin-top:10px }
  .fiche .avis.mini { font-size:11.5px; padding:4px 8px; margin-top:5px }

  table.fArt { width:100%; border-collapse:collapse; font-size:12.5px }
  table.fArt th { text-align:left; font-size:11px; color:var(--doux); font-weight:600;
                  border-bottom:1px solid var(--bord); padding:4px 7px }
  table.fArt td { padding:7px; border-bottom:1px solid var(--bord); vertical-align:top }
  table.fArt img { width:38px; height:38px; object-fit:contain; border-radius:var(--r1) }
  table.fArt .n, table.fArt th.n { text-align:right; font-variant-numeric:tabular-nums }

  .dDecl { display:flex; flex-direction:column; gap:10px; margin-top:10px }
  .dLigne { border:1px solid var(--bord); border-radius:var(--r1); padding:9px 11px; background:var(--bg) }
  .dLigne .dT { font-size:11.5px; font-weight:650; margin-bottom:6px; display:flex; gap:8px; align-items:baseline }
  .dQ { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:7px }

  .fPliant { padding:0 !important }
  .fPliant summary { padding:12px 14px; cursor:pointer; font-size:13.5px; font-weight:650 }
  .fPliant > div { padding:0 14px 12px }
  .fActi { font-size:12px; max-height:280px; overflow:auto }
  .fEv { display:grid; grid-template-columns:118px 92px 1fr; gap:9px; padding:3px 0;
         border-bottom:1px solid var(--bord) }
  .fEvD { color:var(--doux); font-variant-numeric:tabular-nums }
  .fEvQ { color:var(--doux) }
  .fEvT { color:var(--texte) }

  .fConf { border-left:1px solid var(--bord); background:var(--carte); display:flex; flex-direction:column; min-height:0 }
  .fConfB { flex:1; overflow:auto; padding:12px 13px; display:flex; flex-direction:column; gap:9px }
  .fConf .cDem { font-size:12.5px; display:flex; align-items:center; gap:9px; flex-wrap:wrap }
  .fConf .cPoids { display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:end }

  /*

<script>
// ══════════════════════════════════════════════════════════════════ utilitaires
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (v) => (Number(v) || 0).toFixed(2) + " $";
const num = (v) => (Number(v) || 0).toLocaleString("fr-CA");
const jour = (s) => (s ? String(s).slice(0, 10) : "—");
/**
 * Le montant assuré, en dollars, quelle que soit la forme écrite en base — jumeau de
 * `montantAssure` côté serveur. Une commande migrée porte la forme ShipStation
 * `{provider, insureShipment, insuredValue}` ; une commande saisie ici porte `{montant}`.
 * Le champ ne lisait que la seconde : sur les 38 000 commandes migrées il s'affichait vide,
 * et le premier enregistrement effaçait l'assurance sans que rien ne le dise.
 */
const assure = (v) => {
  if (v === null || v === undefined || v === false) return 0;
  if (typeof v === "number") return v > 0 ? v : 0;
  if (typeof v !== "object") { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : 0; }
  if ("insureShipment" in v) return v.insureShipment ? Number(v.insuredValue || 0) || 0 : 0;
  const n = Number(v.montant ?? v.amount ?? v.valeur ?? v.value ?? 0);
  return Number.isFinite(n) && n > 0 ? n : 0;
};

/**
 * État vide générique — BUG-037, BUG-115.
 *
 * Trois formes, une seule fonction : rien à montrer, rien qui corresponde au filtre, ou
 * rien encore importé. Un tableau qui disparaît sans un mot laisse croire à une panne ;
 * dire ce qui manque et proposer le geste suivant coûte trois lignes.
 */
function etatVideG({ titre, detail = "", action = null }) {
  const d = el(`<div class="vide2"><b>${esc(titre)}</b>
    ${detail ? `<div class="doux">${esc(detail)}</div>` : ""}
    ${action ? `<button type="button" class="p" data-cta>${esc(action.t)}</button>` : ""}</div>`);
  if (action) d.querySelector("[data-cta]").onclick = action.f;
  return d;
}

/**
 * Résumé des coûts — reconstitué depuis les lignes, remise et remboursement compris.
 *
 * L'ancienne version affichait `Produits = total − taxes − livraison`. Sur une commande
 * remisée, ce chiffre contredisait la ligne juste à côté sans que rien ne le dise. Le
 * serveur fournit désormais `couts` ; quand la somme ne se referme pas, on l'annonce au
 * lieu de la maquiller — l'opérateur qui voit « 0,00 $ » sous des articles valorisés doit
 * savoir que c'est l'import qui manque de données, pas la commande qui vaut zéro.
 */
function resumeCouts(o) {
  const c = o.couts || {
    produits: (o.items || []).filter(i => !i.adjustment)
      .reduce((s, i) => s + (i.unit_price || 0) * (i.quantity ?? 0), 0),
    remise: o.discount_amount || 0, ajustements: 0,
    livraison: o.shipping_paid || 0, taxes: o.tax_amount || 0,
    total: o.order_total || 0, paye: o.amount_paid || 0,
    rembourse: o.refunded_amount || 0, coherent: true, motif: null,
  };
  const ligne = (nom, v, cls = "") => `<div class="kv ${cls}"><span>${nom}</span><b>${money(v)}</b></div>`;
  return [
    ligne("Produits", c.produits),
    c.remise ? ligne("Remise", -c.remise, "rem") : "",
    c.ajustements ? ligne("Ajustements", c.ajustements) : "",
    ligne("Livraison", c.livraison),
    ligne("Taxes", c.taxes),
    ligne("Total", c.total, "tot"),
    ligne("Total payé", c.paye),
    c.rembourse ? ligne("Remboursé", -c.rembourse, "rem") : "",
    c.coherent ? "" :
      `<div class="avertMontants" role="status">Montants non synchronisés — ${esc(c.motif || "")}.
       <span class="doux">Reconstitué depuis les lignes : ${money(c.reconstitue)}.</span></div>`,
  ].join("");
}

// ══════════════════════════════════════════════════════════════════ langue
/**
 * Deux langues d'interface, comme ShipStation (« English, Spanish, French, French (Canada) »).
 *
 * La traduction porte sur le **chrome** — navigation, statuts, barres de filtres et d'actions,
 * menus, en-têtes de colonnes, sections de la sidebar, pagination, pieds de dialogue. Jamais
 * sur les données : un client nommé « Total » ou une vue nommée « Colis Canada » traverse
 * intact, puisque seuls les conteneurs d'interface sont parcourus.
 *
 * Le compte ShipStation de Lasclay tournait en `en-CA` : les réflexes de l'entrepôt sont en
 * anglais, ceux des nouveaux employés en français. Le choix est **par utilisateur** (§6.12 —
 * langue, format de date et unités sont des préférences personnelles, pas des réglages de
 * compte) et conservé en base, pour qu'il suive l'employé d'un poste à l'autre.
 */
const EN = {
  // — navigation et modules

  "Produits": "Products", "Clients": "Customers", "Retours": "Returns", "Lots": "Batches",
  "Fin de journée": "End of Day",
  "Le camion de la journée": "Today's pickup", "Demander le ramassage du jour…": "Request today's pickup…",

  "Prêt à": "Ready at", "Jusqu'à": "Until", "Contact sur place": "On-site contact",
  "Lot Chit Chats — le sac du comptoir": "Chit Chats batch — the counter bag",

  "Demander le manifeste du jour": "Request today's manifest",
  "Étiquette du sac": "Bag label", "reçu au comptoir": "received at counter", "Douanes (SH)": "Customs (HS)", "Alertes": "Alerts",
  "Analytique": "Insights", "Gabarits": "Templates", "Utilisateurs": "Users",
  "Réglages": "Settings", "Journal": "Audit Log", "Préréglages": "Presets",
  "Automatisation": "Automation",
  // — engrenage
  "Compte, boutiques et import": "Account, Stores & Import",
  "Règles d'automatisation": "Automation Rules",
  "Préréglages d'expédition et mappings": "Shipping Presets & Service Mapping",
  "Bordereaux et courriels": "Packing Slips & Emails",
  "Utilisateurs et permissions": "Users & Permissions",
  "Alertes de commandes": "Order Alerts", "Journal d'audit": "Audit Log",
  // — profil
  "Second facteur ✓": "Two-factor ✓", "Activer le second facteur": "Enable two-factor",
  "Changer le mot de passe": "Change password", "Voir les alertes": "View Alerts",
  "Se déconnecter": "Sign Out", "Langue : Français": "Language: English",
  "Recherche rapide  ( / )": "Quicksearch  ( / )",
  // — barre latérale et statuts
  "Commandes": "Orders", "Filtres sauvegardés": "Saved Filters",
  "Analytique": "Analytics", "Automatisations": "Automations", "Scan": "Scan", "Tarifs": "Rates",
  "Préparations externes": "Fulfillments", "Inventaire": "Inventory",
  "Rechercher des commandes…": "Search Orders…", "Recherche avancée": "Advanced Search",
  "↻ Recharger": "↻ Reload", "Filtrer par :": "Filter By:", "Grouper… ▾": "Group By… ▾",
  "Créer + imprimer les étiquettes": "Create + Print Labels", "Nouvelle commande": "New Order",
  "Mise à jour en masse ▾": "Bulk Update ▾",
  // — pastilles de filtre : la clé porte le « ▾ » quand la pastille est vide, sans lui
  //   quand elle affiche une valeur. Les deux formes sont donc nécessaires.
  "Boutique ▾": "Store ▾", "Boutique": "Store",
  "Destination ▾": "Destination ▾",
  "Assignée à ▾": "Assignee ▾", "Assignée à": "Assignee",
  "Étiquette ▾": "Tag ▾", "Étiquette": "Tag",
  "Statut d'allocation ▾": "Allocation Status ▾", "Statut d'allocation": "Allocation Status",
  "Date de commande ▾": "Order Date ▾", "Date de commande": "Order Date",
  "Autre ▾": "Other ▾", "Autre": "Other",
  "Filtres sauvegardés ▾": "Saved Filters ▾",
  // — barre d'actions
  "Créer + imprimer les étiquettes ▾": "Create + Print Label ▾", "Coter": "Get Rate",
  "Imprimer ▾": "Print ▾", "Prêtes à prélever": "Ready To Pick", "Mettre en attente": "Hold",
  "Assigner à ▾": "Assign To ▾", "Étiqueter ▾": "Tag ▾", "Allouer ▾": "Allocate ▾",
  "Autres actions ▾": "Other Actions ▾",
  // — lots
  "Lots ouverts": "Open Batches", "+ Créer un lot": "+ Create New Batch",

/** Conteneurs d'interface — la traduction ne sort jamais de là, donc jamais dans les données. */
// Les pastilles de la grille portent un vocabulaire fixe — statut, « dépôt », « manquant »,
// « non mappé » — et non des données : elles font partie du chrome. Les étiquettes de commande,
// elles, sont rendues en `.tag` et restent intactes.
const CHROME = "header.top, .sousnav, .ssL, .ongVues, .barreF, .barreA, .pag, .ssR, .menuF, " +
  "dialog, thead, table.tblCmd .puce, table.tblCmd .age, tr.grp, .vide2, .vide3";

const langue = () => (S.pref && S.pref.langue) || "fr";

/** Formulations variables — ce qui porte un nombre ne peut pas vivre dans un dictionnaire. */
const EN_MOTIFS = [
  [/^(\d+) sélectionnées?$/, (m, n) => `${n} selected`],
  [/^(\d[\d  ]*)–(\d[\d  ]*) sur (.+)$/, (m, a, b, c) => `${a}–${b} of ${c}`],
  [/^(\d+) j$/, (m, n) => `${n} d`],
  [/^(\d+) sélectionnée$/, (m, n) => `${n} selected`],
];

/** Traduit un sous-arbre sans reposer la question du périmètre : l'appelant l'a tranchée. */
function traduireDans(z) {
  const it = document.createTreeWalker(z, NodeFilter.SHOW_TEXT);
  for (let n = it.nextNode(); n; n = it.nextNode()) {
    const brut = n.nodeValue.trim();
    if (!brut) continue;
    // Un en-tête de colonne trié porte sa flèche : « Âge ▼ » n'est pas une clé, « Âge » si.
    const sansFleche = brut.replace(/\s*[▼▲]$/, "");
    const cible = EN[brut] || (EN[sansFleche] && EN[sansFleche] + brut.slice(sansFleche.length));
    // Réécrire une valeur identique déclenche quand même une mutation de `characterData` :
    // avec l'observateur branché dessus, une correspondance neutre ferait boucler la page.
    // On ne touche au nœud que si le texte change vraiment.
    if (cible) { if (cible !== brut) n.nodeValue = n.nodeValue.replace(brut, cible); continue; }
    for (const [re, fn] of EN_MOTIFS) {
      const m = brut.match(re);
      if (m) { const t = fn(...m); if (t !== brut) n.nodeValue = n.nodeValue.replace(brut, t); break; }
    }
  }
  const porteurs = z.querySelectorAll ? [...z.querySelectorAll("[placeholder],[title]")] : [];
  if (z.getAttribute && (z.getAttribute("placeholder") || z.getAttribute("title"))) porteurs.push(z);
  for (const e of porteurs) {
    for (const attr of ["placeholder", "title"]) {
      const v = e.getAttribute(attr);
      if (v && EN[v.trim()] && EN[v.trim()] !== v.trim()) e.setAttribute(attr, EN[v.trim()]);
    }
  }
}

/**
 * Traduit le chrome d'une racine. Sans effet en français : le texte source EST le français.
 *
 * Trois cas à couvrir, et c'est le troisième qui compte : la racine **est** un conteneur de
 * chrome, elle en **contient**, ou — le plus fréquent quand une section se redessine — elle
 * se trouve **dedans**. Sans ce dernier cas, tout ce qu'un `innerHTML` écrit à l'intérieur
 * de la sidebar ou de la pagination échappait à la traduction.
 */
function traduire(racine = document.body) {
  if (langue() !== "en" || !racine || !racine.querySelectorAll) return;
  const zones = new Set(racine.querySelectorAll(CHROME));
  if (racine.matches && racine.matches(CHROME)) zones.add(racine);
  else if (racine.closest && racine.closest(CHROME)) zones.add(racine);
  zones.forEach(traduireDans);
}

/**
 * Tout ce que l'interface écrit passe par le DOM : un observateur traduit ce qui arrive,
 * plutôt que d'imposer un appel à `t()` sur chaque chaîne — et rien n'est oublié quand un
 * écran change.
 */
function observerLangue() {
  new MutationObserver((muts) => {
    if (langue() !== "en") return;
    for (const m of muts) {
      if (m.type === "characterData") { traduire(m.target.parentElement); continue; }
      for (const n of m.addedNodes) {
        if (n.nodeType === 1) traduire(n);
        // `element.textContent = …` remplace le nœud de texte : la mutation porte sur un
        // nœud de type 3, qu'il faut traduire par son parent.
        else if (n.nodeType === 3 && n.parentElement) traduire(n.parentElement);
      }
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
}

async function basculerLangue() {
  const cible = langue() === "fr" ? "en" : "fr";
  S.pref = await api("/api/moi/preferences", { method: "POST", body: { langue: cible } });
  location.reload();   // le plus simple et le plus sûr : tout est redessiné dans la langue choisie
}

// ------------------------------------------------------------------- thème
/**
 * Thème d'affichage. Clair par défaut — c'est ce que montre ShipStation, et l'entrepôt
 * travaille sous néon, pas dans le noir. Le mode sombre reste un choix, jamais une
 * conséquence du réglage du système : c'est la préférence de l'utilisateur qui tranche.
 */
const THEMES = [["clair", "Thème clair"], ["sombre", "Thème sombre"], ["systeme", "Thème du système"]];
const theme = () => (S.pref && S.pref.theme) || "clair";

function appliquerTheme(t = theme()) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
}

async function poserTheme(t) {
  appliquerTheme(t);                       // effet immédiat, avant l'aller-retour réseau
  S.pref = { ...(S.pref || {}), theme: t };
  try { S.pref = await api("/api/moi/preferences", { method: "POST", body: { theme: t } }); }
  catch { /* le thème reste appliqué localement même si l'enregistrement échoue */ }
  appliquerTheme();
}

// Le thème est posé avant le premier rendu utile : appliqué depuis le dernier choix connu,
// gardé en localStorage uniquement pour éviter le flash blanc au chargement. La préférence
// qui fait foi reste celle du serveur, relue à l'ouverture de session.
try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "clair"; } catch {}

async function api(route, opts = {}) {
  const o = { headers: { "Content-Type": "application/json" }, credentials: "same-origin", ...opts };
  if (o.body && typeof o.body !== "string") o.body = JSON.stringify(o.body);
  // Une lecture lancée pour peindre un écran n'a plus d'objet quand on a changé d'écran :
  // sans cela, un écran lent finit de se peindre par-dessus le suivant. On n'attache le
  // signal qu'aux lectures — abandonner un POST ne l'annule pas côté serveur, cela ne fait
  // qu'ignorer sa réponse, ce qui serait pire que de l'attendre.
  const lecture = !o.method || String(o.method).toUpperCase() === "GET";
  if (lecture && !o.signal && S.abortEcran) o.signal = S.abortEcran.signal;
  let r;
  try {
    r = await fetch(route, o);
  } catch (err) {
    // Une requête que l'appelant a lui-même abandonnée n'est pas une panne de service :
    // la confondre ferait clignoter « service injoignable » à chaque frappe rapide.
    if (err && err.name === "AbortError") throw err;
    throw new Error("service injoignable — redémarrage en cours ? réessayer dans un instant");
  }
  if (r.status === 401) {
    // La session a expiré : l'écran de connexion **est** le traitement de cette erreur. On
    // lève quand même pour interrompre l'appelant, mais en marquant l'erreur comme déjà
    // traitée — sinon elle finit en rejet non géré dans la console, où elle noie les vraies
    // pannes que le §4.3 demande justement de rendre visibles.
    montrerConnexion();
    const e = new Error("session expirée");
    e.traitee = true;
    throw e;
  }
  const t = await r.text();
  let j;
  try {
    j = JSON.parse(t);
  } catch {
    // Réponse non-JSON : c'est la page d'erreur de l'hébergeur, pas la nôtre. L'afficher
    // telle quelle noierait l'utilisateur sous du HTML — on traduit.
    if (r.status === 502 || r.status === 503 || r.status === 504)
      throw new Error(`service indisponible (${r.status}) — il redémarre probablement, réessayer dans une minute`);
    throw new Error(`réponse inattendue du serveur (HTTP ${r.status})`);
  }
  if (!r.ok) {
    const e = new Error(j.error || `HTTP ${r.status}`);
    e.detail = j;              // le serveur joint parfois la liste de ce qui bloque
    throw e;
  }
  return j;
}

function dialogue(titre, html, onOk, texteOk = "Confirmer", apres = null) {
  // La fiche de commande est un écran, pas une question : elle prend toute la largeur utile.
  $("#dlg").classList.toggle("large", /^Commande /.test(titre));
  // §8.2.4 — le <dialog> natif porte déjà le rôle et le piège de focus ; il lui manquait
  // seulement d'être nommé par son titre pour être annoncé correctement.
  $("#dlg").setAttribute("aria-labelledby", "dlgT");
  $("#dlg").setAttribute("aria-modal", "true");
  $("#dlgT").textContent = titre;
  $("#dlgC").innerHTML = html;
  if (apres) apres($("#dlgC"));
  $("#dlgO").textContent = texteOk;
  // Un dialogue qui a désactivé son bouton (l'import, tant qu'aucun passage à blanc n'a été
  // joué) le laissait désactivé pour le dialogue suivant : l'état se réarme à chaque ouverture.
  $("#dlgO").disabled = false;
  $("#dlgO").style.display = onOk ? "" : "none";
  $("#dlgO").onclick = async () => {
    try { if (await onOk?.() !== false) $("#dlg").close(); }
    catch (e) { alert(e.message); }
  };
  $("#dlgN").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
  return $("#dlgC");
}
const attendre = (t = "Un instant…") => dialogue(t, '<p class="doux">Traitement en cours…</p>', null);

/** Table générique : colonnes, lignes, sélection, tri. */
function table(cols, lignes, { sel = null, onSel = null, onTri = null, tri = null, dir = null, onLigne = null, cle = "id", pins = 0, legende = null } = {}) {
  const cl = (c, i) => [c.n ? "n" : "", i < pins ? `pin pin${i + 1}` : ""].filter(Boolean).join(" ");
  // « Tout sélectionner » manquait : les cases existaient ligne par ligne, sans moyen de
  // prendre la page entière — ShipStation l'a en tête de colonne, et c'est de là qu'il ouvre
  // son bandeau « sélectionner les N de la vue ».
  const th = (sel ? '<th scope="col" style="width:26px"><input type="checkbox" id="selTout" aria-label="Tout sélectionner sur cette page"></th>' : "") + cols.map((c, i) =>
    `<th scope="col" class="${cl(c, i)}" data-c="${c.k}"${
        tri === c.k ? ` aria-sort="${dir === "asc" ? "ascending" : "descending"}"` : ""
      }>${esc(c.t)}${tri === c.k ? (dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
  const tr = lignes.map(l => {
    const tds = cols.map((c, i) => `<td class="${cl(c, i)}">${c.r ? c.r(l) : esc(l[c.k] ?? "—")}</td>`).join("");
    return `<tr data-id="${esc(l[cle])}" class="${onLigne ? "clic" : ""}">${sel ? `<td><input type="checkbox" data-id="${esc(l[cle])}" aria-label="Sélectionner ${esc(l[cle])}"></td>` : ""}${tds}</tr>`;
  }).join("");
  const t = el(`<div class="tbl"><table>${
    legende ? `<caption class="visuellement-cache">${esc(legende)}</caption>` : ""
  }<thead><tr>${th}</tr></thead><tbody>${tr || `<tr><td colspan="${cols.length + 1}" class="doux" style="padding:22px;text-align:center">Aucun résultat</td></tr>`}</tbody></table></div>`);
  if (onTri) t.querySelectorAll("th[data-c]").forEach(h => h.onclick = () => onTri(h.dataset.c));
  if (sel) {
    const cases = [...t.querySelectorAll("tbody input[type=checkbox][data-id]")];
    const majTout = () => {
      const tout = t.querySelector("#selTout");
      if (!tout) return;
      const n = cases.filter((c) => c.checked).length;
      tout.checked = n > 0 && n === cases.length;
      tout.indeterminate = n > 0 && n < cases.length;
    };
    const signaler = () => {
      majTout();
      onSel?.(sel);
      document.dispatchEvent(new Event("selchange"));
    };
    cases.forEach(cb => {
      cb.checked = sel.has(Number(cb.dataset.id));
      cb.closest("tr").classList.toggle("sel", cb.checked);
      cb.onchange = () => {
        const id = Number(cb.dataset.id);
        cb.checked ? sel.add(id) : sel.delete(id);
        cb.closest("tr").classList.toggle("sel", cb.checked);
        signaler();
      };
    });
    const tout = t.querySelector("#selTout");
    if (tout) tout.onchange = () => {
      cases.forEach((cb) => {
        cb.checked = tout.checked;
        cb.checked ? sel.add(Number(cb.dataset.id)) : sel.delete(Number(cb.dataset.id));
        cb.closest("tr").classList.toggle("sel", cb.checked);
      });
      signaler();
    };
    majTout();
  }
  if (onLigne) t.querySelectorAll("tbody tr.clic").forEach(r => r.onclick = (e) => {
    if (e.target.tagName === "INPUT") return;
    onLigne(r.dataset.id);
  });
  return t;
}

 * Catalogue des colonnes de la grille — l'équivalent du « Manage Columns » de ShipStation.

/*

 * Commandes lui-même, et la sélection est enregistrée **côté serveur** — par vue, ou dans le

 * qui fait que les colonnes personnalisées de ShipStation se réinitialisent (bug communautaire

const S = { page: "commandes", moi: null, pref: { langue: "fr" }, config: {}, refs: {}, compteurs: {}, sel: new Set(), filtres: {}, tri: "age", dir: "desc", tick: null };

const MODULES = [
  { id: "analytique", t: "Analytique" },
  { id: "automatisation", t: "Automatisations" },
  { id: "commandes", t: "Commandes", n: () => S.compteurs.statuts?.awaiting_shipment },

/** Page → module qui l'héberge, pour savoir quel onglet allumer. */
const MODULE_DE = {};
for (const m of MODULES) {
  MODULE_DE[m.id] = m.id;
  for (const x of (m.sous || [])) MODULE_DE[x.id] = m.id;
}
MODULE_DE.attente = "commandes";

const PERM_PAGE = { utilisateurs: "users_manage", reglages: "settings_edit", journal: "reports_view",
  analytique: "reports_view", produits: "products_view", retours: "returns_manage",
  prereglages: "settings_edit", automatisation: "settings_edit", gabarits: "settings_edit",
  douanes: "products_view", cueillettes: "shipments_view" };

function autorise(id) {
  const need = PERM_PAGE[id];
  return !need || S.moi?.permissions?.[need] === true;
}

function menu() {
  const actif = MODULE_DE[S.page] || S.page;
  // Un `href` réel plutôt qu'un `onclick` nu : la tabulation atteint la navigation, le lecteur
  // d'écran annonce un lien, et « ouvrir dans un nouvel onglet » redevient possible (§8.2.1).
  $("#mods").innerHTML = MODULES.filter((m) => autorise(m.id))
    .map((m) => `<a href="#${m.id}" data-p="${m.id}" class="${actif === m.id ? "actif" : ""}"${
      actif === m.id ? ' aria-current="page"' : ""}>${esc(m.t)}<span class="n" data-n="${m.id}"></span></a>`).join("");
  $("#mods").querySelectorAll("[data-p]").forEach((a) => a.onclick = (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;   // laisser le navigateur ouvrir un onglet
    e.preventDefault(); aller(a.dataset.p);
  });

  const mod = MODULES.find((m) => m.id === actif);
  const sous = (mod && mod.sous || []).filter((x) => autorise(x.id));
  $("#sousnav").innerHTML = sous.length
    ? sous.map((x) => `<a href="#${x.id}" data-s="${x.id}" class="${S.page === x.id ? "actif" : ""}"${
        S.page === x.id ? ' aria-current="page"' : ""}>${esc(x.t)}</a>`).join("")
    : "";
  $("#sousnav").querySelectorAll("[data-s]").forEach((a) => a.onclick = (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); aller(a.dataset.s);
  });
  majCompteursMenu();
}

function majCompteursMenu() {
  for (const m of MODULES.filter((x) => x.n)) {
    const s = $(`[data-n="${m.id}"]`);
    if (!s) continue;
    const v = m.n();
    s.textContent = v ? num(v) : "";
    s.style.display = v ? "" : "none";
  }
  const n = Object.values(S.compteurs.alertes || {}).reduce((a, b) => a + b, 0);
  const p = $("#hAlertes .pastille");
  if (p) { p.textContent = num(n); p.hidden = !n; }
}

function aller(page) {
  if (!autorise(page)) return;
  // Un module qui a des sous-onglets ouvre le premier : cliquer « Expéditions » doit montrer
  // les expéditions, pas une page d'accueil vide.
  const mod = MODULES.find((m) => m.id === page);
  if (mod && mod.sous && mod.sous.length && !mod.sous.some((x) => x.id === page)) page = mod.sous[0].id;
  S.page = page; S.sel.clear(); S.filtres = {};
  if ((location.hash || "").slice(1) !== page) location.hash = page;
  menu();
  rendre();
}

/**
 * Routage par l'historique — BUG-053.
 *
 * `aller()` posait le hash sans que personne n'écoute son changement : le bouton Retour du
 * navigateur modifiait l'URL et laissait l'écran en place. On se retrouvait avec « #tarifs »
 * affiché au-dessus de l'écran Scan, et deux comptages contradictoires sur la même page.
 */
function suivreHash() {
  const cible = (location.hash || "").slice(1) || "commandes";
  if (cible === S.page || !VUES[cible] || !autorise(cible)) return;
  S.page = cible; S.sel.clear(); S.filtres = {};
  menu();
  rendre();
}

/** Menu de configuration — le contenu de l'engrenage. */
function menuReglages(ancre) {
  const r = ancre.getBoundingClientRect();
  document.querySelectorAll(".menuF").forEach((m) => m.remove());
  const m = el(`<div class="menuF" style="top:${r.bottom + 4}px;right:8px;left:auto">${
    REGLAGES.filter((x) => autorise(x.id)).map((x) => `<div class="mi" data-r="${x.id}">${esc(x.t)}</div>`).join("")}</div>`);
  document.body.append(m);
  m.querySelectorAll("[data-r]").forEach((d) => d.onclick = () => { m.remove(); aller(d.dataset.r); });
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once: true }), 0);
}

/** Menu de profil — second facteur, mot de passe, déconnexion. */
function menuProfil(ancre) {
  const r = ancre.getBoundingClientRect();
  document.querySelectorAll(".menuF").forEach((m) => m.remove());
  const m = el(`<div class="menuF" style="top:${r.bottom + 4}px;right:8px;left:auto">
    <div class="mi" data-a="2fa">${S.moi?.totp_enabled ? "Second facteur ✓" : "Activer le second facteur"}</div>
    <div class="mi" data-a="mdp">Changer le mot de passe</div>
    <div class="sep"></div>
    <div class="mi" data-a="langue">${langue() === "fr" ? "Language: English" : "Langue : Français"}</div>
    <div class="mt">Thème</div>
    ${THEMES.map(([v, t]) => `<div class="mi" data-a="th:${v}">${t}${theme() === v ? " ✓" : ""}</div>`).join("")}
    <div class="sep"></div>
    <div class="mi" data-a="alertes">Voir les alertes</div>
    <div class="sep"></div>
    <div class="mi danger" data-a="out">Se déconnecter</div></div>`);
  document.body.append(m);
  const actions = { "2fa": configurer2facteur, mdp: () => changerMotDePasse(false),
    langue: basculerLangue, alertes: () => aller("alertes"), out: deconnexion };
  m.querySelectorAll("[data-a]").forEach((d) => d.onclick = () => {
    m.remove();
    const a = d.dataset.a;
    if (a.startsWith("th:")) return poserTheme(a.slice(3));
    actions[a]();
  });
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once: true }), 0);
}

const STATUT_FR = {
  awaiting_payment: "Paiement attendu", on_hold: "En attente", awaiting_shipment: "À expédier",
  pending_fulfillment: "Préparation externe", shipped: "Expédiée", cancelled: "Annulée",
};
const STATUTS_ORDRE = ["awaiting_shipment", "on_hold", "awaiting_payment", "pending_fulfillment", "shipped", "cancelled"];

/**
 * Articles physiques d'une commande, mémorisés sur l'objet. À 1 000 lignes, plusieurs colonnes
 * redemandent la même liste : la recalculer à chaque cellule coûte plus cher que la dessiner.
 */
const arts = (o) => (o._arts || (o._arts = (o.items || []).filter((i) => !i.adjustment)));

/**
 * Index des référentiels. Un `find()` linéaire par cellule, sur 1 000 lignes et treize
 * colonnes, c'est treize mille balayages de tableau pour un seul rendu.
 */
/**
 * Les treize plages de dates nommées de ShipStation, calculées à l'ouverture du menu et non
 * figées au chargement de la page : un poste d'emballage reste ouvert toute la journée, et
 * « aujourd'hui » doit vouloir dire aujourd'hui même après minuit.
 *
 * Chaque entrée rend `{ from, to }` en dates locales — passer par `toISOString()` sur un
 * `Date` local décale d'un jour à l'ouest de Greenwich, ce qui est exactement le cas du
 * Québec, et « aujourd'hui » y ramènerait les commandes d'hier.
 */
const jourLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const ilYA = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return jourLocal(d); };
const PLAGES_DATE = [
  ["aujourdhui", "Aujourd'hui", () => ({ from: ilYA(0), to: ilYA(0) })],
  ["hier", "Hier", () => ({ from: ilYA(1), to: ilYA(1) })],
  ["7j", "7 derniers jours", () => ({ from: ilYA(6), to: ilYA(0) })],
  ["14j", "14 derniers jours", () => ({ from: ilYA(13), to: ilYA(0) })],
  ["30j", "30 derniers jours", () => ({ from: ilYA(29), to: ilYA(0) })],
  ["90j", "90 derniers jours", () => ({ from: ilYA(89), to: ilYA(0) })],
  ["mois", "Ce mois-ci", () => { const d = new Date();
    return { from: jourLocal(new Date(d.getFullYear(), d.getMonth(), 1)), to: ilYA(0) }; }],
  ["mois_dernier", "Le mois dernier", () => { const d = new Date();
    return { from: jourLocal(new Date(d.getFullYear(), d.getMonth() - 1, 1)),
             to: jourLocal(new Date(d.getFullYear(), d.getMonth(), 0)) }; }],
  ["semaine", "Cette semaine", () => { const d = new Date();
    // Semaine à la québécoise : elle commence le lundi.
    const recul = (d.getDay() + 6) % 7;
    return { from: ilYA(recul), to: ilYA(0) }; }],
  ["annee", "Cette année", () => ({ from: `${new Date().getFullYear()}-01-01`, to: ilYA(0) })],
  ["avant_7j", "Il y a plus de 7 jours", () => ({ from: "", to: ilYA(7) })],
  ["avant_30j", "Il y a plus de 30 jours", () => ({ from: "", to: ilYA(30) })],
  ["tout", "Tout l'historique", () => ({ from: "", to: "" })],
];

/**
 * Pastilles de canal de vente — repérage visuel des boutiques.
 *
 * ShipStation marque chaque boutique d'une icône de place de marché, dans le rail gauche
 * **et** sur chaque ligne de la grille. Chez Lasclay, cinq canaux cohabitent (Shopify, Etsy,
 * Faire, commandes manuelles, Shopify direct) et les distinguer d'un coup d'œil change le
 * temps qu'on met à retrouver une commande.
 *
 * Deux règles de conception. La pastille porte une **lettre**, pas seulement une couleur :
 * c'est le défaut que le §4.7 de l'audit reproche aux badges, indiscernables en niveaux de
 * gris et pour un daltonien. Et elle **complète** le nom de la boutique, elle ne le remplace
 * jamais — un repère de plus, pas un rébus.
 *
 * Les couleurs sont des teintes de repérage, pas des logos : reproduire les marques serait
 * inutile ici, et un aplat lisible dans les deux thèmes vaut mieux qu'un logo illisible en
 * 16 px. Le CSP interdit d'ailleurs toute image externe.
 */
/**
 * Icônes de marque, intégrées au document.
 *
 * Provenance, pour que personne n'ait à la deviner : Shopify et Etsy viennent de leur propre
 * `apple-touch-icon.png` officiel, rapatrié une fois puis normalisé à 64 px ; le F de Faire est
 * dessiné ici, leur site refusant toute requête automatisée.
 *
 * Ce ne sont que des valeurs par défaut : une icône déposée dans les réglages passe devant.
 * Elles existent pour que les trois canaux de Lasclay soient reconnaissables sans avoir rien
 * à configurer — et elles sont en URI de données, comme le reste : la page n'appelle jamais

/**
 * Les options d'une liste « Service », groupées par transporteur et honnêtes sur l'achat.
 *
 * Trois défauts corrigés d'un coup :
 *
 * 1. **Aucun regroupement.** Quatre-vingt-dix-sept lignes à plat, transporteurs mélangés.
 *    `<optgroup>` sépare, et le navigateur le rend nativement.
 * 2. **Rien du transporteur réellement branché.** La liste ne contenait que le référentiel
 *    migré ; les services de Freightcom n'y étaient pas tant qu'on ne les avait pas versés.
 * 3. **Des choix qui échouent à l'achat.** Les identifiants hérités de ShipStation n'ont de
 *    sens que chez ShipStation. Les laisser au même rang que les vrais, c'est un piège qui
 *    ne se referme qu'au moment de payer. Ils restent — l'historique s'y réfère — mais dans
 *    un groupe nommé, en fin de liste, et dits non achetables.
 */
function optionsService(selection = "", { vide = "— choisir —" } = {}) {
  const tous = (S.refs.services || []).filter((x) => !x.hidden);
  const nomTransporteur = (code) => (S.refs.carriers || [])
    .find((c) => String(c.code) === String(code))?.name || code || "Sans transporteur";

  // Les services hérités de ShipStation sont retirés de la liste : leurs identifiants n'ont
  // de sens que chez ShipStation, aucun transporteur branché ici ne les reconnaîtra, et un
  // choix qui échoue à l'achat est pire qu'une liste courte. Ils restent en base — la fiche
  // d'une commande ancienne doit encore pouvoir afficher le nom de son service.
  const svc = tous.filter((x) => x.source !== "shipstation");

  // Une exception, et elle compte : si la commande ouverte porte justement un de ces
  // services, on le garde dans la liste. Sinon le `<select>` perdrait silencieusement sa
  // valeur, et le premier enregistrement effacerait le service de la commande sans que
  // personne ne l'ait demandé.
  const actuel = selection && !svc.some((x) => String(x.id) === String(selection))
    ? tous.find((x) => String(x.id) === String(selection)) : null;

  const groupes = new Map();
  for (const x of svc) {
    const cle = nomTransporteur(x.carrier_code);
    if (!groupes.has(cle)) groupes.set(cle, []);
    groupes.get(cle).push(x);
  }
  const ordonnes = [...groupes.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  const corps = ordonnes.map(([titre, liste]) =>
    `<optgroup label="${esc(titre)}">${liste.map((x) =>
      `<option value="${esc(x.id)}"${String(x.id) === String(selection) ? " selected" : ""}>${
        esc(x.name)}${x.drop_off ? " · dépôt" : ""}</option>`).join("")}</optgroup>`).join("");

  const conserve = actuel
    ? `<optgroup label="Service actuel — hérité de ShipStation">
         <option value="${esc(actuel.id)}" selected>${esc(actuel.name)}</option></optgroup>`
    : "";

  // Une liste vide sans explication ressemble à une panne. Elle dit donc quoi faire — et ce
  // n'est pas « voir Réglages » : chez un courtier, la liste des services applicables dépend
  // de l'envoi, elle vient de la cotation. Le bouton Coter est la réponse, pas un réglage.
  const rien = !svc.length && !actuel
    ? `<option value="" disabled>Cliquer « Coter » pour voir les tarifs applicables</option>` : "";

  return `${vide === null ? "" : `<option value="">${esc(vide)}</option>`}${rien}${conserve}${corps}`;
}

/** Le marché d'une boutique, avec repli sur son nom quand le champ n'est pas renseigné. */
function marcheDe(boutique) {
  if (!boutique) return MARCHES.autre;
  const m = String(boutique.marketplace || "").toLowerCase();
  if (MARCHES[m]) return MARCHES[m];
  const n = String(boutique.name || "").toLowerCase();
  for (const cle of Object.keys(MARCHES)) if (n.includes(cle)) return MARCHES[cle];
  if (/manuel|manual/.test(n)) return MARCHES.manual;
  return MARCHES.autre;
}

/**
 * Pastille d'une boutique, par identifiant. `avecNom` place le nom à côté ; sinon la pastille
 * seule, mais toujours avec le nom en info-bulle et en nom accessible — jamais une couleur
 * muette.
 */
function pastilleBoutique(storeId, { avecNom = false } = {}) {
  const b = IDX.stores?.get(String(storeId));
  const m = marcheDe(b);
  const nom = b ? b.name : "Boutique inconnue";
  const titre = b && m.nom !== nom ? `${nom} · ${m.nom}` : nom;
  // L'icône déposée d'abord, celle de la marque ensuite, la lettre en dernier recours. Le nom
  // accessible reste porté par le conteneur et non par l'image : une icône qui ne charge pas
  // ne doit pas emporter avec elle le nom de la boutique. L'`alt` vide évite que le lecteur
  // d'écran annonce la chose deux fois.
  const icone = (b && b.logo) || m.icone || null;
  const dedans = icone
    ? `<img src="${esc(icone)}" alt="" width="16" height="16">`
    : esc(m.lettre);
  const fond = icone ? "" : `style="background:${m.fond};color:${m.texte}"`;
  return `<span class="mk${icone ? " img" : ""}" ${fond}
    title="${esc(titre)}" aria-label="${esc(titre)}" role="img">${dedans}</span>${
    avecNom ? ` ${esc(nom)}` : ""}`;
}

 */
