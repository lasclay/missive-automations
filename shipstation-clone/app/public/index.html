/** Menu flottant ancré sur un élément. Une seule implémentation pour toute l'application. */
function menuAncre(ancre, entrees, { droite = false } = {}) {
  const r = ancre.getBoundingClientRect();
  document.querySelectorAll(".menuF").forEach((m) => m.remove());
  const pos = droite ? `right:${Math.max(8, innerWidth - r.right)}px;left:auto` : `left:${r.left}px`;
  const m = el(`<div class="menuF" style="top:${r.bottom + 4}px;${pos}">${
    entrees.map((e, i) => e.sep ? '<div class="sep"></div>'
      : e.titre ? `<div class="mt">${esc(e.titre)}</div>`
      : `<div class="mi ${e.danger ? "danger" : ""}${e.inactif ? " inactifM" : ""}"
           ${e.inactif ? `title="${esc(e.inactif)}" aria-disabled="true"` : `data-i="${i}"`}>${esc(e.t)}${
          e.hk ? `<kbd>${e.hk}</kbd>` : ""}${
          e.n != null ? `<span class="cpt">${num(e.n)}</span>` : ""}</div>`).join("")}</div>`);
  document.body.append(m);
  m.querySelectorAll("[data-i]").forEach((d) => d.onclick = () => { m.remove(); entrees[d.dataset.i].f(); });
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once: true }), 0);
  return m;
}

/**
 * Recharge la liste des lots ouverts — §4.3 de l'audit visuel.
 *
 * Le `catch` remettait `LOTS = []`, si bien qu'une panne réseau transformait « Lot du
 * 2026-08-02 · 2 » en « aucun lot ouvert ». L'utilisateur voyait une **information fausse**,
 * pas une absence d'information — et c'est pire, parce qu'on agit dessus : on recrée un lot
 * qui existe déjà, on y dépose des commandes qui étaient ailleurs.
 *
 * En cas d'échec on garde donc la dernière liste connue et on le dit ; `LOTS_PERIMES`
 * permet au rail de la marquer comme datée plutôt que de la présenter comme à jour.
 */
let LOTS_PERIMES = false;
async function chargerLots() {
  try {
    LOTS = (await api("/api/batches/open")).batches || [];
    LOTS_PERIMES = false;
  } catch {
    LOTS_PERIMES = true;   // on conserve LOTS tel quel : périmé vaut mieux que faux
  }
  return LOTS;
}

/**
 * Menu « Lot » — le même depuis la grille, la sidebar et la fiche de commande.
 *
 * Plusieurs chemins mènent au même geste, parce que le tri d'un arriéré ne suit pas un chemin
 * unique : on dépose parfois depuis la liste, parfois en regardant une commande de près.
 */
async function menuLots(ancre, ids, apres = () => {}) {
  await chargerLots();
  const n = ids.length;
  const entrees = [
    { titre: n ? `Déposer ${n} commande(s) dans…` : "Aucune commande sélectionnée" },
    ...LOTS.map((l) => ({ t: l.name, n: l.n, f: async () => {
      await api("/api/batches/add", { method: "POST", body: { batch_id: l.id, ids } });
      await chargerLots(); apres();
    } })),
    ...(LOTS.length ? [{ sep: 1 }] : []),
    { t: "Nouveau lot…", f: () => dialogue("Créer un lot", `
        <label class="champ"><span>Nom du lot</span>
          <input id="lnom2" value="${esc(nomDeLotPropose())}"></label>
        <p class="doux">${n ? `Les <b>${n}</b> commande(s) y seront déposées.` : "Le lot sera créé vide."}</p>`,
        async () => {
          await api("/api/batches/new", { method: "POST", body: { name: $("#lnom2").value, ids } });
          await chargerLots(); apres();
        }, "Créer") },
    { t: "Retirer du lot", f: async () => {
      await api("/api/batches/remove", { method: "POST", body: { ids } });
      await chargerLots(); apres();
    } },
    { sep: 1 },
    { t: "Gérer les lots…", f: () => aller("lots") },
  ];
  menuAncre(ancre, entrees, { droite: true });
}

/**
 * Pastille de validation d'adresse — vert immeuble ou maison, orange avertissement, rouge
 * erreur, comme les icônes de la grille d'origine. Utilisée par la sidebar ET par la fiche
 * de commande, donc au niveau du module.
 */
function adresseValide(a) {
  // Si le serveur a déjà tranché (action « Valider les adresses »), on affiche SON verdict et
  // ses motifs : deux avis divergents sur la même adresse, c'est pire que pas d'avis du tout.
  const v = a && a.verification;
  if (v) {
    const m = { verified: ["ok", "Adresse validée"], warning: ["warn", "Avertissement"], error: ["err", "Adresse invalide"] }[v.statut];
    const t = esc([m[1], ...(v.motifs || [])].join(" — "));
    return `<span class="valA ${m[0]}" title="${t}">${v.statut === "verified" ? "⌂" : v.statut === "warning" ? "?" : "!"}</span>`;
  }
  if (!a || !a.street1 || !a.city || !a.postalCode) return '<span class="valA err" title="Adresse incomplète">!</span>';
  if (!a.country) return '<span class="valA warn" title="Pays manquant">?</span>';
  return `<span class="valA ok" title="Adresse complète">${a.country === "CA" || a.country === "US" ? "⌂" : "◍"}</span>`;
}

const CANAL_FR = { ramassage: "ramassage", ddd: "DDD", defricheuses: "Défricheuses",
  colis: "colis", timbre: "timbre" };

/**
 * Libellé de service demandé au paiement, avec son état de mapping.
 *
 * Quatre issues, pas deux. Un libellé peut être mappé vers un canal qui **n'expédie pas** —
 * ramassage en entrepôt, ou remise à un partenaire (DDD, Défricheuses) : ces commandes
 * n'ont pas besoin de service transporteur et ne sont pas en défaut. Les afficher comme
 * « non mappé » noierait le vrai signal, qui est le cas `service_manquant` : mappé vers un
 * canal d'expédition, mais sans service précis — la commande partirait au service par
 * défaut sans que personne ne le voie (réserve du §13.6, constat OBS6).
 */
function rendreDemande(o, cliquable = false) {
  if (!o.requested_service) return "—";
  const r = IDX.resolutions ? IDX.resolutions.get(o.requested_service) : null;
  const nom = esc(o.requested_service);
  const lien = (txt, titre) => cliquable
    ? ` <button type="button" class="lienMap" id="cMapper" title="${esc(titre)}">${txt}</button>`
    : ` <span class="puce a" title="${esc(titre)}">${txt}</span>`;

  if (!r || r.etat === "non_mappe")
    return nom + lien("non mappé", "Aucun mapping — la commande partira au service par défaut");
  if (r.etat === "service_manquant")
    return nom + lien("service manquant", `Mappé vers le canal « ${CANAL_FR[r.channel] || r.channel} » mais sans service transporteur précis`);
  if (r.etat === "sans_transporteur")
    return `${nom} <span class="puce g" title="Ce canal n'utilise pas de transporteur">${
      esc(CANAL_FR[r.channel] || r.channel)}</span>`;
  return nom + (cliquable ? ' <button type="button" class="fEdit" id="cMapper" title="Modifier le mapping">mappé</button>' : "");
}

/**
 * Modale de Service Mapping (§3.7). Le mapping est enregistré au niveau de la boutique et
 * s'applique à **toutes** les commandes à expédier du même magasin portant le même libellé
 * de checkout — c'est la portée qu'annonce ShipStation, et elle mérite d'être écrite à
 * l'écran : on croit corriger une commande, on en corrige quarante.
 */
function modaleMapping(o, apres = () => {}) {
  const svc = (S.refs.services || []).filter((x) => !x.hidden);
  const boutique = IDX.stores?.get(String(o.store_id))?.name || "cette boutique";
  dialogue(`Mapper « ${o.requested_service} »`, `
    <p class="doux">Le libellé choisi par le client au paiement est traduit en service
      transporteur réel. Le mapping s'appliquera à <b>toutes les commandes à expédier de
      ${esc(boutique)}</b> portant ce même libellé — pas seulement à celle-ci.</p>
    <label class="champ"><span>Service d'expédition</span><select id="mpS">
      ${optionsService(o.service_id || "")}
    </select></label>
    <label class="champ"><span>Type de colis</span><select id="mpP">
      <option value="">— choisir —</option>${(S.refs.packages || []).map((x) =>
        `<option value="${esc(x.id)}"${String(o.package_id) === String(x.id) ? " selected" : ""}>${esc(x.name)}</option>`).join("")}
    </select></label>
    <label class="ch"><input type="checkbox" id="mpO" checked> Appliquer aussi aux commandes déjà importées</label>`,
    async () => {
      const service = $("#mpS").value;
      if (!service) { alert("Choisir un service."); return false; }
      const svcObj = svc.find((x) => String(x.id) === String(service));
      await api("/api/service-mappings", { method: "POST", body: {
        store_id: o.store_id || null, requested: o.requested_service, match_mode: "equals",
        carrier_code: svcObj ? svcObj.carrier_code : null,
        service_id: service, package_id: $("#mpP").value || null } });
      if ($("#mpO").checked)
        await api("/api/automation/reprocess", { method: "POST", body: { statuts: ["awaiting_shipment"] } })
          .catch(() => {});
      try {
        const d = await api("/api/service-mappings");
        S.nonMappes = (d.non_mappes || []).map((x) => x.libelle);
        S.resolutions = d.resolutions || [];
        indexerRefs();
      } catch {}
      apres();
    }, "Enregistrer le mapping");
}

        f.age_min && `≥ ${f.age_min} j`, f.gift && "cadeau", f.single_item && "mono-article",
        f.sans_lot && "hors lot"].filter(Boolean).join(" · "),
      html: (f) => `<label class="champ"><span>Admissibilité au dépôt</span><select data-f="drop_off">
          <option value="">Toutes</option>
          <option value="oui"${f.drop_off === "oui" ? " selected" : ""}>Admissibles (&lt; ${S.config.seuil_dropoff_g} g)</option>
          <option value="non"${f.drop_off === "non" ? " selected" : ""}>Non admissibles</option></select></label>
        <div class="deux">
          <label class="champ"><span>Poids min (g)</span><input type="number" data-f="weight_min" value="${esc(f.weight_min || "")}"></label>
          <label class="champ"><span>Poids max (g)</span><input type="number" data-f="weight_max" value="${esc(f.weight_max || "")}"></label>
        </div>
        <label class="champ"><span>Âge minimum (jours)</span><input type="number" data-f="age_min" value="${esc(f.age_min || "")}"></label>
        <label class="ch"><input type="checkbox" data-f="no_weight"${f.no_weight ? " checked" : ""}> Sans poids saisi</label>
        <label class="ch"><input type="checkbox" data-f="gift"${f.gift ? " checked" : ""}> Commandes cadeau</label>
        <label class="ch"><input type="checkbox" data-f="single_item"${f.single_item ? " checked" : ""}> Mono-article seulement</label>
        <label class="ch"><input type="checkbox" data-f="sans_lot"${f.sans_lot ? " checked" : ""}> Pas encore dans un lot</label>` },
  ];

  function dessinerFiltres() {
    const f = S0.f;
    const actifs = PASTILLES.filter((p) => p.resume(f));
    F.innerHTML = `<span class="fpar">Filtrer par :</span>` +
      PASTILLES.map((p) => {
        const r = p.resume(f);
        return `<button class="chip${r ? " on" : ""}" data-chip="${p.id}">${esc(p.t)}${
          r ? `<b>${esc(r)}</b><i data-vider="${p.id}" title="Retirer ce filtre">✕</i>` : " ▾"}</button>`;
      }).join("") +
      `<button class="chip sauv" id="fSaved">Filtres sauvegardés ▾</button>` +
      (actifs.length ? `<button class="lien" id="freset">Tout effacer (${actifs.length})</button>` : "") +
      `<span style="margin-left:auto"></span>
       <button id="fdense" class="${S0.dense ? "on" : ""}" title="Densité de la grille">Dense</button>`;

    F.querySelectorAll("[data-chip]").forEach((b) => b.onclick = (e) => {
      if (e.target.dataset.vider) return;
      ouvrirPastille(b, PASTILLES.find((p) => p.id === b.dataset.chip));
    });
    F.querySelectorAll("[data-vider]").forEach((i) => i.onclick = (e) => {
      e.stopPropagation();
      PASTILLES.find((p) => p.id === i.dataset.vider).cles.forEach((k) => delete S0.f[k]);
      S0.page = 0; dessinerFiltres(); charger();
    });
    $("#fSaved").onclick = () => menuAncre($("#fSaved"), VUES_SAUV.length
      ? [...VUES_SAUV.map((v) => ({ t: v.name, f: () => choisirVue(v.id) })),
         { sep: 1 }, { t: "Enregistrer la vue actuelle…", f: enregistrerVue }]
      : [{ t: "Aucune vue sauvegardée", f: () => {} }]);
    const rz = $("#freset");
    if (rz) rz.onclick = () => { S0.f = {}; S0.vue = null; S0.page = 0; dessinerFiltres(); charger(); majVues(); };
    $("#fdense").onclick = () => {
      S0.dense = !S0.dense;
      $("#tbl").classList.toggle("dense", S0.dense);
      $("#fdense").classList.toggle("on", S0.dense);
      // Mémorisé côté compte : +31 % de lignes visibles qu'on ne redemande plus chaque
      // matin, et qui suivent l'opérateur d'un poste à l'autre.
      S.pref = { ...(S.pref || {}), dense: S0.dense };
      api("/api/moi/preferences", { method: "POST", body: { dense: S0.dense } })
        .catch(() => { /* la densité reste appliquée localement même si l'écriture échoue */ });
    };
    if (langue() !== "fr") traduireDans(F);
  }

  /** Panneau d'une pastille : on modifie, on ferme, on recharge. Pas de bouton « appliquer ». */
  function ouvrirPastille(ancre, p) {
    document.querySelectorAll(".menuF,.panF").forEach((m) => m.remove());
    const r = ancre.getBoundingClientRect();
    const pan = el(`<div class="panF" style="top:${r.bottom + 4}px;left:${Math.min(r.left, innerWidth - 320)}px">
      <div class="panT">${esc(p.t)}</div><div class="panB">${p.html(S0.f)}</div></div>`);
    document.body.appendChild(pan);
    if (langue() !== "fr") traduireDans(pan);

    const appliquer = () => { S0.page = 0; dessinerFiltres(); charger(); };
    let deb;
    pan.querySelectorAll("[data-f]").forEach((i) => {
      const ev = i.tagName === "SELECT" || i.type === "checkbox" || i.type === "date" ? "change" : "input";
      i.addEventListener(ev, () => {
        // Une liste à choix multiples rend un tableau ; le filtre le transmet tel quel et
        // `orders.chercher` en fait un `IN (…)`. Zéro sélection = pas de filtre, pas
        // « aucune boutique ».
        const v = i.type === "checkbox" ? (i.checked ? "1" : "")
          : i.multiple ? [...i.selectedOptions].map((o) => o.value).filter(Boolean)
          : i.value;
        const vide = v === "" || v === false || (Array.isArray(v) && !v.length);
        if (vide) delete S0.f[i.dataset.f]; else S0.f[i.dataset.f] = v;
        clearTimeout(deb); deb = setTimeout(appliquer, ev === "input" ? 300 : 0);
      });
    });
    pan.querySelectorAll("[data-plage]").forEach((b) => b.onclick = () => {
      const p = PLAGES_DATE.find(([id]) => id === b.dataset.plage);
      if (!p) return;
      const { from, to } = p[2]();
      // Les deux bornes sont posées ensemble : une plage à moitié définie (« du 1er au … »)
      // ramène tout l'avenir, ce qui n'est jamais ce qu'on voulait dire.
      if (from) S0.f.date_from = from; else delete S0.f.date_from;
      if (to) S0.f.date_to = to; else delete S0.f.date_to;
      pan.remove(); appliquer();
    });
    setTimeout(() => document.addEventListener("click", function fermer(e) {
      if (pan.contains(e.target)) return;
      pan.remove(); document.removeEventListener("click", fermer);
    }), 0);
  }

  const lire = () => ({
    ...S0.f,
    q: $("#fq").value, status: S0.statut || "",
    store_id: S0.store || S0.f.store_id || "",
    batch_id: S0.lot || "",
    ...(S0.avance || {}),
  });

  /**
   * Le champ de recherche de la barre latérale — **globale**, comme celui de l'en-tête.
   *
   * Il ne l'était pas : il gardait le statut, la boutique, le lot, la vue et les filtres
   * avancés courants, et se contentait de filtrer à l'intérieur. Chercher « josée ferland »
   * depuis « À expédier » rendait « Aucune commande » alors que la commande existait, en
   * Expédiée — et l'écran proposait « Importer depuis Shopify », ce qui laisse conclure que
   * la cliente n'a jamais commandé. ShipStation, lui, ouvre « All Search Results » sur tout
   * le compte.
   *
   * Deux champs de recherche qui se ressemblent et ne cherchent pas dans le même périmètre
   * sont pires qu'un seul : le résultat dépend de celui qu'on a utilisé, sans que rien ne le
   * dise. Ils font désormais la même chose.
   */
  let debQ;
  $("#fq").addEventListener("input", () => {
    clearTimeout(debQ);
    debQ = setTimeout(() => {
      const q = $("#fq").value.trim();
      if (q) {
        // On sort de la vue : on ne peut pas prétendre chercher « partout » en gardant la
        // moitié des filtres. Ce qui est effacé est annoncé dans l'en-tête de l'écran.
        S0.statut = ""; S0.store = null; S0.lot = null; S0.vue = null;
        S0.avance = null; S0.f = {};
        S0.recherche = q;
        S.sel.clear(); S.toutLeFiltre = false;
        const qk = $("#quick"); if (qk) qk.value = q;
        majStatuts(); majVues(); majLots(); dessinerFiltres();
      } else if (S0.recherche) {
        // Champ vidé : on revient à la file de travail, pas à un écran vide sans statut.
        S0.recherche = null; S0.statut = "awaiting_shipment";
        const qk = $("#quick"); if (qk) qk.value = "";
        majStatuts(); majVues(); majLots(); dessinerFiltres();
      }
      S0.page = 0; charger();
    }, 250);
  });

  // ------------------------------------------------------- statuts et vues
  let VUES_SAUV = [];

  /**
   * Panneau gauche — le **premier niveau** de tri, celui de ShipStation : les statuts, avec
   * « À expédier » déplié par boutique. Les onglets du haut affinent ensuite à l'intérieur.
   * Deux niveaux distincts, jamais l'un à la place de l'autre.
   */
  function majStatuts() {
    // Pendant une recherche, le rail montre **où sont les résultats** plutôt que la
    // volumétrie habituelle : c'est le « All Search Results / LAS Shopify 1 / Shipped 1 »
    // de ShipStation. Un résultat unique en « Expédiée » se voit d'un coup d'œil, au lieu
    // de se chercher statut par statut.
    const enRecherche = !!S0.recherche;
    const rep = enRecherche ? (S0.repartition || { statuts: {}, boutiques: {} }) : null;
    const c = enRecherche ? rep.statuts : (S.compteurs.statuts || {});
    const b = enRecherche ? rep.boutiques : (S.compteurs.boutiques || {});
    const ligne = (id, libelle, n, cls = "") =>
      `<button type="button" class="ssLi ${cls} ${estActif(id) ? "actif" : ""}" data-s="${id}"
         aria-pressed="${estActif(id)}">${esc(libelle)}<span class="n">${n ? num(n) : ""}</span></button>`;

    const boutiques = (S.refs.stores || []).filter((x) => x.active)
      .map((x) => `<button type="button" class="ssLi enfant ${S0.statut === "awaiting_shipment" && String(S0.store) === String(x.id) ? "actif" : ""}"
        data-b="${x.id}" aria-pressed="${S0.statut === "awaiting_shipment" && String(S0.store) === String(x.id)}"
        >${pastilleBoutique(x.id)}${esc(x.name)}<span class="n">${b[x.id] ? num(b[x.id]) : ""}</span></button>`).join("");

    const enTeteRecherche = enRecherche
      ? `<button type="button" class="ssLi actif" id="ssTousResultats" aria-pressed="true"
           >Tous les résultats<span class="n">${num(S0.totalRecherche || 0)}</span></button>
         <div class="ssAide">Recherche sur tout le compte, tous statuts confondus.
           Cliquez un statut pour y revenir et quitter la recherche.</div>`
      : "";

    $("#ssStatuts").innerHTML = enTeteRecherche +
      ligne("awaiting_payment", STATUT_FR.awaiting_payment, c.awaiting_payment) +
      ligne("on_hold", STATUT_FR.on_hold, c.on_hold) +
      ligne("awaiting_shipment", STATUT_FR.awaiting_shipment, c.awaiting_shipment) +
      boutiques +
      ligne("pending_fulfillment", STATUT_FR.pending_fulfillment, c.pending_fulfillment) +
      ligne("shipped", STATUT_FR.shipped, c.shipped) +
      ligne("cancelled", STATUT_FR.cancelled, c.cancelled) +
      `<button type="button" class="ssLi" id="ssAlertes">Alertes de commandes<span class="n">${
        num(Object.values(S.compteurs.alertes || {}).reduce((x, y) => x + y, 0)) || ""}</span></button>`;

    $("#ssStatuts").querySelectorAll("[data-s]").forEach((a) => a.onclick = () => {
      // Changer de statut sort de tout le reste — boutique, vue, lot, recherche avancée et
      // recherche rapide. Sinon la barre latérale annonce « À expédier 856 » au-dessus d'une
      // grille vide, et rien n'explique l'écart.
      S0.statut = a.dataset.s; S0.store = null; S0.vue = null; S0.lot = null;
      S0.avance = null; S0.recherche = null; S0.page = 0; S.sel.clear(); S.toutLeFiltre = false;
      const fq = $("#fq"); if (fq) fq.value = "";
      const qk = $("#quick"); if (qk) qk.value = "";
      charger(); majStatuts(); chargerVues(); majLots();
    });
    $("#ssStatuts").querySelectorAll("[data-b]").forEach((a) => a.onclick = () => {
      S0.statut = "awaiting_shipment"; S0.store = a.dataset.b; S0.vue = null; S0.lot = null;
      S0.page = 0; S.sel.clear();
      S0.f.store_id = a.dataset.b; dessinerFiltres();
      charger(); majStatuts(); majLots();
    });
    $("#ssAlertes").onclick = () => aller("alertes");
  }

  const estActif = (id) => S0.statut === id && !S0.store && !S0.vue && !S0.lot;

  /**
   * Lots ouverts. Le `+` apparaît dès qu'une commande est sélectionnée : c'est le geste que
   * ShipStation met à cet endroit précis, et c'est ce qui rend le tri d'un arriéré fluide —
   * on coche, on dépose, on passe à la suivante, sans jamais ouvrir de fenêtre.
   */
  async function majLots() {
    await chargerLots();
    const n = S.sel.size;
    $("#ssLots").innerHTML = LOTS.length
      ? LOTS.map((l) => `<button type="button" class="ssLi lot ${String(S0.lot) === String(l.id) ? "actif" : ""}" data-l="${l.id}" aria-pressed="${String(S0.lot) === String(l.id)}">
          <span class="nom">${esc(l.name)}</span>
          <span class="n">${l.n ? num(l.n) : ""}</span>
          ${n ? `<button class="plus" data-plus="${l.id}" title="Ajouter les ${n} commande(s) sélectionnée(s)">+</button>` : ""}
        </a>`).join("")
      : `<div class="vide">aucun lot ouvert${n ? " — « + Créer un lot » y déposera la sélection" : ""}</div>`;

    // Liste conservée d'un échec réseau : elle est datée, on le dit. Sans cette mention, une
    // liste périmée se lit exactement comme une liste à jour.
    if (LOTS_PERIMES) $("#ssLots").insertAdjacentHTML("afterbegin",
      `<div class="vide" style="color:var(--ambre)">⚠ liste non rafraîchie — service injoignable</div>`);

    $("#ssLots").querySelectorAll("[data-l]").forEach((a) => a.onclick = (e) => {
      if (e.target.dataset.plus) return;
      S0.lot = S0.lot === a.dataset.l ? null : a.dataset.l;
      S0.vue = null; S0.page = 0; S.sel.clear();
      charger(); majStatuts(); majLots();
    });
    $("#ssLots").querySelectorAll("[data-plus]").forEach((b) => b.onclick = async (e) => {
      e.stopPropagation();
      const r = await api("/api/batches/add", { method: "POST",
        body: { batch_id: Number(b.dataset.plus), ids: [...S.sel] } });
      S.sel.clear();
      charger(); majLots(); rafraichirCompteurs();
    });
  }

  $("#ssNouveauLot").onclick = () => dialogue("Créer un lot", `
    <label class="champ"><span>Nom du lot</span>
      <input id="lnom" value="${esc(nomDeLotPropose())}"></label>
    <p class="doux">${S.sel.size
      ? `Les <b>${S.sel.size}</b> commande(s) sélectionnée(s) y seront déposées.`
      : "Le lot sera créé vide ; déposez-y des commandes avec le « + » du panneau gauche."}</p>`,
    async () => {
      await api("/api/batches/new", { method: "POST",
        body: { name: $("#lnom").value, ids: [...S.sel] } });
      S.sel.clear(); charger(); majLots(); rafraichirCompteurs();
    }, "Créer");

  async function chargerVues() {
    const d = await api(`/api/views?scope=orders&counts=1&status=${encodeURIComponent(S0.statut || "")}`);
    VUES_SAUV = d.views;
    majVues();
  }
  /**
   * Les vues vivent **au-dessus de la grille**, en onglets, et nulle part ailleurs.
   *
   * La description générique du produit (§2.2) place une section « Saved Filters » sous les
   * statuts dans le panneau gauche : c'est l'ancienne disposition. La capture réelle du
   * compte (§2.1 du fichier de configuration) montre un panneau gauche qui s'arrête aux
   * statuts, aux boutiques, aux alertes et aux lots ouverts. Deux endroits pour choisir une
   * vue, c'est un endroit de trop — le panneau gauche est le premier niveau de tri, les
   * onglets le second.
   */
  function majVues() {
    $("#ongVues").setAttribute("role", "tablist");
    $("#ongVues").innerHTML = `<button type="button" role="tab" class="ong ${!S0.vue ? "actif" : ""}" data-v=""
      aria-selected="${!S0.vue}">${STATUT_FR[S0.statut] || "Toutes"}</button>` +
      VUES_SAUV.slice(0, 12).map((v) => `<button type="button" role="tab" class="ong ${S0.vue === v.id ? "actif" : ""}" data-v="${v.id}" aria-selected="${S0.vue === v.id}"${
        v.notes ? ` title="${esc(v.notes)}"` : ""}>${esc(v.name)}${
        v.notes && v.notes.includes("vérifier") ? ' <span class="puce a">?</span>' : ""}${
        v.n != null ? ` <i>${num(v.n)}</i>` : ""}</button>`).join("") +
      (VUES_SAUV.length > 12 ? `<button type="button" class="ong" id="ongPlus">+${VUES_SAUV.length - 12}…</button>` : "") +
      `<button type="button" class="ong sauver" id="ongSave" title="Enregistrer les filtres et les colonnes actuels comme vue">+ Enregistrer la vue</button>`;

    document.querySelectorAll("#ongVues [data-v]").forEach((a) => {
      a.onclick = () => choisirVue(a.dataset.v);
      a.oncontextmenu = async (e) => {
        if (!a.dataset.v) return;
        e.preventDefault();
        const v = VUES_SAUV.find((x) => x.id == a.dataset.v);
        if (!confirm(`Supprimer la vue « ${v.name} » ?`)) return;
        await api("/api/views", { method: "POST", body: { id: v.id, delete: true } });
        if (S0.vue === v.id) S0.vue = null;
        chargerVues(); charger();
      };
    });
    const bs = $("#ongSave");
    if (bs) bs.onclick = enregistrerVue;
    const plus = $("#ongPlus");
    if (plus) plus.onclick = () => dialogue("Toutes les vues",
      `<div class="listeVues">${VUES_SAUV.map((v) => `<div class="lv" data-v="${v.id}"><b>${esc(v.name)}</b>
        <span class="n">${v.n != null ? num(v.n) : ""}</span>
        ${v.notes ? `<div class="doux">${esc(v.notes)}</div>` : ""}</div>`).join("")}</div>`,
      null, "Fermer", (c) => c.querySelectorAll("[data-v]").forEach((d) => d.onclick = () => { $("#dlg").close(); choisirVue(d.dataset.v); }));
  }

  /** Sélection d'une vue sauvegardée — appelée par les onglets, la sidebar et la pastille. */
  function choisirVue(id) {
    S0.vue = id ? Number(id) : null;
    S0.page = 0; S.sel.clear();
    const v = VUES_SAUV.find((x) => x.id === S0.vue);
    S0.colonnes = v && v.columns ? v.columns : null;
    charger(); majStatuts(); majVues();
  }

  function enregistrerVue() {
    dialogue("Enregistrer la vue", `
      <label class="champ"><span>Nom</span><input id="nv"></label>
      <p class="doux">Les filtres actifs et les colonnes visibles sont enregistrés ensemble, et
      partagés avec toute l'équipe. Modifier une vue existante la remplace — chez ShipStation
      cela en créait une nouvelle à chaque fois, d'où les 27 vues dont plusieurs datées.</p>`,
      async () => {
        const nom = $("#nv").value.trim(); if (!nom) return false;
        await api("/api/views", { method: "POST", body: {
          name: nom, scope: "orders", filters: lire(), columns: colonnesActives().map((c) => c.k) } });
        chargerVues();
      }, "Enregistrer");
  }

  // ---------------------------------------------------------- colonnes
  const colonnesActives = () => {
    const cles = S0.colonnes || COLONNES.filter((c) => c.defaut).map((c) => c.k);
    return cles.map((k) => COLONNES.find((c) => c.k === k)).filter(Boolean);
  };

  function gererColonnes() {
    const actives = colonnesActives().map((c) => c.k);
    dialogue("Colonnes", `
      <p class="doux">Cochez les colonnes à afficher, épinglez-en jusqu'à deux pour qu'elles
      restent visibles pendant le défilement horizontal. L'ordre suit celui de la liste.</p>
      <div class="cols">${COLONNES.map((c) => `<label class="ch col">
        <input type="checkbox" data-c="${c.k}" ${actives.includes(c.k) ? "checked" : ""}>
        <span>${esc(c.t)}</span>
        <button class="pin ${S0.epingles.includes(c.k) ? "on" : ""}" data-pin="${c.k}" title="Épingler">📌</button>
      </label>`).join("")}</div>`,
      async () => {
        S0.colonnes = COLONNES.filter((c) => $(`[data-c="${c.k}"]`).checked).map((c) => c.k);
        // Persistance côté serveur, attachée à la vue : chez ShipStation les colonnes se
        // réinitialisent parce qu'elles vivent côté navigateur.
        if (S0.vue) {
          const v = VUES_SAUV.find((x) => x.id === S0.vue);
          if (v) await api("/api/views", { method: "POST", body: { ...v, columns: S0.colonnes } });
        } else {
          await api("/api/settings", { method: "POST", body: { colonnes_commandes: S0.colonnes } });
        }
        charger();
      }, "Appliquer",
      (c) => c.querySelectorAll("[data-pin]").forEach((b) => b.onclick = (e) => {
        e.preventDefault();
        const k = b.dataset.pin;
        const i = S0.epingles.indexOf(k);
        if (i >= 0) S0.epingles.splice(i, 1);
        else { S0.epingles.push(k); if (S0.epingles.length > 2) S0.epingles.shift(); }
        c.querySelectorAll("[data-pin]").forEach((x) => x.classList.toggle("on", S0.epingles.includes(x.dataset.pin)));
      }));
  }

  // ------------------------------------------------------------- grille
  let LIGNES = [], dernierIndex = null;

  /**
   * Chargement de la grille — BUG-014, BUG-035.
   *
   * Un échec ne doit jamais laisser l'écran tel quel : avant ce correctif, un HTTP 500 suivi
   * de « ↻ Recharger » ne changeait rien, la grille gardait ses 250 lignes et le pied
   * annonçait toujours « 1–250 sur 474 ». On marque donc les données comme **périmées**, on
   * dit pourquoi, et on propose de réessayer — sans effacer ce qui est à l'écran, qui reste
   * la meilleure information disponible tant qu'on prévient qu'elle date.
   */
  // Course de rendu (BUG-085). Taper vite dans la recherche lance plusieurs requêtes ; si
  // la première revient après la seconde, la grille affiche un résultat périmé sous un
  // champ qui dit autre chose. Chaque chargement porte un numéro et seul le dernier peint ;
  // les précédents sont abandonnés côté réseau plutôt que laissés courir.
  let generation = 0, enCours = null;

  async function charger() {
    // L'écran a pu changer entre la frappe et l'échéance du minuteur anti-rebond : les
    // champs qu'on s'apprête à lire n'existent alors plus. On abandonne au lieu de lever.
    if (!$("#fq")) return;
    const ma = ++generation;
    if (enCours) enCours.abort();
    const ctrl = enCours = new AbortController();

    // Une vue sauvegardée est un **second niveau** de tri, pas un remplacement : elle
    // s'applique à l'intérieur du statut choisi à gauche. Sans cela, « Graines x1 » ramenait
    // aussi les commandes expédiées et annulées — ce que ShipStation ne fait jamais, puisque
    // le panneau gauche filtre d'abord et les onglets du haut affinent ensuite.
    // Une recherche rapide sort de la vue : garder `view_id` la ferait mentir sur sa portée.
    const f = (S0.vue && !S0.recherche) ? { ...lire(), view_id: S0.vue } : lire();
    const p = new URLSearchParams({ ...f, sort: S.tri, dir: S.dir,
      limit: S0.taille, offset: S0.page * S0.taille });

    const zone = $("#tbl");
    zone.setAttribute("aria-busy", "true");
    if (!LIGNES.length) zone.innerHTML = squelette(10);

    let d;
    try {
      d = await api("/api/orders?" + p, { signal: ctrl.signal });
    } catch (e) {
      // Une requête annulée n'est pas une panne : c'est nous qui l'avons abandonnée.
      if (e.name === "AbortError" || ma !== generation) return;
      zone.removeAttribute("aria-busy");
      marquerPerime(e);
      return;
    }
    if (ma !== generation || !$("#tbl")) return;   // demande dépassée, ou écran quitté
    enCours = null;
    zone.removeAttribute("aria-busy");
    // Répartition des résultats de recherche : le rail gauche s'en sert pour dire où ils
    // sont. Elle n'arrive qu'avec une recherche en cours ; sinon on l'oublie, pour ne pas
    // afficher les comptes de la recherche précédente sur la grille suivante.
    if (S0.recherche) { S0.repartition = d.repartition || null; S0.totalRecherche = d.total; majStatuts(); }
    else { S0.repartition = null; S0.totalRecherche = 0; }
    demarquerPerime();
    LIGNES = d.orders;
    // BUG-025 — la sélection survivait au changement de filtre : la grille montrait une
    // commande, le compteur en annonçait une autre, et le panneau de droite en configurait
    // une troisième, invisible. On signale explicitement ce qui est sélectionné hors vue,
    // avec le moyen de le vider.
    const visibles = new Set(LIGNES.map((o) => String(o.id)));
    S.selHorsVue = [...S.sel].filter((id) => !visibles.has(id));
    // Les flèches ‹ › de la fiche de commande naviguent dans CETTE liste, dans l'ordre où
    // elle est triée à l'écran — pas dans l'ordre des identifiants.
    S.cmdIds = LIGNES.map((o) => o.id);
    S.total = d.total;
    const vue = VUES_SAUV.find((x) => x.id === S0.vue);
    const lotA = LOTS.find((l) => String(l.id) === String(S0.lot));
    majEnteteEcran(lotA, vue);
    majBarreLot();
    dessiner(d);
    majPagination(d);
    majBandeauSelection(d);
    majActions();
    cote();
  }

  /** Bandeau « données périmées » : la grille reste lisible, mais elle cesse de faire foi. */
  function marquerPerime(e) {
    S0.perime = true;
    $("#tbl").classList.add("perime");
    let b = $("#bandPerime");
    if (!b) {
      b = el(`<div class="bandPerime" id="bandPerime" role="alert"></div>`);
      $("#tbl").before(b);
    }
    b.innerHTML = `<b>Ces données ne sont plus à jour.</b> ${esc(e.message)}
      <button type="button" id="bpR">Réessayer</button>`;
    $("#bpR").onclick = () => charger();
    // Le pied de page annonçait un total qui n'a plus cours : on le dit.
    const pg = $("#pag");
    if (pg) pg.classList.add("perime");
  }

  function demarquerPerime() {
    if (!S0.perime) return;
    S0.perime = false;
    $("#tbl").classList.remove("perime");
    $("#pag")?.classList.remove("perime");
    $("#bandPerime")?.remove();
  }

  /**
   * En-tête d'écran. En mode lot, ShipStation ne titre pas « Lot : X » : il affiche
   * « Label Batch: [X] » avec le nom en pastille, suivi de « Batch Notes: Add a note ».
   * La note du lot est une consigne d'atelier — « ne pas expédier avant lundi », « tout en
   * dépôt » — et elle doit se lire sans ouvrir quoi que ce soit.
   */
  function majEnteteEcran(lotA, vue) {
    const T = $("#titreE");
    // Un écran de résultats se nomme comme tel — BUG-042. L'ancien gardait le titre
    // « À expédier » au-dessus d'une liste qui ne respectait plus ce statut.
    if (S0.recherche && !lotA) {
      T.innerHTML = `Résultats pour « ${esc(S0.recherche)} »
        <span class="doux" style="font-weight:400;font-size:12.5px">— toutes les commandes, tous statuts</span>
        <button type="button" class="lienB" id="titreRetour">Revenir à la vue</button>`;
      $("#titreRetour").onclick = () => {
        S0.recherche = null;
        const q = $("#quick"); if (q) q.value = "";
        const f = $("#fq"); if (f) { f.value = ""; }
        S0.statut = "awaiting_shipment"; S0.page = 0;
        charger(); majLots();
      };
      return;
    }
    if (!lotA) {
      T.innerHTML = esc(vue ? vue.name : (STATUT_FR[S0.statut] || "Commandes"));
      return;
    }
    T.innerHTML = `<span class="etqT">Lot d'étiquettes :</span> <span class="lotChip">${esc(lotA.name)}</span>
      <span class="etqT">Notes du lot :</span> ${lotA.notes
        ? `<button type="button" class="lienNote" id="lotNote">${esc(lotA.notes)}</button>`
        : `<button type="button" class="lienNote" id="lotNote">Ajouter une note</button>`}`;
    $("#lotNote").onclick = () => dialogue(`Notes — ${lotA.name}`, `
      <label class="champ"><span>Note du lot</span><textarea id="lnT" rows="3">${esc(lotA.notes || "")}</textarea></label>
      <p class="doux">Visible par toute l'équipe en tête de l'écran du lot.</p>`,
      async () => {
        await api(`/api/batches/${lotA.id}/update`, { method: "POST", body: { notes: $("#lnT").value } });
        await chargerLots(); charger(); majLots();
      }, "Enregistrer");
  }

  const LIBELLE_GROUPE = { store: "Boutique", line_count: "Lignes", quantity: "Quantité",
    country: "Pays", item_name: "Article", item_sku: "SKU", requested_service: "Service demandé" };

  /** Clé de regroupement d'une commande, selon le « Group By » choisi. */
  function cleGroupe(o) {
    switch (S0.groupe) {
      case "store": return IDX.stores?.get(String(o.store_id))?.name || "—";
      case "line_count": return `${arts(o).length} ligne(s)`;
      case "quantity": return `${arts(o).reduce((n, i) => n + (i.quantity || 0), 0)} article(s)`;
      case "country": return o.ship_to?.country || "—";
      case "item_name": return arts(o)[0]?.name || "—";
      case "item_sku": return arts(o)[0]?.sku || "—";
      case "requested_service": return o.requested_service || "—";
      default: return null;
    }
  }

  /**
   * État vide — BUG-037.
   *
   * Deux situations que l'ancien écran confondait : « ce statut est vide » et « ce filtre ne
   * ramène rien ». La seconde proposait « Importer depuis Shopify », ce qui n'a aucun rapport
   * avec un filtre trop étroit. On rappelle donc le critère et on propose de l'effacer.
   */
  function etatVide() {
    const f = S0.f || {};
    const actifs = PASTILLES.filter((x) => x.resume(f)).map((x) => x.t);
    const q = $("#fq") && $("#fq").value.trim();
    const vue = VUES_SAUV.find((x) => x.id === S0.vue);
    const filtre = actifs.length || q || vue;

    // Une recherche qui ne trouve rien n'est pas un statut vide, et surtout pas une invitation
    // à importer : proposer « Importer depuis Shopify » sous une recherche infructueuse laisse
    // conclure que la commande n'existe pas, alors que le mot était peut-être mal orthographié.
    // On dit sur quoi on a cherché et où, et on rappelle qu'on a bien cherché partout.
    if (S0.recherche) return `<div class="vide2"><b>Aucune commande pour « ${esc(S0.recherche)} »</b>
      <div class="doux" style="max-width:52ch;margin:8px auto">Cherché sur <b>tout le compte</b>,
        tous statuts confondus — numéro de commande, client, courriel, adresse, SKU, nom
        d'article et numéro de suivi. Les accents et la casse sont ignorés.</div>
      <div class="doux" style="font-size:12px">Chaque mot doit apparaître : essayez avec moins de mots.</div>
      <button type="button" class="p" id="videEffacer">Effacer la recherche</button></div>`;

    if (!filtre) return `<div class="vide2"><b>Rien à expédier dans ce statut</b>
      <div class="doux">Les commandes arrivent par l'import de la boutique.</div>
      <button type="button" class="p" id="videImport">Importer depuis Shopify</button></div>`;

    return `<div class="vide2"><b>Aucun résultat pour ce filtre</b>
      <div class="doux">${vue ? `Vue « ${esc(vue.name)} »` : ""}${vue && (actifs.length || q) ? " · " : ""}${
        actifs.length ? esc(actifs.join(" · ")) : ""}${(vue || actifs.length) && q ? " · " : ""}${
        q ? `recherche « ${esc(q)} »` : ""}</div>
      <button type="button" class="p" id="videEffacer">Tout effacer</button></div>`;
  }

  function dessiner(d) {
    const cols = colonnesActives();
    const epingle = (k) => S0.epingles.includes(k) ? ` class="fig"` : "";
    const toutes = d.orders.length > 0 && d.orders.every((o) => S.sel.has(String(o.id)));
    // BUG-036 — sept colonnes sur douze n'ont pas de clé de tri et simulaient pourtant un tri :
    // le curseur changeait, le clic ne faisait rien. Seules les colonnes triables sont
    // annoncées comme telles, aux voyants comme aux lecteurs d'écran.
    const th = `<th scope="col" class="cx"><input type="checkbox" id="tout"${toutes ? " checked" : ""}
        aria-label="Tout sélectionner sur cette page"></th><th scope="col" class="cx"></th>` +
      cols.map((c) => {
        const triable = !!c.tri;
        const actif = triable && S.tri === c.tri;
        return `<th scope="col"${triable ? ` data-t="${c.tri}" class="triable${c.n ? " n" : ""}" tabindex="0" role="columnheader"` +
            ` aria-sort="${actif ? (S.dir === "asc" ? "ascending" : "descending") : "none"}"` +
            ` title="Trier par ${esc(c.t)}"` : `${c.n ? ' class="n"' : ""}`}${
          S0.epingles.includes(c.k) ? " data-fig=1" : ""}>${esc(c.t)}${
          actif ? (S.dir === "asc" ? " ▲" : " ▼") : ""}</th>`;
      }).join("");
    // Le regroupement suppose des lignes contiguës : on trie côté client sur la clé de groupe
    // avant de dessiner, sans toucher au tri de colonne choisi à l'intérieur d'un groupe.
    if (S0.groupe) d.orders.sort((a, b) => String(cleGroupe(a)).localeCompare(String(cleGroupe(b)), "fr"));
    let groupeCourant = null;
    const tr = d.orders.map((o) => {
      const drop = o.weight_g > 0 && o.weight_g < d.seuil;
      let enTeteGroupe = "";
      if (S0.groupe) {
        const g = cleGroupe(o);
        if (g !== groupeCourant) {
          groupeCourant = g;
          enTeteGroupe = `<tr class="grp"><td colspan="${cols.length + 2}">
            ${esc(LIBELLE_GROUPE[S0.groupe] || S0.groupe)} : <b>${esc(g)}</b></td></tr>`;
        }
      }
      return enTeteGroupe + `<tr data-id="${o.id}" class="${S.sel.has(String(o.id)) ? "sel" : ""}">
        <td class="cx"><input type="checkbox" data-id="${o.id}" ${S.sel.has(String(o.id)) ? "checked" : ""}
          aria-label="Sélectionner la commande ${esc(o.order_number)}"></td>
        <td class="cx">${arts(o).length > 1 ? `<button type="button" class="chev" data-x="${o.id}"
          aria-expanded="false" aria-label="Afficher les ${arts(o).length} articles">▸</button>` : ""}</td>
        ${cols.map((c) => `<td${c.n ? ' class="n"' : ""}${S0.epingles.includes(c.k) ? ' data-fig=1' : ""}>${c.r(o)}${
          c.k === "order_number" && drop ? ' <span class="puce v" title="Admissible au tarif de dépôt en bureau de poste">dépôt</span>' : ""}</td>`).join("")}
      </tr>`;
      // §6.3 réserve n° 2 — la sous-ligne des articles était rendue pour **chaque** commande
      // multi-articles, même repliée : 457 `<tr>` pour 250 commandes, 843 et 15 144 nœuds à
      // 500 par page. Elle est désormais construite au premier dépliage, à partir des données
      // déjà en mémoire. Une grille de 250 lignes rend 250 `<tr>`, pas 457.
    }).join("");

    $("#tbl").className = "grilleWrap" + (S0.dense ? " dense" : "");
    $("#tbl").innerHTML = d.orders.length
      ? `<table class="tblCmd">
           <caption class="visuellement-cache">${esc(S0.recherche
             ? `Résultats de recherche pour « ${S0.recherche} », ${d.total} commande(s)`
             : `${STATUT_FR[S0.statut] || "Commandes"}, ${d.total} commande(s)`)}</caption>
           <thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`
      : etatVide();

    const bi = $("#videImport"); if (bi) bi.onclick = () => importerShopify();
    const be = $("#videEffacer"); if (be) be.onclick = () => {
      S0.f = {}; S0.vue = null; S0.page = 0;
      // Effacer une recherche remet la file de travail, pas un écran sans statut : le champ
      // est vidé et son gestionnaire fait le reste, pour qu'il n'y ait qu'un seul chemin de
      // sortie de la recherche.
      const fq = $("#fq"); if (fq) { fq.value = ""; fq.dispatchEvent(new Event("input")); }
      const qk = $("#quick"); if (qk) qk.value = "";
      if (!S0.recherche) { dessinerFiltres(); charger(); majVues(); }
    };

    // Délégation : deux gestionnaires sur le conteneur, pas trois par ligne. À 1 000 lignes
    // le câblage individuel représentait l'essentiel du temps de rendu — la requête met
    // 200 ms, le DOM en mettait dix fois plus.
    const T = $("#tbl");
    // Un en-tête focalisable doit s'activer au clavier, sinon le `tabindex` ne fait que
    // piéger la tabulation sans rien offrir.
    T.onkeydown = (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const th = e.target.closest("th[data-t]");
      if (!th) return;
      e.preventDefault();
      th.click();
    };
    T.onclick = (e) => {
      const th = e.target.closest("th[data-t]");
      if (th) {
        const c = th.dataset.t; if (!c) return;
        S.tri === c ? (S.dir = S.dir === "asc" ? "desc" : "asc") : (S.tri = c, S.dir = "desc");
        return charger();
      }
      if (e.target.id === "tout") {
        d.orders.forEach((o) => e.target.checked ? S.sel.add(String(o.id)) : S.sel.delete(String(o.id)));
        // BUG-041 — cocher l'en-tête sélectionnait 250 lignes sur 474 en annonçant
        // « 250 sélectionnées », sans dire que 224 restaient dehors. Une mise à jour en
        // masse « sur tout » n'en traitait alors que 53 %.
        S.toutLeFiltre = false;
        return dessiner(d), majBandeauSelection(d), majActions(), cote();
      }
      const lien = e.target.closest("[data-cmd]");
      if (lien) { e.stopPropagation(); return detailCommande(Number(lien.dataset.cmd)); }
      const chev = e.target.closest("[data-x]");
      if (chev) {
        e.stopPropagation();
        let l = $(`[data-arts="${chev.dataset.x}"]`);
        if (!l) {
          // Première ouverture : on fabrique la ligne à partir de la commande en mémoire.
          const o = LIGNES.find((x) => String(x.id) === String(chev.dataset.x));
          if (!o) return;
          const rangee = chev.closest("tr");
          const nCol = rangee.children.length;
          // `insertAdjacentHTML` et non `el()` : un `<tr>` construit dans un `<div>` est
          // **jeté par le parseur HTML**, qui n'accepte une rangée que dans un contexte de
          // tableau. Ici le contexte est la rangée elle-même, donc l'analyse est correcte.
          rangee.insertAdjacentHTML("afterend", `<tr class="arts" data-arts="${o.id}"><td></td><td></td>
            <td colspan="${nCol}"><div class="artL">${arts(o).map((i) =>
              `<div><span class="sku">${esc(i.sku)}</span> ${esc(i.name)} <b>×${i.quantity}</b>
               ${i.warehouse_location ? `<span class="doux">· ${esc(i.warehouse_location)}</span>` : ""}</div>`).join("")}</div></td></tr>`);
          chev.textContent = "▾";
          chev.setAttribute("aria-expanded", "true");
          return;
        }
        l.hidden = !l.hidden;
        chev.textContent = l.hidden ? "▸" : "▾";
        chev.setAttribute("aria-expanded", String(!l.hidden));
        return;
      }
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      const id = tr.dataset.id;
      const i = LIGNES.findIndex((o) => String(o.id) === id);
      if (e.target.tagName === "INPUT") return basculer(id, i, e.shiftKey);
      if (e.ctrlKey || e.metaKey || e.shiftKey) return basculer(id, i, e.shiftKey);
      S.sel.clear(); S.sel.add(id);
      dernierIndex = i;   // ancre de la prochaine sélection de plage
      T.querySelectorAll("tr[data-id]").forEach((x) => x.classList.toggle("sel", x.dataset.id === id));
      T.querySelectorAll("tbody input[type=checkbox]").forEach((x) => x.checked = x.dataset.id === id);
      majActions(); cote();
    };
    T.ondblclick = (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (tr) detailCommande(Number(tr.dataset.id));
    };
  }

  function basculer(id, index, plage) {
    if (plage && dernierIndex != null) {
      const [a, b] = [Math.min(dernierIndex, index), Math.max(dernierIndex, index)];
      LIGNES.slice(a, b + 1).forEach((o) => S.sel.add(String(o.id)));
    } else {
      S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
      dernierIndex = index;
    }
    document.querySelectorAll("tr[data-id]").forEach((r) => r.classList.toggle("sel", S.sel.has(r.dataset.id)));
    document.querySelectorAll("tbody input[type=checkbox]").forEach((c) => c.checked = S.sel.has(String(c.dataset.id)));
    majActions(); cote();
    majLots();   // le « + » des lots n'existe que quand une sélection existe
  }

  function majPagination(d) {
    // Une page au-delà de la dernière donne un intervalle absurde (« 10 251–856 sur 856 »).
    // Le filtre a pu se resserrer entre-temps : on ramène la page dans les bornes et on
    // recharge, plutôt que d'afficher un compte qui ne veut rien dire.
    const pages = Math.max(1, Math.ceil(d.total / S0.taille));
    if (S0.page >= pages && S0.page > 0) { S0.page = pages - 1; return charger(); }
    const debut = S0.page * S0.taille;
    // Pagination complète : sans numéro de page saisissable ni nombre total de pages, aller
    // à la page 31 d'un arriéré coûte trente clics. ShipStation offre les deux, plus les
    // sauts aux extrémités et la taille 50 pour les petits écrans.
    $("#pag").innerHTML = `
      <span class="doux">${d.total ? `${num(debut + 1)}–${num(Math.min(debut + d.orders.length, d.total))} sur ${num(d.total)}`
        : "aucune commande"}</span>
      <button type="button" id="pDeb" title="Première page" aria-label="Première page" ${S0.page ? "" : "disabled"}>«</button>
      <button type="button" id="pPrec" ${S0.page ? "" : "disabled"}>← Précédent</button>
      <label class="pagN">page <input type="number" id="pNum" min="1" max="${pages}" value="${S0.page + 1}"
        aria-label="Numéro de page"> sur ${num(pages)}</label>
      <button type="button" id="pSuiv" ${debut + d.orders.length >= d.total ? "disabled" : ""}>Suivant →</button>
      <button type="button" id="pFin" title="Dernière page" aria-label="Dernière page" ${S0.page + 1 < pages ? "" : "disabled"}>»</button>
      <select id="pTaille" aria-label="Lignes par page">${[50, 100, 250, 500, 1000].map((n) =>
        // §6.3 réserve n° 2 — la taille 1 000 était proposée sans filet. La grille n'est pas
        // virtualisée : sur un parc plus gros que les 474 commandes actuelles, le rendu
        // devient bloquant. L'option le dit plutôt que de laisser découvrir le gel.
        `<option ${n === S0.taille ? "selected" : ""}${n >= 500
          ? ` title="Sans virtualisation, ${n} lignes rendent l'écran lent à peindre — à réserver aux exports et aux tris ponctuels"` : ""
        }>${n}${n >= 500 ? " ⚠" : ""}</option>`).join("")}</select>
      <span class="doux">par page</span>`;
    $("#pDeb").onclick = () => { S0.page = 0; charger(); };
    $("#pPrec").onclick = () => { S0.page--; charger(); };
    $("#pSuiv").onclick = () => { S0.page++; charger(); };
    $("#pFin").onclick = () => { S0.page = pages - 1; charger(); };
    $("#pNum").onchange = (e) => {
      const n = Math.min(Math.max(1, Number(e.target.value) || 1), pages);
      S0.page = n - 1; charger();
    };
    $("#pTaille").onchange = (e) => { S0.taille = Number(e.target.value); S0.page = 0; charger(); };
  }

  // ------------------------------------------------------- barre d'actions
  const A = $("#actions");
  // Ordre repris tel quel de ShipStation (§2.7) : Coter · Imprimer · Assigner · Étiqueter ·
  // Préréglage · Créer + imprimer l'étiquette · Autres actions. Le bouton Colonnes est à
  // l'extrémité droite de cette même barre, pas dans les filtres.
  // Ordre de la barre d'actions de la nouvelle disposition : le bouton vert en tête, puis
  // Coter, Imprimer, Préréglage, Assigner, Étiqueter, Nouvelle commande, Mise à jour en
  // masse, Lot, Autres actions. Grouper et Colonnes sont montés dans l'en-tête de l'écran.
  // Ordre repris à l'identique de la barre d'actions de ShipStation (§2.2) — la position
  // d'un bouton est de la mémoire musculaire : la déplacer coûte plus cher que tout le
  // reste de l'écran. « Préréglage » vit sous Mise à jour en masse et « Lot » sous Autres
  // actions, exactement comme là-bas.
  const BARRE_STANDARD = `
    <button id="aBuy" class="v" title="Créer et imprimer les étiquettes (S)">Créer + imprimer les étiquettes ▾</button>
    <button id="aRate" title="Coter la sélection (R)">Coter</button>
    <button id="aPrint">Imprimer ▾</button>
    <button id="aPrelever" title="Envoyer vers la file de prélèvement">Prêtes à prélever</button>
    <button id="aHold">Mettre en attente</button>
    <button id="aAssign">Assigner à ▾</button>
    <button id="aTag">Étiqueter ▾</button>
    <button id="aNouvelle">Nouvelle commande</button>
    <button id="aMasse">Mise à jour en masse ▾</button>
    <button id="aAlloc">Allouer ▾</button>
    <button id="aAutres">Autres actions ▾</button>
    <button id="aPreset" hidden></button>
    <button id="aLotB" hidden></button>
    <span class="nsel" id="nsel">aucune sélection</span>`;
  A.innerHTML = BARRE_STANDARD;

  /**
   * Les gestionnaires de la barre d'actions passent par un seul écouteur délégué. La barre
   * est remplacée entièrement quand on ouvre un lot ; recâbler bouton par bouton à chaque
   * bascule serait une source d'oublis silencieux — un bouton mort ne se voit pas.
   */
  const ACT = {};
  A.onclick = (e) => {
    const b = e.target.closest("button[id]");
    if (!b || !A.contains(b) || b.disabled) return;
    const fn = ACT[b.id];
    if (fn) { e.stopPropagation(); fn(e); }
  };
  const cablerActions = () => majActions();

  const ids = () => [...S.sel];

  /**
   * Périmètre exact d'une action en masse — BUG-025, troisième volet.
   *
   * « 12 commandes sélectionnées » ne suffit pas quand trois d'entre elles ne sont plus à
   * l'écran : l'opérateur croit agir sur ce qu'il voit. Chaque boîte de confirmation
   * rappelle donc combien de commandes elle touche, et combien sont invisibles.
   */
  function mentionPortee() {
    const n = S.sel.size, hors = (S.selHorsVue || []).length;
    return `<p class="${hors ? "avis" : "doux"}">Portée : <b>${num(n)}</b> commande${n > 1 ? "s" : ""}` +
      (hors ? `, dont <b>${num(hors)}</b> non affichée${hors > 1 ? "s" : ""} par le filtre courant.` : ".") + "</p>";
  }
  /**
   * Barre d'actions du lot (§ écran Batch de ShipStation). Un lot ouvert n'est pas une
   * grille de commandes filtrée : c'est un poste de travail. La barre change donc
   * entièrement — « Traiter les expéditions » en tête, et les actions propres au lot
   * (retirer, arrêter le prélèvement, annuler le lot, scanner pour ajouter).
   */
  function majBarreLot() {
    const lotA = LOTS.find((l) => String(l.id) === String(S0.lot));
    if (!lotA) { A.innerHTML = BARRE_STANDARD; cablerActions(); return; }
    A.innerHTML = `
      <button id="bTraiter" class="v">Traiter les expéditions</button>
      <button id="bTraiterM">▾</button>
      <button id="aPrint">Imprimer ▾</button>
      <button id="aTag">Étiqueter ▾</button>
      <button id="aMasse">Mise à jour en masse ▾</button>
      <button id="bRetirer">Retirer du lot</button>
      <button id="aPrelever">Prêtes à prélever</button>
      <button id="bStopPick">Arrêter le prélèvement</button>
      <button id="bAnnulerLot">Annuler le lot</button>
      <button id="bScanAdd">Scanner pour ajouter</button>
      <button id="bScanCmd">Scanner les commandes</button>
      <button id="bExport">Exporter les commandes</button>
      <button id="aPreset" hidden></button><button id="aLotB" hidden></button>
      <button id="aBuy" hidden></button><button id="aRate" hidden></button>
      <button id="aAssign" hidden></button><button id="aNouvelle" hidden></button>
      <button id="aAlloc" hidden></button><button id="aHold" hidden></button>
      <button id="aAutres" hidden></button>
      <span class="nsel" id="nsel">aucune sélection</span>`;
    cablerActions();

    ACT.bTraiter = () => revueDesCouts(lotA);
    ACT.bTraiterM = (e) => { e.stopPropagation(); menuAncre($("#bTraiterM"), [
      { t: "Traiter et imprimer", f: () => revueDesCouts(lotA) },
      { t: "Simuler sans acheter", f: simulerLot },
    ]); };
    ACT.bRetirer = async () => {
      if (!S.sel.size) return alert("Sélectionner au moins une commande.");
      await api("/api/batches/remove", { method: "POST", body: { ids: ids() } });
      S.sel.clear(); charger(); majLots();
    };
    ACT.bStopPick = async () => {
      await api("/api/orders/bulk", { method: "POST",
        body: { ids: S.sel.size ? ids() : LIGNES.map((o) => String(o.id)), champs: { picking_status: "" } } });
      S.sel.clear(); charger();
    };
    ACT.bAnnulerLot = () => dialogue(`Annuler le lot « ${lotA.name} »`, `
      <div class="avis">Les ${num(S.total || 0)} commandes sortiront du lot et le lot sera
        supprimé. Les commandes elles-mêmes ne sont pas touchées.</div>`,
      async () => {
        const r = await api(`/api/batches/${lotA.id}/cancel`, { method: "POST" });
        S0.lot = null; S.sel.clear();
        await chargerLots(); charger(); majLots(); majStatuts();
        return r;
      }, "Annuler le lot");
    ACT.bScanAdd = () => aller("scan");
    ACT.bScanCmd = () => aller("scan");
    ACT.bExport = () => window.open(
      `/api/export/orders?ids=${(S.sel.size ? ids() : LIGNES.map((o) => o.id)).join(",")}`, "_blank");
  }

  /**
   * « Label Batch Status: Cost Review » — l'écran que ShipStation impose avant d'acheter.
   * Une carte par compte transporteur, le détail par service, les frais additionnels
   * dépliables, puis le bloc vert : date d'expédition, coût d'affranchissement et **montant
   * réellement facturé**. Les deux derniers diffèrent quand on affranchit sur son propre
   * compte — c'est exactement le cas de Lasclay chez Postes Canada.
   */
  async function revueDesCouts(lotA) {
    const cmdIds = LIGNES.map((o) => String(o.id));
    if (!cmdIds.length) return alert("Ce lot est vide.");
    attendre("Calcul des tarifs du lot");
    let r;
    try { r = await api("/api/batches/preview", { method: "POST", body: { ids: cmdIds } }); }
    catch (e) { $("#dlg").close(); return dialogue("Cotation impossible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }
    $("#dlg").close();

    const demain = new Date().toISOString().slice(0, 10);
    const cartes = (r.cartes || []).map((c) => `
      <div class="crCarte">
        <div class="crT"><b>${esc(c.nom)}</b>${c.compte ? ` <span class="doux">(${esc(c.compte)})</span>` : ""}</div>
        ${c.services.map((s) => `<div class="crL"><span>${esc(s.nom)}${
          s.n > 1 ? ` <span class="doux">× ${s.n}</span>` : ""}</span><b>${money(s.montant)}</b></div>`).join("")}
        ${c.frais ? `<details class="crF"><summary>Frais additionnels<b>${money(c.frais)}</b></summary>
          <div class="doux">Surcharges transporteur — carburant, zone étendue, dimensions.</div></details>` : ""}
        <div class="crL crTot"><span>Sous-total d'affranchissement</span><b>${money(c.total)}</b></div>
        ${c.facture_ici ? "" : `<div class="crNote">Affranchi sur votre compte — ${esc(c.nom)} vous facture directement.</div>`}
      </div>`).join("");

    dialogue(`État du lot : révision des coûts`, `
      ${r.bloquees ? `<div class="avis">${r.bloquees} commande(s) ne peuvent pas être cotées et
        seront ignorées. Voir « Simuler le lot » pour le détail.</div>` : ""}
      ${cartes || '<p class="doux">Aucun tarif disponible.</p>'}
      <div class="crVert">
        <label class="champ enLigne"><span>Date d'expédition prévue</span>
          <input type="date" id="crDate" value="${demain}"></label>
        <div class="crL"><span>Coût d'affranchissement transporteur</span><b>${money(r.total)}</b></div>
        <div class="crL crTot"><span>Total à facturer</span><b>${money(r.a_facturer)}</b></div>
      </div>`,
      async () => {
        if (!S.config.etiquettes_actives) {
          alert("Achat d'étiquettes désactivé sur ce service — la révision des coûts reste disponible.");
          return false;
        }
        const res = await api(`/api/batches/${lotA.id}/process`, { method: "POST",
          body: { ids: cmdIds, ship_date: $("#crDate").value } });
        if (res.error) { alert(res.error); return false; }
        window.open(`/api/labels?batch_id=${lotA.id}`, "_blank");
        await chargerLots(); charger(); majLots(); rafraichirCompteurs();
      }, "Continuer");
  }

  /**
   * Bandeau de sélection inter-pages — BUG-041.
   *
   * ShipStation dit : « 250 orders are selected. Select all 427 orders in Awaiting Shipment. »
   * Le clone disait « 250 sélectionnées » et s'arrêtait là. La phrase manquante n'est pas un
   * confort : sans elle, l'opérateur croit agir sur son filtre entier.
   */
  function majBandeauSelection(d) {
    const zone = $("#selTout");
    if (!zone) return;
    const page = d.orders.length;
    const reste = (d.total || 0) - page;
    const toutCoche = page > 0 && d.orders.every((o) => S.sel.has(String(o.id)));
    if (!toutCoche || reste <= 0) { zone.innerHTML = ""; S.toutLeFiltre = false; return; }
    zone.innerHTML = S.toutLeFiltre
      ? `<b>Les ${num(d.total)} commandes du filtre sont sélectionnées.</b>
         <button type="button" class="lienB" id="selAnnuler">Ne garder que les ${num(page)} affichées</button>`
      : `Les <b>${num(page)}</b> commandes de cette page sont sélectionnées.
         <button type="button" class="lienB" id="selTous">Sélectionner les ${num(d.total)} du filtre</button>`;
    const t = $("#selTous"), a = $("#selAnnuler");
    if (t) t.onclick = async () => {
      // On demande les identifiants au serveur : cocher « tout » doit vouloir dire tout,
      // pas « tout ce que la page a chargé ».
      // Une recherche rapide sort de la vue : garder `view_id` la ferait mentir sur sa portée.
    const f = (S0.vue && !S0.recherche) ? { ...lire(), view_id: S0.vue } : lire();
      const r = await api("/api/orders/ids?" + new URLSearchParams({ ...f, sort: S.tri, dir: S.dir }));
      S.sel = new Set(r.ids.map(String));
      S.toutLeFiltre = true;
      // Un plafond qui ne se dit pas ferait croire à une sélection complète : c'est
      // exactement le défaut qu'on est en train de corriger.
      if (r.tronque) toast(`Sélection plafonnée à ${num(r.tronque)} commandes sur ${num(r.total)}.`);
      S.selHorsVue = r.ids.filter((id) => !d.orders.some((o) => o.id === id)).map(String);
      majBandeauSelection(d); majActions(); cote();
    };
    if (a) a.onclick = () => {
      S.sel = new Set(d.orders.map((o) => String(o.id)));
      S.toutLeFiltre = false; S.selHorsVue = [];
      majBandeauSelection(d); majActions(); cote();
    };
  }

  const majActions = () => {
    const n = S.sel.size;
    const hors = (S.selHorsVue || []).length;
    $("#nsel").innerHTML = n
      ? `${n} sélectionnée${n > 1 ? "s" : ""}` +
        (hors ? ` <span class="puce a" title="Sélectionnées mais absentes de la vue courante">dont ${hors} hors vue</span>
                 <button type="button" class="lienB" id="nselVider">vider</button>` : "")
      : "aucune sélection";
    const bv = $("#nselVider");
    if (bv) bv.onclick = () => { S.sel.clear(); S.selHorsVue = []; charger(); };
    // « Autres actions » reste ouvrable sans sélection : ses entrées globales — importer,
    // exporter, scanner, préréglages — sont justement ce dont on a besoin sur un écran vide.
    ["aRate", "aPreset", "aPrint", "aTag", "aAssign", "aBuy", "aMasse", "aLotB",
     "aPrelever", "aHold", "aAlloc"]
      .forEach((i) => { const b = $("#" + i); if (b) b.disabled = !n; });
    const e = etatAchat();
    const b = $("#aBuy");
    if (b) { b.disabled = !n || !e.ok; b.title = !n ? "Sélectionner au moins une commande" : (e.motif || ""); }
  };
  $("#aCols").onclick = gererColonnes;
  $("#btRecharger").onclick = () => { charger(); majLots(); rafraichirCompteurs(); };
  const poserPanneau = (visible) => {
    document.body.classList.toggle("sansPanneau", !visible);
    localStorage.setItem("clone.panneau", visible ? "1" : "0");
  };
  $("#btPanneau").onchange = (e) => poserPanneau(e.target.checked);
  poserPanneau(localStorage.getItem("clone.panneau") !== "0");
  /**
   * Recherche avancée — six champs contre dix chez ShipStation, et pas de réinitialisation.
   *
   * Manquaient `Statut`, `Boutique`, `Article` et `Option d'article` : chercher « toutes les
   * commandes annulées de LAS Etsy contenant des mitaines » était impossible. Le bouton
   * `Réinitialiser` manquait aussi — sans lui, on ferme la boîte et on recommence.
   */
  $("#ssAvance").onclick = () => {
    const av = S0.avance || {};
    dialogue("Recherche avancée", `
    <p class="doux">La recherche rapide cherche « commence par » sur le numéro, le client, le
      courriel, la ville et les SKU. Ici, chaque champ cherche « contient », et les champs se
      cumulent.</p>
    <div class="grille">
      <label class="champ"><span>Numéro de commande</span><input id="raN" value="${esc(av.order_number || "")}"></label>
      <label class="champ"><span>Destinataire</span><input id="raD" value="${esc(av.destinataire || "")}"></label>
      <label class="champ"><span>Courriel</span><input id="raC" value="${esc(av.courriel || "")}"></label>
      <label class="champ"><span>SKU</span><input id="raS" value="${esc(av.sku || "")}"></label>
      <label class="champ"><span>Article (nom)</span><input id="raI" value="${esc(av.item_name || "")}"></label>
      <label class="champ"><span>Option d'article</span><input id="raO" value="${esc(av.item_option || "")}"></label>
      <label class="champ"><span>Statut</span><select id="raT">
        <option value="">— tous —</option>
        ${(S.refs.statuts || []).map(x => `<option value="${esc(x)}"${av.status === x ? " selected" : ""}>${esc(STATUT_FR[x] || x)}</option>`).join("")}
      </select></label>
      <label class="champ"><span>Boutique</span><select id="raB2">
        <option value="">— toutes —</option>
        ${(S.refs.stores || []).filter(x => x.active).map(x => `<option value="${x.id}"${String(av.store_id) === String(x.id) ? " selected" : ""}>${esc(x.name)}</option>`).join("")}
      </select></label>
      <label class="champ"><span>Commandée depuis</span><input type="date" id="raA" value="${esc(av.date_from || "")}"></label>
      <label class="champ"><span>Commandée jusqu'au</span><input type="date" id="raB" value="${esc(av.date_to || "")}"></label>
    </div>
    <div class="barre" style="margin-top:8px">
      <button type="button" id="raReset">Réinitialiser</button>
      <span class="doux">efface les dix champs et sort de la recherche avancée</span>
    </div>`,
    async () => {
      S0.avance = {
        order_number: $("#raN").value.trim(), destinataire: $("#raD").value.trim(),
        courriel: $("#raC").value.trim(), sku: $("#raS").value.trim(),
        item_name: $("#raI").value.trim(), item_option: $("#raO").value.trim(),
        status: $("#raT").value, store_id: $("#raB2").value,
        date_from: $("#raA").value, date_to: $("#raB").value,
      };
      // Un objet vide ne doit pas rester accroché : sinon l'écran reste « en recherche
      // avancée » sans qu'aucun critère ne s'applique.
      if (!Object.values(S0.avance).some((v) => v)) S0.avance = null;
      S0.page = 0; charger();
    }, "Chercher",
    (c) => { c.querySelector("#raReset").onclick = (e) => {
      e.preventDefault();
      c.querySelectorAll("input").forEach((i) => { i.value = ""; });
      c.querySelectorAll("select").forEach((x) => { x.value = ""; });
      S0.avance = null; S0.page = 0;
      $("#dlg").close(); charger();
    }; });
  };
  ACT.aNouvelle = () => nouvelleCommande();
  /**
   * « Bulk Update » (§2.3) : deux intertitres non cliquables — Commande, Expédition — et les
   * vingt-et-un champs modifiables en masse, dans l'ordre de ShipStation. Ceux qui ne sont
   * pas encore branchés le disent au lieu de disparaître : une entrée absente se cherche,
   * une entrée grisée s'explique.
   */
  ACT.aMasse = () => menuFlottant("aMasse", [
    { titre: "Commande" },
    { t: "Date limite d'expédition…", f: () => champEnMasse("ship_by_date", "Date limite d'expédition", "date") },
    { t: "Ajouter une note…", f: () => champEnMasse("internal_notes", "Note interne", "texte") },
    { t: "Appliquer un préréglage d'expédition…", f: menuPreset },
    { t: "Champ perso 1…", f: () => champEnMasse("custom_field1", "Champ personnalisé 1") },
    { t: "Champ perso 2…", f: () => champEnMasse("custom_field2", "Champ personnalisé 2") },
    { t: "Champ perso 3…", f: () => champEnMasse("custom_field3", "Champ personnalisé 3") },
    { titre: "Expédition" },
    { t: "Service…", f: configurerEnMasse },
    { t: "Compte d'expédition…", f: () => champEnMasse("shipping_account", "Compte d'expédition", "choix",
        [["", "—"], ["my_account", "Mon compte"], ["third_party", "Tiers"], ["recipient", "Destinataire"]]) },
    { t: "Colis…", f: configurerEnMasse },
    { t: "Poids…", f: () => champEnMasse("weight_g", "Poids (g)", "nombre") },
    { t: "Dimensions…", f: configurerEnMasse },
    { t: "Expédié de…", f: () => champEnMasse("warehouse_id", "Expédié de", "choix",
        [["", "—"], ...(S.refs.warehouses || []).map((w) => [String(w.id), w.name])]) },
    { t: "Assurance…", f: configurerEnMasse },
    { t: "Confirmation…", f: () => champEnMasse("confirmation", "Confirmation", "choix",
        [["", "—"], ...(S.refs.confirmations || []).map((c) => [String(c.id), c.nom])]) },
    { t: "Ne pas notifier la boutique", f: () => champEnMasse("do_not_notify", "Ne pas notifier la boutique", "oui_non") },
    { t: "Modèle de courriel…", f: () => aller("gabarits") },
    { t: "Modèle de bordereau…", f: () => aller("gabarits") },
    { t: "Autres options d'expédition…", f: configurerEnMasse },
    { t: "Déclarations de douane…", f: () => aller("douanes") },
    { t: "Identifiants fiscaux…", f: () => aller("douanes") },
    { t: "Prépayer droits et taxes", f: () => champEnMasse("prepay_duties", "Prépayer droits et taxes", "oui_non") },
    { sep: 1 },
    { t: "Rejouer l'automatisation", f: () => rejouerAutomatisation(false) },
  ]);

  /** Édition en masse d'un champ unique — le geste le plus fréquent du menu ci-dessus. */
  function champEnMasse(champ, libelle, type = "texte", options = []) {
    const n = S.sel.size;
    const saisie = type === "date" ? '<input type="date" id="bmV">'
      : type === "nombre" ? '<input type="number" id="bmV">'
      : type === "oui_non" ? '<select id="bmV"><option value="1">Oui</option><option value="">Non</option></select>'
      : type === "choix" ? `<select id="bmV">${options.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("")}</select>`
      : '<input id="bmV">';
    dialogue(`${libelle} — ${n} commande${n > 1 ? "s" : ""}`,
      `<label class="champ"><span>${esc(libelle)}</span>${saisie}</label>
       <p class="doux">La valeur remplace celle des ${n} commandes sélectionnées. Vider le champ
       efface la valeur existante.</p>${mentionPortee()}`,
      async () => {
        await api("/api/orders/bulk", { method: "POST",
          body: { ids: ids(), champs: { [champ]: $("#bmV").value } } });
        S.sel.clear(); charger();
      }, "Appliquer");
  }
  ACT.aLotB = (e) => { e.stopPropagation(); menuLots($("#aLotB"), ids(), () => { charger(); majLots(); }); };
  // « Group By » de l'onglet À expédier : les sept regroupements documentés (§2.3.3).
  $("#aGroupe").onclick = () => menuFlottant("aGroupe", [
    { t: "Aucun regroupement", f: () => { S0.groupe = null; charger(); } },
    ...[["store", "Boutique"], ["line_count", "Nombre de lignes"], ["quantity", "Quantité"],
        ["country", "Pays"], ["item_name", "Article"], ["item_sku", "SKU"],
        ["requested_service", "Service demandé"]]
      .map(([k, t]) => ({ t, f: () => { S0.groupe = k; charger(); } })),
  ]);

  const menuFlottant = (bouton, entrees) => menuAncre($("#" + bouton), entrees);

  ACT.aRate = async () => {
    const id = Number(ids()[0]);
    attendre("Cotation");
    try {
      const r = await api("/api/shipments/quote", { method: "POST", body: { order_id: id } });
      dialogue("Tarifs", tableauTarifs(r), null, "Fermer");
    } catch (e) { dialogue("Cotation impossible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }
  };

  const menuPreset = () => menuAncre($("#aMasse"), [
    ...(S.refs.presets || []).map((p) => ({ t: `${p.name}${p.hotkey ? "" : ""}`, hk: p.hotkey || "",
      f: async () => { await api("/api/presets/apply", { method: "POST", body: { preset_id: p.id, ids: ids() } }); charger(); } })),
    { sep: 1 }, { t: "Gérer les préréglages…", f: () => aller("prereglages") },
  ]);
  ACT.aPreset = menuPreset;

  /**
   * « Imprimer ▾ » — trois entrées étaient toujours actives quel que soit le contexte.
   *
   * `Étiquette` proposait d'imprimer une étiquette qui n'existe pas, et `Formulaires de
   * douane` un formulaire pour une commande domestique. ShipStation grise ces entrées selon
   * le contexte ; ici elles disent en plus **pourquoi** elles sont grisées.
   */
  ACT.aPrint = () => {
    const sel = LIGNES.filter((o) => S.sel.has(String(o.id)));
    const avecEtiquette = sel.some((o) => (o.n_shipments || 0) > 0);
    const international = sel.some((o) => (o.ship_to || {}).country && o.ship_to.country !== "CA");
    return menuFlottant("aPrint", [
    { t: "Étiquette", inactif: avecEtiquette ? null : "Aucune étiquette achetée sur la sélection",
