<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog — clone ShipStation</title>
<style>
  :root {
    --bg:#f6f7f9; --carte:#fff; --bord:#dfe3e8; --texte:#1b1f24; --doux:#6b7280;
    --accent:#1a56db; --vert:#0b7a4b; --ambre:#a15c07; --sel:#eef4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --carte:#1c2024; --bord:#2c3238; --texte:#e6e8eb; --doux:#9aa3ad;
            --accent:#5b8cf5; --vert:#3dc98a; --ambre:#e0a33e; --sel:#1e2a42; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--texte) }
  header { padding:12px 18px; background:var(--carte); border-bottom:1px solid var(--bord);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap }
  h1 { font-size:16px; margin:0; font-weight:650 }
  .stat { color:var(--doux); font-size:13px }
  .stat b { color:var(--texte) }
  .pastille { background:var(--vert); color:#fff; border-radius:10px; padding:1px 8px; font-size:12px; font-weight:600 }
  main { padding:14px 18px 40px }
  .barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px }
  input, select, button { font:inherit; padding:6px 9px; border:1px solid var(--bord);
                          border-radius:6px; background:var(--carte); color:var(--texte) }
  input[type=search] { min-width:230px }
  button { cursor:pointer }
  button.primaire { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button:disabled { opacity:.5; cursor:not-allowed }
  .vues { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center }
  .onglet { padding:5px 11px; border:1px solid var(--bord); border-radius:14px;
            background:var(--carte); cursor:pointer; font-size:13px }
  .onglet.actif { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  .tableau { background:var(--carte); border:1px solid var(--bord); border-radius:8px; overflow:auto; max-height:70vh }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  th { position:sticky; top:0; background:var(--carte); border-bottom:1px solid var(--bord);
       text-align:left; padding:8px 10px; font-weight:600; cursor:pointer; white-space:nowrap; z-index:2 }
  th:hover { color:var(--accent) }
  td { padding:7px 10px; border-bottom:1px solid var(--bord); white-space:nowrap }
  tr.selectionnee td { background:var(--sel) }
  td.num, th.num { text-align:right }
  .puce { font-size:11px; padding:1px 7px; border-radius:9px; font-weight:600; display:inline-block }
  .puce.drop { background:rgba(11,122,75,.14); color:var(--vert) }
  .puce.hold { background:rgba(161,92,7,.16); color:var(--ambre) }
  .doux { color:var(--doux) }
  .avis { padding:9px 12px; border-radius:7px; margin-bottom:10px; font-size:13px;
          background:rgba(161,92,7,.12); color:var(--ambre); border:1px solid rgba(161,92,7,.3) }
  dialog { border:1px solid var(--bord); border-radius:10px; background:var(--carte);
           color:var(--texte); padding:0; max-width:560px; width:92vw }
  dialog h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--bord); font-size:15px }
  dialog .corps { padding:14px 16px }
  dialog .pied { padding:10px 16px; border-top:1px solid var(--bord); display:flex; gap:8px; justify-content:flex-end }
  dialog::backdrop { background:rgba(0,0,0,.45) }
</style>
</head>
<body>
<header>
  <h1>Backlog</h1>
  <span class="stat" id="compteur">chargement…</span>
  <span class="stat" id="infoDrop"></span>
  <span class="stat" id="infoCache"></span>
  <span style="flex:1"></span>
  <button id="btnRafraichir">Rafraîchir</button>
</header>

<main>
  <div id="avisEcritures"></div>

  <div class="vues" id="vues"></div>

  <div class="barre">
    <input type="search" id="recherche" placeholder="N° commande, client, courriel, ville, SKU…">
    <select id="statut">
      <option value="">Tous statuts</option>
      <option value="awaiting_shipment">À expédier</option>
      <option value="on_hold">En attente</option>
      <option value="awaiting_payment">Paiement attendu</option>
    </select>
    <select id="dropOff">
      <option value="">Drop-off : tous</option>
      <option value="oui">Admissibles (&lt; 500 g)</option>
      <option value="non">Non admissibles</option>
    </select>
    <select id="pays"><option value="">Tous pays</option></select>
    <input type="number" id="poidsMin" placeholder="poids min (g)" style="width:130px">
    <input type="number" id="poidsMax" placeholder="poids max (g)" style="width:130px">
    <input type="number" id="ageMin" placeholder="âge min (j)" style="width:115px">
    <label class="stat"><input type="checkbox" id="sansPoids"> sans poids</label>
    <button id="btnReset">Réinitialiser</button>
    <button id="btnSauverVue">Sauvegarder la vue…</button>
  </div>

  <div class="barre">
    <span class="stat" id="selection">aucune sélection</span>
    <button id="btnCoter" disabled>Coter</button>
    <button id="btnHold" disabled>Mettre en attente…</button>
    <button id="btnRestaurer" disabled>Remettre en file</button>
  </div>

  <div class="tableau">
    <table>
      <thead><tr id="entetes"></tr></thead>
      <tbody id="corps"></tbody>
    </table>
  </div>
</main>

<dialog id="dlg">
  <h3 id="dlgTitre"></h3>
  <div class="corps" id="dlgCorps"></div>
  <div class="pied">
    <button id="dlgAnnuler">Annuler</button>
    <button class="primaire" id="dlgOk">Confirmer</button>
  </div>
</dialog>

<script>
const COLONNES = [
  { cle:"orderNumber", titre:"Commande" },
  { cle:"age",         titre:"Âge (j)", num:true },
  { cle:"client",      titre:"Client" },
  { cle:"ville",       titre:"Ville" },
  { cle:"province",    titre:"Prov." },
  { cle:"pays",        titre:"Pays" },
  { cle:"poidsG",      titre:"Poids (g)", num:true },
  { cle:"articles",    titre:"Art.", num:true },
  { cle:"total",       titre:"Total", num:true },
  { cle:"serviceDemande", titre:"Service demandé" },
  { cle:"statut",      titre:"Statut" },
];

let etat = { tri:"age", sens:"desc", donnees:[], selection:new Set(), config:{}, vueActive:null };

const $ = (id) => document.getElementById(id);
const filtres = () => ({
  recherche:$("recherche").value, statut:$("statut").value, dropOff:$("dropOff").value,
  pays:$("pays").value, poidsMin:$("poidsMin").value, poidsMax:$("poidsMax").value,
  ageMin:$("ageMin").value, sansPoids:$("sansPoids").checked ? "1" : "",
});
const appliquerFiltres = (f) => {
  $("recherche").value=f.recherche||""; $("statut").value=f.statut||""; $("dropOff").value=f.dropOff||"";
  $("pays").value=f.pays||""; $("poidsMin").value=f.poidsMin||""; $("poidsMax").value=f.poidsMax||"";
  $("ageMin").value=f.ageMin||""; $("sansPoids").checked=f.sansPoids==="1";
};

async function charger(rafraichir) {
  const p = new URLSearchParams({ ...filtres(), tri:etat.tri, sens:etat.sens });
  if (rafraichir) p.set("rafraichir","1");
  $("compteur").textContent = "chargement…";
  const r = await fetch("/api/commandes?" + p).then((r) => r.json());
  if (r.error) { $("compteur").textContent = "erreur : " + r.error; return; }
  etat.donnees = r.commandes;
  etat.selection.clear();
  $("compteur").innerHTML = `<b>${r.filtrees}</b> commandes affichées sur ${r.total} au backlog`;
  $("infoDrop").innerHTML = `<span class="pastille">${r.dropOffAdmissibles} drop-off</span>`;
  $("infoCache").textContent = `données d'il y a ${r.chargeIlYaS}s`;
  remplirPays();
  dessiner();
}

function remplirPays() {
  const sel = $("pays"), courant = sel.value;
  const pays = [...new Set(etat.donnees.map((c) => c.pays).filter(Boolean))].sort();
  if (sel.options.length - 1 !== pays.length) {
    sel.innerHTML = '<option value="">Tous pays</option>' + pays.map((p) => `<option>${p}</option>`).join("");
    sel.value = courant;
  }
}

function dessiner() {
  $("entetes").innerHTML = '<th style="width:28px"></th>' + COLONNES.map((c) =>
    `<th class="${c.num?'num':''}" data-cle="${c.cle}">${c.titre}${etat.tri===c.cle?(etat.sens==="asc"?" ▲":" ▼"):""}</th>`).join("");
  $("entetes").querySelectorAll("th[data-cle]").forEach((th) => th.onclick = () => {
    const cle = th.dataset.cle;
    if (etat.tri === cle) etat.sens = etat.sens === "asc" ? "desc" : "asc"; else { etat.tri = cle; etat.sens = "desc"; }
    charger();
  });

  $("corps").innerHTML = etat.donnees.map((c) => {
    const cells = COLONNES.map((col) => {
      let v = c[col.cle];
      if (col.cle === "total" && v != null) v = v.toFixed(2) + " $";
      if (col.cle === "poidsG") v = v ? v : '<span class="doux">—</span>';
      if (col.cle === "orderNumber") {
        v = `${v}${c.dropOffAdmissible ? ' <span class="puce drop">drop</span>' : ""}` +
            `${c.holdJusqua ? ` <span class="puce hold">→ ${String(c.holdJusqua).slice(0,10)}</span>` : ""}`;
      }
      return `<td class="${col.num?'num':''}">${v ?? '<span class="doux">—</span>'}</td>`;
    }).join("");
    return `<tr data-id="${c.orderId}"><td><input type="checkbox" data-id="${c.orderId}"></td>${cells}</tr>`;
  }).join("");

  $("corps").querySelectorAll('input[type=checkbox]').forEach((cb) => cb.onchange = () => {
    const id = Number(cb.dataset.id);
    cb.checked ? etat.selection.add(id) : etat.selection.delete(id);
    cb.closest("tr").classList.toggle("selectionnee", cb.checked);
    majSelection();
  });
  majSelection();
}

function majSelection() {
  const n = etat.selection.size;
  $("selection").textContent = n ? `${n} sélectionnée${n>1?"s":""}` : "aucune sélection";
  $("btnCoter").disabled = n !== 1;
  $("btnHold").disabled = !n || !etat.config.ecrituresActives;
  $("btnRestaurer").disabled = !n || !etat.config.ecrituresActives;
}

// ---- vues sauvegardées
async function chargerVues() {
  const v = await fetch("/api/vues").then((r) => r.json());
  $("vues").innerHTML = '<span class="stat">Vues :</span>' +
    Object.keys(v).map((nom) => `<span class="onglet ${etat.vueActive===nom?'actif':''}" data-vue="${nom}">${nom}</span>`).join("") +
    (Object.keys(v).length ? "" : '<span class="doux">aucune — configurez des filtres puis « Sauvegarder la vue »</span>');
  $("vues").querySelectorAll("[data-vue]").forEach((el) => {
    el.onclick = () => { etat.vueActive = el.dataset.vue; appliquerFiltres(v[el.dataset.vue]); chargerVues(); charger(); };
    el.oncontextmenu = async (e) => {
      e.preventDefault();
      if (!confirm(`Supprimer la vue « ${el.dataset.vue} » ?`)) return;
      await fetch("/api/vues", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ nom: el.dataset.vue, supprimer:true }) });
      etat.vueActive = null; chargerVues();
    };
  });
}

// ---- dialogue générique
function dialogue(titre, html, onOk, texteOk = "Confirmer") {
  $("dlgTitre").textContent = titre;
  $("dlgCorps").innerHTML = html;
  $("dlgOk").textContent = texteOk;
  $("dlgOk").style.display = onOk ? "" : "none";
  $("dlgOk").onclick = async () => { if (await onOk?.() !== false) $("dlg").close(); };
  $("dlgAnnuler").onclick = () => $("dlg").close();
  $("dlg").showModal();
}

// ---- actions
$("btnRafraichir").onclick = () => charger(true);
$("btnReset").onclick = () => { appliquerFiltres({}); etat.vueActive=null; chargerVues(); charger(); };
["recherche","statut","dropOff","pays","poidsMin","poidsMax","ageMin","sansPoids"].forEach((id) => {
  const el = $(id);
  el.addEventListener(el.type === "search" || el.type === "number" ? "input" : "change", debounce(() => charger(), 250));
});

$("btnSauverVue").onclick = () => dialogue("Sauvegarder la vue",
  '<input id="nomVue" placeholder="Nom de la vue" style="width:100%">' +
  '<p class="doux" style="margin:8px 0 0">Les filtres actuels seront enregistrés. Clic droit sur un onglet pour le supprimer.</p>',
  async () => {
    const nom = $("nomVue").value.trim();
    if (!nom) return false;
    await fetch("/api/vues", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ nom, filtres: filtres() }) });
    etat.vueActive = nom; chargerVues();
  }, "Sauvegarder");

$("btnCoter").onclick = async () => {
  const orderId = [...etat.selection][0];
  dialogue("Cotation", '<p class="doux">Cotation en cours…</p>', null);
  const r = await fetch("/api/coter", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ orderId }) }).then((r) => r.json());
  if (r.error) return dialogue("Cotation", `<p>Erreur : ${r.error}</p>`, null);
  const lignes = r.tarifs.map((t) => `<tr${r.recommande && t.serviceId===r.recommande.serviceId ? ' style="font-weight:650"' : ""}>
      <td>${t.carrier}</td><td>${t.service}${t.dropOff?' <span class="puce drop">drop</span>':""}</td>
      <td class="num">${t.price.toFixed(2)} $</td></tr>`).join("");
  dialogue("Cotation",
    `<p class="doux">Envoi de ${r.envoi.parcel.weightG} g vers ${r.envoi.to.city || ""} ${r.envoi.to.postalCode}.
     Adaptateur : <b>${etat.config.adaptateur}</b>${etat.config.adaptateur==="bouchon"?" — prix de démonstration, pas de vraie cotation":""}.</p>
     <table style="width:100%;margin-top:8px">${lignes}</table>`, null);
};

$("btnHold").onclick = () => {
  const d = new Date(Date.now() + 7*86400000).toISOString().slice(0,10);
  dialogue(`Mettre ${etat.selection.size} commande(s) en attente`,
    `<label>Jusqu'au <input type="date" id="dateHold" value="${d}"></label>
     <p class="doux" style="margin:10px 0 0">Action réelle sur ShipStation. Les commandes reviennent
     automatiquement en file à cette date.</p>`,
    async () => {
      const r = await fetch("/api/hold", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ orderIds:[...etat.selection], holdUntilDate: $("dateHold").value }) }).then((r)=>r.json());
      if (r.error) { alert(r.error); return false; }
      charger(true);
    }, "Mettre en attente");
};

$("btnRestaurer").onclick = () => dialogue(`Remettre ${etat.selection.size} commande(s) en file`,
  '<p>Action réelle sur ShipStation.</p>',
  async () => {
    const r = await fetch("/api/restaurer", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ orderIds:[...etat.selection] }) }).then((r)=>r.json());
    if (r.error) { alert(r.error); return false; }
    charger(true);
  }, "Remettre en file");

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

(async () => {
  etat.config = await fetch("/api/config").then((r) => r.json());
  if (!etat.config.ecrituresActives) {
    $("avisEcritures").innerHTML = '<div class="avis">Lecture seule — Hold et remise en file sont ' +
      'désactivés. Relancer avec <code>CLONE_ALLOW_WRITES=1</code> pour agir sur le vrai ShipStation.</div>';
  }
  await chargerVues();
  await charger();
})();
</script>
</body>
</html>
