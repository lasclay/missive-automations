  };

  if (!a.par_mois.length) carteVide("#mois", "volume par mois");
  else $("#mois").innerHTML = a.par_mois.map(m => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:3px">
    <span style="width:64px;font-variant-numeric:tabular-nums" class="doux">${m.mois}</span>
    <span class="bar" style="flex:1" role="img" aria-label="${num(m.n)} envois en ${esc(m.mois)}"><i style="width:${Math.round(100 * m.n / mx)}%"></i></span>
    <span style="width:60px;text-align:right;font-variant-numeric:tabular-nums">${num(m.n)}</span>
    <span style="width:92px;text-align:right" class="doux">${money(m.cout)}</span></div>`).join("");

  if (!a.par_poids.length) carteVide("#poids", "répartition par poids");
  else $("#poids").append(table([{ k: "bande", t: "Bande" }, { k: "n", t: "Envois", n: true },
    { k: "moyen", t: "Coût moyen", n: true, r: r => money(r.moyen) }, { k: "cout", t: "Total", n: true, r: r => money(r.cout) }],
    a.par_poids, { cle: "bande" }));

  if (!a.par_service.length) carteVide("#serv", "transporteurs et services");
  else $("#serv").append(table([{ k: "carrier_code", t: "Transporteur" },
    // Le service s'affichait en identifiant technique alors que le référentiel porte le
    // libellé commercial : `cp_expedited` au lieu d'« Expedited Parcel ».
    { k: "service_id", t: "Service", r: r => esc(nomService(r.service_id) || r.service_id || "—") },
    { k: "n", t: "Envois", n: true }, { k: "moyen", t: "Moyen", n: true, r: r => money(r.moyen) },
    { k: "drop_off", t: "Drop-off", n: true }], a.par_service, { cle: "service_id" }));

  $("#anaSel").onchange = () => { S0.periode = $("#anaSel").value; VUES.analytique(); };
  const f = $("#anaF"), t = $("#anaT");
  if (f) f.onchange = () => { S0.from = f.value; VUES.analytique(); };
  if (t) t.onchange = () => { S0.to = t.value; VUES.analytique(); };
  S.rafraichirEcran = () => VUES.analytique();
};

/**
 * Référentiel des critères — gardé en mémoire pour la session.
 *
 * `/api/criteres` est strictement statique (39 champs, 19 opérateurs, 23 actions) et était
 * retéléchargé à **chaque** affichage de l'écran Automatisation (§6.3). La route porte déjà
 * un `ETag`, donc le coût réseau était faible ; le coût inutile restait l'aller-retour et
 * l'attente qu'il impose au rendu de l'écran.
 */
let _criteres = null;
const criteresEnCache = async () => (_criteres ||= await api("/api/criteres"));

// ----------------------------------------------------------- automatisation
/**
 * Automatisation — les 6 couches, et l'éditeur de règles.
 *
 * L'éditeur remplace les zones de texte JSON par un vrai formulaire, parce que le champ qui
 * compte le plus n'existe pas chez ShipStation : la **portée** d'un critère d'article. « SKU
 * contient X » sur une commande de cinq articles ne dit pas s'il faut qu'un article
 * corresponde, que tous correspondent, ou qu'aucun ne corresponde — c'est la demande
 * communautaire la plus ancienne restée sans réponse. Ici elle se choisit dans une liste.
 */
VUES.automatisation = async () => {
  const [d, voc, couches] = await Promise.all([
    api("/api/rules"), criteresEnCache(), api("/api/automation")]);
  S.voc = voc;

  const ordreCouches = Object.entries(couches.couches).sort((a, b) => a[1].n - b[1].n);

  $("#vue").innerHTML = `<h1>Automatisation</h1>
    <p class="sous">Les six couches s'exécutent dans cet ordre à chaque import. Les règles
      passent en dernier : elles voient ce que les couches précédentes ont écrit.</p>
    <div class="carte"><div class="couches">${ordreCouches.map(([cle, c]) =>
      `<div class="couche ${c.rejouable ? "" : "gris"}">
        <b>${c.n}</b> ${esc(c.nom)}
        <span class="doux">${c.rejouable ? "rejouable" : "à l'import seulement"}</span>
      </div>`).join('<span class="fleche">→</span>')}</div>
      <p class="doux" style="margin-top:8px">« Rejouable » = repris par le retraitement des
        commandes ouvertes (Réglages). ShipStation ne rejoue que les trois dernières couches, et
        c'est la même règle ici.</p></div>
    <div class="barre">
      <button class="p" id="rn">Nouvelle règle</button>
      <button id="rOrdre">Réordonner…</button>
      <span class="doux" style="margin-left:auto">${d.rules.filter((r) => r.enabled).length} active(s) sur ${d.rules.length}</span>
    </div>
    <div id="rt"></div>`;

  $("#rt").append(table([
    { k: "position", t: "Ordre", n: true },
    { k: "name", t: "Règle", r: (r) => esc(r.name) + (r.enabled ? "" : ' <span class="puce g">désactivée</span>')
      + (r.notes ? ` <button type="button" class="puce a noteB" data-note="${esc(r.notes)}"
           aria-label="Note de migration : ${esc(r.notes)}" title="${esc(r.notes)}">note</button>` : "") },
    { k: "conditions", t: "Si", r: (r) => r.conditions.length
      ? esc((r.resume || r.conditions.map(decrireCritere)).join(r.match_all ? "  ET  " : "  OU  "))
      : (r.sans_condition ? '<span class="puce a">toutes les commandes</span>' : '<span class="puce r">sans condition</span>') },
    { k: "actions", t: "Alors", r: (r) => esc(r.actions.map((a) => decrireAction(a)).join(" · ")) },
    { k: "run_count", t: "Exéc.", n: true },
    { k: "act", t: "", r: (r) => `<button data-e="${r.id}">Modifier</button> <button class="d" data-x="${r.id}">Suppr.</button>` },
  ], d.rules));

  $("#rn").onclick = () => editerRegle();
  $("#rt").querySelectorAll("[data-e]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); editerRegle(d.rules.find((x) => x.id == b.dataset.e));
  });
  $("#rt").querySelectorAll("[data-x]").forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm("Supprimer cette règle ?")) return;
    await api("/api/rules/" + b.dataset.x, { method: "DELETE" });
    VUES.automatisation();
  });
  $("#rOrdre").onclick = () => dialogue("Ordre d'exécution", `
    <p class="doux">Glissez pour réordonner. L'ordre est signifiant : une règle voit l'état
      laissé par les précédentes. C'est ce qui fait que « LAS Cost Centre » doit passer
      <b>après</b> l'affectation d'entrepôt et non avant, comme chez ShipStation où elle ne se
      déclenchait jamais.</p>
    <div id="ordL" class="ordL" role="list">${d.rules.map((r, i) =>
      `<div class="ordI" draggable="true" data-id="${r.id}" role="listitem">
         <span aria-hidden="true">☰</span> <span class="nomR">${esc(r.name)}</span>
         <span class="ordB">
           <button type="button" data-monter="${r.id}" ${i === 0 ? "disabled" : ""}
             aria-label="Monter « ${esc(r.name)} »" title="Monter">▲</button>
           <button type="button" data-descendre="${r.id}" ${i === d.rules.length - 1 ? "disabled" : ""}
             aria-label="Descendre « ${esc(r.name)} »" title="Descendre">▼</button>
         </span></div>`).join("")}</div>`,
    async () => {
      const ids = [...document.querySelectorAll("#ordL .ordI")].map((x) => Number(x.dataset.id));
      await api("/api/rules/reorder", { method: "POST", body: { ids } });
      VUES.automatisation();
    }, "Enregistrer l'ordre", (c) => glisserDeposer(c.querySelector("#ordL")));
};

/**
 * Réordonnancement — glisser-déposer **et** flèches, §5.3 point 5 de l'audit.
 *
 * La modale reposait exclusivement sur le glisser-déposer : l'ordre d'exécution de
 * l'automatisation — celui qui décide qu'une règle voit ou non ce que la précédente a écrit —
 * n'était pas modifiable au clavier, ni au doigt sur la tablette du poste d'emballage. Deux
 * boutons par ligne suffisent, et le focus suit la ligne déplacée pour qu'on puisse enchaîner.
 */
function glisserDeposer(liste) {
  let porte = null;
  liste.querySelectorAll("[draggable]").forEach((it) => {
    it.ondragstart = () => { porte = it; it.style.opacity = ".4"; };
    it.ondragend = () => { it.style.opacity = ""; porte = null; };
    it.ondragover = (e) => {
      e.preventDefault();
      if (!porte || porte === it) return;
      const r = it.getBoundingClientRect();
      it.parentNode.insertBefore(porte, e.clientY - r.top < r.height / 2 ? it : it.nextSibling);
    };
  });

  const deplacer = (id, sens) => {
    const it = liste.querySelector(`.ordI[data-id="${id}"]`);
    if (!it) return;
    const voisin = sens < 0 ? it.previousElementSibling : it.nextElementSibling;
    if (!voisin) return;
    sens < 0 ? liste.insertBefore(it, voisin) : liste.insertBefore(voisin, it);
    majFleches();
    // Le focus reste sur le bouton qui vient d'agir : monter une règle de trois rangs se
    // fait en trois pressions, sans repointer.
    it.querySelector(sens < 0 ? "[data-monter]" : "[data-descendre]")?.focus();
  };

  /** Les extrémités ne peuvent pas monter ni descendre : le bouton le dit plutôt que de ne rien faire. */
  function majFleches() {
    const items = [...liste.querySelectorAll(".ordI")];
    items.forEach((it, i) => {
      const m = it.querySelector("[data-monter]"), d = it.querySelector("[data-descendre]");
      if (m) m.disabled = i === 0;
      if (d) d.disabled = i === items.length - 1;
    });
  }

  liste.addEventListener("click", (e) => {
    const m = e.target.closest("[data-monter]"), d = e.target.closest("[data-descendre]");
    if (m) deplacer(m.dataset.monter, -1);
    else if (d) deplacer(d.dataset.descendre, +1);
  });
  majFleches();
}

/**
 * Pays de destination — trois valeurs seulement (`CA`, `US`, `FR`) rendaient la calculatrice
 * inutilisable dès qu'un client commandait d'ailleurs. La liste couvre les destinations
 * réelles de Lasclay et les grands marchés, avec le Canada en tête.
 */
const PAYS_EXPEDITION = [
  ["CA", "Canada"], ["US", "États-Unis"], ["FR", "France"], ["BE", "Belgique"],
  ["CH", "Suisse"], ["GB", "Royaume-Uni"], ["DE", "Allemagne"], ["IT", "Italie"],
  ["ES", "Espagne"], ["NL", "Pays-Bas"], ["IE", "Irlande"], ["LU", "Luxembourg"],
  ["AU", "Australie"], ["NZ", "Nouvelle-Zélande"], ["JP", "Japon"], ["MX", "Mexique"],
  ["SE", "Suède"], ["NO", "Norvège"], ["DK", "Danemark"], ["FI", "Finlande"],
  ["AT", "Autriche"], ["PT", "Portugal"], ["PL", "Pologne"], ["CZ", "Tchéquie"],
];

const PORTEE_FR = { any: "au moins un article", all: "tous les articles",
  only: "uniquement ces articles", none: "aucun article" };

function decrireCritere(c) {
  const v = Array.isArray(c.value) ? c.value.join(" ou ") : c.value;
  const p = c.scope ? `[${PORTEE_FR[c.scope] || c.scope}] ` : "";
  return `${p}${c.field} ${c.op} ${v ?? ""}`.trim();
}
const decrireAction = (a) => a.type + (a.value != null && typeof a.value !== "object"
  ? ` = ${a.value}` : (a.value ? " …" : ""));

/** Éditeur de règle : critères et actions en lignes, pas en JSON. */
function editerRegle(r = { conditions: [], actions: [], enabled: true, match_all: true, position: 50 }) {
  const voc = S.voc;
  const champArticle = (cle) => (voc.champs.find((c) => c.cle === cle) || {}).article;
  // Les gabarits alimentent la liste de l'action « email » ; on les charge une fois, sans
  // bloquer l'ouverture de l'éditeur si l'appel échoue.
  if (!S.gabarits) api("/api/templates").then((d) => { S.gabarits = d.templates || []; }).catch(() => { S.gabarits = []; });

  /**
   * Une valeur stockée hors du vocabulaire ne doit **jamais** faire retomber le sélecteur sur
   * son premier choix — BUG-017.
   *
   * C'est ainsi qu'ouvrir la règle « Drop-off sous 500 g » affichait `order_number` à la place
   * de son champ réel : un simple ouvrir-fermer suivi d'« Enregistrer » l'aurait corrompue
   * en silence. On injecte une option orpheline signalée, et on bloque l'enregistrement tant
   * qu'elle est sélectionnée.
   */
  const optionsAvec = (liste, valeur, libelle = (x) => x.cle, cle = (x) => x.cle) => {
    const connu = liste.some((x) => cle(x) === valeur);
    const orpheline = !connu && valeur != null && valeur !== ""
      ? `<option value="${esc(valeur)}" selected data-orphelin>⚠ valeur inconnue : ${esc(valeur)}</option>`
      : "";
    return orpheline + liste.map((x) =>
      `<option value="${esc(cle(x))}"${cle(x) === valeur ? " selected" : ""}>${libelle(x)}</option>`).join("");
  };

  const ligneCritere = (c = { field: "item_sku", op: "contient", scope: "any", value: "" }) => `
    <div class="critL" data-crit>
      <select data-f aria-label="Champ">${optionsAvec(voc.champs, c.field,
        (x) => esc(x.cle) + (x.shipstation ? ` (${esc(x.shipstation)})` : ""))}</select>
      <select data-p aria-label="Portée" ${champArticle(c.field) ? "" : "disabled"}>${
        optionsAvec(Object.entries(PORTEE_FR).map(([cle, t]) => ({ cle, t })),
          c.scope || "any", (x) => esc(x.t))}</select>
      <select data-o aria-label="Opérateur">${optionsAvec(voc.operateurs, c.op, (x) => esc(x.libelle))}</select>
      <input data-v aria-label="Valeur" value="${esc(Array.isArray(c.value) ? c.value.join(" ; ") : (c.value ?? ""))}" placeholder="valeurs séparées par ;">
      <button type="button" data-suppr title="Retirer" aria-label="Retirer ce critère">×</button>
    </div>`;

  /**
   * Paramètre d'une action — BUG-076.
   *
   * C'était un champ texte contenant du JSON brut :
   * `{"carrier_code":"canada_post","service_id":"99","package_id":"115317"}`. Une faute de
   * frappe cassait la règle sans validation, et l'opérateur devait connaître les
   * identifiants internes — `99`, `115317`. L'application possédait déjà les listes qu'il
   * fallait, ailleurs. Le serveur décrit la forme attendue de chaque action ; on la rend.
   *
   * Le JSON reste accessible en repli pour les formes qu'on n'a pas décrites : mieux vaut
   * un champ brut assumé qu'une action qu'on ne peut plus configurer du tout.
   */
  const LISTES = {
    service: () => (S.refs.services || []).filter((x) => !x.hidden).map((x) => [String(x.id), x.name]),
    colis: () => (S.refs.packages || []).map((x) => [String(x.id), x.name]),
    entrepot: () => (S.refs.warehouses || []).map((w) => [String(w.id), w.name + (w.is_default ? " (défaut)" : "")]),
    transporteur: () => (S.refs.carriers || []).map((c) => [String(c.code), c.name]),
    etiquette: () => (S.refs.tags || []).map((t) => [String(t.name), t.name]),
    utilisateur: () => (S.refs.users || []).map((u) => [String(u.id), u.name]),
    confirmation: () => (S.refs.confirmations || []).map((c) => [String(c.id), c.nom]),
    gabarit: () => (S.gabarits || []).map((g) => [String(g.id), g.name]),
  };

  const champTypé = (type, valeur, options, attrs = "") => {
    const v = valeur ?? "";
    if (type === "nombre") return `<input type="number" step="any" ${attrs} value="${esc(v)}">`;
    if (type === "date") return `<input type="date" ${attrs} value="${esc(String(v).slice(0, 10))}">`;
    const liste = type === "choix" ? options : (LISTES[type] && LISTES[type]());
    if (!liste) return `<input ${attrs} value="${esc(v)}">`;
    // Une valeur enregistrée absente du référentiel ne doit pas disparaître en silence —
    // même principe que pour les critères (BUG-017).
    const connue = liste.some(([k]) => String(k) === String(v));
    return `<select ${attrs}>
      <option value="">— aucun —</option>
      ${!connue && v !== "" ? `<option value="${esc(v)}" selected data-orphelin>⚠ valeur inconnue : ${esc(v)}</option>` : ""}
      ${liste.map(([k, t]) => `<option value="${esc(k)}"${String(k) === String(v) ? " selected" : ""}>${esc(t)}</option>`).join("")}
    </select>`;
  };

  const parametreAction = (type, valeur) => {
    const f = (voc.formes || {})[type];
    if (!f) return `<input data-av aria-label="Paramètre" value="${esc(typeof valeur === "object" ? JSON.stringify(valeur) : (valeur ?? ""))}" placeholder="valeur (ou JSON)">`;
    if (f.type === "rien") return `<span class="doux" data-vide>cette action n'a pas de paramètre</span>`;
    if (f.type === "objet") {
      const o = (valeur && typeof valeur === "object") ? valeur : {};
      return `<span class="actObj">${f.champs.map((c) =>
        `<label class="actC"><span>${esc(c.libelle)}</span>${
          champTypé(c.type, o[c.cle], c.options, `data-ao="${esc(c.cle)}"`)}</label>`).join("")}</span>`;
    }
    return champTypé(f.type, valeur, f.options, `data-av aria-label="${esc(f.libelle || "Paramètre")}"`);
  };

  const ligneAction = (a = { type: "add_tag", value: "" }) => `
    <div class="critL actL" data-act>
      <select data-t aria-label="Action">${optionsAvec(voc.actions.map((x) => ({ cle: x })), a.type)}</select>
      <span data-param class="actP">${parametreAction(a.type, a.value)}</span>
      <button type="button" data-suppr title="Retirer" aria-label="Retirer cette action">×</button>
    </div>`;

  dialogue(r.id ? `Règle « ${r.name} »` : "Nouvelle règle", `
    ${r.notes ? `<div class="avis info">${esc(r.notes)}</div>` : ""}
    <label class="champ"><span>Nom</span><input id="rnm" value="${esc(r.name || "")}"></label>
    <div class="grille">
      <label class="champ"><span>Ordre</span><input type="number" id="rps" value="${r.position}"></label>
      <label class="champ"><span>Combinaison</span><select id="rma">
        <option value="1"${r.match_all ? " selected" : ""}>Toutes les conditions (ET)</option>
        <option value="0"${!r.match_all ? " selected" : ""}>Au moins une (OU)</option></select></label>
      <label class="champ"><span>Active</span><select id="ren">
        <option value="1"${r.enabled ? " selected" : ""}>Oui</option>
        <option value="0"${!r.enabled ? " selected" : ""}>Non</option></select></label>
    </div>
    <p class="doux">Deux critères sur la <b>même colonne</b> se combinent en OU même en mode ET —
      sans quoi « province = ON » et « province = QC » ne pourraient jamais coexister.</p>
    <b>Si</b><div id="crits">${(r.conditions || []).map(ligneCritere).join("")}</div>
    <div class="barre"><button id="critPlus">+ Critère</button>
      <label class="ch"><input type="checkbox" id="rsc" ${r.sans_condition ? "checked" : ""}>
        sans condition — s'applique à toutes les commandes</label></div>
    <b>Alors</b><div id="acts">${(r.actions || []).map(ligneAction).join("")}</div>
    <div class="barre"><button id="actPlus">+ Action</button>
      <label class="ch"><input type="checkbox" id="rst" ${r.stop_after ? "checked" : ""}>
        arrêter le chaînage si cette règle s'applique</label></div>`,
    async () => {
      // Une option orpheline sélectionnée signifie que la donnée stockée n'est plus dans le
      // vocabulaire. Enregistrer la remplacerait par autre chose : on refuse (BUG-017).
      const orphelines = [...document.querySelectorAll("#dlgC [data-crit] select, #dlgC [data-act] select")]
        .filter((sel) => sel.selectedOptions[0] && sel.selectedOptions[0].hasAttribute("data-orphelin"))
        .map((sel) => sel.value);
      if (orphelines.length) {
        alert(`Cette règle contient ${orphelines.length} valeur(s) que le moteur ne connaît pas : ` +
          `${[...new Set(orphelines)].join(", ")}.\n\n` +
          `Corrigez-les avant d'enregistrer — sinon elles seraient remplacées silencieusement.`);
        return false;
      }
      const conditions = [...document.querySelectorAll("[data-crit]")].map((l) => {
        const f = l.querySelector("[data-f]").value;
        const brut = l.querySelector("[data-v]").value;
        const c = { field: f, op: l.querySelector("[data-o]").value,
          value: brut.includes(";") ? brut.split(";").map((x) => x.trim()).filter(Boolean) : brut };
        if (champArticle(f)) c.scope = l.querySelector("[data-p]").value;
        return c;
      });
      const actions = [...document.querySelectorAll("[data-act]")].map((l) => {
        const type = l.querySelector("[data-t]").value;
        // Action composée : chaque champ nommé donne une clé. On n'envoie que ce qui est
        // rempli — un champ vide veut dire « ne pas y toucher », pas « mettre à vide ».
        const parties = [...l.querySelectorAll("[data-ao]")];
        if (parties.length) {
          const o = {};
          for (const c of parties) if (String(c.value).trim() !== "") o[c.dataset.ao] = c.value;
          return { type, value: o };
        }
        const champ = l.querySelector("[data-av]");
        if (!champ) return { type, value: null };       // action sans paramètre
        const brut = String(champ.value).trim();
        let value = brut;
        if (brut.startsWith("{") || brut.startsWith("[")) { try { value = JSON.parse(brut); } catch {} }
        return { type, value };
      });
      try {
        await api("/api/rules", { method: "POST", body: { id: r.id, name: $("#rnm").value,
          position: Number($("#rps").value), match_all: $("#rma").value === "1",
          enabled: $("#ren").value === "1", sans_condition: $("#rsc").checked,
          stop_after: $("#rst").checked, conditions, actions } });
      } catch (e) {
        // Le serveur refuse un champ ou un opérateur incompatible : on le dit ici plutôt que
        // de fermer la modale en laissant croire que c'est enregistré.
        toast(`Règle refusée : ${e.message}`, { type: "erreur", duree: 12000 });
        return false;
      }
      VUES.automatisation();
    }, "Enregistrer",
    (c) => {
      const brancher = () => {
        c.querySelectorAll("[data-suppr]").forEach((b) => b.onclick = (e) => { e.preventDefault(); b.parentNode.remove(); });
        c.querySelectorAll("[data-f]").forEach((sel) => sel.onchange = () => {
          const p = sel.parentNode.querySelector("[data-p]");
          p.disabled = !champArticle(sel.value);
        });
        // Changer d'action change la forme de son paramètre : une date n'a pas la même
        // saisie qu'un service. On repeint le champ plutôt que de garder l'ancien, qui
        // porterait une valeur qui n'a plus de sens.
        c.querySelectorAll("[data-act] [data-t]").forEach((sel) => sel.onchange = () => {
          const zone = sel.parentNode.querySelector("[data-param]");
          if (zone) zone.innerHTML = parametreAction(sel.value, null);
        });
      };
      c.querySelector("#critPlus").onclick = (e) => { e.preventDefault(); c.querySelector("#crits").insertAdjacentHTML("beforeend", ligneCritere()); brancher(); };
      c.querySelector("#actPlus").onclick = (e) => { e.preventDefault(); c.querySelector("#acts").insertAdjacentHTML("beforeend", ligneAction()); brancher(); };
      brancher();
    });
}

/**
 * Scan — poste d'emballage. Un seul champ actif, qui attend un code-barres ou un numéro de
 * commande ; la commande s'ouvre, on vérifie les articles un à un, puis on imprime.
 *
 * Le point important est ergonomique : après chaque étiquette, le champ reprend le focus tout
 * seul. L'opérateur ne touche jamais la souris de la journée.
 */
/**
 * Poste de scan — refondu après l'audit (BUG-008, 009, 015, 032, 033, 034, 066).
 *
 * Ce que l'audit a trouvé et qui coûtait de l'argent : une commande déjà expédiée s'ouvrait
 * avec le bouton d'impression actif ; une saisie partielle ouvrait silencieusement la première
 * commande trouvée ; le champ n'était pas vidé, donc le deuxième code de la journée se
 * concaténait au premier et n'était jamais trouvé ; une erreur d'API laissait la commande
 * précédente à l'écran ; et chaque visite de l'écran ajoutait un écouteur clavier de plus.
 *
 * Les quatre règles retenues :
 *   • correspondance exacte, jamais `orders[0]` — plusieurs résultats se choisissent à la main ;
 *   • statut expédiable obligatoire, avec la date d'expédition et le suivi si on refuse ;
 *   • le champ est vidé et repris **dans un `finally`**, quoi qu'il arrive ;
 *   • l'écran est effacé **avant** l'appel : on ne regarde jamais la commande précédente.
 */
VUES.scan = async () => {
  $("#vue").innerHTML = `<h1>Scan</h1>
    <p class="sous">Scannez le code-barres du bordereau ou saisissez un numéro de commande.
      Le champ se vide et reprend le focus après chaque lecture — le poste s'utilise sans souris.</p>
    <div class="carte">
      <div class="barre">
        <label class="visuellement-cache" for="scq">Numéro de commande ou code-barres</label>
        <input id="scq" autocomplete="off" spellcheck="false"
               placeholder="Numéro de commande ou code-barres…"
               style="min-width:340px;font-size:16px;padding:10px">
        <label class="visuellement-cache" for="scm">Mode de travail</label>
        <select id="scm">
          <option value="verifier">Vérifier puis imprimer</option>
          <option value="imprimer">Imprimer directement</option>
        </select>
        <span class="doux" id="scEtat" role="status" aria-live="polite"></span>
      </div>
      <div class="doux">Raccourcis : <kbd>F2</kbd> marquer vérifié · <kbd>F3</kbd> imprimer l'étiquette.
        <kbd>V</kbd> et <kbd>P</kbd> font la même chose quand le champ est vide — le temps de
        laisser passer un code-barres qui commencerait par cette lettre.</div>
    </div>
    <div id="scOut"></div>`;

  const champ = $("#scq");
  champ.focus();
  let courante = null, verifies = new Set();

  /**
   * Retour sonore — trois sons, pas deux (BUG-122).
   *
   * À l'emballage, personne ne regarde l'écran entre deux colis. « lu » et « terminé » ne
   * doivent pas se confondre : le premier veut dire « continue », le second « ferme la
   * boîte ». Un carillon à deux notes marque la fin, un bip aigu la lecture, un grave le
   * refus. Ce qui est dit à l'oreille est aussi écrit dans la zone `aria-live`, pour qui
   * travaille sans son ou avec un lecteur d'écran.
   */
  const SONS = {
    lu:      [[880, 0.10]],
    refus:   [[220, 0.32]],
    termine: [[880, 0.10], [1320, 0.16]],
  };
  const bip = (quoi) => {
    const notes = SONS[quoi === true ? "lu" : quoi === false ? "refus" : quoi] || SONS.lu;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let t = ctx.currentTime;
      for (const [freq, duree] of notes) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = freq;
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + duree);
        o.start(t); o.stop(t + duree);
        t += duree;
      }
      setTimeout(() => ctx.close(), 1200);
    } catch { /* l'audio est un confort, pas une dépendance */ }
  };

  /** Ce que le son vient de dire, écrit — pour qui n'a pas de son (BUG-122). */
  const annoncer = (texte) => { const e = $("#scEtat"); if (e) e.textContent = texte; };

  const refus = (html) => {
    bip("refus");
    annoncer("Refusé");
    $("#scOut").innerHTML = `<div class="avis bloquant">${html}</div>`;
  };

  /**
   * Lignes à préparer — BUG-120.
   *
   * `adjustment` ne suffit pas : Shopify envoie les pourboires, les dons et les frais
   * d'emballage comme des lignes ordinaires. Demander à l'emballeur de « vérifier » un
   * pourboire lui apprend à cocher sans regarder, ce qui est exactement ce qu'on veut
   * éviter d'un poste de vérification. Une ligne à quantité nulle est remboursée : elle
   * n'est plus à préparer non plus.
   */
  const NON_PHYSIQUE = /^(tip|pourboire|don|donation|carbon|frais|shipping|livraison|insurance|assurance|gift ?wrap|emballage cadeau)\b/i;
  const aPreparer = (o) => (o.items || []).filter((i) =>
    !i.adjustment && (i.quantity ?? 0) > 0 && !NON_PHYSIQUE.test(String(i.name || "")));

  /**
   * Vérification à l'unité, par scan de code — §3.7 de l'audit visuel.
   *
   * Trois défauts se tenaient ensemble. La vérification se faisait **à la souris**, ce qui
   * contredisait le sous-titre de l'écran (« le poste s'utilise sans souris »). Il y avait
   * **une case par ligne, pas par unité** : une ligne « Mitaines × 2 » se soldait d'un clic,
   * et la seconde paire partait sans que personne l'ait vue — soit exactement ce que le poste
   * de vérification existe pour attraper. Et il manquait le pendant de « Tout vérifier » :
   * une erreur de comptage n'avait aucune sortie sinon recharger la page.
   *
   * Le champ de scan d'article prend le focus dès qu'une commande est ouverte, et le rend au
   * champ principal quand tout est compté : la douchette enchaîne colis après colis.
   */
  const rendreCommande = (o) => {
    courante = o;
    const arts2 = aPreparer(o);
    const ecartees = (o.items || []).length - arts2.length;
    // La vérification vit sur la ligne, pas dans la page : revenir sur une commande la
    // retrouve où on l'avait laissée (BUG-069).
    const compte = (i) => Math.max(0, Math.min(i.quantity || 0,
      i.verified_qty != null ? i.verified_qty : (i.verified_at ? i.quantity || 0 : 0)));
    for (const i of arts2) { i.verified_qty = compte(i); if (i.verified_qty >= (i.quantity || 0)) verifies.add(i.id); }
    const unites = arts2.reduce((s, i) => s + (i.quantity || 0), 0);
    const comptees = arts2.reduce((s, i) => s + i.verified_qty, 0);
    const restantes = unites - comptees;
    const tousVerifies = arts2.length > 0 && restantes === 0;
    const sansCode = arts2.filter((i) => !i.upc && !i.sku).length;
    // Le statut de la commande et l'avancement de la vérification sont deux choses distinctes :
    // les confondre faisait afficher « vérifiée » à la place de « Expédiée » (BUG-069).
    $("#scOut").innerHTML = `
      <div class="carte">
        <div class="barre"><h3 style="margin:0;flex:1">${esc(o.order_number)}
          <span class="puce g">${esc(STATUT_FR[o.status] || o.status)}</span>
          <span class="puce ${tousVerifies ? "v" : "a"}">${restantes
            ? `${num(restantes)} unité${restantes > 1 ? "s" : ""} restante${restantes > 1 ? "s" : ""}`
            : "tout vérifié"}</span></h3>
          <button type="button" id="scTout">Tout vérifier</button>
          <button type="button" id="scRien" ${comptees ? "" : "disabled"}
            title="${comptees ? "Remettre le décompte à zéro" : "Rien n'est encore compté"}">Tout effacer</button>
          <button type="button" id="scVer" ${tousVerifies ? "" : "disabled"}
            title="${tousVerifies ? "" : `Il reste ${restantes} unité(s) à vérifier`}">Marquer vérifiée (V)</button>
          <button type="button" class="v" id="scImp" ${tousVerifies || $("#scm").value === "imprimer" ? "" : "disabled"}
            title="${tousVerifies || $("#scm").value === "imprimer" ? "" : "Vérifier tous les articles avant d'imprimer"}">Imprimer l'étiquette (P)</button></div>
        <div class="doux">${esc(o.customer_name || "")} — ${esc(o.ship_to.city || "")} ${esc(o.ship_to.state || "")}
          · ${num(Math.round(o.weight_g || 0))} g · ${num(unites)} unité${unites > 1 ? "s" : ""} sur ${arts2.length} ligne${arts2.length > 1 ? "s" : ""}
          ${ecartees ? `· <span title="pourboires, dons, frais et lignes remboursées">${ecartees} ligne(s) non physique(s) écartée(s)</span>` : ""}</div>

        <div class="barre" style="margin-top:9px">
          <label class="visuellement-cache" for="scUpc">Code-barres de l'article</label>
          <input id="scUpc" autocomplete="off" spellcheck="false"
                 placeholder="Scannez un article (UPC ou SKU)…"
                 style="min-width:280px;font-size:15px;padding:8px" ${tousVerifies ? "disabled" : ""}>
          <span class="doux" id="scUpcEtat" role="status" aria-live="polite">${tousVerifies
            ? "Tout est compté — imprimez, ou scannez la commande suivante."
            : `${num(comptees)} sur ${num(unites)} unité(s) comptée(s).`}</span>
        </div>
        ${sansCode ? `<div class="avis" style="margin-top:8px">${sansCode} ligne(s) sans UPC ni SKU :
          elles ne peuvent pas être scannées et doivent être comptées à la main ci-dessous.
          Renseigner l'UPC sur la fiche produit rend le scan possible.</div>` : ""}

        <div class="tbl" style="margin-top:10px"><table>
          <thead><tr><th scope="col">Article</th><th scope="col">SKU</th><th scope="col">UPC</th>
            <th scope="col" class="n">Commandée</th><th scope="col" class="n">Comptée</th>
            <th scope="col"><span class="visuellement-cache">À la main</span></th></tr></thead>
          <tbody>${arts2.map((i) => {
            const fait = i.verified_qty >= (i.quantity || 0);
            return `<tr class="${fait ? "sel" : ""}">
            <td>${esc(i.name)}</td><td class="sku">${esc(i.sku || "—")}</td>
            <td class="sku">${i.upc ? esc(i.upc) : '<span class="puce a">absent</span>'}</td>
            <td class="n">${i.quantity}</td>
            <td class="n"><b class="${fait ? "" : "doux"}">${i.verified_qty}</b></td>
            <td><button type="button" data-moins="${i.id}" ${i.verified_qty ? "" : "disabled"}
                  aria-label="Retirer une unité de ${esc(i.name)}">−</button>
                <button type="button" data-plus="${i.id}" ${fait ? "disabled" : ""}
                  aria-label="Ajouter une unité de ${esc(i.name)}">+</button></td></tr>`; }).join("")}</tbody></table></div>
      </div>`;

    /** Pose un décompte sur une ligne et l'écrit tout de suite : la page n'est pas la mémoire. */
    const poser = async (id, qty) => {
      const i = arts2.find((x) => x.id === id);
      if (!i) return;
      const avant = i.verified_qty;
      i.verified_qty = Math.max(0, Math.min(i.quantity || 0, qty));
      rendreCommande(o);
      try { await api("/api/scan/verifier", { method: "POST", body: { item_ids: [id], qty: i.verified_qty } }); }
      catch (e) {
        // L'écriture a échoué : on remet l'écran dans l'état réel plutôt que de laisser
        // croire que c'est enregistré. Un décompte affiché qui n'est pas enregistré est pire
        // que pas de décompte.
        i.verified_qty = avant;
        rendreCommande(o);
        refus(`Vérification non enregistrée : ${esc(e.message)}`);
      }
    };

    $("#scOut").querySelectorAll("[data-plus]").forEach((b) => b.onclick = () => {
      const i = arts2.find((x) => x.id === Number(b.dataset.plus));
      poser(i.id, i.verified_qty + 1);
    });
    $("#scOut").querySelectorAll("[data-moins]").forEach((b) => b.onclick = () => {
      const i = arts2.find((x) => x.id === Number(b.dataset.moins));
      poser(i.id, i.verified_qty - 1);
    });

    /** Scan d'article : le geste principal du poste, clavier seul. */
    // Le focus suit le geste : sur le champ d'article tant qu'il reste à compter, sur le
    // champ principal dès que tout est compté — la douchette enchaîne le colis suivant sans
    // qu'on touche la souris.
    const champUpc = $("#scUpc");
    if (champUpc) (tousVerifies ? champ : champUpc).focus();
    if (champUpc) champUpc.onkeydown = async (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const code = champUpc.value.trim();
      if (!code) return;
      try {
        const r = await api("/api/scan/article", { method: "POST", body: { order_id: o.id, code } });
        if (!r.trouve) {
          bip("refus");
          $("#scUpcEtat").textContent = r.message;
          // Le code fautif reste dans le champ et est sélectionné : on voit ce qui a été lu,
          // et le scan suivant l'écrase — comme le toast de ShipStation qui conserve la saisie.
          champUpc.select();
          return;
        }
        const i = arts2.find((x) => x.id === r.item.id);
        if (i) i.verified_qty = r.item.verified_qty;
        bip(r.restantes === 0 ? "termine" : "lu");
        annoncer(r.restantes === 0 ? `${o.order_number} : tout est compté` : `${r.restantes} unité(s) restante(s)`);
        rendreCommande(o);
      } catch (err) {
        bip("refus");
        $("#scUpcEtat").textContent = `Scan non enregistré : ${err.message}`;
        champUpc.select();
      }
    };

    const marquer = async (ids, verifie) => {
      const avant = arts2.map((i) => [i.id, i.verified_qty]);
      for (const i of arts2) if (ids.includes(i.id)) i.verified_qty = verifie ? (i.quantity || 0) : 0;
      if (!verifie) verifies.clear();
      rendreCommande(o);
      try { await api("/api/scan/verifier", { method: "POST", body: { item_ids: ids, verifie } }); }
      catch (e) {
        for (const [id, q] of avant) { const i = arts2.find((x) => x.id === id); if (i) i.verified_qty = q; }
        rendreCommande(o);
        refus(`Vérification non enregistrée : ${esc(e.message)}`);
      }
    };

    $("#scTout").onclick = () => marquer(arts2.filter((i) => i.verified_qty < (i.quantity || 0)).map((i) => i.id), true);
    $("#scRien").onclick = () => marquer(arts2.filter((i) => i.verified_qty > 0).map((i) => i.id), false);
    $("#scVer").onclick = async () => {
      try {
        await api("/api/orders", { method: "POST", body: { ...o, print_state: "verifiee" } });
        $("#scOut").innerHTML = `<div class="avis info">${esc(o.order_number)} vérifiée. Scannez la suivante.</div>`;
        bip("termine");
        annoncer(`${o.order_number} vérifiée`);
      } catch (e) { refus(`Échec de l'enregistrement : ${esc(e.message)}`); }
      finally { courante = null; verifies = new Set(); champ.value = ""; champ.focus(); }
    };
    $("#scImp").onclick = imprimer;
  };

  const imprimer = async () => {
    if (!courante) return;
    const o = courante;
    try {
      if (!S.config.etiquettes_actives) {
        window.open(`/api/packing-slip?ids=${o.id}`, "_blank", "noopener,noreferrer");
        $("#scOut").innerHTML = `<div class="avis info">Bordereau de ${esc(o.order_number)} ouvert.
          L'achat d'étiquettes est désactivé sur ce service.</div>`;
        bip(true);
        return;
      }
      const r = await api("/api/shipments/buy", { method: "POST", body: {
        order_id: o.id, fournisseur: ($("#cfour") && $("#cfour").value) || null,
        service_id: ($("#cs") && $("#cs").value) || null } });
      $("#scOut").innerHTML = `<div class="avis info">${esc(o.order_number)} — ${esc(r.trackingNumber)} · ${money(r.price)}</div>`;
      bip(true);
      rafraichirCompteurs();
    } catch (e) {
      refus(`Impression impossible pour ${esc(o.order_number)} : ${esc(e.message)}`);
    } finally {
      // Quoi qu'il arrive : plus de commande courante, champ vidé, focus repris. C'est ce
      // `finally` qui manquait — sans lui, le code suivant se concaténait au précédent.
      courante = null; verifies = new Set();
      champ.value = ""; champ.focus();
    }
  };

  async function chercher(code) {
    // On efface AVANT l'appel : garder la commande précédente à l'écran pendant qu'on en
    // cherche une autre est le meilleur moyen d'emballer la mauvaise (BUG-015).
    courante = null; verifies = new Set();
    $("#scOut").innerHTML = "";
    $("#scEtat").textContent = "Recherche…";
    try {
      const r = await api("/api/scan/lookup?q=" + encodeURIComponent(code));
      if (r.trouve) {
        if ($("#scm").value === "imprimer") { courante = r.commande; return imprimer(); }
        bip(true);
        return rendreCommande(r.commande);
      }
      if (r.motif === "non_expediable") {
        const st = STATUT_FR[r.statut] || r.statut;
        return refus(`<b>${esc(r.order_number)} — ${esc(st)}.</b> Cette commande n'est pas à expédier.
          ${r.expediee_le ? `Expédiée le ${esc(jour(r.expediee_le))}` : ""}
          ${r.suivi ? ` · suivi <span class="sku">${esc(r.suivi)}</span>` : ""}
          <div class="doux" style="margin-top:5px">Aucune étiquette ne peut être imprimée depuis ce poste
          pour une commande déjà partie ou annulée.</div>`);
      }
      if (r.motif === "ambigu") {
        bip(false);
        $("#scOut").innerHTML = `<div class="avis">
          <b>${r.total} commandes correspondent à « ${esc(r.q)} ».</b> Choisissez laquelle —
          le poste n'en ouvre jamais une à votre place.
          <div class="listeAmbigu">${r.candidats.map((c) => `<button type="button" class="amb"
            data-id="${c.id}" ${STATUT_FR[c.status] && c.status !== "awaiting_shipment" && c.status !== "on_hold" ? "disabled" : ""}>
            <b>${esc(c.order_number)}</b> <span class="puce g">${esc(STATUT_FR[c.status] || c.status)}</span>
          </button>`).join("")}</div></div>`;
        $("#scOut").querySelectorAll(".amb").forEach((b) =>
          b.onclick = () => chercher(b.querySelector("b").textContent));
        return;
      }
      refus(`Aucune commande pour « ${esc(r.q || code)} ».`);
    } catch (e) {
      refus(`Recherche impossible : ${esc(e.message)}`);
    } finally {
      $("#scEtat").textContent = "";
      champ.value = "";      // BUG-032 : sans ça, le deuxième code se colle au premier
      // Le focus ne revient ici que si aucune commande n'est ouverte : quand il y en a une,
      // c'est le champ de scan d'article qui doit l'avoir, sinon le premier article scanné
      // atterrit dans le champ de recherche et rouvre la commande au lieu de la vérifier.
      const suite = $("#scUpc");
      if (suite && !suite.disabled) suite.focus(); else champ.focus();
    }
  }

  /**
   * Clavier du poste — BUG-066.
   *
   * Les raccourcis globaux se taisent dès que le focus est dans un champ, et cet écran
   * garde le focus dans le champ en permanence : `V` et `P` n'étaient donc atteignables
   * qu'après un clic de souris, l'exact contraire de ce que le sous-titre promet.
   *
   * Deux chemins désormais. `F2` et `F3` agissent toujours — un lecteur de code-barres
   * n'émet pas de touches de fonction, il n'y a rien à départager. `V` et `P` agissent
   * aussi, mais seulement si le champ est vide **et** que rien d'autre n'arrive dans les
   * 250 ms qui suivent : un code-barres qui commencerait par « V » aura déjà ajouté ses
   * autres caractères, et la lettre reste alors une lettre.
   */
  let differe = null;
  const agir = (quoi) => {
    const b = $(quoi === "verifier" ? "#scVer" : "#scImp");
    if (b && !b.disabled) b.click();
    else annoncer(quoi === "verifier" ? "Rien à marquer vérifié" : "Impression indisponible");
  };

  champ.onkeydown = (e) => {
    if (e.key === "F2") { e.preventDefault(); return agir("verifier"); }
    if (e.key === "F3") { e.preventDefault(); return agir("imprimer"); }
    if (e.key === "Enter") {
      e.preventDefault();
      clearTimeout(differe); differe = null;
      const q = champ.value.trim();
      if (q) chercher(q);
      return;
    }
    const k = e.key.toLowerCase();
    if ((k === "v" || k === "p") && !champ.value && !e.ctrlKey && !e.metaKey && !e.altKey && courante) {
      clearTimeout(differe);
      differe = setTimeout(() => {
        differe = null;
        // Le champ ne contient toujours que cette lettre : personne n'était en train de
        // scanner. On la retire et on exécute le raccourci.
        if (champ.value.trim().toLowerCase() !== k) return;
        champ.value = "";
        agir(k === "v" ? "verifier" : "imprimer");
      }, 250);
    }
  };

  // Les raccourcis V et P de cet écran passent par la table globale : un écouteur ajouté ici
  // à chaque visite en laissait un de plus derrière lui à chaque fois (BUG-034).
  S.scanActions = {
    verifier: () => agir("verifier"),
    imprimer: () => agir("imprimer"),
    focus: () => champ.focus(),
  };
};

// -------------------------------------------------------------- inventaire
/**
 * L'audit qualifiait cet écran de « page morte à colonnes mortes » : zéro bouton, zéro
 * filtre, zéro lien, et des colonnes *Entrepôt*, *Réservé*, *Seuil* qui promettaient des
 * concepts sans écran de saisie. Chez ShipStation le même onglet a huit boutons, et surtout
 * son état vide **dit pourquoi** il est vide et propose l'action corrective.
 *
 * Trois manques comblés : la réception de stock (le geste quotidien de l'entrepôt), le lien
 * vers la fiche produit depuis chaque ligne, et un état vide qui distingue « rien à
 * afficher » de « rien à mesurer ».
 */
VUES.inventaire = async () => {
  let bas, prod;
  try { [bas, prod] = await Promise.all([api("/api/inventory/low"), api("/api/products?limit=500")]); }
  catch (e) { $("#vue").innerHTML = ""; return $("#vue").append(panneauErreur(e, () => VUES.inventaire())); }
  const entrepots = S.refs.warehouses || [];
  const suivi = prod.products.some((p) => (p.inventory || []).length);

  $("#vue").innerHTML = `<h1>Inventaire</h1>
    <p class="sous">Stock par entrepôt, seuils de réapprovisionnement et alertes.</p>
    ${!entrepots.length ? `<div class="avis"><b>Aucun entrepôt configuré.</b> Le stock se compte
      par entrepôt : sans entrepôt, les colonnes ci-dessous n'ont nulle part où pointer.
      <button type="button" class="lienB" id="iVersEnt">Configurer un entrepôt</button></div>`
      : !prod.total ? `<div class="avis"><b>Le catalogue est vide.</b> Il n'y a aucun produit
        dont compter le stock — ce n'est pas un inventaire à zéro, c'est un inventaire sans
        objet. <button type="button" class="lienB" id="iVersProd">Importer les produits</button></div>`
      : !suivi ? `<div class="avis"><b>Aucun suivi de stock posé.</b> ${num(prod.total)} produits
        au catalogue, et aucun n'a de quantité par entrepôt : les alertes de stock bas ne se
        déclencheront jamais. Recevez du stock, ou posez les quantités depuis les fiches.</div>` : ""}
    ${bas.low.length ? `<div class="avis"><b>${bas.low.length} produit(s) sous le seuil</b></div>` : ""}

    <div class="barre">
      <button class="p" id="iRec"${entrepots.length && prod.total ? "" : " disabled"}
        title="${entrepots.length && prod.total ? "" : "Il faut un entrepôt et au moins un produit"}">Recevoir du stock…</button>
      <input type="search" id="iq" placeholder="SKU ou nom">
      <a class="doux" href="/api/export/products">Exporter le catalogue</a></div>

    <div class="carte"><b class="titreCarte">Sous le seuil</b><div id="iBas" style="margin-top:8px"></div></div>
    <div class="carte"><b class="titreCarte">Catalogue</b><div id="iTout" style="margin-top:8px"></div></div>`;

  const bE = $("#iVersEnt"); if (bE) bE.onclick = () => aller("reglages");
  const bP = $("#iVersProd"); if (bP) bP.onclick = () => aller("produits");

  $("#iBas").append(table([
    { k: "sku", t: "SKU" }, { k: "name", t: "Produit" },
    { k: "warehouse_name", t: "Entrepôt" },
    { k: "on_hand", t: "En stock", n: true },
    { k: "allocated", t: "Réservé", n: true },
    { k: "low_threshold", t: "Seuil", n: true },
  ], bas.low, { onLigne: (id) => ouvrirProduit(Number(id)), cle: "product_id" }));

  function rendreCatalogue() {
    const q = ($("#iq").value || "").toLowerCase();
    const l = q ? prod.products.filter((p) => `${p.sku} ${p.name}`.toLowerCase().includes(q)) : prod.products;
    $("#iTout").innerHTML = "";
    $("#iTout").append(table([
      { k: "sku", t: "SKU" }, { k: "name", t: "Produit" },
      { k: "weight_g", t: "Poids", n: true, r: (p) => p.weight_g ? `${num(Math.round(p.weight_g))} g`
        : (p.herite && p.herite.weight_g ? `<span class="doux">${num(p.herite.weight_g)} g hérité</span>`
          : '<span class="puce a">—</span>') },
      { k: "on_hand", t: "En stock", n: true, r: (p) => (p.inventory || []).length
        ? num((p.inventory || []).reduce((s, i) => s + (i.on_hand || 0), 0))
        : '<span class="doux">non suivi</span>' },
      { k: "warehouse_location", t: "Emplacement" },
      { k: "hs_code", t: "Code SH", r: (p) => p.hs_code || '<span class="puce a">manquant</span>' },
    ], l, { onLigne: (id) => ouvrirProduit(Number(id)) }));
  }
  let deb; $("#iq").addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(rendreCatalogue, 200); });
  rendreCatalogue();

  /** Une ligne d'inventaire ouvre sa fiche produit, sur l'onglet Inventaire. */
  function ouvrirProduit(id) {
    S.produitAOuvrir = id;
    aller("produits");
  }

  /**
   * Réception de stock — la quantité s'**ajoute** à l'existant plutôt que de le remplacer :
   * recevoir 40 unités sur un stock de 12 doit donner 52, pas 40. C'est le geste que
   * `Receive Stock` fait chez ShipStation, et le confondre avec un ajustement fait perdre
   * du stock en silence.
   */
  $("#iRec").onclick = () => dialogue("Recevoir du stock", `
    <p class="doux">La quantité reçue s'ajoute au stock en main de l'entrepôt choisi.
      Pour corriger un comptage plutôt qu'enregistrer une réception, passez par la fiche produit.</p>
    <div class="grille">
      <label class="champ"><span>SKU</span><input id="rs" list="rsL" placeholder="LAS-MIT-001">
        <datalist id="rsL">${prod.products.slice(0, 500).map((p) =>
          `<option value="${esc(p.sku || "")}">${esc(p.name || "")}</option>`).join("")}</datalist></label>
      <label class="champ"><span>Entrepôt</span><select id="rw">${entrepots.map((w) =>
        `<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select></label>
      <label class="champ"><span>Quantité reçue</span><input type="number" id="rq" min="1" value="1"></label>
    </div>`,
    async () => {
      const p = prod.products.find((x) => (x.sku || "").toLowerCase() === $("#rs").value.trim().toLowerCase());
      if (!p) { toast("SKU inconnu au catalogue.", { type: "avis" }); return false; }
      const q = Number($("#rq").value);
      if (!(q > 0)) { toast("La quantité reçue doit être positive.", { type: "avis" }); return false; }
      const w = Number($("#rw").value);
      const actuel = (p.inventory || []).find((i) => i.warehouse_id === w) || {};
      await api("/api/inventory", { method: "POST",
        body: { product_id: p.id, warehouse_id: w, on_hand: (actuel.on_hand || 0) + q } });
      toast(`${num(q)} unité(s) reçue(s) — ${p.sku} passe à ${num((actuel.on_hand || 0) + q)}.`, { type: "succes" });
      VUES.inventaire();
    }, "Enregistrer la réception");
};

  /**

  $("#ut").querySelectorAll("[data-perm]").forEach(b => b.onclick = (e) => {

      <label class="ch permL"><input type="checkbox" data-d="${esc(k)}"

    dialogue(`Permissions — ${u.name}`, `
      <label class="champ"><span>Rôle (pré-remplit les cases)</span><select id="upr">
        <option value="">— sur mesure —</option>
        ${d.roles.map(r => `<option value="${esc(r)}"${u.permissions.role === r ? " selected" : ""}>${esc(r)}</option>`).join("")}
      </select></label>
      <div class="permG" id="upc">${cases()}</div>
      <p class="doux">Changer de rôle recoche les cases de ce rôle ; les ajustements faits
        ensuite sont conservés tels quels.</p>`,
      async () => {
        const perms = { role: $("#upr").value || u.permissions.role || null };
        $("#upc").querySelectorAll("[data-d]").forEach(c => { perms[c.dataset.d] = c.checked; });
        await api("/api/users", { method: "POST", body: { id: u.id, permissions: perms } });
        VUES.utilisateurs();
      }, "Enregistrer",
      (c) => {
        c.querySelector("#upr").onchange = () => {
          const modele = (d.modeles || {})[c.querySelector("#upr").value] || {};
          c.querySelectorAll("[data-d]").forEach(x => { x.checked = modele[x.dataset.d] === true; });
        };
      });
  });
  $("#un").onclick = () => dialogue("Nouvel employé", `
    <label class="champ"><span>Nom</span><input id="un1"></label>
    <label class="champ"><span>Courriel</span><input id="un2" type="email"></label>
    <label class="champ"><span>Rôle</span><select id="un3">${d.roles.map(r => `<option>${r}</option>`).join("")}</select></label>
    <p class="doux">Un mot de passe provisoire sera généré et affiché une seule fois.
      L'employé devra le changer à sa première connexion.</p>
    <p class="doux" style="font-size:12px">Domaines : ${Object.values(d.domaines).join(", ")}.</p>`,
    async () => {
      const r = await api("/api/users", { method: "POST", body: { name: $("#un1").value, email: $("#un2").value, role: $("#un3").value } });
      if (r.motDePasse) {
        dialogue("Compte créé", `<p>Transmettre ces identifiants à <b>${esc($("#un1").value)}</b> —
          ce mot de passe ne sera plus affiché.</p>
          <div class="carte" style="font-family:ui-monospace,monospace;font-size:15px">
            ${esc($("#un2").value)}<br><b>${esc(r.motDePasse)}</b></div>
          <p class="doux">Il devra le changer à la première connexion.</p>`, null);
      } else VUES.utilisateurs();
      return false;
    }, "Créer");
  $("#ut").querySelectorAll("tbody tr").forEach(tr => tr.oncontextmenu = async (e) => {
    e.preventDefault();
    const u = d.users.find(x => x.id === tr.dataset.id);
    if (!u || !confirm(`Réinitialiser le mot de passe de ${u.name} ?`)) return;
    const r = await api(`/api/users/${u.id}/password`, { method: "POST", body: {} });
    dialogue("Mot de passe réinitialisé",
      `<div class="carte" style="font-family:ui-monospace,monospace;font-size:15px"><b>${esc(r.motDePasse)}</b></div>
       <p class="doux">Toutes ses sessions ont été fermées. À changer à la prochaine connexion.</p>`, null);
  });
};

  colis: "Types de colis", etiquettes: "Étiquettes", presets: "Préréglages d'expédition",
  regles: "Règles d'automatisation", vues: "Vues sauvegardées", mappings: "Mappings de service",
  groupes: "Groupes de préréglages produit",

/**
 * Réduit une image à la taille d'une icône, dans le navigateur, avant de l'envoyer.
 *
 * C'est ce qui permet d'accepter n'importe quel fichier — une photo de 4 Mo, un logo exporté
 * en 2000 px — sans que la base grossisse : ce qui part vers le serveur fait déjà 2 à 6 ko.
 * Le SVG échappe au redimensionnement : il est vectoriel, il pèse déjà peu, et le rasteriser
 * lui ferait perdre exactement ce qui fait son intérêt.
 *
 * `object-fit: contain` en version manuelle : on garde les proportions et on centre, plutôt
 * que d'étirer. Un logo déformé se remarque tout de suite dans une colonne.
 */
const COTE_ICONE = 64;
function reduireImage(fichierOuUri, typeConnu = null) {
  return new Promise((resolve, reject) => {
    const fini = (uri, type) => {
      if (type === "image/svg+xml") return resolve(uri);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = c.height = COTE_ICONE;
        const g = c.getContext("2d");
        const e = Math.min(COTE_ICONE / img.width, COTE_ICONE / img.height, 1);
        const l = Math.round(img.width * e), h = Math.round(img.height * e);
        g.drawImage(img, Math.round((COTE_ICONE - l) / 2), Math.round((COTE_ICONE - h) / 2), l, h);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = () => reject(new Error("fichier illisible comme image"));
      img.src = uri;
    };
    if (typeof fichierOuUri === "string") return fini(fichierOuUri, typeConnu
      || (fichierOuUri.slice(0, 30).includes("image/svg+xml") ? "image/svg+xml" : null));
    const l = new FileReader();
    l.onload = () => fini(String(l.result), fichierOuUri.type);
    l.onerror = () => reject(new Error("lecture du fichier impossible"));
    l.readAsDataURL(fichierOuUri);
  });
}

/**
 * Icônes des boutiques — la carte des Réglages.
 *
 * Trois façons de donner une image, parce qu'elles correspondent à trois situations réelles :
 * le fichier est sur le poste (dépôt ou parcours), il est sur le Drive ou un site (URL), il
 * n'y en a pas encore (la lettre continue de servir). Dans les trois cas, l'image finit rangée
 * en base — la page n'appelle jamais l'extérieur pour l'afficher.
 */
async function peindreLogos() {
  const cible = $("#clogc");
  if (!cible) return;
  // Le compte ShipStation traîne sept boutiques désactivées — des essais, des comptes d'un
  // autre projet, deux « New Shopify Store » sans lendemain. Elles sont correctement marquées
  // inactives en base : il n'y a rien à supprimer, seulement à ne pas les mettre sur le même
  // plan que les quatre canaux vivants. Les ranger derrière un repli suffit, et c'est
  // réversible — contrairement à un ménage qui effacerait des lignes.
  const toutes = (S.refs.stores || []).slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const boutiques = toutes.filter((b) => b.active !== 0);
  const dormantes = toutes.filter((b) => b.active === 0);
  if (!toutes.length) { cible.innerHTML = '<p class="doux">Aucune boutique.</p>'; return; }

  const ligne = (b) => {
      const m = marcheDe(b);
      const icone = b.logo || m.icone || null;
      // Trois états, trois messages : votre image, celle de la marque, ou rien encore. La
      // nuance compte — « il y a une icône » et « c'est la vôtre » ne se remplacent pas.
      const etat = b.logo ? "votre image"
        : m.icone ? `icône ${esc(m.nom)} intégrée — déposez la vôtre pour la remplacer`
        : `lettre « ${esc(m.lettre)} » — déposez une image ici`;
      return `<tr data-lg="${esc(b.id)}">
      <td style="width:44px">${icone
        ? `<img class="logoAp" src="${esc(icone)}" alt="Icône de ${esc(b.name)}">`
        : `<span class="logoAp" aria-hidden="true" style="display:inline-flex;align-items:center;
             justify-content:center;background:${m.fond};color:${m.texte};
             font-weight:700">${esc(m.lettre)}</span>`}</td>
      <td>${esc(b.name)}<div class="doux" style="font-size:12px">${etat}</div></td>
      <td style="text-align:right;white-space:nowrap">
        <button type="button" data-lgf="${esc(b.id)}">Choisir un fichier…</button>
        <button type="button" data-lgu="${esc(b.id)}">Depuis une URL…</button>
        ${b.logo ? `<button type="button" class="d" data-lgx="${esc(b.id)}">Retirer</button>` : ""}
      </td></tr>`;
  };

  cible.innerHTML = `<div class="tbl" style="max-height:none"><table><tbody>${
    boutiques.map(ligne).join("")}</tbody></table></div>
    ${dormantes.length ? `<details style="margin-top:8px">
      <summary>${num(dormantes.length)} boutique(s) désactivée(s) — anciens canaux du compte ShipStation</summary>
      <p class="doux" style="font-size:12px">Elles ne reçoivent plus de commandes et n'apparaissent
        ni dans le rail ni dans les filtres. Rien à supprimer : leur icône ne sert qu'à relire
        l'historique.</p>
      <div class="tbl" style="max-height:none"><table><tbody>${
        dormantes.map(ligne).join("")}</tbody></table></div></details>` : ""}
    <input type="file" id="lgFile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden>
    <p class="doux" style="font-size:12px;margin:6px 0 0">Un carré de 64 px suffit ; les images plus
      grandes sont réduites automatiquement avant l'envoi. PNG, JPEG, WebP, GIF ou SVG.</p>
    <div id="lgOut" aria-live="polite"></div>`;

  const enregistrer = async (id, uri) => {
    const r = await tenter(() => api(`/api/stores/${id}/logo`, { method: "POST", body: { data_uri: uri } }),
      { message: "Icône refusée" });
    if (!r) return;
    if (r.error) { $("#lgOut").innerHTML = `<div class="avis">${esc(r.error)}</div>`; return; }
    $("#lgOut").innerHTML = `<div class="avis info">Icône enregistrée — ${num(Math.max(1, Math.round(r.octets / 1024)))} ko.</div>`;
    S.refs = await api("/api/refs");
    IDX.stores = new Map((S.refs.stores || []).map((s) => [String(s.id), s]));
    peindreLogos();
  };

  const depuisFichier = async (id, fichier) => {
    if (!fichier) return;
    try { await enregistrer(id, await reduireImage(fichier)); }
    catch (e) { $("#lgOut").innerHTML = `<div class="avis">${esc(e.message)}</div>`; }
  };

  const champ = $("#lgFile");
  cible.querySelectorAll("[data-lgf]").forEach((b) => b.onclick = () => {
    champ.value = "";
    champ.onchange = () => depuisFichier(b.dataset.lgf, champ.files[0]);
    champ.click();
  });

  // Le dépôt direct sur la ligne : c'est le geste que l'on fait spontanément avec une image.
  cible.querySelectorAll("[data-lg]").forEach((tr) => {
    tr.ondragover = (e) => { e.preventDefault(); tr.style.outline = "2px dashed var(--accent)"; };
    tr.ondragleave = () => { tr.style.outline = ""; };
    tr.ondrop = (e) => {
      e.preventDefault(); tr.style.outline = "";
      depuisFichier(tr.dataset.lg, e.dataTransfer?.files?.[0]);
    };
  });

  cible.querySelectorAll("[data-lgu]").forEach((b) => b.onclick = () => dialogue(
    "Icône depuis une URL",
    `<p class="doux">Le serveur va chercher l'image <b>une seule fois</b> et la range dans la base.
      Après ça, plus aucun appel vers l'extérieur — c'est ce qui permet de garder la page verrouillée
      sur ses propres images.</p>
     <label class="champ"><span>Adresse de l'image</span>
       <input id="lgU" placeholder="https://… ou un lien de partage Google Drive"></label>
     <p class="doux" style="font-size:12px">Un lien Drive de la forme <code>…/file/d/ID/view</code> est
       converti automatiquement, à condition que le fichier soit partagé publiquement.</p>`,
    async () => {
      const r = await api("/api/images/fetch", { method: "POST", body: { url: $("#lgU").value.trim() } });
      if (r.error) throw new Error(r.error);
      await enregistrer(b.dataset.lgu, await reduireImage(r.data_uri, r.type));
    },
    "Récupérer"));

  cible.querySelectorAll("[data-lgx]").forEach((b) => b.onclick = async () => {
    await tenter(() => api(`/api/stores/${b.dataset.lgx}/logo`, { method: "DELETE" }),
      { message: "Retrait impossible" });
    S.refs = await api("/api/refs");
    IDX.stores = new Map((S.refs.stores || []).map((s) => [String(s.id), s]));
    peindreLogos();
  });
}

/**
 * Compte transporteur Postes Canada — la carte des Réglages.
 *
 * Deux choses doivent rester lisibles d'un coup d'œil, parce qu'elles décident si un clic
 * coûte de l'argent : **dans quel milieu** on est branché (essai ou production) et **si un
 * contrat** est joint (sans contrat, ce sont les tarifs du comptoir, pas les tarifs négociés).
 * Le reste est secondaire. La clé n'est jamais réaffichée : le serveur ne la renvoie pas.
 */
async function peindreCarteCP() {
  const cible = $("#ccpc");
  if (!cible) return;
  cible.innerHTML = squelette(2);
  const e = await tenter(() => api("/api/carriers/postescanada"),
    { message: "État Postes Canada illisible" });
  if (!e) { cible.innerHTML = ""; return; }

  const verrou = (champ) => e.verrouille_par_env[champ]
    ? ' <span class="puce g" title="Défini par une variable d\'environnement Render — l\'écran ne peut pas le changer">env</span>' : "";

  cible.innerHTML = !e.configure
    ? `<div class="avis">Aucun compte Postes Canada branché. La cotation et l'achat d'étiquette
         passent par le bouchon de démonstration — <b>les prix affichés ne sont pas des tarifs réels</b>.</div>
       <div class="barre"><button type="button" class="p" id="cpSet">Brancher le compte Postes Canada…</button></div>`
    : `<div class="tbl" style="max-height:none"><table><tbody>
         <tr><td>Milieu</td><td><span class="puce ${e.production ? "a" : "g"}">${
           e.production ? "production — argent réel" : "essai — aucune facturation"}</span>${verrou("milieu")}</td></tr>
         <tr><td>Clé d'API</td><td><code>${esc(e.username)}</code>${verrou("username")}</td></tr>
         <tr><td>Numéro de client</td><td><code>${esc(e.client || "—")}</code>${verrou("client")}</td></tr>
         <tr><td>Contrat</td><td>${e.contrat ? `<code>${esc(e.contrat)}</code>${verrou("contrat")}`
           : '<span class="puce a" title="Sans contrat, Postes Canada cote au tarif du comptoir">absent — tarifs du comptoir</span>'}</td></tr>
         <tr><td>Passerelle</td><td class="doux">${esc(e.hote)}</td></tr>
       </tbody></table></div>
       <div class="barre" style="margin-top:10px">
         <button type="button" class="p" id="cpTest">Tester la connexion</button>
         <button type="button" id="cpSet">Modifier…</button>
         <button type="button" class="d" id="cpDel">Oublier les identifiants</button>
       </div>
       <p class="doux" style="font-size:12px;margin:6px 0 0">Le test ne fait qu'une <b>cotation</b> :
         il ne crée aucune étiquette et ne débite rien.</p>
       <div id="cpOut"></div>`;

  const bSet = $("#cpSet");
  if (bSet) bSet.onclick = () => dialogueCP(e);

  const bTest = $("#cpTest");
  if (bTest) bTest.onclick = async () => {
    $("#cpOut").innerHTML = squelette(3);
    const r = await tenter(() => api("/api/carriers/postescanada/test", { method: "POST" }),
      { message: "Test impossible" });
    if (!r) { $("#cpOut").innerHTML = ""; return; }
    $("#cpOut").innerHTML = !r.ok
      ? `<div class="avis"><b>Connexion refusée.</b> ${esc(r.erreur)}</div>`
      : `<div class="avis info"><b>Connexion établie</b> — ${r.n} service(s) cotés en ${num(r.ms)} ms,
           milieu ${esc(r.milieu)}, client ${esc(r.client)}.</div>
         ${r.avis ? `<div class="avis">${esc(r.avis)}</div>` : ""}
         <div class="tbl"><table>
           <thead><tr><th scope="col">Service</th><th scope="col">Code</th>
             <th scope="col" class="n">Tarif</th><th scope="col" class="n">Délai</th></tr></thead>
           <tbody>${r.tarifs.map((x) => `<tr><td>${esc(x.service)}</td>
             <td><code>${esc(x.serviceId)}</code></td>
             <td class="n">${money(x.price)}</td>
             <td class="n">${x.transitDays === null ? "—" : `${x.transitDays} j`}</td></tr>`).join("")}</tbody>
         </table></div>
         <p class="doux" style="font-size:12px">Envoi de référence : Québec → Montréal, 500 g, 9 × 6 × 2 po.</p>`;
  };

  const bDel = $("#cpDel");
  if (bDel) bDel.onclick = () => dialogue("Oublier les identifiants Postes Canada",
    `<p>La clé d'API, le numéro de client et le contrat enregistrés ici seront effacés.
      La cotation retombera sur le bouchon de démonstration.</p>
     <p class="doux">Les valeurs définies par variables d'environnement sur Render ne sont pas
      touchées : elles reviendront au prochain chargement.</p>`,
    async () => { await api("/api/carriers/postescanada/forget", { method: "POST" }); peindreCarteCP(); },
    "Oublier");
}

/**
 * Le formulaire d'identifiants.
 *
 * Le mot de passe est le seul champ qu'on ne peut pas pré-remplir — le serveur ne le renvoie
 * jamais. Laissé vide, il n'écrase rien : on peut donc corriger un numéro de contrat sans
 * avoir à retrouver la clé.
 */
function dialogueCP(e) {
  dialogue("Compte Postes Canada",
    `<p class="doux">Ces identifiants viennent du <b>Programme des développeurs</b> de Postes Canada,
      pas de vos accès au site web. Chaque milieu a sa propre paire : la clé d'essai ne
      fonctionne pas en production, et l'inverse est vrai aussi.</p>
     <div class="grille">
       <label class="champ"><span>Nom d'utilisateur d'API</span>
         <input id="cpU" autocomplete="off" placeholder="${esc(e.username || "xxxxxxxxxxxxxxxx")}"></label>
       <label class="champ"><span>Mot de passe d'API</span>
         <input id="cpP" type="password" autocomplete="new-password"
           placeholder="${e.motdepasse_present ? "inchangé" : ""}"></label>
       <label class="champ"><span>Numéro de client</span>
         <input id="cpC" value="${esc(e.client || "")}" placeholder="0005082011"></label>
       <label class="champ"><span>Numéro de contrat</span>
         <input id="cpK" value="${esc(e.contrat || "")}" placeholder="sans contrat : tarifs du comptoir"></label>
     </div>
     <label class="champ"><span>Milieu</span>
       <select id="cpE">
         <option value="essai"${e.milieu === "essai" ? " selected" : ""}>Essai — étiquettes non facturées, non livrables</option>
         <option value="prod"${e.milieu === "prod" ? " selected" : ""}>Production — argent réel</option>
       </select></label>
     <div class="avis" id="cpAvis" hidden><b>Milieu de production.</b> Les étiquettes achetées
       seront facturées au compte ${esc(e.client || "Postes Canada")} et réellement livrables.
       L'achat reste bloqué tant que <code>CLONE_ALLOW_LABELS</code> n'est pas armé.</div>`,
    async () => {
      const env = $("#cpE").value;
      const r = await api("/api/carriers/postescanada", { method: "POST", body: {
        username: $("#cpU").value.trim() || undefined,
        password: $("#cpP").value || undefined,
        customer: $("#cpC").value.trim(),
        contract: $("#cpK").value.trim(),
        env, confirme: env === "prod",
      } });
      if (r && r.error) throw new Error(r.error);
      peindreCarteCP();
    },
    "Enregistrer",
    (c) => {
      const maj = () => { c.querySelector("#cpAvis").hidden = c.querySelector("#cpE").value !== "prod"; };
      c.querySelector("#cpE").onchange = maj; maj();
    });
}

  // Deux cartes « Import Shopify » coexistaient sur cet écran, l'une résumé de l'autre.
