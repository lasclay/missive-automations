<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expéditions — Lasclay</title>
<style>
  :root {
    --bg:#f5f6f8; --carte:#fff; --bord:#dde1e6; --texte:#181c20; --doux:#6b7480;
    --accent:#1a56db; --vert:#0b7a4b; --ambre:#9a5b06; --rouge:#c0392b; --sel:#eaf1ff; --barre:#1f2937;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131619; --carte:#1b1f23; --bord:#2b3137; --texte:#e6e9ec; --doux:#98a1ab;
            --accent:#5b8cf5; --vert:#3dc98a; --ambre:#e0a33e; --rouge:#f0705f; --sel:#1d2740; --barre:#0e1114; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--texte) }
  a { color:var(--accent) }
  /* ---- structure ---- */
  nav h1 { font-size:14px; margin:0 0 4px; padding:0 16px 10px; border-bottom:1px solid rgba(255,255,255,.12);
           font-weight:650; letter-spacing:.2px }
  nav h1 small { display:block; font-weight:400; color:#9aa3ad; font-size:11px; margin-top:2px; line-height:1.6 }
  nav h1 small a { color:#9aa3ad; text-decoration:underline; cursor:pointer }
  nav h1 small a:hover { color:#fff }
  nav a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 16px;
          color:#c7cdd4; text-decoration:none; font-size:13.5px; cursor:pointer; border-left:3px solid transparent }
  nav a:hover { background:rgba(255,255,255,.06); color:#fff }
  nav a.actif { background:rgba(255,255,255,.10); color:#fff; border-left-color:var(--accent); font-weight:600 }
  nav .grp { padding:12px 16px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:#78828d }
  nav .n { background:rgba(255,255,255,.14); border-radius:9px; padding:0 7px; font-size:11px; font-variant-numeric:tabular-nums }
  h2 { font-size:17px; margin:0 0 3px; font-weight:650 }
  .sous { color:var(--doux); font-size:13px; margin:0 0 14px }
  /* ---- éléments ---- */
  input,select,textarea,button { font:inherit; padding:6px 9px; border:1px solid var(--bord);
    border-radius:6px; background:var(--carte); color:var(--texte) }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; width:100%; min-height:280px }
  button { cursor:pointer } button:hover:not(:disabled) { border-color:var(--accent) }
  button:disabled { opacity:.45; cursor:not-allowed }
  button.p { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button.d { border-color:var(--rouge); color:var(--rouge) }
  .barre { display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:10px }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:9px; padding:14px; margin-bottom:12px }
  .grille { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)) }
  .kpi { background:var(--carte); border:1px solid var(--bord); border-radius:9px; padding:12px 14px }
  .kpi .v { font-size:23px; font-weight:660; font-variant-numeric:tabular-nums; letter-spacing:-.4px }
  .kpi .l { color:var(--doux); font-size:12px; margin-top:2px }
  .kpi.vert .v { color:var(--vert) } .kpi.ambre .v { color:var(--ambre) }
  .tbl { background:var(--carte); border:1px solid var(--bord); border-radius:9px; overflow:auto; max-height:66vh }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  th { position:sticky; top:0; background:var(--carte); border-bottom:1px solid var(--bord); text-align:left;
       padding:8px 10px; font-weight:600; white-space:nowrap; z-index:2; cursor:pointer }
  th:hover { color:var(--accent) }
  td { padding:6px 10px; border-bottom:1px solid var(--bord); white-space:nowrap }
  tr.sel td { background:var(--sel) }
  /* Colonnes épinglées : elles restent en place quand la grille défile latéralement. */
  th.pin, td.pin { position:sticky; background:var(--carte); z-index:1 }
  th.pin { z-index:3 }
  th.pin1, td.pin1 { left:26px } th.pin2, td.pin2 { left:170px }
  td.pin { box-shadow:1px 0 0 var(--bord) }
  tr.sel td.pin { background:var(--sel) }
  tr.clic { cursor:pointer } tr.clic:hover td { background:var(--sel) }
  .n, th.n { text-align:right; font-variant-numeric:tabular-nums }
  .puce { font-size:10.5px; padding:1px 7px; border-radius:9px; font-weight:600; display:inline-block; white-space:nowrap }
  .puce.v { background:rgba(11,122,75,.15); color:var(--vert) }
  .puce.a { background:rgba(154,91,6,.16); color:var(--ambre) }
  .puce.r { background:rgba(192,57,43,.14); color:var(--rouge) }
  .puce.g { background:rgba(120,130,140,.16); color:var(--doux) }
  .doux { color:var(--doux) }
  .avis { padding:9px 12px; border-radius:7px; margin-bottom:12px; font-size:13px;
          background:rgba(154,91,6,.12); color:var(--ambre); border:1px solid rgba(154,91,6,.3) }
  .avis.info { background:rgba(26,86,219,.10); color:var(--accent); border-color:rgba(26,86,219,.3) }
  .onglets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center }
  .ong { padding:4px 11px; border:1px solid var(--bord); border-radius:14px; background:var(--carte);
         cursor:pointer; font-size:12.5px }
  .ong.actif { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  dialog { border:1px solid var(--bord); border-radius:11px; background:var(--carte); color:var(--texte);
           padding:0; max-width:800px; width:94vw; max-height:88vh }
  dialog h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--bord); font-size:15px }
  dialog .c { padding:14px 16px; overflow:auto; max-height:64vh }
  dialog .f { padding:10px 16px; border-top:1px solid var(--bord); display:flex; gap:8px; justify-content:flex-end }
  dialog::backdrop { background:rgba(0,0,0,.5) }
  label.ch { display:inline-flex; align-items:center; gap:5px; font-size:13px }
  .champ { display:block; margin-bottom:9px } .champ span { display:block; font-size:12px; color:var(--doux); margin-bottom:3px }
  .champ input, .champ select { width:100% }
  .bar { height:7px; background:var(--bord); border-radius:4px; overflow:hidden; margin-top:5px }
  .bar i { display:block; height:100%; background:var(--vert) }

  /* ══════════════════════ écran Commandes — layout ShipStation à 3 colonnes ══════════════════════
     La densité n'est pas un choix esthétique : c'est un outil d'opérateur d'entrepôt, et le
     nombre de commandes visibles d'un coup d'œil détermine la vitesse de tri d'un arriéré. */
  .ss { display:grid; grid-template-columns:196px minmax(0,1fr) 336px; gap:0; height:100%; min-height:0 }
  .ssL { border-right:1px solid var(--bord); background:var(--carte); overflow:auto; padding:8px 0 24px }
  .ssLt { font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--doux);
          padding:12px 12px 5px; font-weight:700 }
  .ssLi { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 12px;
          font-size:13px; cursor:pointer; border-left:3px solid transparent; color:var(--texte) }
  .ssLi:hover { background:var(--sel) }
  .ssLi.actif { background:var(--sel); border-left-color:var(--accent); font-weight:650 }
  .ssLi .n { color:var(--doux); font-size:11.5px; font-variant-numeric:tabular-nums }
  .ssL .vide { padding:6px 12px; font-size:12px; color:var(--doux) }
  .ssC { display:flex; flex-direction:column; min-width:0; overflow:hidden }
  .ssR { border-left:1px solid var(--bord); background:var(--carte); overflow:auto; padding:0 0 60px;
         display:flex; flex-direction:column }

  .ongVues { display:flex; gap:2px; padding:6px 10px 0; overflow-x:auto; border-bottom:1px solid var(--bord); flex:none }
  .ongVues .ong { padding:5px 11px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0;
                  font-size:12.5px; cursor:pointer; white-space:nowrap; color:var(--doux) }
  .ongVues .ong i { font-style:normal; opacity:.65; font-variant-numeric:tabular-nums }
  .ongVues .ong:hover { background:var(--sel); color:var(--texte) }
  .ongVues .ong.actif { background:var(--bg); border-color:var(--bord); color:var(--texte); font-weight:650;
                        margin-bottom:-1px; border-bottom:1px solid var(--bg) }

  .barreF, .barreA { display:flex; gap:6px; align-items:center; padding:7px 10px; flex:none;
                     border-bottom:1px solid var(--bord); overflow-x:auto; white-space:nowrap }
  .barreF > *, .barreA > * { flex:none }
  .barreF input, .barreF select, .barreA button { padding:4px 8px; font-size:12.5px; border-radius:5px }
  .barreF #fq { min-width:250px }
  .barreF .sep { width:1px; height:20px; background:var(--bord); margin:0 3px; flex:none }
  .barreF button.on { background:var(--sel); border-color:var(--accent); color:var(--accent) }
  .barreA { background:var(--carte) }
  .barreA .nsel { font-size:12.5px; color:var(--doux); min-width:118px }
  .barreA button.v { background:var(--vert); border-color:var(--vert); color:#fff; font-weight:650 }

  .grilleWrap { flex:1; overflow:auto; min-height:0 }
  table.tblCmd { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  table.tblCmd th { position:sticky; top:0; z-index:3; background:var(--carte); border-bottom:1px solid var(--bord);
                    text-align:left; padding:7px 9px; font-weight:650; white-space:nowrap; cursor:pointer; font-size:12px }
  table.tblCmd td { padding:6px 9px; border-bottom:1px solid var(--bord); white-space:nowrap; max-width:320px;
                    overflow:hidden; text-overflow:ellipsis }
  .grilleWrap.dense table.tblCmd td { padding:3px 9px; font-size:12.5px }
  .grilleWrap.dense table.tblCmd th { padding:5px 9px }
  table.tblCmd tr.sel td { background:var(--sel) }
  table.tblCmd tbody tr:hover td { background:var(--sel) }
  table.tblCmd .cx { width:26px; padding-left:8px; padding-right:0 }
  table.tblCmd [data-fig] { position:sticky; left:0; z-index:2; background:var(--carte) }
  .chev { cursor:pointer; color:var(--doux); user-select:none }
  tr.arts td { background:var(--bg); white-space:normal }
  .artL > div, .artG > div { font-size:12.5px; padding:1px 0 }
  .sku { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--doux) }
  .tag { font-size:10.5px; padding:1px 7px; border-radius:9px; font-weight:600; white-space:nowrap;
         background:color-mix(in srgb, var(--c) 20%, transparent); color:var(--c); border:1px solid var(--c) }
  table.tblCmd tr.grp td { background:var(--bg); font-size:12px; color:var(--doux);
                           padding:5px 10px; border-bottom:1px solid var(--bord); position:sticky }
  .ongVues .ong.sauver { color:var(--accent); border-style:dashed; border-color:var(--bord) }
  .pag { display:flex; gap:8px; align-items:center; padding:7px 10px; border-top:1px solid var(--bord); flex:none; font-size:12.5px }
  .vide2 { padding:60px 20px; text-align:center }
  .vide2 button { margin-top:12px }
  .vide3 { padding:28px 16px; color:var(--doux); font-size:13px }

  /* ---- sidebar d'expédition (Configure Shipment Widget) ---- */
  .ssR .sec { border-bottom:1px solid var(--bord); padding:11px 13px }
  .ssR h4 { margin:0 0 7px; font-size:13px; font-weight:650; display:flex; gap:6px; align-items:center }
  .ssR .adr { font-size:12.5px; line-height:1.5 }
  .ssR .kv { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2px 0 }
  .ssR .kv span { color:var(--doux) }
  .ssR .champ { margin-bottom:6px } .ssR .champ span { font-size:11px }
  .ssR .champ input, .ssR .champ select { padding:4px 7px; font-size:12.5px }
  .ssR .dims { display:flex; gap:4px; align-items:center; margin-bottom:6px }
  .ssR .dims input { width:100%; padding:4px 6px; font-size:12.5px }
  .ssR .note { font-size:12.5px; background:var(--bg); border-radius:6px; padding:6px 8px; margin-bottom:6px }
  textarea.petit { min-height:56px; font-size:12.5px; margin-bottom:6px }
  .rouge { color:var(--rouge) } .vert { color:var(--vert) }

  .ssR .pied { position:sticky; bottom:0; margin-top:auto; background:var(--carte); border-top:1px solid var(--bord);
               padding:9px 13px; display:flex; gap:6px; z-index:5 }
  .ssR .pied button.v { flex:1; background:var(--vert); border-color:var(--vert); color:#fff; font-weight:650 }
  .ssR .autres { margin:6px 0 }
  .ssR .autres summary { cursor:pointer; font-size:12.5px; color:var(--doux); padding:3px 0 }
  .ssR .autres label.ch { display:flex; padding:3px 0; font-size:12.5px }
  .valA { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
          border-radius:50%; font-size:11px; font-weight:700; color:#fff }
  .valA.ok { background:var(--vert) } .valA.warn { background:var(--ambre) } .valA.err { background:var(--rouge) }
  .lienMap { color:var(--ambre); text-decoration:underline; cursor:pointer }
  /* ---- menus flottants (Other Actions, Apply Preset, Print) ---- */
  .menuF { position:fixed; z-index:40; background:var(--carte); border:1px solid var(--bord); border-radius:8px;
           box-shadow:0 8px 26px rgba(0,0,0,.18); min-width:224px; padding:4px; max-height:70vh; overflow:auto }
  .menuF .mi { padding:6px 10px; font-size:13px; cursor:pointer; border-radius:5px; display:flex;
               justify-content:space-between; gap:12px; align-items:center }
  .menuF .mi:hover { background:var(--sel) }
  .menuF .mi.danger { color:var(--rouge) }
  .menuF .sep { height:1px; background:var(--bord); margin:4px 2px }
  kbd { font:11px ui-monospace,Menlo,monospace; background:var(--bg); border:1px solid var(--bord);
        border-radius:4px; padding:0 4px; color:var(--doux) }
  .cols { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:2px }
  .cols .col { justify-content:flex-start; padding:3px 5px; border-radius:5px }
  .cols .col:hover { background:var(--sel) }
  .cols .pin { border:none; background:none; padding:0 4px; opacity:.25; font-size:12px }
  .cols .pin.on { opacity:1 }
  .listeVues .lv { padding:7px 9px; border-radius:6px; cursor:pointer; display:block }
  .listeVues .lv:hover { background:var(--sel) }
  .listeVues .lv .n { float:right; color:var(--doux); font-variant-numeric:tabular-nums }

  /* ---- en-tête global ---- */
  header.top { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:0 12px; height:46px;
               background:var(--barre); color:#e8eaed; position:sticky; top:0; z-index:30 }
  header.top .marque { font-weight:700; font-size:14px; letter-spacing:.2px; margin-right:6px }
  header.top input { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#fff;
                     width:270px; padding:5px 9px; font-size:12.5px }
  header.top input::placeholder { color:#9aa3ad }
  header.top button { background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.16); color:#e8eaed;
                      padding:5px 10px; font-size:12.5px }
  header.top button:hover { background:rgba(255,255,255,.18) }
  header.top .droite { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12.5px; color:#c7cdd4 }
  header.top .pastille { background:var(--rouge); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; font-weight:700 }

  /* ---- automatisation : couches et éditeur de règles ---- */
  .couches { display:flex; align-items:center; gap:6px; flex-wrap:wrap }
  .couche { border:1px solid var(--bord); border-radius:7px; padding:6px 10px; font-size:12.5px; background:var(--bg) }
  .couche.gris { opacity:.55 }
  .couche b { display:inline-block; width:16px; color:var(--accent) }
  .couche .doux { display:block; font-size:11px }
  .fleche { color:var(--doux) }
  .critL { display:grid; grid-template-columns:1.3fr 1fr 1fr 1.6fr 28px; gap:5px; margin-bottom:5px; align-items:center }
  .critL select, .critL input { padding:4px 7px; font-size:12.5px; width:100% }
  .critL [data-suppr] { padding:2px 6px; border-color:var(--rouge); color:var(--rouge) }
  .critL [data-act] { grid-template-columns:1fr 2fr 28px }
  div[data-act].critL { grid-template-columns:1fr 2.5fr 28px }
  .ordL .ordI { padding:6px 10px; border:1px solid var(--bord); border-radius:6px; margin-bottom:4px;
                background:var(--carte); cursor:grab; font-size:13px }

  /* ══════════════ chrome global — la disposition de ShipStation ══════════════
     Navigation principale horizontale en haut (Insights · Orders · Shipments ·
     Products · Customers), sous-onglets du module juste en dessous, et la barre
     latérale gauche réservée aux statuts et aux filtres enregistrés de l'écran
     Commandes. C'est la géographie du produit d'origine : la mémoire musculaire
     de l'entrepôt en dépend plus que les libellés. */
  #app { display:flex; flex-direction:column; height:100vh; overflow:hidden }
  header.top { display:flex; align-items:center; gap:14px; padding:0 12px; height:46px;
               background:var(--barre); color:#e8eaed; position:sticky; top:0; z-index:30; flex:none }
  header.top .marque { font-weight:700; font-size:14.5px; letter-spacing:.2px; cursor:pointer; padding-right:4px }
  header.top nav.mods { display:flex; gap:2px; height:100%; align-items:stretch }
  header.top nav.mods a { display:flex; align-items:center; gap:6px; padding:0 13px; color:#c7cdd4;
                          text-decoration:none; font-size:13.5px; cursor:pointer; border-bottom:3px solid transparent }
  header.top nav.mods a:hover { background:rgba(255,255,255,.08); color:#fff }
  header.top nav.mods a.actif { color:#fff; font-weight:650; border-bottom-color:#fff }
  header.top nav.mods .n { background:rgba(255,255,255,.18); border-radius:9px; padding:0 6px;
                           font-size:11px; font-variant-numeric:tabular-nums }
  header.top .droite { margin-left:auto; display:flex; gap:6px; align-items:center }
  header.top input#quick { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#fff;
                           width:250px; padding:5px 9px; font-size:12.5px }
  header.top input#quick::placeholder { color:#9aa3ad }
  header.top .ico, header.top .profil { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14);
                                        color:#e8eaed; padding:4px 9px; font-size:13px; position:relative }
  header.top .ico:hover, header.top .profil:hover { background:rgba(255,255,255,.18) }
  header.top .pastille { position:absolute; top:-5px; right:-5px; background:var(--rouge); color:#fff;
                         border-radius:9px; padding:0 5px; font-size:10.5px; font-weight:700 }
  .sousnav { display:flex; gap:2px; align-items:center; padding:0 12px; height:34px; flex:none;
             background:var(--carte); border-bottom:1px solid var(--bord) }
  .sousnav a { padding:4px 11px; font-size:12.5px; color:var(--doux); cursor:pointer; border-radius:6px }
  .sousnav a:hover { background:var(--sel); color:var(--texte) }
  .sousnav a.actif { background:var(--sel); color:var(--texte); font-weight:650 }
  .sousnav:empty { display:none }
  main { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden }
  #vue { flex:1; min-height:0; overflow:auto; padding:16px 20px 60px }
  /* L'écran Commandes gère lui-même sa disposition : pas de marge autour de la grille. */
  body[data-page="commandes"] #vue, body[data-page="attente"] #vue { padding:0; overflow:hidden }
  /* Bandeaux d'état : une ligne compacte, repliable — ils ne doivent pas manger la grille. */
  #bandeau { flex:none; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
             padding:5px 12px; border-bottom:1px solid var(--bord); background:var(--carte) }
  #bandeau:empty { display:none }
  #bandeau .avis { margin:0; padding:3px 9px; font-size:11.5px; border-radius:5px }
  #bandeau .fermer { border:none; background:none; color:var(--doux); padding:0 4px; font-size:14px }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="marque" id="btMarque">Lasclay</span>
    <nav class="mods" id="mods"></nav>
    <span class="droite">
      <input type="search" id="quick" placeholder="Recherche rapide  ( / )">
      <button id="btMaj" class="ico" title="Mettre à jour les boutiques (U)">⟳</button>
      <button id="hAlertes" class="ico" title="Alertes">🔔<span class="pastille" hidden></span></button>
      <button id="btProfil" class="profil" title="Profil"><span id="hMoi"></span> ▾</button>
      <button id="btReglages" class="ico" title="Réglages">⚙</button>
      <button id="btAide" class="ico" title="Raccourcis clavier (?)">?</button>
    </span>
  </header>
  <div class="sousnav" id="sousnav"></div>
  <main>
    <div id="bandeau"></div>
    <div id="vue"></div>
  </main>
</div>

<dialog id="dlg"><h3 id="dlgT"></h3><div class="c" id="dlgC"></div>
  <div class="f"><button id="dlgN">Fermer</button><button class="p" id="dlgO">Confirmer</button></div></dialog>

<script>
// ══════════════════════════════════════════════════════════════════ utilitaires
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (v) => (Number(v) || 0).toFixed(2) + " $";
const num = (v) => (Number(v) || 0).toLocaleString("fr-CA");
const jour = (s) => (s ? String(s).slice(0, 10) : "—");

async function api(route, opts = {}) {
  const o = { headers: { "Content-Type": "application/json" }, credentials: "same-origin", ...opts };
  if (o.body && typeof o.body !== "string") o.body = JSON.stringify(o.body);
  let r;
  try {
    r = await fetch(route, o);
  } catch {
    throw new Error("service injoignable — redémarrage en cours ? réessayer dans un instant");
  }
  if (r.status === 401) { montrerConnexion(); throw new Error("session expirée"); }
  const t = await r.text();
  let j;
  try {
    j = JSON.parse(t);
  } catch {
    // Réponse non-JSON : c'est la page d'erreur de l'hébergeur, pas la nôtre. L'afficher
    // telle quelle noierait l'utilisateur sous du HTML — on traduit.
    if (r.status === 502 || r.status === 503 || r.status === 504)
      throw new Error(`service indisponible (${r.status}) — il redémarre probablement, réessayer dans une minute`);
    throw new Error(`réponse inattendue du serveur (HTTP ${r.status})`);
  }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function dialogue(titre, html, onOk, texteOk = "Confirmer", apres = null) {
  $("#dlgT").textContent = titre;
  $("#dlgC").innerHTML = html;
  if (apres) apres($("#dlgC"));
  $("#dlgO").textContent = texteOk;
  $("#dlgO").style.display = onOk ? "" : "none";
  $("#dlgO").onclick = async () => {
    try { if (await onOk?.() !== false) $("#dlg").close(); }
    catch (e) { alert(e.message); }
  };
  $("#dlgN").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
  return $("#dlgC");
}
const attendre = (t = "Un instant…") => dialogue(t, '<p class="doux">Traitement en cours…</p>', null);

/** Table générique : colonnes, lignes, sélection, tri. */
function table(cols, lignes, { sel = null, onTri = null, tri = null, dir = null, onLigne = null, cle = "id", pins = 0 } = {}) {
  const cl = (c, i) => [c.n ? "n" : "", i < pins ? `pin pin${i + 1}` : ""].filter(Boolean).join(" ");
  const th = (sel ? '<th style="width:26px"></th>' : "") + cols.map((c, i) =>
    `<th class="${cl(c, i)}" data-c="${c.k}">${esc(c.t)}${tri === c.k ? (dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
  const tr = lignes.map(l => {
    const tds = cols.map((c, i) => `<td class="${cl(c, i)}">${c.r ? c.r(l) : esc(l[c.k] ?? "—")}</td>`).join("");
    return `<tr data-id="${esc(l[cle])}" class="${onLigne ? "clic" : ""}">${sel ? `<td><input type="checkbox" data-id="${esc(l[cle])}"></td>` : ""}${tds}</tr>`;
  }).join("");
  const t = el(`<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${tr || `<tr><td colspan="${cols.length + 1}" class="doux" style="padding:22px;text-align:center">Aucun résultat</td></tr>`}</tbody></table></div>`);
  if (onTri) t.querySelectorAll("th[data-c]").forEach(h => h.onclick = () => onTri(h.dataset.c));
  if (sel) t.querySelectorAll("tbody input").forEach(cb => cb.onchange = () => {
    const id = Number(cb.dataset.id);
    cb.checked ? sel.add(id) : sel.delete(id);
    cb.closest("tr").classList.toggle("sel", cb.checked);
    document.dispatchEvent(new Event("selchange"));
  });
  if (onLigne) t.querySelectorAll("tbody tr.clic").forEach(r => r.onclick = (e) => {
    if (e.target.tagName === "INPUT") return;
    onLigne(r.dataset.id);
  });
  return t;
}

/**
 * Catalogue des colonnes de la grille — l'équivalent du « Manage Columns » de ShipStation.
 * `def` marque celles affichées par défaut ; le choix de l'utilisateur est conservé localement.
 */
/*
 * Le catalogue de colonnes de la grille Commandes vit désormais dans `COLONNES`, avec l'écran
 * Commandes lui-même, et la sélection est enregistrée **côté serveur** — par vue, ou dans le
 * réglage `colonnes_commandes` hors vue. Le stockage local a été retiré : c'est précisément ce
 * qui fait que les colonnes personnalisées de ShipStation se réinitialisent (bug communautaire
 * connu, §6 des notes de réplication).
 */

// ══════════════════════════════════════════════════════════════════ état
const S = { page: "commandes", moi: null, config: {}, refs: {}, compteurs: {}, sel: new Set(), filtres: {}, tri: "age", dir: "desc", tick: null };

/**
 * Navigation — l'arborescence exacte de ShipStation (§1.1 de la spécification).
 *
 * Les modules sont horizontaux en haut, dans cet ordre : Insights · Commandes ·
 * Expéditions · Produits · Clients. Les sous-onglets d'un module apparaissent dans la
 * barre juste en dessous — c'est là que ShipStation range Fulfillments, Retours, Lots,
 * Fin de journée et Ramassage. Les écrans de configuration ne sont pas des modules : ils
 * vivent derrière l'engrenage, comme l'espace Settings.
 *
 * Les raccourcis de navigation confirment l'arborescence : G+O commandes, G+S expéditions,
 * G+R retours, G+B lots, G+E fin de journée, G+P produits, G+C clients.
 */
const MODULES = [
  { id: "analytique", t: "Insights" },
  { id: "commandes", t: "Commandes", n: () => S.compteurs.statuts?.awaiting_shipment },
  { id: "expeditions", t: "Expéditions", sous: [
    { id: "expeditions", t: "Expéditions" },
    { id: "retours", t: "Retours" },
    { id: "lots", t: "Lots" },
    { id: "manifestes", t: "Fin de journée" },
  ] },
  { id: "produits", t: "Produits", sous: [
    { id: "produits", t: "Produits" },
    { id: "douanes", t: "Douanes (SH)" },
  ] },
  { id: "clients", t: "Clients" },
];

/** Espace de configuration — derrière l'engrenage, comme le Settings de ShipStation. */
const REGLAGES = [
  { id: "reglages", t: "Compte, boutiques et import" },
  { id: "automatisation", t: "Règles d'automatisation" },
  { id: "prereglages", t: "Préréglages d'expédition et mappings" },
  { id: "gabarits", t: "Bordereaux et courriels" },
  { id: "utilisateurs", t: "Utilisateurs et permissions" },
  { id: "alertes", t: "Alertes de commandes" },
  { id: "journal", t: "Journal d'audit" },
];

/** Page → module qui l'héberge, pour savoir quel onglet allumer. */
const MODULE_DE = {};
for (const m of MODULES) {
  MODULE_DE[m.id] = m.id;
  for (const x of (m.sous || [])) MODULE_DE[x.id] = m.id;
}
MODULE_DE.attente = "commandes";

const PERM_PAGE = { utilisateurs: "users_manage", reglages: "settings_edit", journal: "reports_view",
  analytique: "reports_view", produits: "products_view", retours: "returns_manage",
  prereglages: "settings_edit", automatisation: "settings_edit", gabarits: "settings_edit",
  douanes: "products_view" };

function autorise(id) {
  const need = PERM_PAGE[id];
  return !need || S.moi?.permissions?.[need] === true;
}

function menu() {
  const actif = MODULE_DE[S.page] || S.page;
  $("#mods").innerHTML = MODULES.filter((m) => autorise(m.id))
    .map((m) => `<a data-p="${m.id}" class="${actif === m.id ? "actif" : ""}">${esc(m.t)}<span class="n" data-n="${m.id}"></span></a>`).join("");
  $("#mods").querySelectorAll("[data-p]").forEach((a) => a.onclick = () => aller(a.dataset.p));

  const mod = MODULES.find((m) => m.id === actif);
  const sous = (mod && mod.sous || []).filter((x) => autorise(x.id));
  $("#sousnav").innerHTML = sous.length
    ? sous.map((x) => `<a data-s="${x.id}" class="${S.page === x.id ? "actif" : ""}">${esc(x.t)}</a>`).join("")
    : "";
  $("#sousnav").querySelectorAll("[data-s]").forEach((a) => a.onclick = () => aller(a.dataset.s));
  majCompteursMenu();
}

function majCompteursMenu() {
  for (const m of MODULES.filter((x) => x.n)) {
    const s = $(`[data-n="${m.id}"]`);
    if (!s) continue;
    const v = m.n();
    s.textContent = v ? num(v) : "";
    s.style.display = v ? "" : "none";
  }
  const n = Object.values(S.compteurs.alertes || {}).reduce((a, b) => a + b, 0);
  const p = $("#hAlertes .pastille");
  if (p) { p.textContent = num(n); p.hidden = !n; }
}

function aller(page) {
  if (!autorise(page)) return;
  // Un module qui a des sous-onglets ouvre le premier : cliquer « Expéditions » doit montrer
  // les expéditions, pas une page d'accueil vide.
  const mod = MODULES.find((m) => m.id === page);
  if (mod && mod.sous && mod.sous.length && !mod.sous.some((x) => x.id === page)) page = mod.sous[0].id;
  S.page = page; S.sel.clear(); S.filtres = {};
  location.hash = page;
  menu();
  rendre();
}

/** Menu de configuration — le contenu de l'engrenage. */
function menuReglages(ancre) {
  const r = ancre.getBoundingClientRect();
  document.querySelectorAll(".menuF").forEach((m) => m.remove());
  const m = el(`<div class="menuF" style="top:${r.bottom + 4}px;right:8px;left:auto">${
    REGLAGES.filter((x) => autorise(x.id)).map((x) => `<div class="mi" data-r="${x.id}">${esc(x.t)}</div>`).join("")}</div>`);
  document.body.append(m);
  m.querySelectorAll("[data-r]").forEach((d) => d.onclick = () => { m.remove(); aller(d.dataset.r); });
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once: true }), 0);
}

/** Menu de profil — second facteur, mot de passe, déconnexion. */
function menuProfil(ancre) {
  const r = ancre.getBoundingClientRect();
  document.querySelectorAll(".menuF").forEach((m) => m.remove());
  const m = el(`<div class="menuF" style="top:${r.bottom + 4}px;right:8px;left:auto">
    <div class="mi" data-a="2fa">${S.moi?.totp_enabled ? "Second facteur ✓" : "Activer le second facteur"}</div>
    <div class="mi" data-a="mdp">Changer le mot de passe</div>
    <div class="sep"></div>
    <div class="mi" data-a="alertes">Voir les alertes</div>
    <div class="sep"></div>
    <div class="mi danger" data-a="out">Se déconnecter</div></div>`);
  document.body.append(m);
  const actions = { "2fa": configurer2facteur, mdp: () => changerMotDePasse(false),
    alertes: () => aller("alertes"), out: deconnexion };
  m.querySelectorAll("[data-a]").forEach((d) => d.onclick = () => { m.remove(); actions[d.dataset.a](); });
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once: true }), 0);
}

// ══════════════════════════════════════════════════════════════════ pages
const VUES = {};

// ---------------------------------------------------------------- commandes
/**
 * Écran Commandes — reprend le layout ShipStation à trois colonnes :
 *
 *   [ statuts + vues ]   [ onglets · filtres · actions · grille ]   [ sidebar d'expédition ]
 *
 * Ce qui est repris tel quel : la hiérarchie verticale (onglets de vues avec compteurs →
 * barre de filtres → barre d'actions + bouton Colonnes → grille → pagination), la très haute
 * densité, l'expansion des articles par chevron, les colonnes épinglées (2 max), la sélection
 * Maj+clic / Ctrl+clic, et les raccourcis clavier.
 *
 * Ce qui est corrigé :
 *   • les compteurs des vues sont calculés en direct, pas seulement à l'ouverture ;
 *   • les colonnes sont enregistrées **côté serveur, par vue** (chez ShipStation elles se
 *     réinitialisent — bug communautaire connu) ;
 *   • la marge d'expédition est affichée avant l'achat (constat OBS9) ;
 *   • le mode dense se règle, au lieu d'un « Legacy vs New Layout » imposé à tout le compte ;
 *   • un libellé de service non mappé est signalé au lieu de partir en silence au défaut.
 */

/** Catalogue de colonnes (§2.3.1). `defaut` = visible dans la vue de base. */
const COLONNES = [
  { k: "order_number", t: "N° commande", defaut: 1, tri: "order_number", r: (o) => `<b>${esc(o.order_number)}</b>` },
  { k: "order_date", t: "Date", tri: "order_date", r: (o) => jour(o.order_date) },
  { k: "age", t: "Âge", defaut: 1, n: 1, tri: "age", r: (o) => `${o.age ?? "—"} j` },
  { k: "paid_at", t: "Payée le", r: (o) => jour(o.paid_at) },
  { k: "ship_by_date", t: "À expédier avant", tri: "ship_by_date", r: (o) => jour(o.ship_by_date) },
  { k: "hold_until", t: "En attente jusqu'au", tri: "hold_until", r: (o) => o.hold_until ? `<span class="puce a">${jour(o.hold_until)}</span>` : "—" },
  { k: "customer_name", t: "Destinataire", defaut: 1, tri: "customer_name", r: (o) => esc(o.customer_name) },
  { k: "company", t: "Société", r: (o) => esc(o.ship_to?.company) },
  { k: "customer_email", t: "Courriel", r: (o) => esc(o.customer_email) },
  { k: "street1", t: "Adresse", r: (o) => esc(o.ship_to?.street1) },
  { k: "city", t: "Ville", defaut: 1, r: (o) => esc(o.ship_to?.city) },
  { k: "state", t: "Prov.", defaut: 1, r: (o) => esc(o.ship_to?.state) },
  { k: "postal_code", t: "Code postal", r: (o) => esc(o.ship_to?.postalCode) },
  { k: "country", t: "Pays", defaut: 1, r: (o) => esc(o.ship_to?.country) },
  { k: "item_sku", t: "SKU", r: (o) => arts(o).map((i) => esc(i.sku)).join(", ") },
  { k: "item_name", t: "Articles", r: (o) => arts(o).map((i) => esc(i.name)).join(" · ") },
  { k: "line_count", t: "Lignes", n: 1, r: (o) => arts(o).length },
  { k: "quantity", t: "Qté", defaut: 1, n: 1, r: (o) => arts(o).reduce((s, i) => s + (i.quantity || 0), 0) },
  { k: "location", t: "Emplacement", r: (o) => arts(o).map((i) => esc(i.warehouse_location)).filter(Boolean).join(", ") },
  { k: "store", t: "Boutique", r: (o) => esc((S.refs.stores || []).find((s) => s.id === o.store_id)?.name || o.source) },
  { k: "requested_service", t: "Service demandé", defaut: 1, r: (o) => rendreDemande(o) },
  { k: "carrier_code", t: "Transporteur", r: (o) => esc(o.carrier_code) },
  { k: "service_id", t: "Service", r: (o) => nomService(o.service_id) },
  { k: "package_id", t: "Colis", r: (o) => nomColis(o.package_id) },
  { k: "confirmation", t: "Confirmation", r: (o) => nomConfirmation(o.confirmation) },
  { k: "weight_g", t: "Poids", defaut: 1, n: 1, tri: "weight_g",
    r: (o) => o.weight_g ? `${num(Math.round(o.weight_g))} g` : '<span class="puce r">manquant</span>' },
  { k: "warehouse_id", t: "Expédié de", r: (o) => esc((S.refs.warehouses || []).find((w) => w.id === o.warehouse_id)?.name) },
  { k: "amount_paid", t: "Payé", n: 1, r: (o) => money(o.amount_paid) },
  { k: "order_total", t: "Total", defaut: 1, n: 1, tri: "order_total", r: (o) => money(o.order_total) },
  { k: "shipping_paid", t: "Livraison payée", n: 1, r: (o) => money(o.shipping_paid) },
  { k: "tax_amount", t: "Taxes", n: 1, r: (o) => money(o.tax_amount) },
  { k: "assigned_user", t: "Assignée à", r: (o) => esc((S.refs.users || []).find((u) => u.id === o.assigned_user)?.name) },
  { k: "tags", t: "Étiquettes", defaut: 1, r: (o) => (o.tags || []).map(pastilleTag).join(" ") },
  { k: "custom_field1", t: "Champ perso 1", r: (o) => esc(o.custom_field1) },
  { k: "custom_field2", t: "Champ perso 2", r: (o) => esc(o.custom_field2) },
  { k: "custom_field3", t: "Champ perso 3", r: (o) => esc(o.custom_field3) },
  { k: "print_state", t: "Impression", r: (o) => o.print_state ? `<span class="puce v">${esc(o.print_state)}</span>` : "—" },
  { k: "status", t: "Statut", r: (o) => `<span class="puce g">${esc(STATUT_FR[o.status] || o.status)}</span>` },
];

const STATUT_FR = {
  awaiting_payment: "Paiement attendu", on_hold: "En attente", awaiting_shipment: "À expédier",
  pending_fulfillment: "Préparation externe", shipped: "Expédiée", cancelled: "Annulée",
};
const STATUTS_ORDRE = ["awaiting_shipment", "on_hold", "awaiting_payment", "pending_fulfillment", "shipped", "cancelled"];

const arts = (o) => (o.items || []).filter((i) => !i.adjustment);
const pastilleTag = (t) => `<span class="tag" style="--c:${esc(t.color || "#888")}">${esc(t.name)}</span>`;
const nomService = (id) => esc((S.refs.services || []).find((s) => s.id === String(id))?.name || id || "—");
const nomColis = (id) => esc((S.refs.packages || []).find((p) => p.id === String(id))?.name || id || "—");
const nomConfirmation = (c) => {
  const x = (S.refs.confirmations || []).find((k) => k.id === String(c));
  return x ? esc(x.nom) : (c ? esc(c) : "—");
};
/** Un libellé de checkout non couvert par un mapping est signalé, pas avalé (OBS6). */
function rendreDemande(o) {
  if (!o.requested_service) return "—";
  const connu = (S.nonMappes || []).includes(o.requested_service);
  return esc(o.requested_service) + (connu ? ' <span class="puce a" title="Aucun mapping de service — la commande partira au service par défaut">non mappé</span>' : "");
}

VUES.commandes = async (statutFixe) => {
  const S0 = S.cmd = S.cmd || { colonnes: null, epingles: [], vue: null, dense: true, page: 0, taille: 100 };
  if (statutFixe) S0.statut = statutFixe;
  else if (!S0.statut) S0.statut = "awaiting_shipment";

  $("#vue").innerHTML = `
  <div class="ss">
    <aside class="ssL">
      <div class="ssLt">Commandes</div>
      <div id="ssStatuts"></div>
      <div class="ssLt">Vues sauvegardées</div>
      <div id="ssVues"></div>
    </aside>
    <section class="ssC">
      <div class="ongVues" id="ongVues"></div>
      <div class="barreF" id="filtres"></div>
      <div class="barreA" id="actions"></div>
      <div id="tbl" class="grilleWrap"></div>
      <div class="pag" id="pag"></div>
    </section>
    <aside class="ssR" id="cote"></aside>
  </div>`;

  // ------------------------------------------------------------- filtres
  const F = $("#filtres");
  F.innerHTML = `
    <input type="search" id="fq" placeholder="N° commande, client, courriel, ville, SKU…  ( / )">
    <select id="fstore"><option value="">Toutes boutiques</option>${(S.refs.stores || []).filter((s) => s.active).map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
    <select id="fpays"><option value="">Tous pays</option><option>CA</option><option>US</option></select>
    <select id="fdrop"><option value="">Drop-off : tous</option><option value="oui">Admissibles (&lt; ${S.config.seuil_dropoff_g} g)</option><option value="non">Non admissibles</option></select>
    <select id="ftag"><option value="">Toutes étiquettes</option>${(S.refs.tags || []).map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>
    <input type="number" id="fpmin" placeholder="poids min" style="width:96px">
    <input type="number" id="fpmax" placeholder="poids max" style="width:96px">
    <input type="number" id="fage" placeholder="âge min (j)" style="width:104px">
    <label class="ch"><input type="checkbox" id="fnw"> sans poids</label>
    <span class="sep"></span>
    <button id="freset" title="Réinitialiser les filtres">Effacer les filtres</button>
    <button id="fdense" title="Densité de la grille">Dense</button>`;

  const lire = () => ({
    q: $("#fq").value, status: S0.statut || "", store_id: $("#fstore").value, country: $("#fpays").value,
    drop_off: $("#fdrop").value, tag_id: $("#ftag").value,
    weight_min: $("#fpmin").value, weight_max: $("#fpmax").value,
    age_min: $("#fage").value, no_weight: $("#fnw").checked ? "1" : "",
  });
  const poser = (x = {}) => {
    $("#fq").value = x.q || ""; $("#fstore").value = x.store_id || ""; $("#fpays").value = x.country || "";
    $("#fdrop").value = x.drop_off || ""; $("#ftag").value = x.tag_id || "";
    $("#fpmin").value = x.weight_min || ""; $("#fpmax").value = x.weight_max || "";
    $("#fage").value = x.age_min || ""; $("#fnw").checked = x.no_weight === "1";
  };

  let deb;
  F.querySelectorAll("input,select").forEach((i) => i.addEventListener(
    i.type === "search" || i.type === "number" ? "input" : "change",
    () => { clearTimeout(deb); deb = setTimeout(() => { S0.page = 0; charger(); }, 250); }));
  $("#freset").onclick = () => { poser({}); S0.vue = null; S0.page = 0; charger(); majVues(); };
  $("#fdense").onclick = () => { S0.dense = !S0.dense; $("#tbl").classList.toggle("dense", S0.dense); $("#fdense").classList.toggle("on", S0.dense); };
  $("#fdense").classList.toggle("on", S0.dense);

  // ------------------------------------------------------- statuts et vues
  let VUES_SAUV = [];

  function majStatuts() {
    const c = S.compteurs.statuts || {};
    $("#ssStatuts").innerHTML = STATUTS_ORDRE.map((s) =>
      `<a class="ssLi ${S0.statut === s && !S0.vue ? "actif" : ""}" data-s="${s}">${STATUT_FR[s]}<span class="n">${c[s] ? num(c[s]) : ""}</span></a>`).join("");
    $("#ssStatuts").querySelectorAll("[data-s]").forEach((a) => a.onclick = () => {
      S0.statut = a.dataset.s; S0.vue = null; S0.page = 0; S.sel.clear(); charger(); majStatuts(); majVues();
    });
  }

  async function chargerVues() {
    const d = await api("/api/views?scope=orders&counts=1");
    VUES_SAUV = d.views;
    majVues();
  }
  function majVues() {
    const lien = (v) => `<a class="ssLi ${S0.vue === v.id ? "actif" : ""}" data-v="${v.id}" title="${esc(v.notes || "")}">
        ${esc(v.name)}${v.notes && v.notes.includes("vérifier") ? ' <span class="puce a">?</span>' : ""}<span class="n">${v.n != null ? num(v.n) : ""}</span></a>`;
    $("#ssVues").innerHTML = VUES_SAUV.length ? VUES_SAUV.map(lien).join("")
      : '<div class="vide">aucune vue — charger la configuration Lasclay dans Réglages</div>';
    $("#ongVues").innerHTML = `<span class="ong ${!S0.vue ? "actif" : ""}" data-v="">${STATUT_FR[S0.statut] || "Toutes"}</span>` +
      VUES_SAUV.slice(0, 12).map((v) => `<span class="ong ${S0.vue === v.id ? "actif" : ""}" data-v="${v.id}">${esc(v.name)}${v.n != null ? ` <i>${num(v.n)}</i>` : ""}</span>`).join("") +
      (VUES_SAUV.length > 12 ? `<span class="ong" id="ongPlus">+${VUES_SAUV.length - 12}…</span>` : "") +
      `<span class="ong sauver" id="ongSave" title="Enregistrer les filtres et les colonnes actuels comme vue">+ Enregistrer la vue</span>`;

    const choisir = (id) => {
      S0.vue = id ? Number(id) : null;
      S0.page = 0; S.sel.clear();
      const v = VUES_SAUV.find((x) => x.id === S0.vue);
      S0.colonnes = v && v.columns ? v.columns : null;
      charger(); majStatuts(); majVues();
    };
    document.querySelectorAll("#ssVues [data-v], #ongVues [data-v]").forEach((a) => {
      a.onclick = () => choisir(a.dataset.v);
      a.oncontextmenu = async (e) => {
        if (!a.dataset.v) return;
        e.preventDefault();
        const v = VUES_SAUV.find((x) => x.id == a.dataset.v);
        if (!confirm(`Supprimer la vue « ${v.name} » ?`)) return;
        await api("/api/views", { method: "POST", body: { id: v.id, delete: true } });
        if (S0.vue === v.id) S0.vue = null;
        chargerVues(); charger();
      };
    });
    const bs = $("#ongSave");
    if (bs) bs.onclick = enregistrerVue;
    const plus = $("#ongPlus");
    if (plus) plus.onclick = () => dialogue("Toutes les vues",
      `<div class="listeVues">${VUES_SAUV.map((v) => `<div class="lv" data-v="${v.id}"><b>${esc(v.name)}</b>
        <span class="n">${v.n != null ? num(v.n) : ""}</span>
        ${v.notes ? `<div class="doux">${esc(v.notes)}</div>` : ""}</div>`).join("")}</div>`,
      null, "Fermer", (c) => c.querySelectorAll("[data-v]").forEach((d) => d.onclick = () => { $("#dlg").close(); choisir(d.dataset.v); }));
  }

  function enregistrerVue() {
    dialogue("Enregistrer la vue", `
      <label class="champ"><span>Nom</span><input id="nv"></label>
      <p class="doux">Les filtres actifs et les colonnes visibles sont enregistrés ensemble, et
      partagés avec toute l'équipe. Modifier une vue existante la remplace — chez ShipStation
      cela en créait une nouvelle à chaque fois, d'où les 27 vues dont plusieurs datées.</p>`,
      async () => {
        const nom = $("#nv").value.trim(); if (!nom) return false;
        await api("/api/views", { method: "POST", body: {
          name: nom, scope: "orders", filters: lire(), columns: colonnesActives().map((c) => c.k) } });
        chargerVues();
      }, "Enregistrer");
  }

  // ---------------------------------------------------------- colonnes
  const colonnesActives = () => {
    const cles = S0.colonnes || COLONNES.filter((c) => c.defaut).map((c) => c.k);
    return cles.map((k) => COLONNES.find((c) => c.k === k)).filter(Boolean);
  };

  function gererColonnes() {
    const actives = colonnesActives().map((c) => c.k);
    dialogue("Colonnes", `
      <p class="doux">Cochez les colonnes à afficher, épinglez-en jusqu'à deux pour qu'elles
      restent visibles pendant le défilement horizontal. L'ordre suit celui de la liste.</p>
      <div class="cols">${COLONNES.map((c) => `<label class="ch col">
        <input type="checkbox" data-c="${c.k}" ${actives.includes(c.k) ? "checked" : ""}>
        <span>${esc(c.t)}</span>
        <button class="pin ${S0.epingles.includes(c.k) ? "on" : ""}" data-pin="${c.k}" title="Épingler">📌</button>
      </label>`).join("")}</div>`,
      async () => {
        S0.colonnes = COLONNES.filter((c) => $(`[data-c="${c.k}"]`).checked).map((c) => c.k);
        // Persistance côté serveur, attachée à la vue : chez ShipStation les colonnes se
        // réinitialisent parce qu'elles vivent côté navigateur.
        if (S0.vue) {
          const v = VUES_SAUV.find((x) => x.id === S0.vue);
          if (v) await api("/api/views", { method: "POST", body: { ...v, columns: S0.colonnes } });
        } else {
          await api("/api/settings", { method: "POST", body: { colonnes_commandes: S0.colonnes } });
        }
        charger();
      }, "Appliquer",
      (c) => c.querySelectorAll("[data-pin]").forEach((b) => b.onclick = (e) => {
        e.preventDefault();
        const k = b.dataset.pin;
        const i = S0.epingles.indexOf(k);
        if (i >= 0) S0.epingles.splice(i, 1);
        else { S0.epingles.push(k); if (S0.epingles.length > 2) S0.epingles.shift(); }
        c.querySelectorAll("[data-pin]").forEach((x) => x.classList.toggle("on", S0.epingles.includes(x.dataset.pin)));
      }));
  }

  // ------------------------------------------------------------- grille
  let LIGNES = [], dernierIndex = null;

  async function charger() {
    const f = S0.vue ? { q: $("#fq").value, view_id: S0.vue } : lire();
    const p = new URLSearchParams({ ...f, sort: S.tri, dir: S.dir,
      limit: S0.taille, offset: S0.page * S0.taille });
    const d = await api("/api/orders?" + p);
    LIGNES = d.orders;
    S.total = d.total;
    dessiner(d);
    majPagination(d);
    majActions();
    cote();
  }

  const LIBELLE_GROUPE = { store: "Boutique", line_count: "Lignes", quantity: "Quantité",
    country: "Pays", item_name: "Article", item_sku: "SKU", requested_service: "Service demandé" };

  /** Clé de regroupement d'une commande, selon le « Group By » choisi. */
  function cleGroupe(o) {
    switch (S0.groupe) {
      case "store": return (S.refs.stores || []).find((x) => x.id === o.store_id)?.name || "—";
      case "line_count": return `${arts(o).length} ligne(s)`;
      case "quantity": return `${arts(o).reduce((n, i) => n + (i.quantity || 0), 0)} article(s)`;
      case "country": return o.ship_to?.country || "—";
      case "item_name": return arts(o)[0]?.name || "—";
      case "item_sku": return arts(o)[0]?.sku || "—";
      case "requested_service": return o.requested_service || "—";
      default: return null;
    }
  }

  function dessiner(d) {
    const cols = colonnesActives();
    const epingle = (k) => S0.epingles.includes(k) ? ` class="fig"` : "";
    const th = `<th class="cx"><input type="checkbox" id="tout"></th><th class="cx"></th>` +
      cols.map((c) => `<th data-t="${c.tri || ""}"${c.n ? ' class="n"' : ""}${S0.epingles.includes(c.k) ? " data-fig=1" : ""}>${esc(c.t)}${S.tri === c.tri ? (S.dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
    // Le regroupement suppose des lignes contiguës : on trie côté client sur la clé de groupe
    // avant de dessiner, sans toucher au tri de colonne choisi à l'intérieur d'un groupe.
    if (S0.groupe) d.orders.sort((a, b) => String(cleGroupe(a)).localeCompare(String(cleGroupe(b)), "fr"));
    let groupeCourant = null;
    const tr = d.orders.map((o) => {
      const drop = o.weight_g > 0 && o.weight_g < d.seuil;
      let enTeteGroupe = "";
      if (S0.groupe) {
        const g = cleGroupe(o);
        if (g !== groupeCourant) {
          groupeCourant = g;
          enTeteGroupe = `<tr class="grp"><td colspan="${cols.length + 2}">
            ${esc(LIBELLE_GROUPE[S0.groupe] || S0.groupe)} : <b>${esc(g)}</b></td></tr>`;
        }
      }
      return enTeteGroupe + `<tr data-id="${o.id}" class="${S.sel.has(String(o.id)) ? "sel" : ""}">
        <td class="cx"><input type="checkbox" data-id="${o.id}" ${S.sel.has(String(o.id)) ? "checked" : ""}></td>
        <td class="cx">${arts(o).length > 1 ? `<span class="chev" data-x="${o.id}">▸</span>` : ""}</td>
        ${cols.map((c) => `<td${c.n ? ' class="n"' : ""}${S0.epingles.includes(c.k) ? ' data-fig=1' : ""}>${c.r(o)}${
          c.k === "order_number" && drop ? ' <span class="puce v" title="Admissible au tarif de dépôt en bureau de poste">dépôt</span>' : ""}</td>`).join("")}
      </tr>` + (arts(o).length > 1 ? `<tr class="arts" data-arts="${o.id}" hidden><td></td><td></td>
        <td colspan="${cols.length}"><div class="artL">${arts(o).map((i) =>
          `<div><span class="sku">${esc(i.sku)}</span> ${esc(i.name)} <b>×${i.quantity}</b>
           ${i.warehouse_location ? `<span class="doux">· ${esc(i.warehouse_location)}</span>` : ""}</div>`).join("")}</div></td></tr>` : "");
    }).join("");

    $("#tbl").className = "grilleWrap" + (S0.dense ? " dense" : "");
    $("#tbl").innerHTML = d.orders.length
      ? `<table class="tblCmd"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`
      : `<div class="vide2"><b>Aucune commande</b><div class="doux">${S0.vue ? "Cette vue ne ramène rien pour l'instant." : "Rien à expédier dans ce statut."}</div>
         <button class="p" onclick="importerShopify()">Importer depuis Shopify</button></div>`;

    $("#tbl").querySelectorAll("th[data-t]").forEach((h) => h.onclick = () => {
      const c = h.dataset.t; if (!c) return;
      S.tri === c ? (S.dir = S.dir === "asc" ? "desc" : "asc") : (S.tri = c, S.dir = "desc");
      charger();
    });
    const tout = $("#tout");
    if (tout) tout.onclick = () => {
      d.orders.forEach((o) => tout.checked ? S.sel.add(String(o.id)) : S.sel.delete(String(o.id)));
      dessiner(d); majActions(); cote();
    };
    $("#tbl").querySelectorAll("tbody input[type=checkbox]").forEach((b, i) => b.onclick = (e) => {
      e.stopPropagation();
      basculer(String(b.dataset.id), i, e.shiftKey);
    });
    $("#tbl").querySelectorAll("[data-x]").forEach((c) => c.onclick = (e) => {
      e.stopPropagation();
      const l = $(`[data-arts="${c.dataset.x}"]`);
      l.hidden = !l.hidden; c.textContent = l.hidden ? "▸" : "▾";
    });
    $("#tbl").querySelectorAll("tr[data-id]").forEach((r, i) => {
      r.onclick = (e) => {
        if (e.target.tagName === "INPUT" || e.target.dataset.x) return;
        if (e.ctrlKey || e.metaKey || e.shiftKey) return basculer(r.dataset.id, i, e.shiftKey);
        S.sel.clear(); S.sel.add(r.dataset.id);
        document.querySelectorAll("tr[data-id]").forEach((x) => x.classList.toggle("sel", x.dataset.id === r.dataset.id));
        document.querySelectorAll("tbody input[type=checkbox]").forEach((x) => x.checked = x.dataset.id === r.dataset.id);
        majActions(); cote();
      };
      r.ondblclick = () => detailCommande(Number(r.dataset.id));
    });
  }

  function basculer(id, index, plage) {
    if (plage && dernierIndex != null) {
      const [a, b] = [Math.min(dernierIndex, index), Math.max(dernierIndex, index)];
      LIGNES.slice(a, b + 1).forEach((o) => S.sel.add(String(o.id)));
    } else {
      S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
      dernierIndex = index;
    }
    document.querySelectorAll("tr[data-id]").forEach((r) => r.classList.toggle("sel", S.sel.has(r.dataset.id)));
    document.querySelectorAll("tbody input[type=checkbox]").forEach((c) => c.checked = S.sel.has(String(c.dataset.id)));
    majActions(); cote();
  }

  function majPagination(d) {
    const debut = S0.page * S0.taille;
    $("#pag").innerHTML = `
      <span class="doux">${num(debut + 1)}–${num(Math.min(debut + d.orders.length, d.total))} sur <b>${num(d.total)}</b></span>
      <button id="pPrec" ${S0.page ? "" : "disabled"}>← Précédent</button>
      <button id="pSuiv" ${debut + d.orders.length >= d.total ? "disabled" : ""}>Suivant →</button>
      <select id="pTaille">${[50, 100, 200, 500].map((n) => `<option ${n === S0.taille ? "selected" : ""}>${n}</option>`).join("")}</select>
      <span class="doux">par page</span>`;
    $("#pPrec").onclick = () => { S0.page--; charger(); };
    $("#pSuiv").onclick = () => { S0.page++; charger(); };
    $("#pTaille").onchange = (e) => { S0.taille = Number(e.target.value); S0.page = 0; charger(); };
  }

  // ------------------------------------------------------- barre d'actions
  const A = $("#actions");
  // Ordre repris tel quel de ShipStation (§2.7) : Coter · Imprimer · Assigner · Étiqueter ·
  // Préréglage · Créer + imprimer l'étiquette · Autres actions. Le bouton Colonnes est à
  // l'extrémité droite de cette même barre, pas dans les filtres.
  A.innerHTML = `
    <span class="nsel" id="nsel">aucune sélection</span>
    <button id="aRate" title="Coter la sélection (R)">Coter</button>
    <button id="aPrint">Imprimer ▾</button>
    <button id="aAssign">Assigner ▾</button>
    <button id="aTag">Étiqueter ▾</button>
    <button id="aPreset">Préréglage ▾</button>
    <button id="aBuy" class="v" title="Créer et imprimer les étiquettes (S)">Créer + imprimer l'étiquette</button>
    <button id="aAutres">Autres actions ▾</button>
    <span style="margin-left:auto"></span>
    <button id="aGroupe" title="Grouper les commandes">Grouper ▾</button>
    <button id="aCols">Colonnes</button>`;

  const ids = () => [...S.sel];
  const majActions = () => {
    const n = S.sel.size;
    $("#nsel").textContent = n ? `${n} sélectionnée${n > 1 ? "s" : ""}` : "aucune sélection";
    ["aRate", "aPreset", "aPrint", "aTag", "aAssign", "aBuy", "aAutres"].forEach((i) => { const b = $("#" + i); if (b) b.disabled = !n; });
    const b = $("#aBuy"); if (b) b.disabled = !n || !S.config.etiquettes_actives;
  };
  $("#aCols").onclick = gererColonnes;
  // « Group By » de l'onglet À expédier : les sept regroupements documentés (§2.3.3).
  $("#aGroupe").onclick = () => menuFlottant("aGroupe", [
    { t: "Aucun regroupement", f: () => { S0.groupe = null; charger(); } },
    ...[["store", "Boutique"], ["line_count", "Nombre de lignes"], ["quantity", "Quantité"],
        ["country", "Pays"], ["item_name", "Article"], ["item_sku", "SKU"],
        ["requested_service", "Service demandé"]]
      .map(([k, t]) => ({ t, f: () => { S0.groupe = k; charger(); } })),
  ]);

  const menuFlottant = (bouton, entrees) => {
    const anc = $("#" + bouton).getBoundingClientRect();
    document.querySelectorAll(".menuF").forEach((m) => m.remove());
    const m = el(`<div class="menuF" style="top:${anc.bottom + 4}px;left:${anc.left}px">${
      entrees.map((e, i) => e.sep ? '<div class="sep"></div>'
        : `<div class="mi ${e.danger ? "danger" : ""}" data-i="${i}">${esc(e.t)}${e.hk ? `<kbd>${e.hk}</kbd>` : ""}</div>`).join("")}</div>`);
    document.body.append(m);
    m.querySelectorAll("[data-i]").forEach((d) => d.onclick = () => { m.remove(); entrees[d.dataset.i].f(); });
    setTimeout(() => document.addEventListener("click", () => m.remove(), { once: true }), 0);
  };

  $("#aRate").onclick = async () => {
    const id = Number(ids()[0]);
    attendre("Cotation");
    try {
      const r = await api("/api/shipments/quote", { method: "POST", body: { order_id: id } });
      dialogue("Tarifs", tableauTarifs(r), null, "Fermer");
    } catch (e) { dialogue("Cotation impossible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }
  };

  $("#aPreset").onclick = () => menuFlottant("aPreset", [
    ...(S.refs.presets || []).map((p) => ({ t: `${p.name}${p.hotkey ? "" : ""}`, hk: p.hotkey || "",
      f: async () => { await api("/api/presets/apply", { method: "POST", body: { preset_id: p.id, ids: ids() } }); charger(); } })),
    { sep: 1 }, { t: "Gérer les préréglages…", f: () => aller("prereglages") },
  ]);

  $("#aPrint").onclick = () => menuFlottant("aPrint", [
    { t: "Étiquette", f: () => window.open(`/api/labels?ids=${ids().join(",")}`, "_blank") },
    { t: "Bordereau de préparation", hk: "P+S", f: () => window.open(`/api/packing-slip?ids=${ids().join(",")}`, "_blank") },
    { t: "Liste de prélèvement", hk: "P+L", f: () => window.open(`/api/pick-list?ids=${ids().join(",")}`, "_blank") },
    { t: "Résumé de commande", hk: "O+S", f: () => window.open(`/api/packing-slip?ids=${ids().join(",")}&resume=1`, "_blank") },
    { t: "Formulaires de douane", f: () => window.open(`/api/packing-slip?ids=${ids().join(",")}&douane=1`, "_blank") },
    { sep: 1 },
    { t: "Exporter la sélection (CSV)", f: () => window.open(`/api/export/orders?ids=${ids().join(",")}`, "_blank") },
  ]);

  $("#aTag").onclick = () => menuFlottant("aTag", [
    ...(S.refs.tags || []).map((t) => ({ t: t.name,
      f: async () => { await api("/api/orders/tag", { method: "POST", body: { ids: ids(), tag_id: t.id } }); charger(); } })),
    { sep: 1 },
    { t: "Retirer une étiquette…", f: () => dialogue("Retirer une étiquette",
      `<label class="champ"><span>Étiquette</span><select id="tg">${(S.refs.tags || []).map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>`,
      async () => { await api("/api/orders/tag", { method: "POST", body: { ids: ids(), tag_id: Number($("#tg").value), remove: true } }); charger(); }) },
  ]);

  $("#aAssign").onclick = () => menuFlottant("aAssign", [
    ...(S.refs.users || []).map((u) => ({ t: u.name,
      f: async () => { await api("/api/orders/assign", { method: "POST", body: { ids: ids(), user_id: u.id } }); charger(); } })),
    { sep: 1 }, { t: "Retirer l'assignation", f: async () => { await api("/api/orders/assign", { method: "POST", body: { ids: ids(), user_id: null } }); charger(); } },
  ]);

  $("#aAutres").onclick = () => menuFlottant("aAutres", [
    { t: "Marquer comme expédiée…", hk: "M+S", f: marquerExpedie },
    { t: "Fusionner les expéditions", f: fusionner },
    { t: "Scinder la commande…", f: scinderSelection },
    { sep: 1 },
    { t: "Configuration d'expédition en masse…", f: configurerEnMasse },
    { t: "Mettre en attente…", f: mettreEnAttente },
    { t: "Remettre en file", f: async () => { await api("/api/orders/restore", { method: "POST", body: { ids: ids() } }); S.sel.clear(); charger(); rafraichirCompteurs(); } },
    { sep: 1 },
    { t: "Simuler le lot (coût et blocages)", f: simulerLot },
    { t: "Créer un lot…", hk: "B", f: acheterLot },
    { sep: 1 },
    { t: "Rejouer l'automatisation (simulation)", f: () => rejouerAutomatisation(true) },
    { t: "Rejouer l'automatisation", f: () => rejouerAutomatisation(false) },
    { sep: 1 },
    { t: "Annuler les commandes…", danger: 1, f: annuler },
  ]);

  $("#aBuy").onclick = acheterLot;

  function simulerLot() {
    attendre("Simulation du lot");
    api("/api/batches/preview", { method: "POST", body: { ids: ids() } }).then((r) => {
      dialogue(`Simulation — ${r.n} étiquette(s)`, `
        <div class="grille" style="margin-bottom:12px">
          <div class="kpi"><div class="v">${money(r.total)}</div><div class="l">coût total</div></div>
          <div class="kpi vert"><div class="v">${r.drop_off}</div><div class="l">en dépôt</div></div>
          <div class="kpi ${r.bloquees ? "ambre" : ""}"><div class="v">${r.bloquees}</div><div class="l">bloquées</div></div>
        </div>
        <div class="tbl"><table><thead><tr><th>Commande</th><th class="n">Poids</th><th>Service</th><th class="n">Prix</th></tr></thead>
        <tbody>${r.lignes.map((l) => `<tr><td>${esc(l.order_number)}</td><td class="n">${l.poids ? num(l.poids) + " g" : "—"}</td>
          <td>${l.erreur ? `<span class="puce r">${esc(l.erreur)}</span>` : esc(l.service) + (l.dropOff ? ' <span class="puce v">dépôt</span>' : "")}</td>
          <td class="n">${l.prix ? money(l.prix) : "—"}</td></tr>`).join("")}</tbody></table></div>`, null, "Fermer");
    });
  }

  function acheterLot() {
    if (!S.sel.size) return;
    dialogue(`Créer ${S.sel.size} étiquette(s)`, `
      <div class="avis">Ceci <b>achète réellement</b> les étiquettes et débite le compte transporteur.
        Adaptateur actif : <b>${esc(S.config.adaptateur)}</b>.</div>
      <label class="champ"><span>Nom du lot (facultatif)</span><input id="bn"></label>
      <label class="champ"><span>Refuser au-delà d'une perte de (laisser vide pour ne rien bloquer)</span>
        <input type="number" id="bm" step="0.01" placeholder="ex. 10.00"></label>
      <p class="doux">Le garde-fou de marge compare la livraison facturée au coût réel de
      l'étiquette, commande par commande. En juillet 2026, la marge d'expédition du compte
      était de −703,52 $ et rien ne le signalait avant l'achat.</p>`,
      async () => {
        const r = await api("/api/batches", { method: "POST", body: {
          ids: ids(), name: $("#bn").value || null, marge_max: $("#bm").value || null } });
        alert(`Lot ${r.batchId} : ${r.reussis} étiquette(s), ${r.echecs} échec(s).`);
        S.sel.clear(); charger(); rafraichirCompteurs();
      }, "Créer");

  /**
   * « Bulk Update » de ShipStation : service, colis, poids, dimensions, confirmation,

  function configurerEnMasse() {

      <p class="doux">Seuls les champs remplis sont appliqués. Un champ laissé vide ne touche

      <div class="grille">
        <label class="champ"><span>Transporteur</span><select id="ccar"><option value="">—</option>

        <label class="champ"><span>Service</span><select id="csrv"><option value="">—</option>
          ${(S.refs.services || []).filter((x) => !x.hidden).map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></label>
        <label class="champ"><span>Type de colis</span><select id="cpkg"><option value="">—</option>
          ${(S.refs.packages || []).map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></label>

        <label class="champ"><span>Poids (g)</span><input type="number" id="cwei"></label>
        <label class="champ"><span>Expédié de</span><select id="cwar"><option value="">—</option>

        alert(`${r.n} commande(s) mise(s) à jour.`);

  /**
   * « Split Ship » : les articles cochés partent dans une nouvelle commande. La scission doit
   * laisser au moins un article de chaque côté, sinon elle ne fait que renommer la commande.
   */
  async function scinderSelection() {
    if (S.sel.size !== 1) return dialogue("Scinder", "<p>Sélectionner une seule commande.</p>", null, "Fermer");
    const o = await api(`/api/orders/${[...S.sel][0]}`);
    const arts2 = (o.items || []).filter((i) => !i.adjustment);
    if (arts2.length < 2) return dialogue("Scinder", "<p>Cette commande n'a qu'un article.</p>", null, "Fermer");
    dialogue(`Scinder ${o.order_number}`, `
      <p class="doux">Les articles cochés partent dans une nouvelle commande, avec ses propres
        détails, étiquettes, notes et bordereau. La grille les affichera « 1 sur 2 » et « 2 sur 2 ».</p>
      ${arts2.map((i) => `<label class="ch" style="display:flex;padding:4px 0;gap:8px">
        <input type="checkbox" data-it="${i.id}"> ${i.quantity} × ${esc(i.name)}
        <span class="sku">${esc(i.sku || "")}</span></label>`).join("")}`,
      async () => {
        const items = [...document.querySelectorAll("#dlgC [data-it]:checked")].map((x) => Number(x.dataset.it));
        if (!items.length || items.length === arts2.length) { alert("Cocher au moins un article, mais pas tous."); return false; }
        const r = await api(`/api/orders/${o.id}/split`, { method: "POST", body: { item_ids: items } });
        alert(`Nouvelle commande créée (#${r.enfant}).`);
        S.sel.clear(); charger(); rafraichirCompteurs();
      }, "Scinder");

  function mettreEnAttente() {
    const d = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    dialogue(`Mettre ${S.sel.size} commande(s) en attente`,
      `<label class="champ"><span>Jusqu'au</span><input type="date" id="hd" value="${d}"></label>
       <p class="doux">Retour automatique en file à cette date.</p>`,
      async () => { await api("/api/orders/hold", { method: "POST", body: { ids: ids(), hold_until: $("#hd").value } });
        S.sel.clear(); charger(); rafraichirCompteurs(); });
  }

  function marquerExpedie() {
    dialogue(`Marquer ${S.sel.size} commande(s) comme expédiée(s)`, `
      <label class="champ"><span>Transporteur</span><input id="msc" placeholder="canada_post"></label>
      <label class="champ"><span>N° de suivi (facultatif)</span><input id="mst"></label>
      <label class="ch"><input type="checkbox" id="msn" checked> notifier la boutique</label>`,
      async () => {
        for (const id of ids())
          await api("/api/shipments/mark-shipped", { method: "POST", body: {
            order_id: Number(id), carrier_code: $("#msc").value || null,
            tracking_number: $("#mst").value || null, notifier: $("#msn").checked } });
