  /**
   * « Other Actions » (§2.2) — BUG-040.
   *
   * Le menu entier était désactivé tant qu'aucune ligne n'était cochée. Or `Importer des
   * commandes` y vit : sur un écran à zéro commande — exactement le moment où l'on veut
   * importer — la barre d'outils n'offrait plus aucun chemin. ShipStation garde `Other
   * Actions` ouvrable en permanence et n'active que ce qui a du sens. Une entrée grisée dit
   * pourquoi elle l'est ; une entrée absente se cherche.
   */
  /**
   * « Exporter les commandes » — le dialogue de ShipStation, pas un téléchargement aveugle.
   *
   * L'export était un lien : colonnes figées, aucun choix, et rien pour dire ce qu'on
   * emportait. ShipStation pose trois questions avant d'écrire le fichier — quelles lignes,
   * quoi, dans quel format — parce que chaque destination en aval attend ses colonnes, dans
   * son ordre, sous ses noms. Un fichier qu'il faut retoucher à la main après chaque
   * téléchargement n'est pas un export.
   *
   * Les en-têtes sortent en anglais, ceux de ShipStation : ces fichiers alimentent ClickShip,
   * eShipper, Dymo et les chiffriers du comptable, tous bâtis sur ces noms-là. Les traduire
   * casserait chaque mappage en aval.
   */
  async function exporterCommandes() {
    const nSel = S.sel.size;
    let jeu = "orders";
    let d = await tenter(() => api(`/api/export-formats?jeu=${jeu}`), { message: "Formats illisibles" });
    if (!d) return;

    const rendreFormats = () => `<div class="expF">${
      [`<label class="ch"><input type="radio" name="expfmt" value="" checked>
          <b>Ma vue courante</b> <span class="doux">— les colonnes de la grille</span></label>`,
       ...d.formats.map((f) => `<label class="ch"><input type="radio" name="expfmt" value="${f.id}">
          ${esc(f.nom)} <span class="doux">— ${f.colonnes.length} colonne(s)</span>
          <button type="button" class="lienB" data-mod="${f.id}">Modifier</button>
          <button type="button" class="lienB" data-sup="${f.id}">Supprimer</button></label>`)
      ].join("")}</div>`;

    dialogue("Exporter les commandes", `
      <div class="expQ"><b>Quelles lignes exporter ?</b>
        <label class="ch"><input type="radio" name="expq" value="sel" ${nSel ? "checked" : "disabled"}>
          Seulement les <b>${num(nSel)}</b> sélectionnée(s)</label>
        <label class="ch"><input type="radio" name="expq" value="vue" ${nSel ? "" : "checked"}>
          Toutes les commandes du filtre courant</label></div>

      <div class="expQ"><b>Exporter quoi ?</b>
        <label class="ch"><input type="radio" name="expj" value="orders" checked>
          Les commandes — une ligne par commande</label>
        <label class="ch"><input type="radio" name="expj" value="order-items">
          Les lignes d'articles — une ligne par article</label></div>

      <div class="expQ"><b>Dans quel format ?</b>
        <button type="button" class="lienB" id="expNew">Créer un format…</button>
        <div id="expL">${rendreFormats()}</div></div>`,
      () => {
        const p = new URLSearchParams();
        const q = [...document.querySelectorAll('[name="expq"]')].find((x) => x.checked)?.value;
        const j = [...document.querySelectorAll('[name="expj"]')].find((x) => x.checked)?.value || "orders";
        const fmt = [...document.querySelectorAll('[name="expfmt"]')].find((x) => x.checked)?.value;
        if (q === "sel") p.set("ids", ids().join(","));
        else for (const [k, v] of Object.entries(S0.vue ? { ...lire(), view_id: S0.vue } : lire()))
          if (v) p.set(k, v);
        if (fmt) p.set("format_id", fmt);
        window.open(`/api/export/${j}?` + p.toString(), "_blank");
      }, "Exporter");

    // Changer de jeu recharge les formats : ceux des commandes n'ont pas les colonnes des
    // lignes d'articles, et les proposer serait proposer un fichier vide.
    const recharger = async (nouveauJeu) => {
      jeu = nouveauJeu;
      d = await api(`/api/export-formats?jeu=${jeu}`);
      $("#expL").innerHTML = rendreFormats();
      brancher();
    };
    document.querySelectorAll('[name="expj"]').forEach((r) =>
      r.onchange = () => recharger(r.value));

    const brancher = () => {
      $("#expL").querySelectorAll("[data-sup]").forEach((b) => b.onclick = async (e) => {
        e.preventDefault();
        await api(`/api/export-formats/${b.dataset.sup}`, { method: "DELETE" });
        await recharger(jeu);
      });
      $("#expL").querySelectorAll("[data-mod]").forEach((b) => b.onclick = (e) => {
        e.preventDefault();
        editerFormat(d.formats.find((f) => String(f.id) === b.dataset.mod));
      });
    };
    brancher();
    $("#expNew").onclick = () => editerFormat(null);

    /** Le sélecteur de champs : disponibles à gauche, retenus à droite, l'ordre est le fichier. */
    function editerFormat(fmt) {
      const retenus = fmt ? [...fmt.colonnes] : [];
      const parGroupe = new Map();
      for (const c of d.champs) {
        if (!parGroupe.has(c.groupe)) parGroupe.set(c.groupe, []);
        parGroupe.get(c.groupe).push(c);
      }
      const titreDe = (cle) => (d.champs.find((c) => c.cle === cle) || {}).titre || cle;
      const dispo = () => [...parGroupe.entries()].map(([g, l]) =>
        `<optgroup label="${esc(g)}">${l.filter((c) => !retenus.includes(c.cle))
          .map((c) => `<option value="${esc(c.cle)}">${esc(c.titre)}</option>`).join("")}</optgroup>`).join("");
      const choisis = () => retenus.map((c) =>
        `<option value="${esc(c)}">${esc(titreDe(c))}</option>`).join("");

      dialogue(fmt ? `Modifier « ${fmt.nom} »` : "Créer un format d'export", `
        <label class="champ"><span>Nom du format</span>
          <input id="efN" value="${esc(fmt ? fmt.nom : "")}" placeholder="ClickShip, Dymo, comptable…"></label>
        <div class="efG">
          <div><div class="fLab">Champs disponibles</div>
            <select id="efA" multiple size="12">${dispo()}</select></div>
          <div class="efB">
            <button type="button" id="efAdd" title="Ajouter">→</button>
            <button type="button" id="efDel" title="Retirer">←</button>
            <button type="button" id="efUp" title="Monter">↑</button>
            <button type="button" id="efDown" title="Descendre">↓</button></div>
          <div><div class="fLab">Champs retenus — l'ordre est celui du fichier</div>
            <select id="efB2" multiple size="12">${choisis()}</select></div>
        </div>`,
        async () => {
          const r = await api("/api/export-formats", { method: "POST", body: {
            id: fmt ? fmt.id : undefined, nom: $("#efN").value, jeu, colonnes: retenus } });
          if (r && r.error) return alert(r.error);
          toast(`Format « ${r.nom} » enregistré — ${r.colonnes.length} colonne(s).`, { type: "succes" });
          $("#dlg").close();
          exporterCommandes();
        }, "Enregistrer le format");

      const repeindre = () => { $("#efA").innerHTML = dispo(); $("#efB2").innerHTML = choisis(); };
      const selection = (sel) => [...$(sel).selectedOptions].map((o) => o.value);
      $("#efAdd").onclick = () => { for (const c of selection("#efA")) if (!retenus.includes(c)) retenus.push(c); repeindre(); };
      $("#efDel").onclick = () => { const s = new Set(selection("#efB2")); for (let i = retenus.length - 1; i >= 0; i--) if (s.has(retenus[i])) retenus.splice(i, 1); repeindre(); };
      // Monter et descendre gardent la sélection : sans ça, réordonner cinq colonnes demande
      // cinq allers-retours à la souris.
      const bouger = (pas) => {
        const s = selection("#efB2");
        const idx = s.map((c) => retenus.indexOf(c)).sort((a, b) => pas < 0 ? a - b : b - a);
        for (const i of idx) {
          const j = i + pas;
          if (j < 0 || j >= retenus.length) continue;
          [retenus[i], retenus[j]] = [retenus[j], retenus[i]];
        }
        repeindre();
        [...$("#efB2").options].forEach((o) => { o.selected = s.includes(o.value); });
      };
      $("#efUp").onclick = () => bouger(-1);
      $("#efDown").onclick = () => bouger(1);
    }
  }

        <label class="champ"><span>Numéro</span><input id="nn" value="M-${Date.now().toString().slice(-6)}"></label>
        <label class="champ"><span>Boutique</span><select id="nb">${(S.refs.stores || []).filter((x) => x.active)
          .map((x) => `<option value="${x.id}" ${x.marketplace === "manual" ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label class="champ"><span>Destinataire</span><input id="nd"></label>
        <label class="champ"><span>Courriel</span><input id="ne" type="email"></label>
        <label class="champ"><span>Téléphone</span><input id="ntel" placeholder="581 982 5857"></label>
        <label class="champ"><span>Adresse</span><input id="na" placeholder="commencer à taper…"></label>
        <label class="champ"><span>Complément (app., étage)</span><input id="na2"></label>
        <label class="champ"><span>Ville</span><input id="nv"></label>
        <label class="champ"><span>Pays</span><select id="npy">${optionsPays("CA")}</select></label>
        <label class="champ"><span>Province / État</span><span id="npZ">${champRegion("np", "CA", "QC")}</span></label>
        <label class="champ"><span>Code postal</span><input id="ncp"></label>
        <label class="champ"><span>Poids (g)</span><input type="number" id="npo"></label>
      </div>
      <p class="doux" style="margin:-4px 0 8px">Téléphone et courriel sont exigés par le
        transporteur à l'achat de l'étiquette. Laissés vides, ce sont les coordonnées de
        l'expéditeur qui partent (Réglages).</p>
      <label class="champ"><span>Articles — une ligne par article : SKU ; quantité ; prix</span>
        <textarea id="ni" style="min-height:90px" placeholder="ASCL-SYRIACA-1.25ML-x1 ; 1 ; 8.99"></textarea></label>`,
      async () => {
        const items = $("#ni").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
          const [sku, q, prix] = l.split(";").map((x) => (x || "").trim());
          return { sku, name: sku, quantity: Number(q) || 1, unit_price: Number(prix) || 0 };
        });
        const total = items.reduce((t, i) => t + i.unit_price * i.quantity, 0);
        await api("/api/orders", { method: "POST", body: {
          order_number: $("#nn").value, order_key: "manuel-" + $("#nn").value,
          store_id: Number($("#nb").value), status: "awaiting_shipment",
          order_date: new Date().toISOString(), customer_email: $("#ne").value || null,
          customer_name: $("#nd").value, order_total: total, amount_paid: total,
          weight_g: Number($("#npo").value) || 0,
          ship_to: { name: $("#nd").value, street1: $("#na").value,
            street2: $("#na2").value || undefined, city: $("#nv").value,
            state: $("#np").value, postalCode: $("#ncp").value, country: $("#npy").value,
            phone: $("#ntel").value || undefined },
          items } });
        charger(); rafraichirCompteurs();
      }, "Créer",
      // Le pays commande la forme du champ région, et l'adresse se complète toute seule.
      () => { brancherRegion("#npy", "#np"); brancherAutoAdresse({ rue: "#na", rue2: "#na2",
        ville: "#nv", region: "#np", cp: "#ncp", pays: "#npy" }); });
  }

  function mettreEnAttente() {
    const d = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    dialogue(`Mettre ${S.sel.size} commande(s) en attente`,
      `<label class="champ"><span>Jusqu'au</span><input type="date" id="hd" value="${d}"></label>
       <p class="doux">Retour automatique en file à cette date.</p>${mentionPortee()}`,
      async () => { await api("/api/orders/hold", { method: "POST", body: { ids: ids(), hold_until: $("#hd").value } });
        S.sel.clear(); charger(); rafraichirCompteurs(); });
  }

  /**
   * `enMasse` distingue les deux entrées de ShipStation : « Mark As Shipped » saisit un
   * numéro de suivi pour une commande, « Mark As Shipped Bulk » ferme un paquet de commandes
   * sans suivi (ramassage en boutique, livraison locale). Le second n'offre donc pas le champ.
   */
  function marquerExpedie(enMasse = false) {
    dialogue(`Marquer ${S.sel.size} commande(s) comme expédiée(s)`, `
      <label class="champ"><span>Transporteur</span><input id="msc" placeholder="canada_post"></label>
      ${enMasse
        ? '<p class="doux">Mode en masse : aucun numéro de suivi n\'est enregistré. Pour saisir un suivi, utilisez « Marquer comme expédiée » sur une commande à la fois.</p><input type="hidden" id="mst">'
        : '<label class="champ"><span>N° de suivi (facultatif)</span><input id="mst"></label>'}
      <label class="ch"><input type="checkbox" id="msn" checked> notifier la boutique</label>`,
      async () => {
        for (const id of ids())
          await api("/api/shipments/mark-shipped", { method: "POST", body: {
            order_id: Number(id), carrier_code: $("#msc").value || null,
            tracking_number: $("#mst").value || null, notifier: $("#msn").checked } });
        S.sel.clear(); charger(); rafraichirCompteurs();
      }, "Marquer expédiée");
  }

  function fusionner() {
    const [cible, ...autres] = ids();
    dialogue("Fusionner", `<p>Les commandes seront fusionnées dans <b>#${cible}</b> (la première sélectionnée).
      Les autres passeront en annulé, leurs articles rejoignant la cible.</p>`,
      async () => { await api("/api/orders/merge", { method: "POST", body: { target: cible, ids: autres } });
        S.sel.clear(); charger(); rafraichirCompteurs(); });
  }

  function annuler() {
    dialogue(`Annuler ${S.sel.size} commande(s)`,
      `<div class="avis">Action destructrice : les commandes passent en <b>annulée</b>.</div>`,
      async () => { const r = await api("/api/orders/cancel", { method: "POST", body: { ids: ids() } });
        if (r.erreurs?.length) alert(r.erreurs.map((e) => `#${e.id} : ${e.e}`).join("\n"));
        S.sel.clear(); charger(); rafraichirCompteurs(); }, "Annuler les commandes");
  }

  async function rejouerAutomatisation(sec) {
    const r = await api("/api/automation/run", { method: "POST", body: { ids: ids(), dry_run: sec } });
    const lignes = Object.entries(r.resultats).map(([id, trace]) => {
      const o = LIGNES.find((x) => String(x.id) === id);
      return `<tr><td>${esc(o ? o.order_number : id)}</td><td>${trace.length
        ? trace.map((t) => `<span class="puce g">${t.couche}. ${esc(t.nom)}</span> ${esc(t.effet || t.regle || t.arret || t.erreur || "")}`).join("<br>")
        : '<span class="doux">aucun effet</span>'}</td></tr>`;
    }).join("");
    dialogue(sec ? "Simulation de l'automatisation" : "Automatisation appliquée", `
      ${sec ? '<div class="avis info">Simulation : rien n\'a été écrit.</div>' : ""}
      <div class="tbl"><table><thead><tr><th>Commande</th><th>Couches déclenchées</th></tr></thead>
      <tbody>${lignes}</tbody></table></div>`, null, "Fermer");
    if (!sec) charger();
  }

  // ------------------------------------------------ sidebar d'expédition
  /**
   * Le « Configure Shipment Widget » de ShipStation : expéditeur, poids, service, colis,
   * dimensions, confirmation, puis le bouton d'achat portant le tarif. Ajouts : la marge
   * avant achat, et la provenance du poids et des dimensions — ShipStation ne documente
   * nulle part qui gagne entre préréglage, profil produit, produit et type de colis, alors
   * que c'est ce qui détermine le poids facturé.
   */
  async function cote() {
    const C = $("#cote");
    if (S.sel.size === 0) {
      C.innerHTML = `<div class="vide3">Sélectionnez une commande pour configurer l'expédition.
        <div class="doux" style="margin-top:8px">Astuce : <kbd>?</kbd> affiche les raccourcis.</div></div>`;
      return;
    }
    // BUG-025, deuxième volet. Le panneau lisait la sélection sans vérifier qu'elle est à
    // l'écran : il configurait une commande que la grille n'affichait plus. Le poids, la
    // valeur et les articles ne portaient que sur les lignes visibles, sans le dire.
    const hors = (S.selHorsVue || []).length;
    const avertHorsVue = hors
      ? `<div class="avis" style="margin:8px 11px 0">${hors} commande(s) sélectionnée(s) ne sont pas
           affichées par le filtre courant. Les totaux ci-dessous ne les comptent pas.
           <button type="button" class="lienB" id="cViderHors">Vider la sélection</button></div>`
      : "";
    const brancherVider = () => {
      const b = $("#cViderHors");
      if (b) b.onclick = () => { S.sel.clear(); S.selHorsVue = []; charger(); };
    };

    if (S.sel.size > 1) {
      const sel = LIGNES.filter((o) => S.sel.has(String(o.id)));
      const poids = sel.reduce((s, o) => s + (o.weight_g || 0), 0);
      const sansPoids = sel.filter((o) => !o.weight_g).length;
      C.innerHTML = avertHorsVue + `<div class="sec entete"><h4>${sel.length} commandes sélectionnées
        <span style="margin-left:auto"></span>
        <button id="cLotM" class="mini">Lot ▾</button></h4>
        <div class="kv"><span>Poids cumulé</span><b>${num(Math.round(poids))} g</b></div>
        <div class="kv"><span>Sans poids</span><b class="${sansPoids ? "rouge" : ""}">${sansPoids}</b></div>
        <div class="kv"><span>Valeur</span><b>${money(sel.reduce((s, o) => s + (o.order_total || 0), 0))}</b></div>
        <div class="kv"><span>Livraison facturée</span><b>${money(sel.reduce((s, o) => s + (o.shipping_paid || 0), 0))}</b></div>
      </div>
      <div class="sec"><h4>Articles à préparer</h4>${listeArticlesGroupes(sel)}</div>`;
      $("#cLotM").onclick = (e) => { e.stopPropagation(); menuLots($("#cLotM"), [...S.sel], () => { charger(); majLots(); }); };
      brancherVider();
      return;
    }
    // Une seule commande sélectionnée, mais absente de la grille : ne pas la configurer en
    // douce. Le panneau le dit et propose de la rejoindre plutôt que de laisser croire que
    // ce qui est à l'écran et ce qui est en cours d'expédition sont la même commande.
    if (hors) {
      const seule = await api(`/api/orders/${[...S.sel][0]}`).catch(() => null);
      C.innerHTML = `<div class="vide3">La commande sélectionnée${seule ? ` <b>${esc(seule.order_number)}</b>` : ""}
          n'est pas affichée par le filtre courant.
        <div class="barre" style="justify-content:center;margin-top:10px">
          <button type="button" class="p" id="cAllerSel">L'afficher</button>
          <button type="button" id="cViderHors">Vider la sélection</button>
        </div></div>`;
      brancherVider();
      $("#cAllerSel").onclick = () => {
        // On rejoint la commande par son numéro : c'est le seul filtre qui la ramène à coup
        // sûr, quels que soient le statut, la boutique ou la vue en cours.
        if (!seule) return;
        // Chercher par numéro est le seul filtre qui la ramène à coup sûr : on efface
        // statut, boutique, lot et vue plutôt que de deviner lequel la cachait.
        S0.statut = ""; S0.store = null; S0.lot = null; S0.vue = null;
        S0.avance = null; S0.f = {}; S0.page = 0;
        $("#fq").value = seule.order_number;
        charger();
      };
      return;
    }

    const o = await api(`/api/orders/${[...S.sel][0]}`);
    const svc = (S.refs.services || []).filter((x) => !x.hidden);
    const colis = (S.refs.packages || []);
    const mapped = o.requested_service ? !(S.nonMappes || []).includes(o.requested_service) : null;

    // Sections dans l'ordre exact de la Shipping Sidebar (§2.6) : résumé, destinataire,
    // articles, widget de configuration, notes, étiquettes, communication client, activité.
    // Le bouton d'achat est en bas et porte le tarif, comme « Create + Print Label $X.XX ».
    C.innerHTML = `
      <div class="sec entete">
        <h4><button type="button" class="lienCmd" id="cOuvrir">${esc(o.order_number)}</button>
          <span class="puce g">${esc(STATUT_FR[o.status] || o.status)}</span>
          <span style="margin-left:auto"></span>
          <button id="cLot" class="mini">Lot ▾</button>
          <button id="cPrint" class="mini">Imprimer ▾</button></h4>
        ${o.batch_id ? `<div class="kv"><span>Lot</span><b>${esc((LOTS.find((l) => l.id === o.batch_id) || {}).name || "—")}</b></div>` : ""}
        <div class="kv"><span>Boutique</span><b>${esc((S.refs.stores || []).find((x) => x.id === o.store_id)?.name || o.source || "—")}</b></div>
        <div class="kv"><span>Commandée le</span><b>${jour(o.order_date)}</b></div>
        <div class="kv"><span>Âge</span><b>${o.age ?? "—"} j</b></div>
        <div class="kv"><span>Total</span><b>${money(o.order_total)}</b></div>
        <div class="kv"><span>Livraison facturée</span><b>${money(o.shipping_paid)}</b></div>
      </div>

      <div class="sec">
        <h4>Destinataire ${adresseValide(o.ship_to)}</h4>
        <div class="adr">${esc(o.customer_name || "")}
          ${o.ship_to.company ? `<br>${esc(o.ship_to.company)}` : ""}<br>${esc(o.ship_to.street1 || "")}
          ${o.ship_to.street2 ? `<br>${esc(o.ship_to.street2)}` : ""}<br>
          ${esc(o.ship_to.city || "")} ${esc(o.ship_to.state || "")} ${esc(o.ship_to.postalCode || "")}<br>
          ${esc(o.ship_to.country || "")}</div>
        ${o.customer_email ? `<div class="kv"><span>Courriel</span><b>${esc(o.customer_email)}</b></div>` : ""}
      </div>

      <div class="sec"><h4>Articles</h4>${listeArticlesGroupes([o])}</div>

      <div class="sec csw">
        <h4>Configuration de l'expédition</h4>
        <label class="champ"><span>Expédié de</span><select id="cw">${optionsEntrepot(o)}</select></label>
        <label class="champ"><span>Poids (g) — touche W</span><input type="number" id="cp" value="${o.weight_g || ""}"></label>
        <label class="champ"><span>Fournisseur d'étiquettes</span>
          <select id="cfour">${optionsFournisseur()}</select></label>
        <label class="champ"><span id="csL">Service — choisir un fournisseur</span>
          <select id="cs">${optionsService(o.service_id || "")}</select></label>
        <label class="champ"><span>Colis</span><select id="cc"><option value="">— choisir —</option>${colis.map((x) =>
          `<option value="${x.id}" ${String(o.package_id) === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <div class="dims">
          <input type="number" id="cl" placeholder="L" value="${o.dimensions?.length || ""}">
          <input type="number" id="cW" placeholder="l" value="${o.dimensions?.width || ""}">
          <input type="number" id="ch" placeholder="H" value="${o.dimensions?.height || ""}">
          <span class="doux">po</span>
        </div>
        <label class="champ"><span>Confirmation</span><select id="cf">${(S.refs.confirmations || []).map((k) =>
          `<option value="${k.id}" ${String(o.confirmation) === k.id ? "selected" : ""}>${esc(k.nom)}</option>`).join("")}</select></label>
        <label class="champ"><span>Assurance ($, vide = aucune)</span>
          <input type="number" step="0.01" id="ci" value="${assure(o.insurance) || ""}"></label>
        <label class="champ"><span>Date d'expédition</span>
          <input type="date" id="cd" value="${(o.ship_by_date || "").slice(0, 10)}"></label>
        <details class="autres"><summary>Autres options d'expédition</summary>
          <label class="ch"><input type="checkbox" id="cnd" ${String(o.internal_notes || "").includes("[no_dropoff]") ? "checked" : ""}>
            interdire le dépôt en bureau de poste</label>
          <label class="ch"><input type="checkbox" id="cnm"> ne pas notifier la boutique</label>
        </details>
        ${o.requested_service ? `<div class="kv" style="margin-top:6px"><span>Service demandé</span>
          <b>${esc(o.requested_service)} ${mapped
            ? '<span class="puce v">mappé</span>'
            : '<button type="button" class="lienMap" id="cMap">non mappé</button>'}</b></div>` : ""}
        <div id="cMarge"></div>
      </div>

      <div class="sec"><h4>Notes</h4>
        ${o.customer_notes ? `<div class="note"><span class="doux">De l'acheteur</span><br>${esc(o.customer_notes)}</div>` : ""}
        ${o.gift_message ? `<div class="note"><span class="doux">Message cadeau</span><br>${esc(o.gift_message)}</div>` : ""}
        <textarea id="cNote" class="petit" placeholder="Note interne…">${esc(o.internal_notes || "")}</textarea>
        <button id="cNoteS">Enregistrer la note</button>
      </div>

      <div class="sec"><h4>Étiquettes</h4>
        ${(o.tags || []).map(pastilleTag).join(" ") || '<span class="doux">aucune</span>'}</div>

      <div class="sec"><h4>Communication client</h4>
        <div class="kv"><span>Bordereau</span><b>Default 4″ × 6″</b></div>
        <div class="kv"><span>Avis d'expédition</span><b>${esc(S.refs.gabarit_expedition || "Gabarit par défaut")}</b></div>
        <div class="kv"><span>Boutique notifiée</span><b>${o.status === "shipped" ? "à l'achat de l'étiquette" : "pas encore"}</b></div>
      </div>

      <div class="sec"><h4>Activité</h4><div id="cActivite" class="doux">Chargement…</div></div>

      <div class="pied">
        ${motifAchat(o, "cRaisonP")}
        <button id="cCoter" title="Coter (R)">Coter</button>
        <button type="button" id="cAssur" title="Coter avec assurance — des tarifs peuvent disparaître">Assurance…</button>
        <button type="button" class="v" id="cAcheter" ${etatAchat(o).ok ? "" : "disabled"}
          aria-describedby="cRaisonP" title="${esc(etatAchat(o).motif || "")}">
          Créer + imprimer l'étiquette<span id="cPrix"></span></button>
      </div>
      <div class="sec" id="cTarifs"></div>
      <div class="sec" id="cAssurR"></div>`;

    // marge : ce que le client a payé pour la livraison, avant l'achat (constat OBS9)
    const paye = Number(o.shipping_paid || 0);
    $("#cMarge").innerHTML = paye === 0
      ? `<div class="avis" style="margin:6px 0 0">Livraison offerte — le coût de l'étiquette est une perte sèche.</div>`
      : "";

    const enregistrer = async (extra = {}) => api("/api/orders", { method: "POST", body: { ...o,
      warehouse_id: Number($("#cw").value) || null, weight_g: Number($("#cp").value) || 0,
      service_id: $("#cs").value || null, package_id: $("#cc").value || null,
      confirmation: $("#cf").value || null,
      ship_by_date: $("#cd").value || null,
      insurance: $("#ci").value ? { montant: Number($("#ci").value), devise: "CAD" } : null,
      dimensions: ($("#cl").value || $("#cW").value || $("#ch").value)
        ? { length: Number($("#cl").value) || 0, width: Number($("#cW").value) || 0,
            height: Number($("#ch").value) || 0, units: "inches" } : null, ...extra } });

    // Chaque champ du widget enregistre en sortant : ShipStation applique au fil de la saisie,
    // et un bouton « Enregistrer » oublié fait acheter l'étiquette avec l'ancien service.
    C.querySelectorAll(".csw input, .csw select").forEach((x) => x.onchange = async () => {
      await enregistrer(); majAchat(o, "panneau"); charger();
    });
    const map = $("#cMap");
    if (map) map.onclick = () => aller("prereglages");

    $("#cNoteS").onclick = () => enregistrer({ internal_notes: $("#cNote").value });
    // Changer de fournisseur relance la cotation : le deuxième menu n'a de sens que rempli
    // par celui qu'on vient de choisir. C'est le geste attendu, on ne le fait pas attendre
    // un second clic.
    const champFournisseur = $("#cfour");
    if (champFournisseur) champFournisseur.onchange = () => $("#cCoter").click();

    /**
     * Choisir un colis applique ses dimensions, et recote.
     *
     * Le menu ne faisait rien : on choisissait « Box 12 x 6 x 6 » et les trois champs
     * restaient vides. Un contrôle qui porte un nom sans produire d'effet est pire qu'un
     * contrôle absent — on croit avoir agi.
     *
     * Les types de colis dont le référentiel ne connaît pas les dimensions ne peuvent rien
     * appliquer : plutôt que de rester muets, ils le disent, parce que c'est une donnée à
     * corriger dans les réglages et non une panne.
     */
    if ($("#cc")) $("#cc").onchange = async () => {
      const p = (S.refs.packages || []).find((x) => String(x.id) === String($("#cc").value));
      const d = p && p.dimensions;
      if (d && (d.length || d.width || d.height)) {
        $("#cl").value = d.length || "";
        $("#cW").value = d.width || "";
        $("#ch").value = d.height || "";
      } else if (p) {
        toast(`« ${p.name} » n'a pas de dimensions enregistrées — à compléter dans Réglages ▸ Types de colis.`,
          { type: "info" });
      }
      await tenter(() => enregistrer(), { message: "Colis non enregistré" });
      majAchat(o, "panneau");
      // Les dimensions changent le prix : recoter est le geste suivant, on ne le fait pas
      // attendre un clic.
      if (Number($("#cp").value || 0)) $("#cCoter").click();
    };

    /**
     * Le tarif choisi, en une ligne.
     *
     * Le panneau de droite fait 300 px : un tableau à six colonnes y arrive tronqué, et il
     * répète ce que la liste déroulante dit déjà. Une ligne suffit — transporteur, service,
     * prix, délai, dépôt — et elle tient sans barre de défilement horizontale.
     */
    let derniereCotation = null;
    const resumerTarif = () => {
      // Le tarif choisi vient peut-être d'une liste réécrite par la cotation : l'état
      // d'achat se relit ici, une fois pour tous les chemins qui aboutissent à ce résumé.
      majAchat(o, "panneau");
      const boite = $("#cTarifs");
      if (!boite || !derniereCotation) return;
      const t = derniereCotation.tarifs.find((x) => String(x.serviceId) === String($("#cs").value));
      if (!t) { boite.innerHTML = ""; $("#cPrix").textContent = ""; return; }
      const paye = Number(o.shipping_paid || 0);
      // La marge se calcule HORS TAXES, des deux côtés.
      //
      // Le tarif que rend Freightcom inclut TPS et TVQ ; les frais de port encaissés sur la
      // commande, eux, sont hors taxes. Comparer les deux surestimait la perte de 15 % — sur
      // un envoi à 7,28 $, la marge paraissait 0,95 $ plus mauvaise qu'elle n'est. Et ces
      // taxes se récupèrent en crédits de taxe sur intrants : elles ne sont pas une dépense.
      const cout = t.prixHT ?? t.price;
      const marge = paye ? Math.round((paye - cout) * 100) / 100 : null;
      boite.innerHTML = `<div class="crL"><span>${esc(t.carrier)} · ${esc(nomTarif(t))}${
        t.dropOff ? ' <span class="puce v">dépôt</span>' : ""}</span><b>${money(cout)}</b></div>
        <div class="doux" style="font-size:12px">${esc(delaiTarif(t))}${
        t.prixHT !== undefined && t.prixHT !== t.price
          ? ` · ${money(t.price)} taxes comprises` : ""}${
        marge !== null ? ` · marge <span class="${marge < 0 ? "rouge" : "vert"}">${
          marge >= 0 ? "+" : ""}${money(marge)}</span>` : ""}</div>`;
      $("#cPrix").textContent = "  " + money(cout);
    };

    // Choisir un tarif l'enregistre, sans second clic. C'était la plainte : on sélectionnait,
    // puis il fallait recliquer sur Coter pour que quoi que ce soit se passe.
    if ($("#cs")) $("#cs").onchange = async () => {
      resumerTarif();
      await tenter(() => enregistrer(), { message: "Service non enregistré" });
      majAchat(o, "panneau");
    };

    /*
     * Coter AVEC assurance, sur demande.
     *
     * Chez Freightcom, demander une couverture retire du panel les services qui ne peuvent
     * pas la porter : quatorze tarifs sur vingt-trois, mesuré sur le compte, FedEx et UPS
     * compris. Envoyer le champ à chaque cotation amputait donc le comparateur en silence.
     *
     * ClickShip règle ça en séparant les deux gestes — les prix d'abord, « + Additional
     * Insurance » ensuite. On fait pareil : la cotation ordinaire ne demande rien, ce bouton
     * demande la couverture. Perdre des tarifs à son insu est un défaut ; les perdre
     * volontairement, en sachant combien, est un arbitrage. L'écran affiche donc les deux
     * comptes côte à côte.
     */
    $("#cAssur").onclick = () => dialogue("Coter avec assurance", `
      <label class="champ"><span>Valeur à assurer ($)</span>
        <input type="number" step="0.01" min="0" id="qaV" value="${assure(o.insurance) || Math.round(Number(o.order_total || 0) * 100) / 100}"></label>
      <p class="doux">Cette cotation-ci seulement — la commande n'est pas modifiée.
        Des tarifs peuvent disparaître : les transporteurs qui ne vendent pas la couverture
        sortent du panel. Le compte avant/après s'affiche sous la liste.</p>`,
      async () => {
        const montant = Number($("#qaV").value) || 0;
        const zone = $("#cAssurR");
        if (zone) zone.innerHTML = '<div class="doux">Cotation assurée…</div>';
        try {
          const fournisseur = champFournisseur ? champFournisseur.value : "";
          const avant = derniereCotation ? derniereCotation.tarifs.length : null;
          const r = await api("/api/shipments/quote", { method: "POST",
            body: { order_id: o.id, fournisseur: fournisseur || undefined, assurance: montant } });
          if (r.error) throw new Error(r.error);
          derniereCotation = r;
          const ops = optionsTarifs(r, ($("#cs") && $("#cs").value) || (o.service_id || ""));
          if (ops && $("#cs")) { $("#cs").innerHTML = ops; $("#cs").dataset.tarifs = "1"; }
          resumerTarif();
          const perdus = avant === null ? null : avant - r.tarifs.length;
          const couverts = r.tarifs.filter((t) => t.assurance && t.assurance.appliquee);
          const cout = couverts.length ? couverts[0].assurance.cout : null;
          if (zone) zone.innerHTML = `<div class="avis ${couverts.length ? "info" : ""}">
            Coté assuré à <b>${money(montant)}</b> — ${num(r.tarifs.length)} tarif(s)${
            perdus > 0 ? `, <b>${num(perdus)} de moins</b> qu'à la cotation nue` : ""}.<br>
            ${couverts.length
              ? `${num(couverts.length)} service(s) portent la couverture${
                  cout ? `, à partir de <b>${money(cout)}</b>` : ""}.`
              : `<b>Aucun service ne porte la couverture.</b> La demander ne fait ici que
                 retirer des tarifs : recoter sans assurance, ou passer par Chit Chats, qui
                 vend la sienne sans amputer le panel.`}
            <button type="button" class="lienB" id="cAssurN">Recoter sans assurance</button></div>`;
          const bn = $("#cAssurN");
          if (bn) bn.onclick = () => { zone.innerHTML = ""; $("#cCoter").click(); };
        } catch (e) {
          if (zone) zone.innerHTML = `<div class="avis mini">${esc(e.message)}</div>`;
        }
      }, "Coter assuré");

    $("#cCoter").onclick = async () => {
      $("#cTarifs").innerHTML = '<div class="doux">Cotation…</div>';
      if ($("#cAssurR")) $("#cAssurR").innerHTML = "";
      try {
        const fournisseur = champFournisseur ? champFournisseur.value : "";
        const r = await api("/api/shipments/quote", { method: "POST",
          body: { order_id: o.id, fournisseur: fournisseur || undefined } });
        derniereCotation = r;
        // La cotation remplace le contenu du champ Service : les tarifs du moment sont la
        // seule liste dont on sait qu'elle s'applique à CET envoi. Le référentiel statique
        // reste le repli quand aucune cotation n'a encore été faite.
        const ops = optionsTarifs(r, ($("#cs") && $("#cs").value) || (o.service_id || ""));
        if (ops && $("#cs")) {
          $("#cs").innerHTML = ops;
          $("#cs").dataset.tarifs = "1";
          const l = $("#csL");
          // Dire de qui viennent ces tarifs : sans ça, on compare deux fournisseurs sans
          // savoir lequel on regarde. `r.fournisseur` vient du serveur, pas du menu — c'est
          // celui qui a réellement répondu.
          const nomF = (S.fournisseurs || []).find((f) => f.nom === r.fournisseur);
          if (l) l.textContent = `Service — ${r.tarifs.length} tarif(s) chez ${
            nomF ? nomF.libelle : r.fournisseur || "le fournisseur par défaut"}`;
        }
        resumerTarif();

        /*
         * Un tarif moins cher existe, et le choix en place ne le voit pas.
         *
         * Le service sélectionné est enregistré sur la commande : il survit à un changement
         * de poids, et c'est voulu — un choix délibéré ne doit pas être défait dans le dos de
         * celui qui l'a fait. Mais quand le poids passe de 300 g à 99 g, le tarif de dépôt
         * apparaît sans que rien ne le dise, et l'écran continue d'afficher 11,06 $ comme si
         * de rien n'était. On a cru que la cotation n'avait pas bougé.
         *
         * Donc : on ne change rien tout seul, on le signale, et on offre le clic.
         */
        const choisiId = $("#cs") && $("#cs").value;
        const actuel = r.tarifs.find((t) => String(t.serviceId) === String(choisiId));
        const meilleur = r.tarifs[0];
        if (actuel && meilleur && meilleur.serviceId !== actuel.serviceId
            && meilleur.price < actuel.price) {
          const gain = Math.round((actuel.price - meilleur.price) * 100) / 100;
          $("#cTarifs").insertAdjacentHTML("beforeend",
            `<div class="avis info" style="margin-top:6px">${esc(meilleur.carrier)} ·
              ${esc(nomTarif(meilleur))} est à ${money(meilleur.price)} —
              <b>${money(gain)} de moins</b>.
              <button type="button" class="lienB" id="cMieux">Prendre celui-là</button></div>`);
          const b = $("#cMieux");
          if (b) b.onclick = () => { $("#cs").value = meilleur.serviceId; $("#cs").onchange(); };
        }

        /*
         * La confirmation de livraison ne traverse pas tous les fournisseurs.
         *
         * La spécification Freightcom 2.10.0 n'a AUCUN champ pour la confirmation : ni
         * signature, ni preuve d'âge, ni « Do Not Safe Drop ». Or la règle 6 du compte
         * ShipStation appliquait `Confirmation = 5` à tout envoi Canada Post — c'est une
         * politique de livraison, pas un détail. Acheter chez ce courtier la perd en silence,
         * et on ne s'en apercevrait qu'au premier colis laissé sur un perron.
         *
         * L'écran le dit donc avant l'achat. Postes Canada en direct, lui, la transmet.
         */
        const conf = $("#cf") && $("#cf").value;
        if (conf && conf !== "0" && r.fournisseur === "freightcom") {
          const nomConf = (S.refs.confirmations || []).find((c) => String(c.id) === String(conf));
          $("#cTarifs").insertAdjacentHTML("beforeend",
            `<div class="avis" style="margin-top:6px">« ${esc(nomConf ? nomConf.nom : conf)} »
              ne sera <b>pas transmis</b> : l'API Freightcom n'a pas de champ pour la
              confirmation de livraison. Passer par Postes Canada pour la conserver.</div>`);
        }

        // Dire pourquoi le tarif de dépôt n'est pas là.
        //
        // Sur une commande de 600 g, la liste passait de 6,61 $ à 12,70 $ sans un mot, et il
        // a fallu essayer trois commandes pour comprendre que le seuil des 500 g était en
        // cause. Une absence inexpliquée coûte plus cher qu'un avertissement : elle fait
        // douter de l'outil. Le poids exact est écrit, pas seulement la règle.
        const seuil = Number((S.config && S.config.seuil_dropoff_g) || 500);
        const poids = Number($("#cp").value || o.weight_g || 0);
        if (!r.tarifs.some((t) => t.dropOff) && poids >= seuil) {
          $("#cTarifs").insertAdjacentHTML("beforeend",
            `<div class="doux" style="font-size:12px;margin-top:6px">Pas de tarif de dépôt :
              ce colis fait ${num(poids)} g, le programme s'arrête à ${num(seuil)} g.</div>`);
        }
      } catch (e) {
        // Une cotation qui échoue doit EFFACER la liste précédente, pas la laisser en place.
        // Choisir Chit Chats et continuer de voir les tarifs Freightcom, avec leur étiquette,
        // donne une liste qui a l air valide et ne l est plus — on achèterait chez l un en
        // croyant l avoir comparé chez l autre.
        $("#cTarifs").innerHTML = `<div class="avis">${esc(e.message)}</div>`;
        derniereCotation = null;
        if ($("#cs")) $("#cs").innerHTML = optionsService(o.service_id || "");
        const l = $("#csL");
        const nomF = (S.fournisseurs || []).find((x) => x.nom === (champFournisseur && champFournisseur.value));
        if (l) l.textContent = `Service — aucun tarif${nomF ? ` chez ${nomF.libelle}` : ""}`;
        $("#cPrix").textContent = "";
      }
    };
    // Coter dès l'ouverture. Le cache de cotation rend l'appel quasi gratuit sur une commande
    // déjà vue, et le préparateur n'a plus à cliquer pour voir un prix — il ouvre, il voit.
    // Une commande sans poids ne se cote pas : on ne fait pas apparaître une erreur pour un
    // geste que personne n'a demandé.
    if (o.weight_g) $("#cCoter").click();

    $("#cAcheter").onclick = acheterLot;
    $("#cOuvrir").onclick = () => detailCommande(o.id);
    $("#cLot").onclick = (e) => { e.stopPropagation(); menuLots($("#cLot"), [...S.sel], () => { charger(); majLots(); }); };
    $("#cPrint").onclick = (e) => { e.stopPropagation(); menuAncre($("#cPrint"), [
      { t: "Bordereau de préparation", f: () => window.open(`/api/packing-slip?ids=${o.id}`, "_blank") },
      { t: "Liste de prélèvement", f: () => window.open(`/api/pick-list?ids=${o.id}`, "_blank") },
      { t: "Étiquette", f: () => window.open(`/api/labels?ids=${o.id}`, "_blank") },
    ], { droite: true }); };

    api(`/api/audit?limit=8`).then((j) => {
      const l = (j.rows || []).filter((r) => String(r.entity_id) === String(o.id) || r.entity === "order");
      $("#cActivite").innerHTML = l.length
        ? l.slice(0, 6).map((r) => `<div>${esc(String(r.at).slice(0, 16).replace("T", " "))} — ${esc(r.action)}</div>`).join("")
        : "aucune activité enregistrée";
    }).catch(() => { $("#cActivite").textContent = "—"; });
  }


  function listeArticlesGroupes(cmds) {
    const par = new Map();
    for (const o of cmds) for (const i of arts(o)) {
      const cle = i.sku || i.name;
      const x = par.get(cle) || { sku: i.sku, name: i.name, q: 0, loc: i.warehouse_location };
      x.q += i.quantity || 0; par.set(cle, x);
    }
    return `<div class="artG">${[...par.values()].map((i) =>
      `<div><b>×${i.q}</b> <span class="sku">${esc(i.sku)}</span> ${esc(i.name)}
       ${i.loc ? `<span class="doux">· ${esc(i.loc)}</span>` : ""}</div>`).join("")}</div>`;
  }

  // ------------------------------------------------------------- démarrage
  S.cmdCharger = charger;
  S.cmdIds = ids;
  S.cmdPresetParTouche = async (touche) => {
    const p = (S.refs.presets || []).find((x) => x.hotkey === touche);
    if (!p || !S.sel.size) return;
    await api("/api/presets/apply", { method: "POST", body: { preset_id: p.id, ids: ids() } });
    charger();
  };
  /**
   * Actions exposées aux raccourcis clavier.
   *
   * `confirmerAchat` est délibérément distinct d'`acheterLot` : une touche ne doit pas pouvoir
   * dépenser. On affiche le nombre de commandes et le coût estimé, et on exige un clic —
   * c'est le garde-fou qui manquait quand « b » et « s » appelaient la même fonction.
   */
  S.cmdActions = {
    acheterLot, marquerExpedie, simulerLot, coter: () => $("#aRate").click(),
    creerLot: () => { S.sel.size ? ajouterAuLot() : $("#ssNouveauLot")?.click(); },
    confirmerAchat: async () => {
      const n = S.sel.size;
      if (!n) return;
      if (!S.config.etiquettes_actives)
        return dialogue("Achat d'étiquettes désactivé",
          `<p>Ce service tourne sans <code>CLONE_ALLOW_LABELS=1</code>. La cotation et la
           simulation de lot restent disponibles.</p>`, null, "Fermer");
      let cout = "";
      try {
        const r = await api("/api/batches/preview", { method: "POST", body: { ids: ids() } });
        cout = `<div class="kv"><span>Coût estimé</span><b>${money(r.total)}</b></div>` +
               (r.bloquees ? `<div class="avis mini">${r.bloquees} commande(s) ne peuvent pas être cotées.</div>` : "");
      } catch { /* la confirmation reste possible même sans cotation */ }
      dialogue(`Acheter ${n} étiquette${n > 1 ? "s" : ""} ?`,
        `<p>Cette action <b>dépense réellement</b> et n'est pas annulable sans passer par
         l'annulation d'étiquette chez le transporteur.</p>${cout}`,
        acheterLot, `Acheter ${n} étiquette${n > 1 ? "s" : ""}`);
    },
  };

  indexerRefs();
  dessinerFiltres();
  majStatuts();
  await majLots();
  await chargerVues();
  try {
    const d = await api("/api/service-mappings");
    S.nonMappes = (d.non_mappes || []).map((x) => x.libelle);
    S.resolutions = d.resolutions || [];
  } catch {}
  indexerRefs();
  await charger();
};

/**
 * Import Shopify — accessible partout : bouton d'en-tête, état vide de la grille, raccourci U.
 *
 * La fenêtre est choisie à l'écran. Le rattrapage reprend par défaut au dernier passage réussi,
 * ce qui est le bon comportement au quotidien mais trompe au premier import : sur une base
 * neuve il ne remonte que trente jours, et l'entrepôt croit que l'import a échoué.
 *
 * L'import se fait par tranches. Chaque passage avance le curseur `shopify_dernier_import`,
 * donc la tranche suivante reprend exactement là où la précédente s'est arrêtée : une seule
 * requête pour 38 000 commandes dépasserait le délai du proxy, et on ne saurait pas où elle
 * en était.
 */
async function importerShopify() {
  const e = await api("/api/shopify");
  if (!e.configure) return dialogue("Shopify non configuré", `
    <div class="avis">Il manque les variables <code>SHOPIFY_STORE</code> et
    <code>SHOPIFY_CLIENT_ID</code> / <code>SHOPIFY_CLIENT_SECRET</code> sur le service.</div>
    <p class="doux">Ce sont exactement les mêmes identifiants que <code>support.js</code> et A2X —
    l'app « Render connector ». Aucun nouveau jeton à créer.</p>`, null, "Fermer");

  const jours = (n) => new Date(Date.now() - n * 86400000).toISOString();
  const TRANCHE = 500;
  const FENETRES = [
    { t: "Depuis le dernier passage (incrémental)", d: () => null, boucle: false },
    { t: "30 derniers jours", d: () => jours(30), boucle: true },
    { t: "12 derniers mois", d: () => jours(365), boucle: true },
    { t: "Tout l'historique de la boutique", d: () => "2015-01-01T00:00:00Z", boucle: true },
  ];

  dialogue("Importer depuis Shopify", `
    <div class="kv"><span>Boutique</span><b>${esc(e.boutique)}</b></div>
    <div class="kv"><span>Dernier passage</span><b>${e.dernier_import ? esc(String(e.dernier_import).slice(0, 16).replace("T", " ")) : "jamais"}</b></div>
    <div class="kv"><span>Commandes Shopify déjà ici</span><b>${num(e.commandes || 0)}</b></div>
    <div class="kv"><span>Synchronisation automatique</span><b>${e.sync_minutes ? `toutes les ${e.sync_minutes} min` : "désactivée"}</b></div>
    <div class="kv"><span>Webhooks signés</span><b>${e.secret_webhook ? "oui" : "non — secret manquant"}</b></div>
    <hr>
    <label class="champ"><span>Fenêtre à importer</span><select id="siFen">${
      FENETRES.map((f, i) => `<option value="${i}"${!e.dernier_import && i === 3 ? " selected" : ""}>${esc(f.t)}</option>`).join("")}</select></label>
    <p class="doux">L'import met à jour les commandes déjà présentes plutôt que de les dupliquer,
      et ne retouche jamais une commande déjà expédiée ici. Un premier import complet prend
      plusieurs minutes — la fenêtre reste ouverte et affiche l'avancement.</p>
    <div class="avis info">Shopify ne contient que la boutique <b>LAS Shopify</b>. L'archive
      complète — Etsy, Faire, commandes manuelles, expéditions, lots — se reprend par
      <b>Réglages → Lancer la migration</b> depuis ShipStation.</div>
    <div id="siJournal"></div>`,
    async () => {
      const f = FENETRES[Number($("#siFen").value)];
      const J = $("#siJournal");
      let depuis = f.d(), total = 0, nouvelles = 0, ignorees = 0, tranches = 0, curseur = null;

      for (;;) {
        tranches++;
        J.innerHTML = `<div class="doux">Tranche ${tranches} — ${num(total)} commande(s) traitée(s),
          ${num(nouvelles)} nouvelle(s)… (ne pas fermer la fenêtre)</div>`;
        let r;
        try {
          r = await api("/api/shopify/rattraper", { method: "POST", body: { depuis, max: TRANCHE } });
        } catch (err) {
          J.innerHTML = `<div class="avis">Interrompu après ${num(total)} commande(s) : ${esc(err.message)}</div>`;
          break;
        }
        total += r.traitees; nouvelles += r.nouvelles; ignorees += r.ignorees || 0;
        rafraichirCompteurs();
        if (S.cmdCharger) S.cmdCharger();

        // Fin : tranche incomplète, ou curseur qui n'avance plus — toutes les commandes de la
        // tranche portant le même horodatage. Sans cette garde, la boucle tournerait en rond.
        const fini = !f.boucle || r.traitees < TRANCHE || r.jusqua === curseur;
        curseur = r.jusqua;
        depuis = null;   // les tranches suivantes reprennent au curseur enregistré
        if (fini) {
          J.innerHTML = `<div class="avis info">Terminé — ${num(total)} commande(s) traitée(s) en
            ${tranches} tranche(s) · <b>${num(nouvelles)}</b> nouvelle(s)
            ${ignorees ? ` · ${num(ignorees)} déjà expédiée(s), non retouchée(s)` : ""}</div>
            <div class="doux">Curseur : ${esc(String(r.jusqua || "").slice(0, 16).replace("T", " "))}</div>`;
          break;
        }
      }
      return false;   // garde la fenêtre ouverte pour lire le bilan
    }, "Importer");
}

/**
 * Fiche de commande — la fenêtre qu'ouvre le numéro de commande.
 *
 * La sidebar de droite sert à expédier ; cette fiche sert à **agir sur la commande** :
 * la déposer dans un lot, l'expédier, la marquer expédiée, créer un retour, la mettre en
 * attente, la scinder, l'annuler. C'est la répartition de ShipStation, où la fiche porte son
 * propre bandeau d'actions (`Batch`, `Print`, `Shipment Actions`).
 */
/**
 * Fiche de commande — l'écran de détail de ShipStation (§2.6), reproduit dans son anatomie.
 *
 * Trois colonnes : le rail SHIPMENTS à gauche (une expédition par ligne, `+` pour scinder),
 * les six blocs au centre — détails, articles, déclarations de douane, notes, communication
 * client, activité — et « Configure Shipment » à droite avec son pied fixe. L'en-tête porte
 * le nom de la boutique, le numéro, les boutons Lot et Imprimer, les flèches ‹ › et le ✕.
 *
 * Ce n'est pas une boîte de dialogue : c'est un écran. Il ne passe donc pas par `dialogue()`,
 * qui redimensionne, centre et pose deux boutons en pied — trois choses qu'on ne veut pas ici.
 */
let ficheOuverte = null;

/**
 * Tableau de tarifs partagé par la grille et par la fiche de commande. La colonne « Marge »
 * n'apparaît que si on sait ce que le client a payé — c'est l'alerte du constat OBS9 : la
 * marge d'expédition de Lasclay était négative de 703 $ sur un seul mois.
 */
/**
 * Tableau de tarifs — BUG-018, BUG-068.
 *
 * Deux corrections issues de l'audit. D'abord le nom : la colonne affichait l'identifiant
 * technique (`cp_expedited`) au lieu du libellé commercial, et « Délai » restait vide alors
 * que l'API renvoie la durée de transit. Ensuite, et surtout, l'honnêteté du chiffre :
 * l'adaptateur de démonstration calcule un prix **qui ne dépend que du poids**, identique pour
 * les six transporteurs, ce qui rend le classement faux — Purolator, réellement quatrième
 * moins cher, ressortait avant-dernier. Un bandeau refermable au-dessus du tableau ne suffit
 * pas : la mention « démo » est répétée **sur chaque ligne**, là où l'œil se pose.
 */
/**
 * Tableau de tarifs — BUG-068.
 *
 * Le rendu lisait `serviceName` et `delivery_days` ; l'adaptateur renvoie `service` et
 * `transitDays`. Deux noms de champ qui ne se rencontrent jamais, et c'est tout l'arbitrage
 * prix/délai qui disparaît : la colonne Service affichait des identifiants techniques
 * (`cp_expedited_dropoff`) et la colonne Délai était vide sur toutes les lignes, alors que
 * l'API renvoyait déjà « Expedited Parcel » et 1 jour. On accepte les deux vocabulaires
 * plutôt que d'en imposer un : l'adaptateur réel n'aura pas forcément le même.
 */
const nomTarif = (t) => t.serviceName || t.service || nomService(t.serviceId) || t.serviceId || "—";
const delaiTarif = (t) => {
  const j = t.transitDays ?? t.delivery_days ?? t.transit_days;
  if (j != null && j !== "") return `${num(j)} jour${Number(j) > 1 ? "s" : ""}`;
  const d = t.estimated_delivery_date || t.estimatedDeliveryDate;
  return d ? jour(d) : "—";
};

function tableauTarifs(r, o) {
  const paye = o ? Number(o.shipping_paid || 0) : null;
  const demo = S.config && S.config.adaptateur === "bouchon";
  // Un compte transporteur n'est pas un détail : Lasclay a deux comptes Canada Post à
  // 1,08 $ d'écart sur le même service. La colonne n'apparaît que s'il y a de quoi la remplir.
  const comptes = r.tarifs.some((t) => t.compte);
  return `${demo ? `<div class="avis bloquant" style="margin-bottom:10px">
      <b>Tarifs de démonstration.</b> L'adaptateur transporteur n'est pas branché : ces prix
      sont ceux relevés une fois chez ShipStation et ne varient pas avec la destination.
      <b>Ne pas s'en servir pour arbitrer un envoi réel.</b> Brancher
      <code>CARRIER_ADAPTER</code> à réception des identifiants.</div>` : ""}
    <div class="tbl"><table>
    <thead><tr><th scope="col">Transporteur</th>${comptes ? '<th scope="col">Compte</th>' : ""}
      <th scope="col">Service</th>
      <th scope="col">Délai</th><th scope="col" class="n">Prix</th>${
      paye !== null ? '<th scope="col" class="n">Marge</th>' : ""}</tr></thead><tbody>${
    r.tarifs.map((t) => {
      const m = paye !== null ? Math.round((paye - t.price) * 100) / 100 : null;
      return `<tr><td>${esc(t.carrier)}</td>
        ${comptes ? `<td class="doux">${esc(t.compte || "—")}</td>` : ""}
        <td><span title="${esc(t.serviceId || "")}">${esc(nomTarif(t))}</span>${
          t.dropOff ? ' <span class="puce v">dépôt</span>' : ""}${
          r.recommande && r.recommande.serviceId === t.serviceId ? ' <span class="puce v">recommandé</span>' : ""}</td>
        <td>${esc(delaiTarif(t))}</td>
        <td class="n">${money(t.price)}${demo ? ' <span class="puce a" title="Valeur de démonstration, non contractuelle">démo</span>' : ""}</td>
        ${m !== null ? `<td class="n ${m < 0 ? "rouge" : "vert"}">${m >= 0 ? "+" : ""}${money(m)}</td>` : ""}</tr>`;
    }).join("")}</tbody></table></div>`;
}

/**
 * Le premier menu : chez qui on achète.
 *
 * Rien n'y est écrit en dur. La liste vient de `/api/carriers/adapters`, donc brancher un
 * jour les comptes transporteur propres de Lasclay les fera apparaître ici sans toucher à
 * l'interface. Un fournisseur sans identifiants reste **visible mais désactivé** : c'est
 * ainsi qu'on apprend qu'il existe et qu'il lui manque une clé, plutôt que par son absence.
 */
function optionsFournisseur(selection = "") {
  const liste = S.fournisseurs || [];
  if (!liste.length) return `<option value="">— chargement…</option>`;
  const choisi = selection || (liste.find((f) => f.defaut) || {}).nom || "";
  // « Tous » en tête : c'est la question qu'on se pose vraiment — le prix le plus bas, tous
  // comptes confondus. Sur une même commande, trois cents séparaient Chit Chats de Freightcom
  // et quatre dollars les séparaient de l'ancien compte. On ne trouve pas ça en changeant de
  // menu vingt fois par jour. L'option n'apparaît qu'à partir de deux fournisseurs branchés :
  // « comparer » un seul compte ne veut rien dire.
  const n = liste.filter((f) => f.configure && !f.demonstration).length;
  return `${n > 1 ? `<option value="tous"${choisi === "tous" ? " selected" : ""}>Tous les fournisseurs — comparer ${n} comptes</option>` : ""}<option value="">— choisir —</option>${liste.map((f) =>
    `<option value="${esc(f.nom)}"${f.configure ? "" : " disabled"}${
      String(f.nom) === String(choisi) ? " selected" : ""}>${esc(f.libelle)} — ${
      f.configure ? esc(f.detail) : "identifiants manquants"}</option>`).join("")}`;
}

/**
 * Les tarifs du moment, en options de liste déroulante.
 *
 * Le référentiel statique ne peut pas être la liste des choix d'expédition : Freightcom cote
 * 153 services et n'en retourne qu'une vingtaine pour un envoi donné — ceux qui desservent
 * cette destination, à ce poids, ce jour-là. Mapper les 153 à la main reviendrait à recopier
 * un catalogue pour ensuite proposer des services qui ne s'appliquent pas.
 *
 * Alors la cotation **devient** le menu. Chaque ligne porte son prix, parce que c'est sur le
 * prix qu'on choisit, et le tarif de dépôt est marqué : c'est lui qui porte l'économie.
 */
function optionsTarifs(r, selection = "") {
  const tarifs = (r && r.tarifs) || [];
  if (!tarifs.length) return null;
  const choisi = selection || (r.recommande && r.recommande.serviceId) || "";
  const groupes = new Map();
  for (const t of tarifs) {
    if (!groupes.has(t.carrier)) groupes.set(t.carrier, []);
    groupes.get(t.carrier).push(t);
  }
  // Le transporteur le moins cher d'abord : c'est l'ordre dans lequel on décide.
  const ordonnes = [...groupes.entries()]
    .sort((a, b) => Math.min(...a[1].map((x) => x.price)) - Math.min(...b[1].map((x) => x.price)));
  return `<option value="">— choisir —</option>${ordonnes.map(([carrier, liste]) =>
    `<optgroup label="${esc(carrier)}">${liste.sort((a, b) => a.price - b.price).map((t) =>
      `<option value="${esc(t.serviceId)}"${String(t.serviceId) === String(choisi) ? " selected" : ""}>${
        money(t.prixHT ?? t.price)} — ${esc(nomTarif(t))}${t.dropOff ? " · dépôt" : ""}${
        t.transitDays ? ` · ${t.transitDays} j` : ""}${
        // En comparaison croisée, deux services homonymes chez deux courtiers seraient
        // indiscernables : le fournisseur est écrit dans le libellé.
        t.fournisseur ? ` · ${esc((S.fournisseurs || []).find((f) => f.nom === t.fournisseur)?.libelle || t.fournisseur)}` : ""
      }${t.achetable === false ? " · ESSAI, non achetable" : ""}</option>`).join("")}</optgroup>`).join("")}`;
}

  $("#fPrint", f).onclick = (e) => { e.stopPropagation(); menuAncre($("#fPrint", f), [

  /**
   * Annuler l'étiquette depuis la commande.
   *
   * Le geste n'existait que dans l'écran Expéditions. Or on découvre l'erreur en regardant LA
   * COMMANDE — mauvaise adresse, mauvais service, colis déjà parti autrement — et il fallait
   * changer d'écran, retrouver la ligne, la sélectionner. Entre-temps, l'étiquette reste
   * payée. Le menu Actions de la commande le propose donc aussi, en nommant l'expédition

   */
  // Les expéditions de la commande arrivent en différé (voir plus bas, `/api/shipments`).

  let expeditionsDeLaCommande = [];

  const annulerEtiquette = () => {
    const vivants = envoisVivants();

    const choix = vivants.length === 1 ? `<input type="hidden" id="avE" value="${vivants[0].id}">`
      : `<label class="champ"><span>Expédition</span><select id="avE">${vivants.map((x) =>
          `<option value="${x.id}">${esc(x.carrier_code || "—")} ${esc(x.service_id || "")} · ${
            esc(x.tracking_number || "sans suivi")} · ${money(x.cost)}</option>`).join("")}</select></label>`;
    dialogue("Annuler l'étiquette", `${choix}
      <p>L'étiquette sera annulée auprès du transporteur. Le remboursement dépend de lui et
        n'est pas garanti — ce qu'il répond s'affichera.</p>
      <p class="doux">La commande repassera « à expédier » si c'était sa dernière étiquette.</p>`,
      async () => {
        const r = await api("/api/shipments/void", { method: "POST",
          body: { shipment_id: Number($("#avE").value) } });
        if (r && r.error) return alert(r.error);
        toast(r && r.refunded
          ? `Étiquette annulée et remboursement confirmé${r.cout ? ` — ${money(r.cout)}` : ""}.`
          : `Étiquette annulée. Remboursement ${esc((r && r.remboursement) || "non confirmé")}.`,
          { type: r && r.refunded ? "ok" : "info" });
        recharger(); rafraichirGrille(); rafraichirCompteurs();
      }, "Annuler l'étiquette");
  };

  $("#fActions", f).onclick = (e) => { e.stopPropagation(); menuAncre($("#fActions", f), [
    { t: "Annuler l'étiquette…", inactif: envoisVivants().length ? null : "aucune étiquette active",
      f: annulerEtiquette },
    { t: "Marquer comme expédiée…", f: () => dialogue("Marquer comme expédiée", `
        <label class="champ"><span>Transporteur</span><input id="mc" placeholder="canada_post"></label>
        <label class="champ"><span>N° de suivi</span><input id="mt"></label>
        <label class="ch"><input type="checkbox" id="mn" checked> notifier la boutique</label>`,
      async () => {
        await api("/api/shipments/mark-shipped", { method: "POST", body: {
          order_id: id, carrier_code: $("#mc").value || null,
          tracking_number: $("#mt").value || null, notifier: $("#mn").checked } });
        recharger(); rafraichirGrille(); rafraichirCompteurs();
      }, "Marquer") },
    { t: "Créer une étiquette de retour", f: async () => {
        if (!S.config.etiquettes_actives) return alert("Achat d'étiquettes désactivé sur ce service.");
        const r = await api("/api/shipments/return", { method: "POST", body: {
          order_id: id, fournisseur: ($("#cFour", f) && $("#cFour", f).value) || null } });
        alert(r.error ? r.error : `Retour ${r.trackingNumber}`);
        recharger();
      } },
    { t: "Ouvrir un retour (RMA)…", f: () => dialogue("Ouvrir un retour", `
        <label class="champ"><span>Motif</span><select id="rm">${MOTIFS_RETOUR.map((m) =>
          `<option value="${esc(m[0])}">${esc(m[1])}</option>`).join("")}</select></label>
        <label class="champ"><span>Note</span><input id="rn"></label>
        <label class="champ"><span>Résolution</span><select id="rr">
          <option value="refund">remboursement</option><option value="exchange">échange</option>
          <option value="store_credit">crédit en boutique</option></select></label>`,
      async () => {
        await api("/api/returns", { method: "POST", body: { order_id: id,
          reason: $("#rm").value, note: $("#rn").value, resolution: $("#rr").value } });
        recharger();
      }, "Ouvrir le retour") },
    { sep: 1 },
    { t: "Mettre en attente…", f: () => {
        const d7 = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
        dialogue("Mettre en attente", `<label class="champ"><span>Jusqu'au</span><input type="date" id="hd2" value="${d7}"></label>`,
          async () => { await api("/api/orders/hold", { method: "POST", body: { ids, hold_until: $("#hd2").value } });
            recharger(); rafraichirGrille(); rafraichirCompteurs(); });
      } },
    { t: "Remettre en file", f: async () => {
        await api("/api/orders/restore", { method: "POST", body: { ids } });
        recharger(); rafraichirGrille(); rafraichirCompteurs();
      } },
    { t: "Étiqueter…", f: () => dialogue("Étiqueter", `
        <label class="champ"><span>Étiquette</span><select id="tg2">${(S.refs.tags || []).map((t) =>
          `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
        <label class="ch"><input type="checkbox" id="trm2"> retirer au lieu d'ajouter</label>`,
      async () => { await api("/api/orders/tag", { method: "POST", body: {
        ids, tag_id: Number($("#tg2").value), remove: $("#trm2").checked } }); recharger(); rafraichirGrille(); }) },
    { t: "Rafraîchir depuis la boutique", f: async () => {
        const r = await api("/api/orders/refresh", { method: "POST", body: { ids } });
        if (r.erreurs?.length) alert(r.erreurs.map((x) => `${x.numero} : ${x.motif}`).join("\n"));
        recharger(); rafraichirGrille();
      } },
    { t: "Valider l'adresse", f: async () => {
        await api("/api/orders/validate-address", { method: "POST", body: { ids } });
        recharger();
      } },
    { t: "Rejouer l'automatisation", f: async () => {
        await api("/api/automation/run", { method: "POST", body: { ids } });
        recharger(); rafraichirGrille();
      } },
    { t: "Tester les règles (simulation)", f: async () => {
        const r = await api("/api/rules/test", { method: "POST", body: { order_id: id } });
        const l = r.declenchees.declenchees || r.declenchees || [];
        $("#cOut", f).innerHTML = l.length
          ? `<div class="carte">${l.map((x) => `<b>${esc(x.name)}</b><br><span class="doux">${
              (x.actions || []).map((a) => esc(a.type)).join(", ")}</span>`).join("<hr>")}</div>`
          : '<p class="doux">Aucune règle ne s\'applique.</p>';
      } },
    { sep: 1 },
    { t: "Annuler la commande…", danger: 1, f: () => dialogue("Annuler la commande",
      `<div class="avis">La commande passera en <b>annulée</b>. L'annulation ne remonte pas
       vers la boutique — il faut aussi l'annuler à la source.</div>`,
      async () => { await api("/api/orders/cancel", { method: "POST", body: { ids } });
        fermer(); rafraichirGrille(); rafraichirCompteurs(); }, "Annuler la commande") },
  ], { droite: true }); };

  // ------------------------------------------------------- rail d'expéditions
  api(`/api/shipments?order_id=${id}`).then((j) => {
    const l = j.shipments || [];
    expeditionsDeLaCommande = l;
    $("#fnExp", f).textContent = l.length;
    /*
     * L'état du renvoi à la boutique, sur chaque expédition.
     *
     * L'étiquette s'imprime, le colis part, et le client ne voit rien passer chez Shopify :
     * c'est un renvoi qui n'a pas eu lieu. Il ne se voyait nulle part — l'écran affichait le
     * numéro de suivi comme si tout était fait. Il se lit ici, et se relance d'un clic.
     */
    const etatRenvoi = (x) => {
      if (x.is_return || x.voided) return "";
      if (x.marketplace_notified) return '<span class="puce v">boutique notifiée</span>';
      return `<span class="puce a">boutique non notifiée</span>
        ${x.notify_error ? `<span class="doux" style="font-size:11px">${esc(String(x.notify_error).slice(0, 70))}</span>` : ""}
        <button type="button" class="lienB" data-renvoi="${x.id}">Renvoyer le suivi</button>`;
    };
    $("#fRailL", f).innerHTML = l.length
      ? l.map((x, i) => `<div class="fRailE ${i === 0 ? "actif" : ""}">
          <b>Expédition ${i + 1}</b>
          <span class="sku">${esc(x.tracking_number || "sans suivi")}</span>
          <span>${nomService(x.service_id)}</span>
          <span class="doux">${money(x.cost)}</span>
          ${x.is_return ? '<span class="puce a">retour</span>' : ""}
          ${x.voided ? '<span class="puce r">annulée</span>' : ""}
          ${etatRenvoi(x)}
        </div>`).join("")
      : `<div class="fRailE actif"><b>Expédition 1</b><span class="doux">à préparer</span></div>`;

    $("#fRailL", f).querySelectorAll("[data-renvoi]").forEach((b) => b.onclick = async (ev) => {
      ev.stopPropagation();
      b.disabled = true;
      try {
        // `force` : le geste est explicite, il passe outre la date de bascule. C'est le seul
        // moyen de rattraper une expédition que la bascule avait laissée de côté.
        const r = await api("/api/channels/notify", { method: "POST",
          body: { shipment_id: Number(b.dataset.renvoi), force: true } });
        if (r.erreur) dialogue("Renvoi refusé", `<div class="avis">${esc(r.erreur)}</div>`, null, "Fermer");
        else if (r.ignore) dialogue("Renvoi non effectué", `<div class="avis">${esc(r.ignore)}</div>`, null, "Fermer");
        else toast(`Suivi renvoyé à ${esc(r.canal || "la boutique")}.`);
      } catch (e) { dialogue("Renvoi impossible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }
      finally { recharger(); }
    });
  }).catch(() => { $("#fRailL", f).innerHTML = '<div class="doux" style="padding:8px">—</div>'; });

  const scinder = () => dialogue(`Scinder ${o.order_number}`, `
    <p class="doux">Les articles cochés partent dans une nouvelle expédition. C'est le
    « Split Ship » de ShipStation : une commande, deux colis, deux étiquettes.</p>
    ${artsF.map((i) => `<label class="ch" style="display:flex;padding:4px 0;gap:8px">
      <input type="checkbox" data-it="${i.id}"> ${i.quantity} × ${esc(i.name)}
      <span class="sku">${esc(i.sku || "")}</span></label>`).join("")}`,
    async () => {
      const items = [...document.querySelectorAll("#dlgC [data-it]:checked")].map((x) => Number(x.dataset.it));
      if (!items.length || items.length === artsF.length) { alert("Cocher au moins un article, mais pas tous."); return false; }
      const r = await api(`/api/orders/${id}/split`, { method: "POST", body: { item_ids: items } });
      alert(`Nouvelle commande créée (#${r.enfant}).`);
      recharger(); rafraichirGrille(); rafraichirCompteurs();
    }, "Scinder");
  $("#fSplit", f).onclick = scinder;
  const s2 = $("#fSplit2", f); if (s2) s2.onclick = scinder;
  $("#fScan", f).onclick = () => dialogue("Vérifier au scan",
    `<p>Le poste de scan s'ouvre sur son propre écran, avec le champ prêt à recevoir la
       douchette. La fiche de <b>${esc(o.order_number)}</b> se fermera.</p>`,
    () => { f.remove(); ficheOuverte = null; aller("scan"); }, "Ouvrir le poste de scan");
  // Le message était juste ; le véhicule ne l'était pas. Un `alert()` natif est bloquant,
  // non stylé, non traduisible, et il n'offre pas le geste qu'il recommande.
  /*
   * Modifier les articles — selon d'où vient la commande.
   *
   * Le refus est juste pour une commande importée : une ligne changée des deux côtés ne se
   * réconcilie plus. Mais il s'appliquait à TOUTES les commandes, y compris celles saisies à
   * la main dans le clone — qui n'ont aucun amont où aller les corriger.
   */
  const boutiqueDeCmd = (S.refs.stores || []).find((x) => String(x.id) === String(o.store_id));
  const manuelle = String(boutiqueDeCmd?.marketplace || "").toLowerCase() === "manual" || !o.store_id;

  $("#fEditArt", f).onclick = () => manuelle ? editerArticles() : dialogue("Modifier les articles", `
    <p>Les lignes d'une commande se modifient <b>à la source</b>, dans ${
      esc(boutiqueDeCmd?.name || "la boutique")}, puis se rapatrient ici. C'est la seule façon
      de ne pas désynchroniser la commande : une ligne changée des deux côtés ne se réconcilie
      plus.</p>
    <p class="doux">Modifiez la commande dans ${esc(boutiqueDeCmd?.name || "la boutique")},
      puis revenez rafraîchir.</p>`,
    async () => {
      await api("/api/orders/refresh", { method: "POST", body: { ids: [o.id] } });
      $("#dlg").close();
      detailCommande(o.id);
    }, "Rafraîchir depuis la boutique");

  /** L'éditeur de lignes des commandes manuelles. */
  function editerArticles() {
    const lignes = (o.items || []).filter((i) => !i.adjustment).map((i) => ({ ...i }));
    const ligneHtml = (i, n) => `<tr data-n="${n}">
      <td><input data-c="name" value="${esc(i.name || "")}" placeholder="Description"></td>
      <td><input data-c="sku" value="${esc(i.sku || "")}" placeholder="SKU" size="10"></td>
      <td><input type="number" data-c="quantity" min="0" step="1" value="${esc(i.quantity ?? 1)}" size="4"></td>
      <td><input type="number" data-c="unit_price" min="0" step="0.01" value="${esc(i.unit_price ?? 0)}" size="7"></td>
      <td><input type="number" data-c="weight_g" min="0" step="1" value="${esc(i.weight_g ?? 0)}" size="6"></td>
      <td><button type="button" class="lienB" data-sup="${n}" aria-label="Retirer la ligne">✕</button></td></tr>`;
    dialogue("Modifier les articles", `
      <p class="doux">Commande saisie à la main : les lignes se modifient ici, il n'y a pas de
        boutique d'où les rapatrier. Une quantité à zéro retire la ligne.</p>
      <div class="tScroll"><table class="tArt"><thead><tr>
        <th>Article</th><th>SKU</th><th>Qté</th><th>Prix unitaire</th><th>Poids (g)</th><th></th>
      </tr></thead><tbody id="eaB">${lignes.map(ligneHtml).join("")}</tbody></table></div>
      <button type="button" class="lienB" id="eaAdd">+ Ajouter une ligne</button>`,
      async () => {
        const finales = [...$("#eaB").querySelectorAll("tr")].map((tr) => {
          const v = (c) => tr.querySelector(`[data-c="${c}"]`).value;
          const base = lignes[Number(tr.dataset.n)] || {};
          return { ...base, name: v("name"), sku: v("sku") || null,
            quantity: Number(v("quantity")) || 0, unit_price: Number(v("unit_price")) || 0,
            weight_g: Number(v("weight_g")) || 0 };
        }).filter((i) => i.quantity > 0 && (i.name || i.sku));
        // Les lignes d'ajustement ne sont pas éditables mais ne doivent pas disparaître :
        // l'enregistrement remplace TOUTES les lignes de la commande.
        const ajustements = (o.items || []).filter((i) => i.adjustment);
        await api("/api/orders", { method: "POST",
          body: { ...o, items: [...finales, ...ajustements] } });
        $("#dlg").close();
        detailCommande(o.id);
      }, "Enregistrer");
    let n = lignes.length;
    $("#eaAdd").onclick = () => {
      $("#eaB").insertAdjacentHTML("beforeend",
        ligneHtml({ name: "", sku: "", quantity: 1, unit_price: 0, weight_g: 0 }, n++));
    };
    $("#eaB").onclick = (e) => {
      const b = e.target.closest("[data-sup]");
      if (b) b.closest("tr").remove();
    };
  }

  // ------------------------------------------------------ déclarations douane
  const declOf = () => {
    const enr = new Map((douane.declarations || []).map((d) => [String(d.order_item_id ?? d.sku), d]));
    return artsF.map((i) => {
      const d = enr.get(String(i.id)) || enr.get(String(i.sku)) || {};
      return { order_item_id: i.id, description: d.description || i.name || "", sku: i.sku || "",
        quantity: d.quantity ?? i.quantity, value: d.value ?? i.unit_price,
        hs_code: d.hs_code || "", country_of_origin: d.country_of_origin || "CA" };
    });
  };
  let DECL = declOf();
  function dessinerDecl() {
    $("#dDecl", f).innerHTML = DECL.map((d, i) => `<div class="dLigne">
      <div class="dT">Déclaration ${i + 1}
        <span class="sku">${esc(d.sku || "sans SKU")}</span>
        <button type="button" class="fEdit" data-suppr="${i}" style="margin-left:auto">Supprimer</button></div>
      <label class="champ"><span>Description *</span><input data-d="${i}" data-k="description" value="${esc(d.description)}"></label>
      <div class="dQ">
        <label class="champ"><span>SKU</span><input data-d="${i}" data-k="sku" value="${esc(d.sku || "")}"></label>
        <label class="champ"><span>Quantité *</span><input type="number" data-d="${i}" data-k="quantity" value="${esc(d.quantity)}"></label>
        <label class="champ"><span>Valeur unitaire *</span><input type="number" step="0.01" data-d="${i}" data-k="value" value="${esc(d.value)}"></label>
        <label class="champ"><span>Valeur totale</span>
          <input value="${money((Number(d.quantity) || 0) * (Number(d.value) || 0))}" disabled
                 title="Quantité × valeur unitaire — c'est ce montant que la douane lit"></label>
        <!-- L'espace réservé montrait « 1209.30 » — le code des semences — sur des
             déclarations de textiles. Il ressemble à une valeur saisie : un opérateur pressé
             déclarait un cache-cou comme des semences. Un gabarit neutre ne peut pas être
             pris pour une réponse. -->
        <label class="champ"><span>Code SH ${international ? "*" : ""}</span><input data-d="${i}" data-k="hs_code" value="${esc(d.hs_code)}" placeholder="6 chiffres — ex. 0000.00" inputmode="numeric"></label>
        <!-- Le pays d'origine était en saisie libre : « CAN », « Canada », « ca » et une
             faute de frappe sont quatre déclarations différentes pour un douanier, et une
             seule d'entre elles est valide. Liste fermée, comme chez ShipStation. -->
        <label class="champ"><span>Pays d'origine *</span><select data-d="${i}" data-k="country_of_origin">${
          PAYS_EXPEDITION.map(([c, n]) => `<option value="${esc(c)}"${d.country_of_origin === c ? " selected" : ""}>${esc(n)}</option>`).join("")}
        </select></label>
      </div>
      ${!d.hs_code && international ? '<div class="avis mini">Code SH manquant — le colis sera bloqué en douane.</div>' : ""}
    </div>`).join("");
    $("#dDecl", f).querySelectorAll("[data-d]").forEach((i) =>
      i.onchange = () => {
        DECL[Number(i.dataset.d)][i.dataset.k] = i.value;
        // La valeur totale est ce que la douane lit ; elle doit suivre la saisie tout de
        // suite, pas au prochain rechargement.
        if (i.dataset.k === "quantity" || i.dataset.k === "value") dessinerDecl();
      });
    // Ajouter et supprimer une déclaration : une commande peut porter une ligne qui n'a pas
    // d'article correspondant (un envoi groupé, un remplacement), et une ligne non physique
    // n'a rien à faire dans une déclaration douanière.
    $("#dDecl", f).querySelectorAll("[data-suppr]").forEach((b) =>
      b.onclick = () => { DECL.splice(Number(b.dataset.suppr), 1); dessinerDecl(); });
    $("#fnDoc", f).textContent = DECL.filter((d) => d.hs_code).length;
  }
  dessinerDecl();

  $("#dAjout", f).onclick = () => {
    DECL.push({ order_item_id: null, description: "", sku: "", quantity: 1, value: 0,
      hs_code: "", country_of_origin: "CA" });
    dessinerDecl();
    // Le focus va sur la description de la ligne créée : c'est le champ obligatoire.
    const champs = $("#dDecl", f).querySelectorAll('[data-k="description"]');
    champs[champs.length - 1]?.focus();
  };

  $("#dHS", f).onclick = async () => {
    $("#dMsg", f).textContent = "Classification…";

      const r = await api("/api/hs/simuler", { method: "POST", body: { tous: true } });
      const par = new Map((r.classees || r.resultats || []).map((x) => [String(x.sku), x]));
      let n = 0;
      DECL = DECL.map((d) => {
        const p = par.get(String(d.sku));
        if (p && p.code && !d.hs_code) { n++; return { ...d, hs_code: p.code, description: d.description || p.libelle }; }
        return d;

      $("#dMsg", f).textContent = n ? `${n} code(s) proposé(s) — à vérifier avant d'enregistrer.` : "Aucune proposition nouvelle.";
    } catch (e) { $("#dMsg", f).textContent = e.message; }
  };

  $("#dEnr", f).onclick = async () => {
    const corps = { contents: $("#dContenu", f).value, non_delivery: $("#dNonLiv", f).value,
      invoice_number: $("#dFacture", f).value, export_declaration_number: $("#dExport", f).value,
      duties_paid: $("#dDroits", f).value, postage_paid: $("#dPort", f).value,

      certifier_id: $("#dCertI", f).value,

    const r = await api(`/api/orders/${id}/customs`, { method: "POST", body: corps }).catch((e) => ({ error: e.message }));
    if (r.error) {
      // Le refus est explicite et actionnable — jamais une erreur brute de validation d'API
      // renvoyée telle quelle à l'écran (constat OBS1).
      $("#dMsg", f).innerHTML = `<span class="puce r">${esc(r.error)}</span>`;
      return;
    }
    $("#dMsg", f).textContent = `${r.n} déclaration(s) enregistrée(s).`;
    dessinerDecl();
  };

  // ---------------------------------------------------------------- ④ notes
  $("#fNoteS", f).onclick = async () => {
    await api("/api/orders", { method: "POST", body: { ...o,
      internal_notes: $("#fNoteI", f).value, note_to_buyer: $("#fNoteB", f).value,

  /**
   * Toute modification de la colonne d'expédition est enregistrée immédiatement et recote.

  const conf = async (source = null) => {
    try {
      await api("/api/orders/configure", { method: "POST", body: { ids,
