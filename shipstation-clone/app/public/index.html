      }, "Marquer expédiée");
  }

  function fusionner() {
    const [cible, ...autres] = ids();
    dialogue("Fusionner", `<p>Les commandes seront fusionnées dans <b>#${cible}</b> (la première sélectionnée).
      Les autres passeront en annulé, leurs articles rejoignant la cible.</p>`,
      async () => { await api("/api/orders/merge", { method: "POST", body: { target: cible, ids: autres } });
        S.sel.clear(); charger(); rafraichirCompteurs(); });
  }

  function annuler() {
    dialogue(`Annuler ${S.sel.size} commande(s)`,
      `<div class="avis">Action destructrice : les commandes passent en <b>annulée</b>.</div>`,
      async () => { const r = await api("/api/orders/cancel", { method: "POST", body: { ids: ids() } });
        if (r.erreurs?.length) alert(r.erreurs.map((e) => `#${e.id} : ${e.e}`).join("\n"));
        S.sel.clear(); charger(); rafraichirCompteurs(); }, "Annuler les commandes");
  }

  async function rejouerAutomatisation(sec) {
    const r = await api("/api/automation/run", { method: "POST", body: { ids: ids(), dry_run: sec } });
    const lignes = Object.entries(r.resultats).map(([id, trace]) => {
      const o = LIGNES.find((x) => String(x.id) === id);
      return `<tr><td>${esc(o ? o.order_number : id)}</td><td>${trace.length
        ? trace.map((t) => `<span class="puce g">${t.couche}. ${esc(t.nom)}</span> ${esc(t.effet || t.regle || t.arret || t.erreur || "")}`).join("<br>")
        : '<span class="doux">aucun effet</span>'}</td></tr>`;
    }).join("");
    dialogue(sec ? "Simulation de l'automatisation" : "Automatisation appliquée", `
      ${sec ? '<div class="avis info">Simulation : rien n\'a été écrit.</div>' : ""}
      <div class="tbl"><table><thead><tr><th>Commande</th><th>Couches déclenchées</th></tr></thead>
      <tbody>${lignes}</tbody></table></div>`, null, "Fermer");
    if (!sec) charger();
  }

  // ------------------------------------------------ sidebar d'expédition
  /**
   * Le « Configure Shipment Widget » de ShipStation : expéditeur, poids, service, colis,
   * dimensions, confirmation, puis le bouton d'achat portant le tarif. Ajouts : la marge
   * avant achat, et la provenance du poids et des dimensions — ShipStation ne documente
   * nulle part qui gagne entre préréglage, profil produit, produit et type de colis, alors
   * que c'est ce qui détermine le poids facturé.
   */
  async function cote() {
    const C = $("#cote");
    if (S.sel.size === 0) {
      C.innerHTML = `<div class="vide3">Sélectionnez une commande pour configurer l'expédition.
        <div class="doux" style="margin-top:8px">Astuce : <kbd>?</kbd> affiche les raccourcis.</div></div>`;
      return;
    }
    if (S.sel.size > 1) {
      const sel = LIGNES.filter((o) => S.sel.has(String(o.id)));
      const poids = sel.reduce((s, o) => s + (o.weight_g || 0), 0);
      const sansPoids = sel.filter((o) => !o.weight_g).length;
      C.innerHTML = `<div class="sec"><h4>${sel.length} commandes sélectionnées</h4>
        <div class="kv"><span>Poids cumulé</span><b>${num(Math.round(poids))} g</b></div>
        <div class="kv"><span>Sans poids</span><b class="${sansPoids ? "rouge" : ""}">${sansPoids}</b></div>
        <div class="kv"><span>Valeur</span><b>${money(sel.reduce((s, o) => s + (o.order_total || 0), 0))}</b></div>
        <div class="kv"><span>Livraison facturée</span><b>${money(sel.reduce((s, o) => s + (o.shipping_paid || 0), 0))}</b></div>
      </div>
      <div class="sec"><h4>Articles à préparer</h4>${listeArticlesGroupes(sel)}</div>`;
      return;
    }
    const o = await api(`/api/orders/${[...S.sel][0]}`);
    const svc = (S.refs.services || []).filter((x) => !x.hidden);
    const colis = (S.refs.packages || []);
    const mapped = o.requested_service ? !(S.nonMappes || []).includes(o.requested_service) : null;

    // Sections dans l'ordre exact de la Shipping Sidebar (§2.6) : résumé, destinataire,
    // articles, widget de configuration, notes, étiquettes, communication client, activité.
    // Le bouton d'achat est en bas et porte le tarif, comme « Create + Print Label $X.XX ».
    C.innerHTML = `
      <div class="sec">
        <h4>${esc(o.order_number)} <span class="puce g">${esc(STATUT_FR[o.status] || o.status)}</span></h4>
        <div class="kv"><span>Boutique</span><b>${esc((S.refs.stores || []).find((x) => x.id === o.store_id)?.name || o.source || "—")}</b></div>
        <div class="kv"><span>Commandée le</span><b>${jour(o.order_date)}</b></div>
        <div class="kv"><span>Âge</span><b>${o.age ?? "—"} j</b></div>
        <div class="kv"><span>Total</span><b>${money(o.order_total)}</b></div>
        <div class="kv"><span>Livraison facturée</span><b>${money(o.shipping_paid)}</b></div>
      </div>

      <div class="sec">
        <h4>Destinataire ${adresseValide(o.ship_to)}</h4>
        <div class="adr">${esc(o.customer_name || "")}
          ${o.ship_to.company ? `<br>${esc(o.ship_to.company)}` : ""}<br>${esc(o.ship_to.street1 || "")}
          ${o.ship_to.street2 ? `<br>${esc(o.ship_to.street2)}` : ""}<br>
          ${esc(o.ship_to.city || "")} ${esc(o.ship_to.state || "")} ${esc(o.ship_to.postalCode || "")}<br>
          ${esc(o.ship_to.country || "")}</div>
        ${o.customer_email ? `<div class="kv"><span>Courriel</span><b>${esc(o.customer_email)}</b></div>` : ""}
      </div>

      <div class="sec"><h4>Articles</h4>${listeArticlesGroupes([o])}</div>

      <div class="sec csw">
        <h4>Configuration de l'expédition</h4>
        <label class="champ"><span>Expédié de</span><select id="cw">${(S.refs.warehouses || []).map((w) =>
          `<option value="${w.id}" ${o.warehouse_id === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select></label>
        <label class="champ"><span>Poids (g) — touche W</span><input type="number" id="cp" value="${o.weight_g || ""}"></label>
        <label class="champ"><span>Service</span><select id="cs"><option value="">— choisir —</option>${svc.map((x) =>
          `<option value="${x.id}" ${String(o.service_id) === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label class="champ"><span>Colis</span><select id="cc"><option value="">— choisir —</option>${colis.map((x) =>
          `<option value="${x.id}" ${String(o.package_id) === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <div class="dims">
          <input type="number" id="cl" placeholder="L" value="${o.dimensions?.length || ""}">
          <input type="number" id="cW" placeholder="l" value="${o.dimensions?.width || ""}">
          <input type="number" id="ch" placeholder="H" value="${o.dimensions?.height || ""}">
          <span class="doux">po</span>
        </div>
        <label class="champ"><span>Confirmation</span><select id="cf">${(S.refs.confirmations || []).map((k) =>
          `<option value="${k.id}" ${String(o.confirmation) === k.id ? "selected" : ""}>${esc(k.nom)}</option>`).join("")}</select></label>
        <label class="champ"><span>Assurance ($, vide = aucune)</span>
          <input type="number" step="0.01" id="ci" value="${o.insurance?.montant ?? ""}"></label>
        <label class="champ"><span>Date d'expédition</span>
          <input type="date" id="cd" value="${(o.ship_by_date || "").slice(0, 10)}"></label>
        <details class="autres"><summary>Autres options d'expédition</summary>
          <label class="ch"><input type="checkbox" id="cnd" ${String(o.internal_notes || "").includes("[no_dropoff]") ? "checked" : ""}>
            interdire le dépôt en bureau de poste</label>
          <label class="ch"><input type="checkbox" id="cnm"> ne pas notifier la boutique</label>
        </details>
        ${o.requested_service ? `<div class="kv" style="margin-top:6px"><span>Service demandé</span>
          <b>${esc(o.requested_service)} ${mapped
            ? '<span class="puce v">mappé</span>'
            : '<a class="lienMap" id="cMap">non mappé</a>'}</b></div>` : ""}
        <div id="cMarge"></div>
      </div>

      <div class="sec"><h4>Notes</h4>
        ${o.customer_notes ? `<div class="note"><span class="doux">De l'acheteur</span><br>${esc(o.customer_notes)}</div>` : ""}
        ${o.gift_message ? `<div class="note"><span class="doux">Message cadeau</span><br>${esc(o.gift_message)}</div>` : ""}
        <textarea id="cNote" class="petit" placeholder="Note interne…">${esc(o.internal_notes || "")}</textarea>
        <button id="cNoteS">Enregistrer la note</button>
      </div>

      <div class="sec"><h4>Étiquettes</h4>
        ${(o.tags || []).map(pastilleTag).join(" ") || '<span class="doux">aucune</span>'}</div>

      <div class="sec"><h4>Communication client</h4>
        <div class="kv"><span>Bordereau</span><b>Default 4″ × 6″</b></div>
        <div class="kv"><span>Avis d'expédition</span><b>${esc(S.refs.gabarit_expedition || "Gabarit par défaut")}</b></div>
        <div class="kv"><span>Boutique notifiée</span><b>${o.status === "shipped" ? "à l'achat de l'étiquette" : "pas encore"}</b></div>
      </div>

      <div class="sec"><h4>Activité</h4><div id="cActivite" class="doux">Chargement…</div></div>

      <div class="pied">
        <button id="cCoter" title="Coter (R)">Coter</button>
        <button class="v" id="cAcheter" ${S.config.etiquettes_actives ? "" : "disabled"}>
          Créer + imprimer l'étiquette<span id="cPrix"></span></button>
      </div>
      <div class="sec" id="cTarifs"></div>`;

    // marge : ce que le client a payé pour la livraison, avant l'achat (constat OBS9)
    const paye = Number(o.shipping_paid || 0);
    $("#cMarge").innerHTML = paye === 0
      ? `<div class="avis" style="margin:6px 0 0">Livraison offerte — le coût de l'étiquette est une perte sèche.</div>`
      : "";

    const enregistrer = async (extra = {}) => api("/api/orders", { method: "POST", body: { ...o,
      warehouse_id: Number($("#cw").value) || null, weight_g: Number($("#cp").value) || 0,
      service_id: $("#cs").value || null, package_id: $("#cc").value || null,
      confirmation: $("#cf").value || null,
      ship_by_date: $("#cd").value || null,
      insurance: $("#ci").value ? { montant: Number($("#ci").value), devise: "CAD" } : null,
      dimensions: ($("#cl").value || $("#cW").value || $("#ch").value)
        ? { length: Number($("#cl").value) || 0, width: Number($("#cW").value) || 0,
            height: Number($("#ch").value) || 0, units: "inches" } : null, ...extra } });

    // Chaque champ du widget enregistre en sortant : ShipStation applique au fil de la saisie,
    // et un bouton « Enregistrer » oublié fait acheter l'étiquette avec l'ancien service.
    C.querySelectorAll(".csw input, .csw select").forEach((x) => x.onchange = async () => {
      await enregistrer(); charger();
    });
    const map = $("#cMap");
    if (map) map.onclick = () => aller("prereglages");

    $("#cNoteS").onclick = () => enregistrer({ internal_notes: $("#cNote").value });
    $("#cCoter").onclick = async () => {
      $("#cTarifs").innerHTML = '<div class="doux">Cotation…</div>';
      try {
        const r = await api("/api/shipments/quote", { method: "POST", body: { order_id: o.id } });
        $("#cTarifs").innerHTML = tableauTarifs(r, o);
        if (r.recommande) $("#cPrix").textContent = "  " + money(r.recommande.price);
      } catch (e) { $("#cTarifs").innerHTML = `<div class="avis">${esc(e.message)}</div>`; }
    };
    $("#cAcheter").onclick = acheterLot;

    api(`/api/audit?limit=8`).then((j) => {
      const l = (j.rows || []).filter((r) => String(r.entity_id) === String(o.id) || r.entity === "order");
      $("#cActivite").innerHTML = l.length
        ? l.slice(0, 6).map((r) => `<div>${esc(String(r.at).slice(0, 16).replace("T", " "))} — ${esc(r.action)}</div>`).join("")
        : "aucune activité enregistrée";
    }).catch(() => { $("#cActivite").textContent = "—"; });
  }

  /** Icône de validation d'adresse — vert immeuble/maison, orange avertissement, rouge erreur. */
  function adresseValide(a) {
    if (!a || !a.street1 || !a.city || !a.postalCode) return '<span class="valA err" title="Adresse incomplète">!</span>';
    if (!a.country) return '<span class="valA warn" title="Pays manquant">?</span>';
    return `<span class="valA ok" title="Adresse complète">${a.country === "CA" || a.country === "US" ? "⌂" : "◍"}</span>`;
  }

  function listeArticlesGroupes(cmds) {
    const par = new Map();
    for (const o of cmds) for (const i of arts(o)) {
      const cle = i.sku || i.name;
      const x = par.get(cle) || { sku: i.sku, name: i.name, q: 0, loc: i.warehouse_location };
      x.q += i.quantity || 0; par.set(cle, x);
    }
    return `<div class="artG">${[...par.values()].map((i) =>
      `<div><b>×${i.q}</b> <span class="sku">${esc(i.sku)}</span> ${esc(i.name)}
       ${i.loc ? `<span class="doux">· ${esc(i.loc)}</span>` : ""}</div>`).join("")}</div>`;
  }

  function tableauTarifs(r, o) {
    const paye = o ? Number(o.shipping_paid || 0) : null;
    return `<div class="tbl"><table><thead><tr><th>Transporteur</th><th>Service</th><th class="n">Prix</th>${
      paye !== null ? '<th class="n">Marge</th>' : ""}</tr></thead><tbody>${
      r.tarifs.map((t) => {
        const m = paye !== null ? Math.round((paye - t.price) * 100) / 100 : null;
        return `<tr><td>${esc(t.carrier)}</td>
          <td>${esc(t.serviceName || t.serviceId)}${t.dropOff ? ' <span class="puce v">dépôt</span>' : ""}${
            r.recommande && r.recommande.serviceId === t.serviceId ? ' <span class="puce v">recommandé</span>' : ""}</td>
          <td class="n">${money(t.price)}</td>
          ${m !== null ? `<td class="n ${m < 0 ? "rouge" : "vert"}">${m >= 0 ? "+" : ""}${money(m)}</td>` : ""}</tr>`;
      }).join("")}</tbody></table></div>`;
  }

  // ------------------------------------------------------------- démarrage
  S.cmdCharger = charger;
  S.cmdIds = ids;
  S.cmdPresetParTouche = async (touche) => {
    const p = (S.refs.presets || []).find((x) => x.hotkey === touche);
    if (!p || !S.sel.size) return;
    await api("/api/presets/apply", { method: "POST", body: { preset_id: p.id, ids: ids() } });
    charger();
  };
  S.cmdActions = { acheterLot, marquerExpedie, simulerLot, coter: () => $("#aRate").click() };

  poser({});
  $("#fdense").classList.toggle("on", S0.dense);
  majStatuts();
  await chargerVues();
  try { const d = await api("/api/service-mappings"); S.nonMappes = (d.non_mappes || []).map((x) => x.libelle); } catch {}
  await charger();
};
VUES.attente = () => VUES.commandes("on_hold");

/**
 * Import Shopify — accessible partout : bouton d'en-tête, état vide de la grille, raccourci U.
 *
 * La fenêtre est choisie à l'écran. Le rattrapage reprend par défaut au dernier passage réussi,
 * ce qui est le bon comportement au quotidien mais trompe au premier import : sur une base
 * neuve il ne remonte que trente jours, et l'entrepôt croit que l'import a échoué.
 *
 * L'import se fait par tranches. Chaque passage avance le curseur `shopify_dernier_import`,
 * donc la tranche suivante reprend exactement là où la précédente s'est arrêtée : une seule
 * requête pour 38 000 commandes dépasserait le délai du proxy, et on ne saurait pas où elle
 * en était.
 */
async function importerShopify() {
  const e = await api("/api/shopify");
  if (!e.configure) return dialogue("Shopify non configuré", `
    <div class="avis">Il manque les variables <code>SHOPIFY_STORE</code> et
    <code>SHOPIFY_CLIENT_ID</code> / <code>SHOPIFY_CLIENT_SECRET</code> sur le service.</div>
    <p class="doux">Ce sont exactement les mêmes identifiants que <code>support.js</code> et A2X —
    l'app « Render connector ». Aucun nouveau jeton à créer.</p>`, null, "Fermer");

  const jours = (n) => new Date(Date.now() - n * 86400000).toISOString();
  const TRANCHE = 500;
  const FENETRES = [
    { t: "Depuis le dernier passage (incrémental)", d: () => null, boucle: false },
    { t: "30 derniers jours", d: () => jours(30), boucle: true },
    { t: "12 derniers mois", d: () => jours(365), boucle: true },
    { t: "Tout l'historique de la boutique", d: () => "2015-01-01T00:00:00Z", boucle: true },
  ];

  dialogue("Importer depuis Shopify", `
    <div class="kv"><span>Boutique</span><b>${esc(e.boutique)}</b></div>
    <div class="kv"><span>Dernier passage</span><b>${e.dernier_import ? esc(String(e.dernier_import).slice(0, 16).replace("T", " ")) : "jamais"}</b></div>
    <div class="kv"><span>Commandes Shopify déjà ici</span><b>${num(e.commandes || 0)}</b></div>
    <div class="kv"><span>Synchronisation automatique</span><b>${e.sync_minutes ? `toutes les ${e.sync_minutes} min` : "désactivée"}</b></div>
    <div class="kv"><span>Webhooks signés</span><b>${e.secret_webhook ? "oui" : "non — secret manquant"}</b></div>
    <hr>
    <label class="champ"><span>Fenêtre à importer</span><select id="siFen">${
      FENETRES.map((f, i) => `<option value="${i}"${!e.dernier_import && i === 3 ? " selected" : ""}>${esc(f.t)}</option>`).join("")}</select></label>
    <p class="doux">L'import met à jour les commandes déjà présentes plutôt que de les dupliquer,
      et ne retouche jamais une commande déjà expédiée ici. Un premier import complet prend
      plusieurs minutes — la fenêtre reste ouverte et affiche l'avancement.</p>
    <div class="avis info">Shopify ne contient que la boutique <b>LAS Shopify</b>. L'archive
      complète — Etsy, Faire, commandes manuelles, expéditions, lots — se reprend par
      <b>Réglages → Lancer la migration</b> depuis ShipStation.</div>
    <div id="siJournal"></div>`,
    async () => {
      const f = FENETRES[Number($("#siFen").value)];
      const J = $("#siJournal");
      let depuis = f.d(), total = 0, nouvelles = 0, ignorees = 0, tranches = 0, curseur = null;

      for (;;) {
        tranches++;
        J.innerHTML = `<div class="doux">Tranche ${tranches} — ${num(total)} commande(s) traitée(s),
          ${num(nouvelles)} nouvelle(s)… (ne pas fermer la fenêtre)</div>`;
        let r;
        try {
          r = await api("/api/shopify/rattraper", { method: "POST", body: { depuis, max: TRANCHE } });
        } catch (err) {
          J.innerHTML = `<div class="avis">Interrompu après ${num(total)} commande(s) : ${esc(err.message)}</div>`;
          break;
        }
        total += r.traitees; nouvelles += r.nouvelles; ignorees += r.ignorees || 0;
        rafraichirCompteurs();
        if (S.cmdCharger) S.cmdCharger();

        // Fin : tranche incomplète, ou curseur qui n'avance plus — toutes les commandes de la
        // tranche portant le même horodatage. Sans cette garde, la boucle tournerait en rond.
        const fini = !f.boucle || r.traitees < TRANCHE || r.jusqua === curseur;
        curseur = r.jusqua;
        depuis = null;   // les tranches suivantes reprennent au curseur enregistré
        if (fini) {
          J.innerHTML = `<div class="avis info">Terminé — ${num(total)} commande(s) traitée(s) en
            ${tranches} tranche(s) · <b>${num(nouvelles)}</b> nouvelle(s)
            ${ignorees ? ` · ${num(ignorees)} déjà expédiée(s), non retouchée(s)` : ""}</div>
            <div class="doux">Curseur : ${esc(String(r.jusqua || "").slice(0, 16).replace("T", " "))}</div>`;
          break;
        }
      }
      return false;   // garde la fenêtre ouverte pour lire le bilan
    }, "Importer");
}

/**
 * Automatisation — les 6 couches, et l'éditeur de règles.
 *
 * L'éditeur remplace les zones de texte JSON par un vrai formulaire, parce que le champ qui
 * compte le plus n'existe pas chez ShipStation : la **portée** d'un critère d'article. « SKU
 * contient X » sur une commande de cinq articles ne dit pas s'il faut qu'un article
 * corresponde, que tous correspondent, ou qu'aucun ne corresponde — c'est la demande
 * communautaire la plus ancienne restée sans réponse. Ici elle se choisit dans une liste.
 */
VUES.automatisation = async () => {
  const [d, voc, couches] = await Promise.all([
    api("/api/rules"), api("/api/criteres"), api("/api/automation")]);
  S.voc = voc;

  const ordreCouches = Object.entries(couches.couches).sort((a, b) => a[1].n - b[1].n);

  $("#vue").innerHTML = `<h2>Automatisation</h2>

      passent en dernier : elles voient ce que les couches précédentes ont écrit.</p>
    <div class="carte"><div class="couches">${ordreCouches.map(([cle, c]) =>
      `<div class="couche ${c.rejouable ? "" : "gris"}">
        <b>${c.n}</b> ${esc(c.nom)}
        <span class="doux">${c.rejouable ? "rejouable" : "à l'import seulement"}</span>
      </div>`).join('<span class="fleche">→</span>')}</div>
      <p class="doux" style="margin-top:8px">« Rejouable » = repris par le retraitement des
        commandes ouvertes (Réglages). ShipStation ne rejoue que les trois dernières couches, et
        c'est la même règle ici.</p></div>
    <div class="barre">
      <button class="p" id="rn">Nouvelle règle</button>
      <button id="rOrdre">Réordonner…</button>
      <span class="doux" style="margin-left:auto">${d.rules.filter((r) => r.enabled).length} active(s) sur ${d.rules.length}</span>
    </div>
    <div id="rt"></div>`;

  $("#rt").append(table([
    { k: "position", t: "Ordre", n: true },
    { k: "name", t: "Règle", r: (r) => esc(r.name) + (r.enabled ? "" : ' <span class="puce g">désactivée</span>')
      + (r.notes ? ` <span class="puce a" title="${esc(r.notes)}">note</span>` : "") },
    { k: "conditions", t: "Si", r: (r) => r.conditions.length
      ? esc((r.resume || r.conditions.map(decrireCritere)).join(r.match_all ? "  ET  " : "  OU  "))
      : (r.sans_condition ? '<span class="puce a">toutes les commandes</span>' : '<span class="puce r">sans condition</span>') },
    { k: "actions", t: "Alors", r: (r) => esc(r.actions.map((a) => decrireAction(a)).join(" · ")) },
    { k: "run_count", t: "Exéc.", n: true },
    { k: "act", t: "", r: (r) => `<button data-e="${r.id}">Modifier</button> <button class="d" data-x="${r.id}">Suppr.</button>` },
  ], d.rules));

  $("#rn").onclick = () => editerRegle();
  $("#rt").querySelectorAll("[data-e]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); editerRegle(d.rules.find((x) => x.id == b.dataset.e));
  });
  $("#rt").querySelectorAll("[data-x]").forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm("Supprimer cette règle ?")) return;
    await api("/api/rules/" + b.dataset.x, { method: "DELETE" });

  $("#rOrdre").onclick = () => dialogue("Ordre d'exécution", `

      `<div class="ordI" draggable="true" data-id="${r.id}">☰ ${esc(r.name)}</div>`).join("")}</div>`,
    async () => {

      await api("/api/rules/reorder", { method: "POST", body: { ids } });
      VUES.automatisation();
    }, "Enregistrer l'ordre", (c) => glisserDeposer(c.querySelector("#ordL")));

/** Réordonnancement par glisser-déposer — le geste de ShipStation sur la liste des règles. */
function glisserDeposer(liste) {
  let porte = null;
  liste.querySelectorAll("[draggable]").forEach((it) => {
    it.ondragstart = () => { porte = it; it.style.opacity = ".4"; };
    it.ondragend = () => { it.style.opacity = ""; porte = null; };
    it.ondragover = (e) => {
      e.preventDefault();
      if (!porte || porte === it) return;
      const r = it.getBoundingClientRect();
      it.parentNode.insertBefore(porte, e.clientY - r.top < r.height / 2 ? it : it.nextSibling);
    };
  });
}

const PORTEE_FR = { any: "au moins un article", all: "tous les articles",
  only: "uniquement ces articles", none: "aucun article" };

function decrireCritere(c) {
  const v = Array.isArray(c.value) ? c.value.join(" ou ") : c.value;
  const p = c.scope ? `[${PORTEE_FR[c.scope] || c.scope}] ` : "";
  return `${p}${c.field} ${c.op} ${v ?? ""}`.trim();
}
const decrireAction = (a) => a.type + (a.value != null && typeof a.value !== "object"
  ? ` = ${a.value}` : (a.value ? " …" : ""));

/** Éditeur de règle : critères et actions en lignes, pas en JSON. */
function editerRegle(r = { conditions: [], actions: [], enabled: true, match_all: true, position: 50 }) {
  const voc = S.voc;
  const champArticle = (cle) => (voc.champs.find((c) => c.cle === cle) || {}).article;

  const ligneCritere = (c = { field: "item_sku", op: "contient", scope: "any", value: "" }) => `
    <div class="critL" data-crit>
      <select data-f>${voc.champs.map((x) => `<option value="${x.cle}" ${x.cle === c.field ? "selected" : ""}>${x.cle}${x.shipstation ? ` (${x.shipstation})` : ""}</option>`).join("")}</select>
      <select data-p ${champArticle(c.field) ? "" : "disabled"}>${Object.entries(PORTEE_FR).map(([k, t]) =>
        `<option value="${k}" ${(c.scope || "any") === k ? "selected" : ""}>${t}</option>`).join("")}</select>
      <select data-o>${voc.operateurs.map((x) => `<option value="${x.cle}" ${x.cle === c.op ? "selected" : ""}>${esc(x.libelle)}</option>`).join("")}</select>
      <input data-v value="${esc(Array.isArray(c.value) ? c.value.join(" ; ") : (c.value ?? ""))}" placeholder="valeurs séparées par ;">
      <button data-suppr title="Retirer">×</button>
    </div>`;

  const ligneAction = (a = { type: "add_tag", value: "" }) => `
    <div class="critL" data-act>
      <select data-t>${voc.actions.map((x) => `<option value="${x}" ${x === a.type ? "selected" : ""}>${x}</option>`).join("")}</select>
      <input data-av value="${esc(typeof a.value === "object" ? JSON.stringify(a.value) : (a.value ?? ""))}" placeholder="valeur (ou JSON)">
      <button data-suppr title="Retirer">×</button>
    </div>`;

  dialogue(r.id ? `Règle « ${r.name} »` : "Nouvelle règle", `
    ${r.notes ? `<div class="avis info">${esc(r.notes)}</div>` : ""}
    <label class="champ"><span>Nom</span><input id="rnm" value="${esc(r.name || "")}"></label>
    <div class="grille">
      <label class="champ"><span>Ordre</span><input type="number" id="rps" value="${r.position}"></label>
      <label class="champ"><span>Combinaison</span><select id="rma">
        <option value="1"${r.match_all ? " selected" : ""}>Toutes les conditions (ET)</option>
        <option value="0"${!r.match_all ? " selected" : ""}>Au moins une (OU)</option></select></label>
      <label class="champ"><span>Active</span><select id="ren">
        <option value="1"${r.enabled ? " selected" : ""}>Oui</option>
        <option value="0"${!r.enabled ? " selected" : ""}>Non</option></select></label>
    </div>
    <p class="doux">Deux critères sur la <b>même colonne</b> se combinent en OU même en mode ET —
      sans quoi « province = ON » et « province = QC » ne pourraient jamais coexister.</p>
    <b>Si</b><div id="crits">${(r.conditions || []).map(ligneCritere).join("")}</div>
    <div class="barre"><button id="critPlus">+ Critère</button>
      <label class="ch"><input type="checkbox" id="rsc" ${r.sans_condition ? "checked" : ""}>
        sans condition — s'applique à toutes les commandes</label></div>
    <b>Alors</b><div id="acts">${(r.actions || []).map(ligneAction).join("")}</div>
    <div class="barre"><button id="actPlus">+ Action</button>
      <label class="ch"><input type="checkbox" id="rst" ${r.stop_after ? "checked" : ""}>
        arrêter le chaînage si cette règle s'applique</label></div>`,
    async () => {
      const conditions = [...document.querySelectorAll("[data-crit]")].map((l) => {
        const f = l.querySelector("[data-f]").value;
        const brut = l.querySelector("[data-v]").value;
        const c = { field: f, op: l.querySelector("[data-o]").value,
          value: brut.includes(";") ? brut.split(";").map((x) => x.trim()).filter(Boolean) : brut };
        if (champArticle(f)) c.scope = l.querySelector("[data-p]").value;
        return c;
      });
      const actions = [...document.querySelectorAll("[data-act]")].map((l) => {
        const brut = l.querySelector("[data-av]").value.trim();
        let value = brut;
        if (brut.startsWith("{") || brut.startsWith("[")) { try { value = JSON.parse(brut); } catch {} }
        return { type: l.querySelector("[data-t]").value, value };
      });
      await api("/api/rules", { method: "POST", body: { id: r.id, name: $("#rnm").value,
        position: Number($("#rps").value), match_all: $("#rma").value === "1",
        enabled: $("#ren").value === "1", sans_condition: $("#rsc").checked,
        stop_after: $("#rst").checked, conditions, actions } });
      VUES.automatisation();
    }, "Enregistrer",
    (c) => {
      const brancher = () => {
        c.querySelectorAll("[data-suppr]").forEach((b) => b.onclick = (e) => { e.preventDefault(); b.parentNode.remove(); });
        c.querySelectorAll("[data-f]").forEach((sel) => sel.onchange = () => {
          const p = sel.parentNode.querySelector("[data-p]");
          p.disabled = !champArticle(sel.value);
        });
      };
      c.querySelector("#critPlus").onclick = (e) => { e.preventDefault(); c.querySelector("#crits").insertAdjacentHTML("beforeend", ligneCritere()); brancher(); };
      c.querySelector("#actPlus").onclick = (e) => { e.preventDefault(); c.querySelector("#acts").insertAdjacentHTML("beforeend", ligneAction()); brancher(); };
      brancher();
    });
}

    const c = dialogue(t.id ? `Gabarit — ${t.name}` : "Nouveau gabarit", `
      <div class="grille">
        <label class="champ"><span>Nom</span><input id="gnm" value="${esc(t.name || "")}"></label>

          <option value="label_message"${t.kind === "label_message" ? " selected" : ""}>Message d'étiquette</option></select></label>
        <label class="champ"><span>Par défaut</span><select id="gdf"><option value="0">Non</option><option value="1"${t.is_default ? " selected" : ""}>Oui</option></select></label>
      </div>
      <label class="champ"><span>Sujet (courriels)</span><input id="gsb" value="${esc(t.subject || "")}"></label>
      <label class="champ"><span>Corps</span><textarea id="gbd">${esc(t.body || "")}</textarea></label>
      <div class="barre"><button id="gpv">Aperçu sur une vraie commande</button></div>
      <div id="gout"></div>`,
      async () => {
        await api("/api/templates", { method: "POST", body: { id: t.id, name: $("#gnm").value, kind: $("#gkd").value,
          subject: $("#gsb").value, body: $("#gbd").value, is_default: $("#gdf").value === "1" } });
        VUES.gabarits();
      }, "Enregistrer");

      const r = await api("/api/templates/preview", { method: "POST", body: { body: $("#gbd").value, subject: $("#gsb").value } });

        : `<div class="carte">${r.sujet ? `<b>Sujet :</b> ${esc(r.sujet)}<hr>` : ""}${r.html}</div>`;
    };
  };
  $("#gn").onclick = () => editer();
};

    { k: "perms", t: "Peut", r: u => Object.entries(u.permissions).filter(([k, v]) => v === true).length + " permission(s)" },

    { k: "active", t: "Actif", r: u => u.active ? '<span class="puce v">oui</span>' : '<span class="puce r">non</span>' },

    await api(`/api/users/${b.dataset.r2}/2fa/reset`, { method: "POST" });

    <label class="champ"><span>Nom</span><input id="un1"></label>

    <label class="champ"><span>Rôle</span><select id="un3">${d.roles.map(r => `<option>${r}</option>`).join("")}</select></label>

    <p class="doux" style="font-size:12px">Domaines : ${Object.values(d.domaines).join(", ")}.</p>`,
    async () => {

      if (r.motDePasse) {
        dialogue("Compte créé", `<p>Transmettre ces identifiants à <b>${esc($("#un1").value)}</b> —
          ce mot de passe ne sera plus affiché.</p>
          <div class="carte" style="font-family:ui-monospace,monospace;font-size:15px">
            ${esc($("#un2").value)}<br><b>${esc(r.motDePasse)}</b></div>
          <p class="doux">Il devra le changer à la première connexion.</p>`, null);
      } else VUES.utilisateurs();
      return false;
    }, "Créer");
  $("#ut").querySelectorAll("tbody tr").forEach(tr => tr.oncontextmenu = async (e) => {
    e.preventDefault();
    const u = d.users.find(x => x.id === tr.dataset.id);
    if (!u || !confirm(`Réinitialiser le mot de passe de ${u.name} ?`)) return;
    const r = await api(`/api/users/${u.id}/password`, { method: "POST", body: {} });
    dialogue("Mot de passe réinitialisé",

       <p class="doux">Toutes ses sessions ont été fermées. À changer à la prochaine connexion.</p>`, null);
  });
};

  ecran.innerHTML = `<form class="carte" style="width:min(380px,92vw);padding:22px" id="f2">
      <h2 style="margin:0 0 3px">Vérification</h2>
      <p class="sous" style="margin-bottom:16px">Code à six chiffres de votre application d'authentification.</p>
      <label class="champ"><span>Code</span>
        <input id="c2" inputmode="numeric" autocomplete="one-time-code" maxlength="11"
               placeholder="123456" style="font-size:22px;letter-spacing:5px;text-align:center" required></label>
      <div id="e2"></div>
      <button class="p" style="width:100%;margin-top:6px" type="submit">Vérifier</button>
      <p class="doux" style="font-size:12px;margin:12px 0 0">Téléphone indisponible ? Saisir un
        code de secours à la place.</p>
      <p class="doux" style="font-size:12px;margin:6px 0 0"><a id="r2">Recommencer</a></p>
    </form>`;
  setTimeout(() => $("#c2").focus(), 30);
  $("#r2").onclick = () => location.reload();
  const envoyer = async (e) => {
    e?.preventDefault();
    $("#e2").innerHTML = "";
    try {
      await api("/api/login/2fa", { method: "POST", body: { code: $("#c2").value } });
      ecran.remove();
      $("#app").style.display = "";

  $("#c2").oninput = () => { if (/^\d{6}$/.test($("#c2").value.trim())) envoyer(); };

    <p>1. Scanner ce code avec Google Authenticator, Authy, 1Password ou le trousseau de votre

    <hr>
    <p>2. Saisir le code affiché par l'application pour confirmer.</p>
    <label class="champ"><input id="a2" inputmode="numeric" maxlength="6" placeholder="123456"
      style="font-size:20px;letter-spacing:4px;text-align:center"></label>
    <div id="ae2"></div>`,
    async () => {
      try {
        const r = await api("/api/moi/2fa/activer", { method: "POST", body: { code: $("#a2").value } });
        dialogue("Codes de secours", `
          <div class="avis">Conserver ces codes hors du téléphone. Chacun ne sert qu'une fois, et

// ══════════════════════════════════════════════════════════════════ démarrage
// ------------------------------------------------------- raccourcis clavier
/**
 * Raccourcis de ShipStation (§2.12), y compris les séquences à deux touches (`G+O`, `M+S`).
 * L'implémentation est un petit automate : une première touche « préfixe » ouvre une fenêtre
 * de 900 ms pendant laquelle la seconde complète la commande.
 *
 * Ajout : les chiffres 1 à 9 appliquent les préréglages d'expédition. Les 17 préréglages du
 * compte ShipStation n'avaient aucun raccourci — c'était l'accélérateur le plus évident et
 * il n'a jamais servi.
 */
const PREFIXES = { g: "Aller à…", m: "Marquer…", p: "Imprimer…", o: "Commandes…" };
const RACCOURCIS = {
  "g o": ["Aller aux commandes", () => aller("commandes")],
  "g s": ["Aller aux expéditions", () => aller("expeditions")],
  "g b": ["Aller aux lots", () => aller("lots")],
  "g r": ["Aller aux retours", () => aller("retours")],
  "g e": ["Aller à la fin de journée", () => aller("manifestes")],
  "g p": ["Aller aux produits", () => aller("produits")],
  "g c": ["Aller aux clients", () => aller("clients")],
  "g a": ["Aller aux réglages", () => aller("reglages")],
  "m s": ["Marquer comme expédiée", () => S.cmdActions?.marquerExpedie()],
  "p s": ["Imprimer les bordereaux", () => S.sel.size && window.open(`/api/packing-slip?ids=${[...S.sel].join(",")}`, "_blank")],
  "p l": ["Imprimer la liste de prélèvement", () => S.sel.size && window.open(`/api/pick-list?ids=${[...S.sel].join(",")}`, "_blank")],
  "o r": ["Recharger la grille", () => S.cmdCharger?.()],
  "u": ["Mettre à jour les boutiques (Shopify)", importerShopify],
  "v": ["Ouvrir le détail", () => S.sel.size && detailCommande(Number([...S.sel][0]))],
  "r": ["Coter la sélection", () => S.cmdActions?.coter()],
  "s": ["Créer les étiquettes", () => S.cmdActions?.acheterLot()],
  "b": ["Créer un lot", () => S.cmdActions?.acheterLot()],
  "/": ["Recherche rapide", () => { $("#quick").focus(); }],
  "?": ["Afficher les raccourcis", () => aideRaccourcis()],
};

let prefixe = null, minuteurPrefixe = null;

function raccourcis(e) {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) {
    if (e.key === "Escape") t.blur();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();

  if (prefixe) {
    const combo = `${prefixe} ${k}`;
    clearTimeout(minuteurPrefixe); prefixe = null; indice("");
    if (RACCOURCIS[combo]) { e.preventDefault(); RACCOURCIS[combo][1](); }
    return;
  }
  if (PREFIXES[k] && Object.keys(RACCOURCIS).some((c) => c.startsWith(k + " "))) {
    e.preventDefault();
    prefixe = k; indice(PREFIXES[k]);
    minuteurPrefixe = setTimeout(() => { prefixe = null; indice(""); }, 900);
    return;
  }
  if (/^[1-9]$/.test(k)) { e.preventDefault(); S.cmdPresetParTouche?.(k); return; }
  if (RACCOURCIS[e.key] || RACCOURCIS[k]) { e.preventDefault(); (RACCOURCIS[e.key] || RACCOURCIS[k])[1](); }
}

function indice(txt) {
  let b = $("#indiceHk");
  if (!txt) { b?.remove(); return; }
  if (!b) { b = el('<div id="indiceHk" class="menuF" style="bottom:14px;left:14px;top:auto;padding:7px 12px"></div>'); document.body.append(b); }
  b.textContent = txt;
}

function aideRaccourcis() {
  const lignes = Object.entries(RACCOURCIS)
    .map(([k, [t]]) => `<tr><td><kbd>${esc(k.toUpperCase().replace(" ", " + "))}</kbd></td><td>${esc(t)}</td></tr>`).join("");
  const presets = (S.refs.presets || []).filter((p) => p.hotkey)
    .map((p) => `<tr><td><kbd>${esc(p.hotkey)}</kbd></td><td>Préréglage « ${esc(p.name)} »</td></tr>`).join("");
  dialogue("Raccourcis clavier", `
    <div class="tbl" style="max-height:60vh"><table><tbody>${lignes}
      ${presets ? `<tr><td colspan="2" class="doux" style="padding-top:10px"><b>Préréglages d'expédition</b></td></tr>${presets}` : ""}
      <tr><td colspan="2" class="doux" style="padding-top:10px"><b>Sélection</b></td></tr>
      <tr><td><kbd>Maj + clic</kbd></td><td>Sélectionner une plage de lignes</td></tr>
      <tr><td><kbd>Ctrl + clic</kbd></td><td>Basculer une ligne</td></tr>
      <tr><td><kbd>Double-clic</kbd></td><td>Ouvrir le détail de la commande</td></tr>
    </tbody></table></div>`, null, "Fermer");
}

      async () => {
        await api("/api/presets", { method: "POST", body: {
          id: p.id, name: $("#pn").value, hotkey: $("#pk").value || null,
          warehouse_id: Number($("#pw").value) || null, carrier_code: p.carrier_code || "canada_post",
          service_id: $("#ps").value || null, package_id: $("#pc").value || null,
          confirmation: $("#pf").value || null, weight_g: $("#pp").value === "" ? null : Number($("#pp").value),
          dimensions: $("#pl").value ? { length: Number($("#pl").value), width: Number($("#pW").value), height: Number($("#ph").value), units: "inches" } : null,
          position: p.position || 0, notes: p.notes || null } });
        rendre();
      }, "Enregistrer",
      (c) => { const b = c.querySelector("#pSup"); if (b) b.onclick = async () => {
        if (!confirm("Supprimer ?")) return;
        await api("/api/presets", { method: "POST", body: { id: p.id, delete: true } });
        $("#dlg").close(); rendre(); }; });
  }

  function editerMapping(m) {
    dialogue(m.id ? "Mapping de service" : "Nouveau mapping", `
      <label class="champ"><span>Libellé au checkout</span><input id="mr" value="${esc(m.requested || "")}"></label>
      <label class="champ"><span>Correspondance</span><select id="mm">
        <option value="contains" ${m.match_mode !== "equals" ? "selected" : ""}>contient</option>
        <option value="equals" ${m.match_mode === "equals" ? "selected" : ""}>exacte</option></select></label>
      <label class="champ"><span>Canal logistique</span><select id="mc">
        ${["", "colis", "timbre", "ramassage", "defricheuses", "ddd"].map((x) =>
          `<option value="${x}" ${m.channel === x ? "selected" : ""}>${x || "—"}</option>`).join("")}</select></label>
      <label class="champ"><span>Service</span><select id="ms"><option value="">—</option>${(S.refs.services || []).map((s) =>
        `<option value="${s.id}" ${m.service_id === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
      <label class="champ"><span>Colis</span><select id="mp"><option value="">—</option>${(S.refs.packages || []).map((c) =>
        `<option value="${c.id}" ${m.package_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
      <p class="doux">Le canal logistique remplace la recherche de sous-chaîne dans un texte libre :
        une faute de frappe côté Shopify devient un libellé « non mappé » visible, au lieu d'une
        règle qui cesse silencieusement de se déclencher.</p>
      ${m.id ? `<button class="d" id="mSup">Supprimer</button>` : ""}`,
      async () => {
        await api("/api/service-mappings", { method: "POST", body: {
          id: m.id, store_id: m.store_id ?? 198670, requested: $("#mr").value,
          match_mode: $("#mm").value, channel: $("#mc").value || null,
          carrier_code: $("#ms").value ? "canada_post" : null,
          service_id: $("#ms").value || null, package_id: $("#mp").value || null } });
        rendre();
      }, "Enregistrer",
      (c) => { const b = c.querySelector("#mSup"); if (b) b.onclick = async () => {
        await api("/api/service-mappings", { method: "POST", body: { id: m.id, delete: true } });
        $("#dlg").close(); rendre(); }; });
  }
};

// ---------------------------------------------------------------- douanes
VUES.douanes = async () => {
  const d = await api("/api/hs");
  const v = $("#vue");
  v.innerHTML = `<h2>Douanes — codes SH</h2>
    <p class="sous">Un code SH manquant, c'est un colis international qui peut être retenu.
      Sur le compte ShipStation, 403 produits actifs sur 472 n'en avaient aucun.</p>
    <div class="grille">
      <div class="kpi ${d.alertes.sans_code ? "ambre" : "vert"}"><div class="v">${num(d.alertes.sans_code)}</div><div class="l">produits actifs sans code SH</div></div>
      <div class="kpi vert"><div class="v">${num(d.alertes.avec_code)}</div><div class="l">avec code</div></div>
      <div class="kpi ${d.alertes.commandes_bloquantes.length ? "ambre" : ""}"><div class="v">${num(d.alertes.commandes_bloquantes.length)}</div><div class="l">commandes internationales à risque</div></div>
    </div>
    ${d.alertes.a_revalider.length ? `<div class="avis"><b>Codes hérités à faire valider par un courtier</b> —
      ${d.alertes.a_revalider.map((c) => `${esc(c.hs_code)} <span class="doux">(${num(c.n)} produits)</span>`).join(" · ")}.
      Ces classements (« pâtes à modeler », « confettis », « aliments pour chiens ») portent sur des
      produits à base de graines : une déclaration inexacte engage l'exportateur. Repris tels quels,
      pas validés.</div>` : ""}
    <div class="carte">
      <div class="barre"><b style="flex:1">Classification automatique</b>
        <button id="hSim">Simuler</button>
        <button class="p" id="hApp">Appliquer aux produits sans code</button></div>
      <div id="hOut" class="doux">Le moteur classe par mots-clés, SKU d'abord puis nom de produit.</div>
    </div>
    <div class="carte"><b>Répartition actuelle</b>
      <div id="tblH" style="margin-top:8px"></div></div>
    ${d.alertes.commandes_bloquantes.length ? `<div class="carte"><b>Commandes internationales avec un article sans code SH</b>
      <div id="tblB" style="margin-top:8px"></div></div>` : ""}`;

  $("#tblH").append(table([{ k: "hs_code", t: "Code SH" }, { k: "n", t: "Produits", n: true }], d.alertes.repartition));
  if (d.alertes.commandes_bloquantes.length)
    $("#tblB").append(table([{ k: "order_number", t: "Commande" }, { k: "n", t: "Articles sans code", n: true }],
      d.alertes.commandes_bloquantes, { onLigne: (id) => detailCommande(Number(id)) }));

  $("#hSim").onclick = async () => {
    $("#hOut").innerHTML = "Simulation…";
    const r = await api("/api/hs/simuler", { method: "POST", body: {} });
    $("#hOut").innerHTML = `<div class="avis info"><b>${num(r.classes)}</b> produits classés sur ${num(r.total)}
      (${r.taux} %) · ${num(r.non_classes)} sans correspondance · ${num(r.exclus)} exclus des douanes
      · <b>${num(r.a_revalider)}</b> avec un code à revalider</div>
      <div class="tbl"><table><thead><tr><th>SKU</th><th>Produit</th><th>Code proposé</th><th>Libellé</th><th>Via</th></tr></thead>
      <tbody>${r.detail.classes.slice(0, 200).map((p) => `<tr><td class="sku">${esc(p.sku)}</td><td>${esc(p.name)}</td>
        <td>${esc(p.hs_code)}${p.revalider ? ' <span class="puce a">à revalider</span>' : ""}</td>
        <td>${esc(p.customs_description)}</td><td class="doux">${esc(p.via)}</td></tr>`).join("")}</tbody></table></div>`;
  };
  $("#hApp").onclick = () => dialogue("Appliquer la classification", `
    <p>Les codes SH seront écrits sur les produits qui n'en ont pas. Les 69 produits déjà
    classés ne sont pas touchés.</p>
    <div class="avis">Les familles marquées « à revalider » seront appliquées elles aussi —
    c'est la convention existante du compte, à trancher avec un courtier.</div>`,
    async () => { const r = await api("/api/hs/appliquer", { method: "POST", body: {} });
      alert(`${r.applique} produit(s) classés, ${r.non_classes} sans correspondance.`); rendre(); }, "Appliquer");
};

async function demarrer() {
  const m = await api("/api/moi");
  if (!m.user) return montrerConnexion();
  S.moi = m.user;

  S.config = await api("/api/config");
  const av = [];
  if (!S.config.etiquettes_actives) av.push(`Achat d'étiquettes <b>désactivé</b> — lancer avec <code>CLONE_ALLOW_LABELS=1</code>. Cotation et simulation restent disponibles.`);
  if (S.config.adaptateur === "bouchon") av.push(`Transporteur <b>bouchon</b> : les tarifs sont des valeurs de démonstration. Passer à <code>CARRIER_ADAPTER=clickship</code> à réception des identifiants.`);
  if (!S.config.config_lasclay) av.push(`Configuration Lasclay <b>non chargée</b> — règles, vues, préréglages, colis et étiquettes du compte ShipStation. À charger depuis <a onclick="aller('reglages')">l'engrenage → Compte, boutiques et import</a>.`);
  if (S.config.shopify && !S.config.shopify.configure) av.push(`Import Shopify <b>indisponible</b> : variables <code>SHOPIFY_STORE</code> et <code>SHOPIFY_CLIENT_ID</code>/<code>SHOPIFY_CLIENT_SECRET</code> manquantes sur le service.`);
  // Les bandeaux d'état tiennent sur une ligne et se referment : ils informent au démarrage,
  // ils ne doivent pas rogner la grille toute la journée.
  $("#bandeau").innerHTML = av.map((a, i) => `<div class="avis" data-b="${i}">${a}
    <button class="fermer" data-f="${i}" title="Masquer">×</button></div>`).join("");
  $("#bandeau").querySelectorAll("[data-f]").forEach((b) => b.onclick = () => b.parentNode.remove());
  try { S.refs = await api("/api/refs"); } catch { S.refs = {}; }

  // ---- en-tête global, de gauche à droite comme chez ShipStation : marque, modules,
  //      recherche rapide, mise à jour des boutiques, alertes, profil, réglages, aide.
  $("#hMoi").textContent = S.moi.name;
  $("#btMarque").onclick = () => aller("analytique");
  $("#btAide").onclick = aideRaccourcis;
  $("#btMaj").onclick = importerShopify;
  $("#hAlertes").onclick = () => aller("alertes");
  $("#btProfil").onclick = (e) => { e.stopPropagation(); menuProfil($("#btProfil")); };
  $("#btReglages").onclick = (e) => { e.stopPropagation(); menuReglages($("#btReglages")); };
  $("#quick").onkeydown = (e) => {
    if (e.key !== "Enter") return;
    const q = $("#quick").value.trim();
    if (!q) return;
    if (S.page !== "commandes") aller("commandes");
    setTimeout(() => { const f = $("#fq"); if (f) { f.value = q; f.dispatchEvent(new Event("input")); } }, 120);
  };
  document.addEventListener("keydown", raccourcis);
  await rafraichirCompteurs();
  S.page = (location.hash || "").slice(1) || "commandes";
  if (!VUES[S.page]) S.page = "commandes";
  menu();
  rendre();
  if (S.moi.must_change) changerMotDePasse(true);
  else if (!S.moi.totp_enabled && S.config.exiger_2fa) configurer2facteur();
  clearInterval(S.tick);
  S.tick = setInterval(rafraichirCompteurs, 60000);
}

demarrer().catch(() => montrerConnexion());
</script>
