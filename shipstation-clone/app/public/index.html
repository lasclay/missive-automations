<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expéditions — Lasclay</title>
<style>
  :root {
    --bg:#f5f6f8; --carte:#fff; --bord:#dde1e6; --texte:#181c20; --doux:#6b7480;
    --accent:#1a56db; --vert:#0b7a4b; --ambre:#9a5b06; --rouge:#c0392b; --sel:#eaf1ff; --barre:#1f2937;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131619; --carte:#1b1f23; --bord:#2b3137; --texte:#e6e9ec; --doux:#98a1ab;
            --accent:#5b8cf5; --vert:#3dc98a; --ambre:#e0a33e; --rouge:#f0705f; --sel:#1d2740; --barre:#0e1114; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--texte) }
  a { color:var(--accent) }
  /* ---- structure ---- */
  #app { display:grid; grid-template-columns:196px 1fr; grid-template-rows:46px 1fr; min-height:100vh }
  nav { background:var(--barre); color:#e8eaed; padding:8px 0; position:sticky; top:46px; height:calc(100vh - 46px); overflow:auto }
  nav h1 { font-size:14px; margin:0 0 4px; padding:0 16px 10px; border-bottom:1px solid rgba(255,255,255,.12);
           font-weight:650; letter-spacing:.2px }
  nav h1 small { display:block; font-weight:400; color:#9aa3ad; font-size:11px; margin-top:2px; line-height:1.6 }
  nav h1 small a { color:#9aa3ad; text-decoration:underline; cursor:pointer }
  nav h1 small a:hover { color:#fff }
  nav a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 16px;
          color:#c7cdd4; text-decoration:none; font-size:13.5px; cursor:pointer; border-left:3px solid transparent }
  nav a:hover { background:rgba(255,255,255,.06); color:#fff }
  nav a.actif { background:rgba(255,255,255,.10); color:#fff; border-left-color:var(--accent); font-weight:600 }
  nav .grp { padding:12px 16px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:#78828d }
  nav .n { background:rgba(255,255,255,.14); border-radius:9px; padding:0 7px; font-size:11px; font-variant-numeric:tabular-nums }
  main { padding:16px 20px 60px; min-width:0 }
  h2 { font-size:17px; margin:0 0 3px; font-weight:650 }
  .sous { color:var(--doux); font-size:13px; margin:0 0 14px }
  /* ---- éléments ---- */
  input,select,textarea,button { font:inherit; padding:6px 9px; border:1px solid var(--bord);
    border-radius:6px; background:var(--carte); color:var(--texte) }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; width:100%; min-height:280px }
  button { cursor:pointer } button:hover:not(:disabled) { border-color:var(--accent) }
  button:disabled { opacity:.45; cursor:not-allowed }
  button.p { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button.d { border-color:var(--rouge); color:var(--rouge) }
  .barre { display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:10px }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:9px; padding:14px; margin-bottom:12px }
  .grille { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)) }
  .kpi { background:var(--carte); border:1px solid var(--bord); border-radius:9px; padding:12px 14px }
  .kpi .v { font-size:23px; font-weight:660; font-variant-numeric:tabular-nums; letter-spacing:-.4px }
  .kpi .l { color:var(--doux); font-size:12px; margin-top:2px }
  .kpi.vert .v { color:var(--vert) } .kpi.ambre .v { color:var(--ambre) }
  .tbl { background:var(--carte); border:1px solid var(--bord); border-radius:9px; overflow:auto; max-height:66vh }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  th { position:sticky; top:0; background:var(--carte); border-bottom:1px solid var(--bord); text-align:left;
       padding:8px 10px; font-weight:600; white-space:nowrap; z-index:2; cursor:pointer }
  th:hover { color:var(--accent) }
  td { padding:6px 10px; border-bottom:1px solid var(--bord); white-space:nowrap }
  tr.sel td { background:var(--sel) }
  /* Colonnes épinglées : elles restent en place quand la grille défile latéralement. */
  th.pin, td.pin { position:sticky; background:var(--carte); z-index:1 }
  th.pin { z-index:3 }
  th.pin1, td.pin1 { left:26px } th.pin2, td.pin2 { left:170px }
  td.pin { box-shadow:1px 0 0 var(--bord) }
  tr.sel td.pin { background:var(--sel) }
  tr.clic { cursor:pointer } tr.clic:hover td { background:var(--sel) }
  .n, th.n { text-align:right; font-variant-numeric:tabular-nums }
  .puce { font-size:10.5px; padding:1px 7px; border-radius:9px; font-weight:600; display:inline-block; white-space:nowrap }
  .puce.v { background:rgba(11,122,75,.15); color:var(--vert) }
  .puce.a { background:rgba(154,91,6,.16); color:var(--ambre) }
  .puce.r { background:rgba(192,57,43,.14); color:var(--rouge) }
  .puce.g { background:rgba(120,130,140,.16); color:var(--doux) }
  .doux { color:var(--doux) }
  .avis { padding:9px 12px; border-radius:7px; margin-bottom:12px; font-size:13px;
          background:rgba(154,91,6,.12); color:var(--ambre); border:1px solid rgba(154,91,6,.3) }
  .avis.info { background:rgba(26,86,219,.10); color:var(--accent); border-color:rgba(26,86,219,.3) }
  .onglets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center }
  .ong { padding:4px 11px; border:1px solid var(--bord); border-radius:14px; background:var(--carte);
         cursor:pointer; font-size:12.5px }
  .ong.actif { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  dialog { border:1px solid var(--bord); border-radius:11px; background:var(--carte); color:var(--texte);
           padding:0; max-width:800px; width:94vw; max-height:88vh }
  dialog h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--bord); font-size:15px }
  dialog .c { padding:14px 16px; overflow:auto; max-height:64vh }
  dialog .f { padding:10px 16px; border-top:1px solid var(--bord); display:flex; gap:8px; justify-content:flex-end }
  dialog::backdrop { background:rgba(0,0,0,.5) }
  label.ch { display:inline-flex; align-items:center; gap:5px; font-size:13px }
  .champ { display:block; margin-bottom:9px } .champ span { display:block; font-size:12px; color:var(--doux); margin-bottom:3px }
  .champ input, .champ select { width:100% }
  .bar { height:7px; background:var(--bord); border-radius:4px; overflow:hidden; margin-top:5px }
  .bar i { display:block; height:100%; background:var(--vert) }

  /* ══════════════════════ écran Commandes — layout ShipStation à 3 colonnes ══════════════════════
     La densité n'est pas un choix esthétique : c'est un outil d'opérateur d'entrepôt, et le
     nombre de commandes visibles d'un coup d'œil détermine la vitesse de tri d'un arriéré. */
  .ss { display:grid; grid-template-columns:196px minmax(0,1fr) 336px; gap:0;
        height:calc(100vh - 46px); margin:-16px -20px -60px }
  .ssL { border-right:1px solid var(--bord); background:var(--carte); overflow:auto; padding:8px 0 24px }
  .ssLt { font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--doux);
          padding:12px 12px 5px; font-weight:700 }
  .ssLi { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 12px;
          font-size:13px; cursor:pointer; border-left:3px solid transparent; color:var(--texte) }
  .ssLi:hover { background:var(--sel) }
  .ssLi.actif { background:var(--sel); border-left-color:var(--accent); font-weight:650 }
  .ssLi .n { color:var(--doux); font-size:11.5px; font-variant-numeric:tabular-nums }
  .ssL .vide { padding:6px 12px; font-size:12px; color:var(--doux) }
  .ssC { display:flex; flex-direction:column; min-width:0; overflow:hidden }
  .ssR { border-left:1px solid var(--bord); background:var(--carte); overflow:auto; padding:0 0 40px }

  .ongVues { display:flex; gap:2px; padding:6px 10px 0; overflow-x:auto; border-bottom:1px solid var(--bord); flex:none }
  .ongVues .ong { padding:5px 11px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0;
                  font-size:12.5px; cursor:pointer; white-space:nowrap; color:var(--doux) }
  .ongVues .ong i { font-style:normal; opacity:.65; font-variant-numeric:tabular-nums }
  .ongVues .ong:hover { background:var(--sel); color:var(--texte) }
  .ongVues .ong.actif { background:var(--bg); border-color:var(--bord); color:var(--texte); font-weight:650;
                        margin-bottom:-1px; border-bottom:1px solid var(--bg) }

  .barreF, .barreA { display:flex; gap:6px; align-items:center; padding:7px 10px; flex:none;
                     border-bottom:1px solid var(--bord); overflow-x:auto }
  .barreF input, .barreF select, .barreA button { padding:4px 8px; font-size:12.5px; border-radius:5px }
  .barreF #fq { min-width:250px }
  .barreF .sep { width:1px; height:20px; background:var(--bord); margin:0 3px; flex:none }
  .barreF button.on { background:var(--sel); border-color:var(--accent); color:var(--accent) }
  .barreA { background:var(--carte) }
  .barreA .nsel { font-size:12.5px; color:var(--doux); min-width:118px }
  .barreA button.v { background:var(--vert); border-color:var(--vert); color:#fff; font-weight:650 }

  .grilleWrap { flex:1; overflow:auto; min-height:0 }
  table.grille { border-collapse:separate; border-spacing:0; width:100%; font-size:13px }
  table.grille th { position:sticky; top:0; z-index:3; background:var(--carte); border-bottom:1px solid var(--bord);
                    text-align:left; padding:7px 9px; font-weight:650; white-space:nowrap; cursor:pointer; font-size:12px }
  table.grille td { padding:6px 9px; border-bottom:1px solid var(--bord); white-space:nowrap; max-width:320px;
                    overflow:hidden; text-overflow:ellipsis }
  .grilleWrap.dense table.grille td { padding:3px 9px; font-size:12.5px }
  .grilleWrap.dense table.grille th { padding:5px 9px }
  table.grille tr.sel td { background:var(--sel) }
  table.grille tbody tr:hover td { background:var(--sel) }
  table.grille .cx { width:26px; padding-left:8px; padding-right:0 }
  table.grille [data-fig] { position:sticky; left:0; z-index:2; background:var(--carte) }
  .chev { cursor:pointer; color:var(--doux); user-select:none }
  tr.arts td { background:var(--bg); white-space:normal }
  .artL > div, .artG > div { font-size:12.5px; padding:1px 0 }
  .sku { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--doux) }
  .tag { font-size:10.5px; padding:1px 7px; border-radius:9px; font-weight:600; white-space:nowrap;
         background:color-mix(in srgb, var(--c) 20%, transparent); color:var(--c); border:1px solid var(--c) }
  .pag { display:flex; gap:8px; align-items:center; padding:7px 10px; border-top:1px solid var(--bord); flex:none; font-size:12.5px }
  .vide2 { padding:60px 20px; text-align:center }
  .vide2 button { margin-top:12px }
  .vide3 { padding:28px 16px; color:var(--doux); font-size:13px }

  /* ---- sidebar d'expédition (Configure Shipment Widget) ---- */
  .ssR .sec { border-bottom:1px solid var(--bord); padding:11px 13px }
  .ssR h4 { margin:0 0 7px; font-size:13px; font-weight:650; display:flex; gap:6px; align-items:center }
  .ssR .adr { font-size:12.5px; line-height:1.5 }
  .ssR .kv { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2px 0 }
  .ssR .kv span { color:var(--doux) }
  .ssR .champ { margin-bottom:6px } .ssR .champ span { font-size:11px }
  .ssR .champ input, .ssR .champ select { padding:4px 7px; font-size:12.5px }
  .ssR .dims { display:flex; gap:4px; align-items:center; margin-bottom:6px }
  .ssR .dims input { width:100%; padding:4px 6px; font-size:12.5px }
  .ssR .note { font-size:12.5px; background:var(--bg); border-radius:6px; padding:6px 8px; margin-bottom:6px }
  textarea.petit { min-height:56px; font-size:12.5px; margin-bottom:6px }
  .rouge { color:var(--rouge) } .vert { color:var(--vert) }

  /* ---- menus flottants (Other Actions, Apply Preset, Print) ---- */
  .menuF { position:fixed; z-index:40; background:var(--carte); border:1px solid var(--bord); border-radius:8px;
           box-shadow:0 8px 26px rgba(0,0,0,.18); min-width:224px; padding:4px; max-height:70vh; overflow:auto }
  .menuF .mi { padding:6px 10px; font-size:13px; cursor:pointer; border-radius:5px; display:flex;
               justify-content:space-between; gap:12px; align-items:center }
  .menuF .mi:hover { background:var(--sel) }
  .menuF .mi.danger { color:var(--rouge) }
  .menuF .sep { height:1px; background:var(--bord); margin:4px 2px }
  kbd { font:11px ui-monospace,Menlo,monospace; background:var(--bg); border:1px solid var(--bord);
        border-radius:4px; padding:0 4px; color:var(--doux) }
  .cols { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:2px }
  .cols .col { justify-content:flex-start; padding:3px 5px; border-radius:5px }
  .cols .col:hover { background:var(--sel) }
  .cols .pin { border:none; background:none; padding:0 4px; opacity:.25; font-size:12px }
  .cols .pin.on { opacity:1 }
  .listeVues .lv { padding:7px 9px; border-radius:6px; cursor:pointer; display:block }
  .listeVues .lv:hover { background:var(--sel) }
  .listeVues .lv .n { float:right; color:var(--doux); font-variant-numeric:tabular-nums }

  /* ---- en-tête global ---- */
  header.top { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:0 12px; height:46px;
               background:var(--barre); color:#e8eaed; position:sticky; top:0; z-index:30 }
  header.top .marque { font-weight:700; font-size:14px; letter-spacing:.2px; margin-right:6px }
  header.top input { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#fff;
                     width:270px; padding:5px 9px; font-size:12.5px }
  header.top input::placeholder { color:#9aa3ad }
  header.top button { background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.16); color:#e8eaed;
                      padding:5px 10px; font-size:12.5px }
  header.top button:hover { background:rgba(255,255,255,.18) }
  header.top .droite { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12.5px; color:#c7cdd4 }
  header.top .pastille { background:var(--rouge); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; font-weight:700 }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="marque">Lasclay · Expéditions</span>
    <input type="search" id="quick" placeholder="Recherche rapide  ( / )">
    <button id="btMaj" title="Importer les nouvelles commandes Shopify (U)">Mettre à jour</button>
    <span class="droite">
      <span id="hAlertes"></span>
      <span id="hMoi"></span>
      <button id="btAide" title="Raccourcis clavier (?)">?</button>
    </span>
  </header>
  <nav>
    <h1>Expéditions<small id="navSous">Lasclay</small></h1>
    <div id="menu"></div>
  </nav>
  <main>
    <div id="bandeau"></div>
    <div id="vue"></div>
  </main>
</div>

<dialog id="dlg"><h3 id="dlgT"></h3><div class="c" id="dlgC"></div>
  <div class="f"><button id="dlgN">Fermer</button><button class="p" id="dlgO">Confirmer</button></div></dialog>

<script>
// ══════════════════════════════════════════════════════════════════ utilitaires
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (v) => (Number(v) || 0).toFixed(2) + " $";
const num = (v) => (Number(v) || 0).toLocaleString("fr-CA");
const jour = (s) => (s ? String(s).slice(0, 10) : "—");

async function api(route, opts = {}) {
  const o = { headers: { "Content-Type": "application/json" }, credentials: "same-origin", ...opts };
  if (o.body && typeof o.body !== "string") o.body = JSON.stringify(o.body);
  let r;
  try {
    r = await fetch(route, o);
  } catch {
    throw new Error("service injoignable — redémarrage en cours ? réessayer dans un instant");
  }
  if (r.status === 401) { montrerConnexion(); throw new Error("session expirée"); }
  const t = await r.text();
  let j;
  try {
    j = JSON.parse(t);
  } catch {
    // Réponse non-JSON : c'est la page d'erreur de l'hébergeur, pas la nôtre. L'afficher
    // telle quelle noierait l'utilisateur sous du HTML — on traduit.
    if (r.status === 502 || r.status === 503 || r.status === 504)
      throw new Error(`service indisponible (${r.status}) — il redémarre probablement, réessayer dans une minute`);
    throw new Error(`réponse inattendue du serveur (HTTP ${r.status})`);
  }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function dialogue(titre, html, onOk, texteOk = "Confirmer", apres = null) {
  $("#dlgT").textContent = titre;
  $("#dlgC").innerHTML = html;
  if (apres) apres($("#dlgC"));
  $("#dlgO").textContent = texteOk;
  $("#dlgO").style.display = onOk ? "" : "none";
  $("#dlgO").onclick = async () => {
    try { if (await onOk?.() !== false) $("#dlg").close(); }
    catch (e) { alert(e.message); }
  };
  $("#dlgN").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
  return $("#dlgC");
}
const attendre = (t = "Un instant…") => dialogue(t, '<p class="doux">Traitement en cours…</p>', null);

/** Table générique : colonnes, lignes, sélection, tri. */
function table(cols, lignes, { sel = null, onTri = null, tri = null, dir = null, onLigne = null, cle = "id", pins = 0 } = {}) {
  const cl = (c, i) => [c.n ? "n" : "", i < pins ? `pin pin${i + 1}` : ""].filter(Boolean).join(" ");
  const th = (sel ? '<th style="width:26px"></th>' : "") + cols.map((c, i) =>
    `<th class="${cl(c, i)}" data-c="${c.k}">${esc(c.t)}${tri === c.k ? (dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
  const tr = lignes.map(l => {
    const tds = cols.map((c, i) => `<td class="${cl(c, i)}">${c.r ? c.r(l) : esc(l[c.k] ?? "—")}</td>`).join("");
    return `<tr data-id="${esc(l[cle])}" class="${onLigne ? "clic" : ""}">${sel ? `<td><input type="checkbox" data-id="${esc(l[cle])}"></td>` : ""}${tds}</tr>`;
  }).join("");
  const t = el(`<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${tr || `<tr><td colspan="${cols.length + 1}" class="doux" style="padding:22px;text-align:center">Aucun résultat</td></tr>`}</tbody></table></div>`);
  if (onTri) t.querySelectorAll("th[data-c]").forEach(h => h.onclick = () => onTri(h.dataset.c));
  if (sel) t.querySelectorAll("tbody input").forEach(cb => cb.onchange = () => {
    const id = Number(cb.dataset.id);
    cb.checked ? sel.add(id) : sel.delete(id);
    cb.closest("tr").classList.toggle("sel", cb.checked);
    document.dispatchEvent(new Event("selchange"));
  });
  if (onLigne) t.querySelectorAll("tbody tr.clic").forEach(r => r.onclick = (e) => {
    if (e.target.tagName === "INPUT") return;
    onLigne(r.dataset.id);
  });
  return t;
}

/**
 * Catalogue des colonnes de la grille — l'équivalent du « Manage Columns » de ShipStation.
 * `def` marque celles affichées par défaut ; le choix de l'utilisateur est conservé localement.
 */
/*
 * Le catalogue de colonnes de la grille Commandes vit désormais dans `COLONNES`, avec l'écran
 * Commandes lui-même, et la sélection est enregistrée **côté serveur** — par vue, ou dans le
 * réglage `colonnes_commandes` hors vue. Le stockage local a été retiré : c'est précisément ce
 * qui fait que les colonnes personnalisées de ShipStation se réinitialisent (bug communautaire
 * connu, §6 des notes de réplication).
 */

// ══════════════════════════════════════════════════════════════════ état
const S = { page: "commandes", moi: null, config: {}, refs: {}, compteurs: {}, sel: new Set(), filtres: {}, tri: "age", dir: "desc", tick: null };

const PAGES = [
  { g: "Traitement" },
  { id: "commandes", t: "Commandes", n: () => S.compteurs.statuts?.awaiting_shipment },
  { id: "attente", t: "En attente", n: () => S.compteurs.statuts?.on_hold },
  { id: "alertes", t: "Alertes", n: () => Object.values(S.compteurs.alertes || {}).reduce((a, b) => a + b, 0) },
  { id: "lots", t: "Lots" },
  { id: "expeditions", t: "Expéditions" },
  { id: "manifestes", t: "Fin de journée" },
  { id: "retours", t: "Retours" },
  { g: "Référentiels" },
  { id: "produits", t: "Produits" },
  { id: "prereglages", t: "Préréglages" },
  { id: "douanes", t: "Douanes (SH)" },
  { id: "clients", t: "Clients" },
  { g: "Pilotage" },
  { id: "analytique", t: "Analytique" },
  { id: "automatisation", t: "Automatisation" },
  { id: "gabarits", t: "Gabarits" },
  { g: "Administration" },
  { id: "utilisateurs", t: "Utilisateurs" },
  { id: "reglages", t: "Réglages" },
  { id: "journal", t: "Journal" },
];

const PERM_PAGE = { utilisateurs: "users_manage", reglages: "settings_edit", journal: "reports_view",
  analytique: "reports_view", produits: "products_view", retours: "returns_manage" };

function autorise(id) {
  const need = PERM_PAGE[id];
  return !need || S.moi?.permissions?.[need] === true;
}

function menu() {
  $("#menu").innerHTML = PAGES.filter(p => p.g || autorise(p.id)).map(p => p.g
    ? `<div class="grp">${p.t || p.g}</div>`
    : `<a data-p="${p.id}" class="${S.page === p.id ? "actif" : ""}">${p.t}<span class="n" data-n="${p.id}"></span></a>`).join("");
  $("#menu").querySelectorAll("[data-p]").forEach(a => a.onclick = () => aller(a.dataset.p));
  majCompteursMenu();
}
function majCompteursMenu() {
  for (const p of PAGES.filter(p => p.n)) {
    const s = $(`[data-n="${p.id}"]`);
    if (!s) continue;
    const v = p.n();
    s.textContent = v ? num(v) : "";
    s.style.display = v ? "" : "none";
  }
}

function aller(page) {
  if (!autorise(page)) return;
  S.page = page; S.sel.clear(); S.filtres = {};
  location.hash = page;
  menu();
  rendre();
}

const VUES = {};

// ---------------------------------------------------------------- commandes
/**
 * Écran Commandes — reprend le layout ShipStation à trois colonnes :
 *
 *   [ statuts + vues ]   [ onglets · filtres · actions · grille ]   [ sidebar d'expédition ]
 *
 * Ce qui est repris tel quel : la hiérarchie verticale (onglets de vues avec compteurs →
 * barre de filtres → barre d'actions + bouton Colonnes → grille → pagination), la très haute
 * densité, l'expansion des articles par chevron, les colonnes épinglées (2 max), la sélection
 * Maj+clic / Ctrl+clic, et les raccourcis clavier.
 *
 * Ce qui est corrigé :
 *   • les compteurs des vues sont calculés en direct, pas seulement à l'ouverture ;
 *   • les colonnes sont enregistrées **côté serveur, par vue** (chez ShipStation elles se
 *     réinitialisent — bug communautaire connu) ;
 *   • la marge d'expédition est affichée avant l'achat (constat OBS9) ;
 *   • le mode dense se règle, au lieu d'un « Legacy vs New Layout » imposé à tout le compte ;
 *   • un libellé de service non mappé est signalé au lieu de partir en silence au défaut.
 */

const STATUT_FR = {
  awaiting_payment: "Paiement attendu", on_hold: "En attente", awaiting_shipment: "À expédier",
  pending_fulfillment: "Préparation externe", shipped: "Expédiée", cancelled: "Annulée",
};
const STATUTS_ORDRE = ["awaiting_shipment", "on_hold", "awaiting_payment", "pending_fulfillment", "shipped", "cancelled"];

const arts = (o) => (o.items || []).filter((i) => !i.adjustment);
const pastilleTag = (t) => `<span class="tag" style="--c:${esc(t.color || "#888")}">${esc(t.name)}</span>`;
const nomService = (id) => esc((S.refs.services || []).find((s) => s.id === String(id))?.name || id || "—");
const nomColis = (id) => esc((S.refs.packages || []).find((p) => p.id === String(id))?.name || id || "—");
const nomConfirmation = (c) => {
  const x = (S.refs.confirmations || []).find((k) => k.id === String(c));
  return x ? esc(x.nom) : (c ? esc(c) : "—");
};
/** Un libellé de checkout non couvert par un mapping est signalé, pas avalé (OBS6). */
function rendreDemande(o) {
  if (!o.requested_service) return "—";
  const connu = (S.nonMappes || []).includes(o.requested_service);
  return esc(o.requested_service) + (connu ? ' <span class="puce a" title="Aucun mapping de service — la commande partira au service par défaut">non mappé</span>' : "");
}

VUES.commandes = async (statutFixe) => {
  const S0 = S.cmd = S.cmd || { colonnes: null, epingles: [], vue: null, dense: true, page: 0, taille: 100 };
  if (statutFixe) S0.statut = statutFixe;
  else if (!S0.statut) S0.statut = "awaiting_shipment";

  $("#vue").innerHTML = `

    <select id="fdrop"><option value="">Drop-off : tous</option><option value="oui">Admissibles (&lt; ${S.config.seuil_dropoff_g} g)</option><option value="non">Non admissibles</option></select>

    <input type="number" id="fpmin" placeholder="poids min" style="width:96px">
    <input type="number" id="fpmax" placeholder="poids max" style="width:96px">
    <input type="number" id="fage" placeholder="âge min (j)" style="width:104px">
    <label class="ch"><input type="checkbox" id="fnw"> sans poids</label>
    <span class="sep"></span>
    <button id="freset" title="Réinitialiser les filtres">Effacer</button>
    <button id="fcols">Colonnes…</button>
    <button id="fdense" title="Densité de la grille">Dense</button>
    <button id="fsave">Enregistrer la vue…</button>`;

  const lire = () => ({
    q: $("#fq").value, status: S0.statut || "", store_id: $("#fstore").value, country: $("#fpays").value,
    drop_off: $("#fdrop").value, tag_id: $("#ftag").value,
    weight_min: $("#fpmin").value, weight_max: $("#fpmax").value,
    age_min: $("#fage").value, no_weight: $("#fnw").checked ? "1" : "",
  });
  const poser = (x = {}) => {
    $("#fq").value = x.q || ""; $("#fstore").value = x.store_id || ""; $("#fpays").value = x.country || "";
    $("#fdrop").value = x.drop_off || ""; $("#ftag").value = x.tag_id || "";
    $("#fpmin").value = x.weight_min || ""; $("#fpmax").value = x.weight_max || "";
    $("#fage").value = x.age_min || ""; $("#fnw").checked = x.no_weight === "1";
  };

  let deb;
  F.querySelectorAll("input,select").forEach((i) => i.addEventListener(
    i.type === "search" || i.type === "number" ? "input" : "change",
    () => { clearTimeout(deb); deb = setTimeout(() => { S0.page = 0; charger(); }, 250); }));
  $("#freset").onclick = () => { poser({}); S0.vue = null; S0.page = 0; charger(); majVues(); };
  $("#fdense").onclick = () => { S0.dense = !S0.dense; $("#tbl").classList.toggle("dense", S0.dense); $("#fdense").classList.toggle("on", S0.dense); };
  $("#fcols").onclick = gererColonnes;
  $("#fsave").onclick = enregistrerVue;

  // ------------------------------------------------------- statuts et vues
  let VUES_SAUV = [];

  function majStatuts() {
    const c = S.compteurs.statuts || {};
    $("#ssStatuts").innerHTML = STATUTS_ORDRE.map((s) =>
      `<a class="ssLi ${S0.statut === s && !S0.vue ? "actif" : ""}" data-s="${s}">${STATUT_FR[s]}<span class="n">${c[s] ? num(c[s]) : ""}</span></a>`).join("");
    $("#ssStatuts").querySelectorAll("[data-s]").forEach((a) => a.onclick = () => {
      S0.statut = a.dataset.s; S0.vue = null; S0.page = 0; S.sel.clear(); charger(); majStatuts(); majVues();
    });
  }

  async function chargerVues() {
    const d = await api("/api/views?scope=orders&counts=1");
    VUES_SAUV = d.views;
    majVues();
  }
  function majVues() {
    const lien = (v) => `<a class="ssLi ${S0.vue === v.id ? "actif" : ""}" data-v="${v.id}" title="${esc(v.notes || "")}">
        ${esc(v.name)}${v.notes && v.notes.includes("vérifier") ? ' <span class="puce a">?</span>' : ""}<span class="n">${v.n != null ? num(v.n) : ""}</span></a>`;
    $("#ssVues").innerHTML = VUES_SAUV.length ? VUES_SAUV.map(lien).join("")
      : '<div class="vide">aucune vue — charger la configuration Lasclay dans Réglages</div>';
    $("#ongVues").innerHTML = `<span class="ong ${!S0.vue ? "actif" : ""}" data-v="">${STATUT_FR[S0.statut] || "Toutes"}</span>` +
      VUES_SAUV.slice(0, 12).map((v) => `<span class="ong ${S0.vue === v.id ? "actif" : ""}" data-v="${v.id}">${esc(v.name)}${v.n != null ? ` <i>${num(v.n)}</i>` : ""}</span>`).join("") +
      (VUES_SAUV.length > 12 ? `<span class="ong" id="ongPlus">+${VUES_SAUV.length - 12}…</span>` : "");

    const choisir = (id) => {
      S0.vue = id ? Number(id) : null;
      S0.page = 0; S.sel.clear();
      const v = VUES_SAUV.find((x) => x.id === S0.vue);

      charger(); majStatuts(); majVues();

    document.querySelectorAll("#ssVues [data-v], #ongVues [data-v]").forEach((a) => {
      a.onclick = () => choisir(a.dataset.v);

        if (!a.dataset.v) return;
        e.preventDefault();
        const v = VUES_SAUV.find((x) => x.id == a.dataset.v);
        if (!confirm(`Supprimer la vue « ${v.name} » ?`)) return;
        await api("/api/views", { method: "POST", body: { id: v.id, delete: true } });
        if (S0.vue === v.id) S0.vue = null;
        chargerVues(); charger();

    });
    const plus = $("#ongPlus");
    if (plus) plus.onclick = () => dialogue("Toutes les vues",
      `<div class="listeVues">${VUES_SAUV.map((v) => `<div class="lv" data-v="${v.id}"><b>${esc(v.name)}</b>
        <span class="n">${v.n != null ? num(v.n) : ""}</span>
        ${v.notes ? `<div class="doux">${esc(v.notes)}</div>` : ""}</div>`).join("")}</div>`,
      null, "Fermer", (c) => c.querySelectorAll("[data-v]").forEach((d) => d.onclick = () => { $("#dlg").close(); choisir(d.dataset.v); }));
  }

  function enregistrerVue() {
    dialogue("Enregistrer la vue", `
      <label class="champ"><span>Nom</span><input id="nv"></label>
      <p class="doux">Les filtres actifs et les colonnes visibles sont enregistrés ensemble, et
      partagés avec toute l'équipe. Modifier une vue existante la remplace — chez ShipStation
      cela en créait une nouvelle à chaque fois, d'où les 27 vues dont plusieurs datées.</p>`,
      async () => {
        const nom = $("#nv").value.trim(); if (!nom) return false;
        await api("/api/views", { method: "POST", body: {
          name: nom, scope: "orders", filters: lire(), columns: colonnesActives().map((c) => c.k) } });
        chargerVues();
      }, "Enregistrer");
  }

  // ---------------------------------------------------------- colonnes
  const colonnesActives = () => {
    const cles = S0.colonnes || COLONNES.filter((c) => c.defaut).map((c) => c.k);
    return cles.map((k) => COLONNES.find((c) => c.k === k)).filter(Boolean);
  };

  function gererColonnes() {
    const actives = colonnesActives().map((c) => c.k);
    dialogue("Colonnes", `
      <p class="doux">Cochez les colonnes à afficher, épinglez-en jusqu'à deux pour qu'elles
      restent visibles pendant le défilement horizontal. L'ordre suit celui de la liste.</p>
      <div class="cols">${COLONNES.map((c) => `<label class="ch col">
        <input type="checkbox" data-c="${c.k}" ${actives.includes(c.k) ? "checked" : ""}>
        <span>${esc(c.t)}</span>
        <button class="pin ${S0.epingles.includes(c.k) ? "on" : ""}" data-pin="${c.k}" title="Épingler">📌</button>
      </label>`).join("")}</div>`,
      async () => {
        S0.colonnes = COLONNES.filter((c) => $(`[data-c="${c.k}"]`).checked).map((c) => c.k);
        // Persistance côté serveur, attachée à la vue : chez ShipStation les colonnes se
        // réinitialisent parce qu'elles vivent côté navigateur.
        if (S0.vue) {
          const v = VUES_SAUV.find((x) => x.id === S0.vue);
          if (v) await api("/api/views", { method: "POST", body: { ...v, columns: S0.colonnes } });
        } else {
          await api("/api/settings", { method: "POST", body: { colonnes_commandes: S0.colonnes } });

        charger();

  // ------------------------------------------------------------- grille
  let LIGNES = [], dernierIndex = null;

  async function charger() {
    const f = S0.vue ? { q: $("#fq").value, view_id: S0.vue } : lire();
    const p = new URLSearchParams({ ...f, sort: S.tri, dir: S.dir,
      limit: S0.taille, offset: S0.page * S0.taille });
    const d = await api("/api/orders?" + p);
    LIGNES = d.orders;
    S.total = d.total;
    dessiner(d);
    majPagination(d);
    majActions();
    cote();
  }

  function dessiner(d) {
    const cols = colonnesActives();
    const epingle = (k) => S0.epingles.includes(k) ? ` class="fig"` : "";
    const th = `<th class="cx"><input type="checkbox" id="tout"></th><th class="cx"></th>` +
      cols.map((c) => `<th data-t="${c.tri || ""}"${c.n ? ' class="n"' : ""}${S0.epingles.includes(c.k) ? " data-fig=1" : ""}>${esc(c.t)}${S.tri === c.tri ? (S.dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
    const tr = d.orders.map((o) => {
      const drop = o.weight_g > 0 && o.weight_g < d.seuil;
      return `<tr data-id="${o.id}" class="${S.sel.has(String(o.id)) ? "sel" : ""}">
        <td class="cx"><input type="checkbox" data-id="${o.id}" ${S.sel.has(String(o.id)) ? "checked" : ""}></td>
        <td class="cx">${arts(o).length > 1 ? `<span class="chev" data-x="${o.id}">▸</span>` : ""}</td>
        ${cols.map((c) => `<td${c.n ? ' class="n"' : ""}${S0.epingles.includes(c.k) ? ' data-fig=1' : ""}>${c.r(o)}${
          c.k === "order_number" && drop ? ' <span class="puce v" title="Admissible au tarif de dépôt en bureau de poste">dépôt</span>' : ""}</td>`).join("")}
      </tr>` + (arts(o).length > 1 ? `<tr class="arts" data-arts="${o.id}" hidden><td></td><td></td>
        <td colspan="${cols.length}"><div class="artL">${arts(o).map((i) =>
          `<div><span class="sku">${esc(i.sku)}</span> ${esc(i.name)} <b>×${i.quantity}</b>
           ${i.warehouse_location ? `<span class="doux">· ${esc(i.warehouse_location)}</span>` : ""}</div>`).join("")}</div></td></tr>` : "");
    }).join("");

    $("#tbl").className = "grilleWrap" + (S0.dense ? " dense" : "");
    $("#tbl").innerHTML = d.orders.length
      ? `<table class="grille"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`
      : `<div class="vide2"><b>Aucune commande</b><div class="doux">${S0.vue ? "Cette vue ne ramène rien pour l'instant." : "Rien à expédier dans ce statut."}</div>
         <button class="p" onclick="importerShopify()">Importer depuis Shopify</button></div>`;

    $("#tbl").querySelectorAll("th[data-t]").forEach((h) => h.onclick = () => {
      const c = h.dataset.t; if (!c) return;
      S.tri === c ? (S.dir = S.dir === "asc" ? "desc" : "asc") : (S.tri = c, S.dir = "desc");
      charger();
    });
    const tout = $("#tout");
    if (tout) tout.onclick = () => {
      d.orders.forEach((o) => tout.checked ? S.sel.add(String(o.id)) : S.sel.delete(String(o.id)));
      dessiner(d); majActions(); cote();
    };
    $("#tbl").querySelectorAll("tbody input[type=checkbox]").forEach((b, i) => b.onclick = (e) => {
      e.stopPropagation();
      basculer(String(b.dataset.id), i, e.shiftKey);
    });
    $("#tbl").querySelectorAll("[data-x]").forEach((c) => c.onclick = (e) => {
      e.stopPropagation();
      const l = $(`[data-arts="${c.dataset.x}"]`);
      l.hidden = !l.hidden; c.textContent = l.hidden ? "▸" : "▾";
    });
    $("#tbl").querySelectorAll("tr[data-id]").forEach((r, i) => {
      r.onclick = (e) => {
        if (e.target.tagName === "INPUT" || e.target.dataset.x) return;
        if (e.ctrlKey || e.metaKey || e.shiftKey) return basculer(r.dataset.id, i, e.shiftKey);
        S.sel.clear(); S.sel.add(r.dataset.id);
        document.querySelectorAll("tr[data-id]").forEach((x) => x.classList.toggle("sel", x.dataset.id === r.dataset.id));
        document.querySelectorAll("tbody input[type=checkbox]").forEach((x) => x.checked = x.dataset.id === r.dataset.id);
        majActions(); cote();
      };
      r.ondblclick = () => detailCommande(Number(r.dataset.id));
    });
  }

  function basculer(id, index, plage) {
    if (plage && dernierIndex != null) {
      const [a, b] = [Math.min(dernierIndex, index), Math.max(dernierIndex, index)];
      LIGNES.slice(a, b + 1).forEach((o) => S.sel.add(String(o.id)));
    } else {
      S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
      dernierIndex = index;
    }
    document.querySelectorAll("tr[data-id]").forEach((r) => r.classList.toggle("sel", S.sel.has(r.dataset.id)));
    document.querySelectorAll("tbody input[type=checkbox]").forEach((c) => c.checked = S.sel.has(String(c.dataset.id)));
    majActions(); cote();
  }

  // ------------------------------------------------ sidebar d'expédition
  /**
   * Le « Configure Shipment Widget » de ShipStation : expéditeur, poids, service, colis,
   * dimensions, confirmation, puis le bouton d'achat portant le tarif. Ajouts : la marge
   * avant achat, et la provenance du poids et des dimensions — ShipStation ne documente
   * nulle part qui gagne entre préréglage, profil produit, produit et type de colis, alors
   * que c'est ce qui détermine le poids facturé.
   */
  async function cote() {
    const C = $("#cote");
    if (S.sel.size === 0) {
      C.innerHTML = `<div class="vide3">Sélectionnez une commande pour configurer l'expédition.
        <div class="doux" style="margin-top:8px">Astuce : <kbd>?</kbd> affiche les raccourcis.</div></div>`;
      return;
    }
    if (S.sel.size > 1) {
      const sel = LIGNES.filter((o) => S.sel.has(String(o.id)));
      const poids = sel.reduce((s, o) => s + (o.weight_g || 0), 0);
      const sansPoids = sel.filter((o) => !o.weight_g).length;
      C.innerHTML = `<div class="sec"><h4>${sel.length} commandes sélectionnées</h4>
        <div class="kv"><span>Poids cumulé</span><b>${num(Math.round(poids))} g</b></div>
        <div class="kv"><span>Sans poids</span><b class="${sansPoids ? "rouge" : ""}">${sansPoids}</b></div>
        <div class="kv"><span>Valeur</span><b>${money(sel.reduce((s, o) => s + (o.order_total || 0), 0))}</b></div>
        <div class="kv"><span>Livraison facturée</span><b>${money(sel.reduce((s, o) => s + (o.shipping_paid || 0), 0))}</b></div>
      </div>
      <div class="sec"><h4>Articles à préparer</h4>${listeArticlesGroupes(sel)}</div>`;
      return;
    }
    const o = await api(`/api/orders/${[...S.sel][0]}`);
    const svc = (S.refs.services || []).filter((s) => !s.hidden);
    C.innerHTML = `
      <div class="sec">
        <h4>${esc(o.order_number)} <span class="puce g">${esc(STATUT_FR[o.status] || o.status)}</span></h4>
        <div class="adr">${esc(o.customer_name || "")}<br>${esc(o.ship_to.street1 || "")}
          ${o.ship_to.street2 ? `<br>${esc(o.ship_to.street2)}` : ""}<br>
          ${esc(o.ship_to.city || "")} ${esc(o.ship_to.state || "")} ${esc(o.ship_to.postalCode || "")}<br>
          ${esc(o.ship_to.country || "")}</div>
        ${o.requested_service ? `<div class="kv"><span>Demandé au checkout</span><b>${rendreDemande(o)}</b></div>` : ""}
      </div>
      <div class="sec"><h4>Articles</h4>${listeArticlesGroupes([o])}</div>
      <div class="sec csw">
        <h4>Expédition</h4>
        <label class="champ"><span>Expédié de</span><select id="cw"> ${(S.refs.warehouses || []).map((w) =>
          `<option value="${w.id}" ${o.warehouse_id === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select></label>
        <label class="champ"><span>Poids (g)</span><input type="number" id="cp" value="${o.weight_g || ""}"></label>
        <label class="champ"><span>Service</span><select id="cs"><option value="">— choisir —</option>${svc.map((s) =>
          `<option value="${s.id}" ${String(o.service_id) === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
        <label class="champ"><span>Colis</span><select id="cc"><option value="">— choisir —</option>${(S.refs.packages || []).map((p) =>
          `<option value="${p.id}" ${String(o.package_id) === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>
        <div class="dims">
          <input type="number" id="cl" placeholder="L" value="${o.dimensions?.length || ""}">
          <input type="number" id="cW" placeholder="l" value="${o.dimensions?.width || ""}">
          <input type="number" id="ch" placeholder="H" value="${o.dimensions?.height || ""}">
          <span class="doux">po</span>
        </div>
        <label class="champ"><span>Confirmation</span><select id="cf">${(S.refs.confirmations || []).map((k) =>
          `<option value="${k.id}" ${String(o.confirmation) === k.id ? "selected" : ""}>${esc(k.nom)}</option>`).join("")}</select></label>
        <div id="cMarge"></div>
        <div class="barre">
          <button id="cEnr">Enregistrer</button>
          <button id="cCoter">Coter (R)</button>
          <button class="v" id="cAcheter" ${S.config.etiquettes_actives ? "" : "disabled"}>Créer + imprimer</button>
        </div>
        <div id="cTarifs"></div>
      </div>
      <div class="sec"><h4>Notes</h4>
        ${o.customer_notes ? `<div class="note"><span class="doux">De l'acheteur</span><br>${esc(o.customer_notes)}</div>` : ""}
        <textarea id="cNote" class="petit" placeholder="Note interne…">${esc(o.internal_notes || "")}</textarea>
        <button id="cNoteS">Enregistrer la note</button>
      </div>
      <div class="sec"><h4>Étiquettes</h4>${(o.tags || []).map(pastilleTag).join(" ") || '<span class="doux">aucune</span>'}</div>`;

      const paye = Number(o.shipping_paid || 0);
      $("#cMarge").innerHTML = paye === 0

        : `<div class="kv"><span>Livraison facturée</span><b>${money(paye)}</b></div>`;

      charger();

    $("#cNoteS").onclick = async () => {
      await api(`/api/orders`, { method: "POST", body: { ...o, internal_notes: $("#cNote").value } });
    };
    $("#cCoter").onclick = async () => {
      $("#cTarifs").innerHTML = '<div class="doux">Cotation…</div>';

        $("#cTarifs").innerHTML = tableauTarifs(r, o);
      } catch (e) { $("#cTarifs").innerHTML = `<div class="avis">${esc(e.message)}</div>`; }
    };
    $("#cAcheter").onclick = acheterLot;
  }

  function listeArticlesGroupes(cmds) {
    const par = new Map();
    for (const o of cmds) for (const i of arts(o)) {
      const cle = i.sku || i.name;
      const x = par.get(cle) || { sku: i.sku, name: i.name, q: 0, loc: i.warehouse_location };
      x.q += i.quantity || 0; par.set(cle, x);
    }
    return `<div class="artG">${[...par.values()].map((i) =>
      `<div><b>×${i.q}</b> <span class="sku">${esc(i.sku)}</span> ${esc(i.name)}
       ${i.loc ? `<span class="doux">· ${esc(i.loc)}</span>` : ""}</div>`).join("")}</div>`;
  }

  function tableauTarifs(r, o) {
    const paye = o ? Number(o.shipping_paid || 0) : null;
    return `<div class="tbl"><table><thead><tr><th>Transporteur</th><th>Service</th><th class="n">Prix</th>${
      paye !== null ? '<th class="n">Marge</th>' : ""}</tr></thead><tbody>${
      r.tarifs.map((t) => {
        const m = paye !== null ? Math.round((paye - t.price) * 100) / 100 : null;
        return `<tr><td>${esc(t.carrier)}</td>
          <td>${esc(t.serviceName || t.serviceId)}${t.dropOff ? ' <span class="puce v">dépôt</span>' : ""}${
            r.recommande && r.recommande.serviceId === t.serviceId ? ' <span class="puce v">recommandé</span>' : ""}</td>
          <td class="n">${money(t.price)}</td>
          ${m !== null ? `<td class="n ${m < 0 ? "rouge" : "vert"}">${m >= 0 ? "+" : ""}${money(m)}</td>` : ""}</tr>`;
      }).join("")}</tbody></table></div>`;
  }

  // ------------------------------------------------------------- démarrage
  S.cmdCharger = charger;
  S.cmdIds = ids;
  S.cmdPresetParTouche = async (touche) => {
    const p = (S.refs.presets || []).find((x) => x.hotkey === touche);
    if (!p || !S.sel.size) return;
    await api("/api/presets/apply", { method: "POST", body: { preset_id: p.id, ids: ids() } });
    charger();
  };
  S.cmdActions = { acheterLot, marquerExpedie, simulerLot, coter: () => $("#aRate").click() };

  poser({});
  $("#fdense").classList.toggle("on", S0.dense);
  majStatuts();
  await chargerVues();
  try { const d = await api("/api/service-mappings"); S.nonMappes = (d.non_mappes || []).map((x) => x.libelle); } catch {}
  await charger();
};

VUES.automatisation = async () => {
  const d = await api("/api/rules");
  $("#vue").innerHTML = `<h2>Automatisation</h2>
    <p class="sous">Règles SI/ALORS appliquées à l'import, dans l'ordre. Une règle voit le résultat des précédentes.</p>
    <div class="barre"><button class="p" id="rn">Nouvelle règle</button></div><div id="rt"></div>`;
  $("#rt").append(table([
    { k: "position", t: "Ordre", n: true },
    { k: "name", t: "Règle", r: r => esc(r.name) + (r.enabled ? "" : ' <span class="puce g">désactivée</span>') },
    { k: "conditions", t: "Si", r: r => esc(r.conditions.map(c => `${c.field} ${c.op} ${JSON.stringify(c.value)}`).join(r.match_all ? " ET " : " OU ")) },
    { k: "actions", t: "Alors", r: r => esc(r.actions.map(a => a.type).join(", ")) },
    { k: "run_count", t: "Exéc.", n: true },
    { k: "act", t: "", r: r => `<button data-e="${r.id}">Modifier</button> <button class="d" data-x="${r.id}">Suppr.</button>` },
  ], d.rules));
  const editer = (r = { conditions: [], actions: [], enabled: true, match_all: true, position: 50 }) => {
    dialogue(r.id ? "Modifier la règle" : "Nouvelle règle", `
      <label class="champ"><span>Nom</span><input id="rnm" value="${esc(r.name || "")}"></label>
      <div class="grille">
        <label class="champ"><span>Ordre</span><input type="number" id="rps" value="${r.position}"></label>
        <label class="champ"><span>Correspondance</span><select id="rma"><option value="1"${r.match_all ? " selected" : ""}>Toutes les conditions</option><option value="0"${!r.match_all ? " selected" : ""}>Au moins une</option></select></label>
        <label class="champ"><span>Active</span><select id="ren"><option value="1"${r.enabled ? " selected" : ""}>Oui</option><option value="0"${!r.enabled ? " selected" : ""}>Non</option></select></label>
      </div>
      <label class="champ"><span>Conditions — JSON. Champs : ${d.champs.join(", ")}. Opérateurs : ${d.operateurs.join(", ")}</span>
        <textarea id="rco" style="min-height:120px">${esc(JSON.stringify(r.conditions, null, 1))}</textarea></label>
      <label class="champ"><span>Actions — JSON. Types : ${d.actions.join(", ")}</span>
        <textarea id="rac" style="min-height:100px">${esc(JSON.stringify(r.actions, null, 1))}</textarea></label>`,
      async () => {
        await api("/api/rules", { method: "POST", body: { id: r.id, name: $("#rnm").value,
          position: Number($("#rps").value), match_all: $("#rma").value === "1", enabled: $("#ren").value === "1",
          conditions: JSON.parse($("#rco").value), actions: JSON.parse($("#rac").value) } });
        VUES.automatisation();
      }, "Enregistrer");
  };
  $("#rn").onclick = () => editer();
  $("#rt").querySelectorAll("[data-e]").forEach(b => b.onclick = (e) => { e.stopPropagation(); editer(d.rules.find(x => x.id == b.dataset.e)); });
  $("#rt").querySelectorAll("[data-x]").forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm("Supprimer cette règle ?")) return;
    await api("/api/rules/" + b.dataset.x, { method: "DELETE" }); VUES.automatisation();
  });
};

  $("#ssave").onclick = async () => {

  // --- préréglages d'expédition

VUES.journal = async () => {
  const { rows } = await api("/api/audit?limit=300");
  $("#vue").innerHTML = `<h2>Journal</h2><p class="sous">Qui a fait quoi — ShipStation n'expose pas ça par API, nous si.</p>`;
  $("#vue").append(table([
    { k: "at", t: "Quand", r: r => String(r.at).slice(0, 19).replace("T", " ") },
    { k: "action", t: "Action" }, { k: "entity", t: "Objet" }, { k: "entity_id", t: "Réf." },
    { k: "detail", t: "Détail", r: r => `<span class="doux">${esc(JSON.stringify(r.detail || "")).slice(0, 90)}</span>` },
  ], rows));
};

// ══════════════════════════════════════════════════════════════════ amorçage
async function rafraichirCompteurs() {
  majEnTete();
  try { S.compteurs = await api("/api/orders/counts"); majCompteursMenu(); } catch {}
}

function majEnTete() {
  const n = Object.values(S.compteurs.alertes || {}).reduce((a, b) => a + b, 0);
  const h = $("#hAlertes");
  if (h) h.innerHTML = n ? `<span class="pastille" title="Alertes">${num(n)}</span>` : "";
}

async function rendre() {
  $("#vue").innerHTML = '<p class="doux">Chargement…</p>';
  try { await (VUES[S.page] || VUES.commandes)(); }
  catch (e) { $("#vue").innerHTML = `<div class="avis">${esc(e.message)}</div>`; }
}

// ══════════════════════════════════════════════════════════════════ connexion
function montrerConnexion(message = "") {
  $("#app").style.display = "none";
  let ecran = $("#connexion");
  if (!ecran) {
    ecran = el(`<div id="connexion" style="display:grid;place-items:center;min-height:100vh;padding:20px">
      <form class="carte" style="width:min(380px,92vw);padding:22px" id="fc">
        <h2 style="margin:0 0 3px">Expéditions</h2>
        <p class="sous" style="margin-bottom:16px">Connexion</p>
        <label class="champ"><span>Courriel</span><input type="email" id="le" autocomplete="username" required></label>
        <label class="champ"><span>Mot de passe</span><input type="password" id="lp" autocomplete="current-password" required></label>
        <div id="lerr"></div>
        <button class="p" style="width:100%;margin-top:6px" type="submit">Se connecter</button>
      </form></div>`);
    document.body.append(ecran);
    $("#fc").onsubmit = async (e) => {
      e.preventDefault();
      $("#lerr").innerHTML = "";
      try {
        const r = await api("/api/login", { method: "POST", body: { email: $("#le").value, password: $("#lp").value } });
        if (r.besoin2fa) return etape2facteur(ecran);
        ecran.remove();
        $("#app").style.display = "";
        demarrer();
      } catch (err) { $("#lerr").innerHTML = `<div class="avis">${esc(err.message)}</div>`; }
    };
  }
  if (message) $("#lerr").innerHTML = `<div class="avis">${esc(message)}</div>`;
  setTimeout(() => $("#le")?.focus(), 30);
}

  ecran.innerHTML = `<form class="carte" style="width:min(380px,92vw);padding:22px" id="f2">
      <h2 style="margin:0 0 3px">Vérification</h2>
      <p class="sous" style="margin-bottom:16px">Code à six chiffres de votre application d'authentification.</p>
      <label class="champ"><span>Code</span>
        <input id="c2" inputmode="numeric" autocomplete="one-time-code" maxlength="11"
               placeholder="123456" style="font-size:22px;letter-spacing:5px;text-align:center" required></label>
      <div id="e2"></div>
      <button class="p" style="width:100%;margin-top:6px" type="submit">Vérifier</button>
      <p class="doux" style="font-size:12px;margin:12px 0 0">Téléphone indisponible ? Saisir un
        code de secours à la place.</p>
      <p class="doux" style="font-size:12px;margin:6px 0 0"><a id="r2">Recommencer</a></p>
    </form>`;
  setTimeout(() => $("#c2").focus(), 30);
  $("#r2").onclick = () => location.reload();
  const envoyer = async (e) => {
    e?.preventDefault();
    $("#e2").innerHTML = "";
    try {
      await api("/api/login/2fa", { method: "POST", body: { code: $("#c2").value } });
      ecran.remove();
      $("#app").style.display = "";

  $("#c2").oninput = () => { if (/^\d{6}$/.test($("#c2").value.trim())) envoyer(); };
}

  }
  const p = await api("/api/moi/2fa/preparer", { method: "POST", body: {} });
  const c = dialogue("Activer le second facteur", `
    <p>1. Scanner ce code avec Google Authenticator, Authy, 1Password ou le trousseau de votre
       téléphone.</p>
    <div style="text-align:center;margin:12px 0">${p.qr}</div>
    <p class="doux" style="font-size:12px">Le scan ne marche pas ? Saisir la clé à la main :<br>

    <p class="doux" style="font-size:12px">Code refusé alors que vous venez de scanner ?

      <b>la supprimer</b>, puis <a id="regen">repartir d'un secret neuf</a> et rescanner.</p>
    <hr>
    <p>2. Saisir le code affiché par l'application pour confirmer.</p>
    <label class="champ"><input id="a2" inputmode="numeric" maxlength="6" placeholder="123456"
      style="font-size:20px;letter-spacing:4px;text-align:center"></label>
    <div id="ae2"></div>`,
    async () => {
      try {
        const r = await api("/api/moi/2fa/activer", { method: "POST", body: { code: $("#a2").value } });
        dialogue("Codes de secours", `
          <div class="avis">Conserver ces codes hors du téléphone. Chacun ne sert qu'une fois, et
            ils ne seront plus jamais affichés. Ils permettent d'entrer si le téléphone est perdu.</div>
          <div class="carte" style="font-family:ui-monospace,monospace;font-size:15px;columns:2">
            ${r.codes.map(x => esc(x)).join("<br>")}</div>

        return false;
      } catch (e) { $("#ae2").innerHTML = `<div class="avis">${esc(e.message)}</div>`; return false; }
    }, "Activer");
  const rg = $("#regen", c);

    await api("/api/moi/2fa/preparer", { method: "POST", body: { regenerer: true } });
    $("#dlg").close(); configurer2facteur();
  };
  setTimeout(() => {
    const d = $("#db2", c);
    if (d) d.onclick = async () => {
      try { await api("/api/moi/2fa/desactiver", { method: "POST", body: { password: $("#d2").value } });
        alert("Second facteur désactivé."); location.reload();
      } catch (e) { alert(e.message); }
    };
  }, 30);
}

// ══════════════════════════════════════════════════════════════════ démarrage
// ------------------------------------------------------- raccourcis clavier
/**
 * Raccourcis de ShipStation (§2.12), y compris les séquences à deux touches (`G+O`, `M+S`).
 * L'implémentation est un petit automate : une première touche « préfixe » ouvre une fenêtre
 * de 900 ms pendant laquelle la seconde complète la commande.
 *
 * Ajout : les chiffres 1 à 9 appliquent les préréglages d'expédition. Les 17 préréglages du
 * compte ShipStation n'avaient aucun raccourci — c'était l'accélérateur le plus évident et
 * il n'a jamais servi.
 */
const PREFIXES = { g: "Aller à…", m: "Marquer…", p: "Imprimer…", o: "Commandes…" };
const RACCOURCIS = {
  "g o": ["Aller aux commandes", () => aller("commandes")],
  "g s": ["Aller aux expéditions", () => aller("expeditions")],
  "g b": ["Aller aux lots", () => aller("lots")],
  "g r": ["Aller aux retours", () => aller("retours")],
  "g e": ["Aller à la fin de journée", () => aller("manifestes")],
  "g p": ["Aller aux produits", () => aller("produits")],
  "g c": ["Aller aux clients", () => aller("clients")],
  "g a": ["Aller aux réglages", () => aller("reglages")],
  "m s": ["Marquer comme expédiée", () => S.cmdActions?.marquerExpedie()],
  "p s": ["Imprimer les bordereaux", () => S.sel.size && window.open(`/api/packing-slip?ids=${[...S.sel].join(",")}`, "_blank")],
  "p l": ["Imprimer la liste de prélèvement", () => S.sel.size && window.open(`/api/pick-list?ids=${[...S.sel].join(",")}`, "_blank")],
  "o r": ["Recharger la grille", () => S.cmdCharger?.()],
  "u": ["Mettre à jour les boutiques (Shopify)", importerShopify],
  "v": ["Ouvrir le détail", () => S.sel.size && detailCommande(Number([...S.sel][0]))],
  "r": ["Coter la sélection", () => S.cmdActions?.coter()],
  "s": ["Créer les étiquettes", () => S.cmdActions?.acheterLot()],
  "b": ["Créer un lot", () => S.cmdActions?.acheterLot()],
  "/": ["Recherche rapide", () => { $("#quick").focus(); }],
  "?": ["Afficher les raccourcis", () => aideRaccourcis()],
};

let prefixe = null, minuteurPrefixe = null;

function raccourcis(e) {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) {
    if (e.key === "Escape") t.blur();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();

  if (prefixe) {
    const combo = `${prefixe} ${k}`;
    clearTimeout(minuteurPrefixe); prefixe = null; indice("");
    if (RACCOURCIS[combo]) { e.preventDefault(); RACCOURCIS[combo][1](); }
    return;
  }
  if (PREFIXES[k] && Object.keys(RACCOURCIS).some((c) => c.startsWith(k + " "))) {
    e.preventDefault();
    prefixe = k; indice(PREFIXES[k]);
    minuteurPrefixe = setTimeout(() => { prefixe = null; indice(""); }, 900);
    return;
  }
  if (/^[1-9]$/.test(k)) { e.preventDefault(); S.cmdPresetParTouche?.(k); return; }
  if (RACCOURCIS[e.key] || RACCOURCIS[k]) { e.preventDefault(); (RACCOURCIS[e.key] || RACCOURCIS[k])[1](); }
}

function indice(txt) {
  let b = $("#indiceHk");
  if (!txt) { b?.remove(); return; }
  if (!b) { b = el('<div id="indiceHk" class="menuF" style="bottom:14px;left:14px;top:auto;padding:7px 12px"></div>'); document.body.append(b); }
  b.textContent = txt;
}

function aideRaccourcis() {
  const lignes = Object.entries(RACCOURCIS)
    .map(([k, [t]]) => `<tr><td><kbd>${esc(k.toUpperCase().replace(" ", " + "))}</kbd></td><td>${esc(t)}</td></tr>`).join("");
  const presets = (S.refs.presets || []).filter((p) => p.hotkey)
    .map((p) => `<tr><td><kbd>${esc(p.hotkey)}</kbd></td><td>Préréglage « ${esc(p.name)} »</td></tr>`).join("");
  dialogue("Raccourcis clavier", `
    <div class="tbl" style="max-height:60vh"><table><tbody>${lignes}
      ${presets ? `<tr><td colspan="2" class="doux" style="padding-top:10px"><b>Préréglages d'expédition</b></td></tr>${presets}` : ""}
      <tr><td colspan="2" class="doux" style="padding-top:10px"><b>Sélection</b></td></tr>
      <tr><td><kbd>Maj + clic</kbd></td><td>Sélectionner une plage de lignes</td></tr>
      <tr><td><kbd>Ctrl + clic</kbd></td><td>Basculer une ligne</td></tr>
      <tr><td><kbd>Double-clic</kbd></td><td>Ouvrir le détail de la commande</td></tr>
    </tbody></table></div>`, null, "Fermer");
}

    $("#hOut").innerHTML = `<div class="avis info"><b>${num(r.classes)}</b> produits classés sur ${num(r.total)}
      (${r.taux} %) · ${num(r.non_classes)} sans correspondance · ${num(r.exclus)} exclus des douanes
      · <b>${num(r.a_revalider)}</b> avec un code à revalider</div>
      <div class="tbl"><table><thead><tr><th>SKU</th><th>Produit</th><th>Code proposé</th><th>Libellé</th><th>Via</th></tr></thead>
      <tbody>${r.detail.classes.slice(0, 200).map((p) => `<tr><td class="sku">${esc(p.sku)}</td><td>${esc(p.name)}</td>
        <td>${esc(p.hs_code)}${p.revalider ? ' <span class="puce a">à revalider</span>' : ""}</td>
        <td>${esc(p.customs_description)}</td><td class="doux">${esc(p.via)}</td></tr>`).join("")}</tbody></table></div>`;
  };
  $("#hApp").onclick = () => dialogue("Appliquer la classification", `
    <p>Les codes SH seront écrits sur les produits qui n'en ont pas. Les 69 produits déjà
    classés ne sont pas touchés.</p>
    <div class="avis">Les familles marquées « à revalider » seront appliquées elles aussi —
    c'est la convention existante du compte, à trancher avec un courtier.</div>`,
    async () => { const r = await api("/api/hs/appliquer", { method: "POST", body: {} });
      alert(`${r.applique} produit(s) classés, ${r.non_classes} sans correspondance.`); rendre(); }, "Appliquer");
};

async function demarrer() {
  const m = await api("/api/moi");
  if (!m.user) return montrerConnexion();
  S.moi = m.user;

  S.config = await api("/api/config");
  const av = [];
  if (!S.config.etiquettes_actives) av.push(`Achat d'étiquettes <b>désactivé</b> — lancer avec <code>CLONE_ALLOW_LABELS=1</code>. Cotation et simulation restent disponibles.`);
  if (S.config.adaptateur === "bouchon") av.push(`Transporteur <b>bouchon</b> : les tarifs sont des valeurs de démonstration. Passer à <code>CARRIER_ADAPTER=clickship</code> à réception des identifiants.`);
  if (!S.config.config_lasclay) av.push(`Configuration Lasclay <b>non chargée</b> — règles, vues, préréglages, colis et étiquettes du compte ShipStation. À charger depuis <a onclick="aller('reglages')">Réglages</a>.`);
  if (S.config.shopify && !S.config.shopify.configure) av.push(`Import Shopify <b>indisponible</b> : variables <code>SHOPIFY_STORE</code> et <code>SHOPIFY_CLIENT_ID</code>/<code>SHOPIFY_CLIENT_SECRET</code> manquantes sur le service.`);
  $("#bandeau").innerHTML = av.map(a => `<div class="avis">${a}</div>`).join("");
  $("#navSous").innerHTML = `${esc(S.moi.name)}<br>` +
    `<a id="l2f">${S.moi.totp_enabled ? "second facteur ✓" : "activer le 2FA"}</a> · ` +
    `<a id="lqm">mot de passe</a> · <a id="lout">quitter</a>`;
  $("#lout").onclick = deconnexion;
  $("#lqm").onclick = () => changerMotDePasse(false);
  $("#l2f").onclick = configurer2facteur;

  try { S.refs = await api("/api/refs"); } catch { S.refs = {}; }

  // ---- en-tête global : recherche rapide, mise à jour des boutiques, raccourcis
  $("#hMoi").textContent = S.moi.name;
  $("#btAide").onclick = aideRaccourcis;
  $("#btMaj").onclick = importerShopify;
  $("#quick").onkeydown = (e) => {
    if (e.key !== "Enter") return;
    const q = $("#quick").value.trim();
    if (!q) return;
    if (S.page !== "commandes") aller("commandes");
    setTimeout(() => { const f = $("#fq"); if (f) { f.value = q; f.dispatchEvent(new Event("input")); } }, 120);
  };
  document.addEventListener("keydown", raccourcis);
  await rafraichirCompteurs();
  S.page = (location.hash || "").slice(1) || "commandes";
  if (!VUES[S.page]) S.page = "commandes";
  menu();
  rendre();
  if (S.moi.must_change) changerMotDePasse(true);
  else if (!S.moi.totp_enabled && S.config.exiger_2fa) configurer2facteur();
  clearInterval(S.tick);
  S.tick = setInterval(rafraichirCompteurs, 60000);
}

demarrer().catch(() => montrerConnexion());
</script>
</body>
</html>
