  const btRat = $("#shRattraper");
  if (btRat) btRat.onclick = async () => {
    btRat.disabled = true;
    try {
      const r = await api("/api/shopify/rattraper", { method: "POST", body: {} });
      toast(`${num(r.traitees)} commande(s) traitée(s), ${num(r.nouvelles)} nouvelle(s).`);
      rafraichirCompteurs(); VUES.reglages();
    } catch (e) { dialogue("Rattrapage impossible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }
    finally { btRat.disabled = false; }
  };

  // BUG-084 — « Retraiter » était en primaire et « Simuler » en secondaire : l'écran invitait
  // à écrire avant de regarder. Inversé, et le bouton mutant reste inactif tant qu'aucune
  // simulation n'a été jouée. Il annonce ensuite combien de commandes il touchera.
  let derniereSim = null;
  const retraiter = async (sec) => {
    $("#rpOut").innerHTML = squelette(2);
    try {
      const r = await api("/api/automation/reprocess", { method: "POST", body: { dry_run: sec } });
      if (sec) {
        derniereSim = r;
        const b = $("#rpGo");
        b.disabled = !r.touchees;
        b.textContent = r.touchees ? `Retraiter ${num(r.touchees)} commande${r.touchees > 1 ? "s" : ""}` : "Rien à retraiter";
        b.title = r.touchees ? "" : "La simulation n'a trouvé aucune commande à modifier";
      }
      $("#rpOut").innerHTML = `<div class="avis ${sec ? "info" : ""}">${num(r.commandes)} commande(s) examinée(s),
        <b>${num(r.touchees)}</b> ${sec ? "seraient modifiées" : "modifiées"}.</div>`;
    } catch (e) {
      $("#rpOut").innerHTML = "";
      $("#rpOut").append(panneauErreur(e, () => retraiter(sec), sec ? "Simulation impossible" : "Retraitement impossible"));
    }
  };
  $("#rpSec").onclick = () => retraiter(true);
  $("#rpGo").onclick = () => {
    if (!derniereSim) return;
    dialogue("Retraiter les commandes ouvertes",
      `<p><b>${num(derniereSim.touchees)}</b> commande(s) seront modifiées, sur
       ${num(derniereSim.commandes)} examinées.</p>
       <div class="avis">Les réglages d'expédition faits à la main depuis l'import peuvent être
       écrasés — c'est le même avertissement que donnait ShipStation, mais ici vous savez
       combien de commandes sont concernées.</div>`,
      () => retraiter(false), `Retraiter ${num(derniereSim.touchees)} commande(s)`);
  };

  // Hygiène des comptes — ce qui empêchera d'imposer le second facteur, montré avant qu'on
  // essaie plutôt qu'en refus sec. Un compte sans adresse valide ne peut pas s'enrôler ;
  // armer l'exigence sans le corriger, c'est le mettre dehors.
  (async () => {
    try {
      const h = await api("/api/users/hygiene");
      const ennuis = [
        ...h.courriels_invalides.map(u => `${u.name} — courriel invalide (${u.email || "vide"})`),
        ...h.homonymes.map(g => `${g.length} comptes nommés « ${g[0].name} » — les menus d'assignation deviennent ambigus`),
      ];
      $("#s2h").innerHTML = ennuis.length
        ? `<div class="avis" style="margin-top:8px">À corriger avant d'imposer le second facteur :
             <ul style="margin:4px 0 0 16px">${ennuis.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`
        : (h.sans_second_facteur.length && !h.exiger_2fa
            ? `<div class="doux" style="font-size:12px;margin-top:6px">${num(h.sans_second_facteur.length)}
                 compte(s) actif(s) sans second facteur — ils s'enrôleront à leur prochaine connexion.</div>`
            : "");
    } catch { /* l'écran reste utilisable sans le diagnostic */ }
  })();

  $("#s2save").onclick = async () => {
    try {
      await api("/api/settings", { method: "POST", body: { exiger_2fa: $("#s2fa").checked } });
    } catch (e) {
      $("#s2fa").checked = !!S.config.exiger_2fa;   // rien n'a été écrit : l'affichage suit
      const liste = (e.detail && e.detail.comptes) || [];
      return dialogue("Second facteur non imposé",
        `<div class="avis">${esc(e.message)}</div>${liste.length
          ? `<ul style="margin:8px 0 0 16px">${liste.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}`,
        null, "Fermer");
    }
    S.config = await api("/api/config");
    toast($("#s2fa").checked
      ? "Second facteur obligatoire. Chaque employé devra le configurer à sa prochaine connexion."
      : "Second facteur redevenu facultatif.");
  };
  /**
   * Modifier un emplacement — l'adresse et le contact au même endroit.
   *
   * Le pays commande la forme du champ Province, et l'adresse se complète par Google comme
   * partout ailleurs : un emplacement se saisit une fois, autant que ce soit au même endroit
   * et de la même façon qu'une adresse de livraison.
   */
  $("#vue").querySelectorAll("[data-emp]").forEach((b) => b.onclick = () => {
    const e = emplacements.find((x) => String(x.id) === String(b.dataset.emp));
    if (!e) return;
    const a = e.origin_address || {};
    dialogue(`Emplacement — ${e.name}`, `
      <div class="fDeux">
        <label class="champ"><span>Nom de l'emplacement</span><input id="wN" value="${esc(e.name || "")}"></label>
        <label class="champ"><span>Société</span><input id="wSoc" value="${esc(a.company || "")}"></label>
        <label class="champ"><span>Adresse 1</span><input id="w1" value="${esc(a.street1 || "")}"></label>
        <label class="champ"><span>Adresse 2</span><input id="w2" value="${esc(a.street2 || "")}"></label>
        <label class="champ"><span>Ville</span><input id="wV" value="${esc(a.city || "")}"></label>
        <label class="champ"><span>Pays</span><select id="wY">${optionsPays(a.country || "CA")}</select></label>
        <label class="champ"><span>Province / État</span><span id="wPZ">${
          champRegion("wP", (a.country || "CA").toUpperCase(), a.state || "")}</span></label>
        <label class="champ"><span>Code postal</span><input id="wC" value="${esc(a.postalCode || "")}"></label>
      </div>
      <div class="avis info">Ces trois champs partent chez le transporteur à chaque étiquette
        expédiée d'ici. Sans eux, la réservation est refusée.</div>
      <div class="fDeux">
        <label class="champ"><span>Nom du contact</span><input id="wCo" value="${esc(a.name || "")}"></label>
        <label class="champ"><span>Téléphone</span><input id="wT" value="${esc(a.phone || "")}"></label>
        <label class="champ"><span>Courriel</span><input id="wM" type="email" value="${esc(a.email || "")}"></label>
      </div>
      <label class="ch"><input type="checkbox" id="wD" ${e.is_default ? "checked" : ""}
        ${e.is_default ? "disabled" : ""}> emplacement par défaut</label>`,
      async () => {
        await api(`/api/warehouses/${e.id}`, { method: "POST", body: {
          name: $("#wN").value.trim(),
          is_default: $("#wD").checked,
          origin_address: { name: $("#wCo").value.trim(), company: $("#wSoc").value.trim(),
            street1: $("#w1").value.trim(), street2: $("#w2").value.trim(),
            city: $("#wV").value.trim(), state: $("#wP").value.trim(),
            postalCode: $("#wC").value.trim(), country: $("#wY").value,
            phone: $("#wT").value.trim(), email: $("#wM").value.trim() } } });
        // Les référentiels en mémoire portent l'ancienne adresse : les relire évite que
        // l'écran d'expédition continue d'afficher ce qu'on vient de corriger.
        S.refs = await api("/api/refs");
        toast(`Emplacement « ${$("#wN").value.trim() || e.name} » enregistré.`);
        VUES.reglages();
      }, "Enregistrer",
      () => { brancherRegion("#wY", "#wP"); brancherAutoAdresse({ rue: "#w1", rue2: "#w2",
        ville: "#wV", region: "#wP", cp: "#wC", pays: "#wY" }); });
  });

  /**
   * L'état du paiement Freightcom, dit en clair.
   *
   * La question qu'on se pose devant un refus est « qu'est-ce que le clone envoie, et
   * est-ce que ça existe ? ». La carte y répond directement : les méthodes du compte,
   * celle qui partirait, et le réglage quand il en nomme une qui n'existe pas.
   */
  const lirePaiement = async () => {
    const z = $("#fcPay");
    if (!z) return;
    z.innerHTML = '<span class="doux">Lecture du compte…</span>';
    let p;
    try { p = await api("/api/carriers/freightcom/paiement"); }
    catch (e) { z.innerHTML = `<div class="avis">${esc(e.message)}</div>`; return; }

    const lignes = (p.methodes || []).map((m) => `<tr>
      <td><code>${esc(m.id)}</code>${String(m.id) === String(p.choisie) ? ' <span class="puce v">utilisée</span>' : ""}</td>
      <td>${esc(m.nom || "—")}</td><td class="doux">${esc(m.type || "—")}</td>
      <td>${m.defaut ? '<span class="puce g">défaut du compte</span>' : ""}</td></tr>`).join("");

    z.innerHTML = `
      ${p.lecture ? `<div class="avis">Le compte n'a pas pu être lu : ${esc(p.lecture)}</div>` : ""}
      ${p.imposeIntrouvable ? `<div class="avis bloquant"><b>Le réglage
        <code>FREIGHTCOM_PAYMENT_METHOD_ID</code> vaut <code>${esc(p.configuree)}</code>, qui
        n'existe pas sur ce compte.</b> C'est ce qui fait répondre
        <code>payment_method_id: not-found</code> à la réservation. Le corriger sur Render avec
        l'un des identifiants ci-dessous, ou le retirer pour laisser le clone prendre celle par
        défaut.</div>` : ""}
      ${p.refus && !p.imposeIntrouvable ? `<div class="avis">${esc(p.refus)}</div>` : ""}
      ${lignes ? `<div class="tbl" style="max-height:none"><table>
        <thead><tr><th scope="col">Identifiant</th><th scope="col">Nom</th>
          <th scope="col">Type</th><th scope="col"></th></tr></thead>
        <tbody>${lignes}</tbody></table></div>`
        : (p.lecture ? "" : `<div class="avis">Aucune méthode n'a pu être lue dans la réponse de
            Freightcom. Ce n'est pas la même chose qu'un compte sans carte — c'est peut-être une
            forme de réponse que le clone ne sait pas ouvrir. Voici ce que l'API a rendu :
            <pre style="white-space:pre-wrap;max-height:200px;overflow:auto">${
              esc(JSON.stringify(p.brut, null, 2) || "réponse vide")}</pre></div>`)}
      ${p.configuree ? `<div class="doux" style="margin-top:6px">Réglage
        <code>FREIGHTCOM_PAYMENT_METHOD_ID</code> = <code>${esc(p.configuree)}</code></div>`
        : '<div class="doux" style="margin-top:6px">Aucun réglage imposé — le clone prend celle par défaut du compte.</div>'}
      ${p.solde && p.solde.montant !== null && p.solde.montant !== undefined
        ? `<div class="doux">Solde disponible : <b>${esc(p.solde.montant)} ${esc(p.solde.devise || "")}</b></div>`
        : (p.solde && p.solde.erreur ? `<div class="doux">Solde illisible : ${esc(p.solde.erreur)}</div>` : "")}`;
  };
  lirePaiement();
  $("#fcPayR").onclick = lirePaiement;

  /** Le formulaire d'un type de colis — le même pour créer et pour corriger. */
  const editerColis = (p) => {
    const d = (p && p.dimensions) || {};
    dialogue(p ? `Type de colis — ${p.name}` : "Nouveau type de colis", `
      <label class="champ"><span>Nom</span><input id="pkN" value="${esc(p ? p.name : "")}"
        placeholder="Boite 8.5 x 4 x 4"></label>
      <div class="fTrois">
        <label class="champ"><span>Longueur (po)</span><input type="number" step="0.1" min="0" id="pkL" value="${esc(d.length ?? "")}"></label>
        <label class="champ"><span>Largeur (po)</span><input type="number" step="0.1" min="0" id="pkW" value="${esc(d.width ?? "")}"></label>
        <label class="champ"><span>Hauteur (po)</span><input type="number" step="0.1" min="0" id="pkH" value="${esc(d.height ?? "")}"></label>
      </div>
      <p class="doux">Une pochette souple a quand même une épaisseur : la déclarer à zéro fait
        coter un volume nul, et le transporteur facture ensuite sa propre mesure.</p>
      ${p && p.custom ? `<div class="barre" style="margin-top:10px">
        <button type="button" class="d" id="pkDel">Supprimer ce type</button></div>` : ""}`,
      async () => {
        await api("/api/packages", { method: "POST", body: {
          id: p ? p.id : null, name: $("#pkN").value,
          length: $("#pkL").value, width: $("#pkW").value, height: $("#pkH").value } });
        S.refs = await api("/api/refs");
        toast(`Type de colis « ${$("#pkN").value.trim()} » enregistré.`);
        VUES.reglages();
      }, "Enregistrer",
      () => {
        const sup = $("#pkDel");
        if (sup) sup.onclick = async () => {
          try {
            await api(`/api/packages/${encodeURIComponent(p.id)}`, { method: "DELETE" });
            S.refs = await api("/api/refs");
            $("#dlg").close(); toast(`« ${p.name} » supprimé.`); VUES.reglages();
          } catch (e) {
            $("#dlgC").insertAdjacentHTML("afterbegin", `<div class="avis">${esc(e.message)}</div>`);
          }
        };
      });
  };

  $("#vue").querySelectorAll("[data-colis]").forEach((b) => b.onclick = () =>
    editerColis(colisTypes.find((x) => String(x.id) === String(b.dataset.colis))));
  $("#colisNew").onclick = () => editerColis(null);

  $("#expS").onclick = async () => {
    const manque = ["expC", "expT", "expM"].filter((k) => !$("#" + k).value.trim());
    await api("/api/settings", { method: "POST", body: {
      expediteur_contact: $("#expC").value.trim(),
      expediteur_telephone: $("#expT").value.trim(),
      expediteur_courriel: $("#expM").value.trim() } });
    // Un repli incomplet ne remplit pas son office : le dire tout de suite plutôt qu'au
    // prochain achat refusé.
    $("#expE").textContent = manque.length
      ? "Enregistré — mais tant que les trois champs ne sont pas remplis, une commande sans coordonnées sera refusée à l'achat."
      : "Enregistré.";
    toast(manque.length ? "Coordonnées incomplètes." : "Coordonnées de l'expéditeur enregistrées.");
  };

  $("#stsave").onclick = async () => { await api("/api/settings", { method: "POST", body: { tarif_dropoff_cible: Number($("#st").value) } }); toast("Tarif de dépôt cible enregistré."); };
  $("#wt").append(table([{ k: "event", t: "Événement" }, { k: "target_url", t: "URL" },
    { k: "act", t: "", r: x => `<button class="d" data-w="${x.id}">Retirer</button>` }], w.webhooks));
  $("#wt").querySelectorAll("[data-w]").forEach(b => b.onclick = async () => {
    await api("/api/webhooks/" + b.dataset.w, { method: "DELETE" }); VUES.reglages();
  });
  $("#wadd").onclick = async () => {
    try { await api("/api/webhooks", { method: "POST", body: { event: $("#wev").value, target_url: $("#wurl").value } }); VUES.reglages(); }
    catch (e) { alert(e.message); }
  };
  /**
   * Recopie d'une commande — chercher, montrer, puis seulement écrire.
   *
   * Le premier appel ne confirme rien : il rapporte ce que ShipStation a. On n'écrit qu'après
   * avoir lu l'adresse et le suivi à l'écran, parce qu'un prénom seul désigne souvent
   * plusieurs commandes et qu'on ne veut pas recopier la mauvaise.
   */
  $("#rcb").onclick = async () => {
    const saisie = ($("#rcn").value || "").trim(), province = ($("#rcp").value || "").trim();
    if (!saisie) return toast("Donner un numéro de commande ou un nom.");
    const parNumero = /^[0-9#-]+$/.test(saisie);
    const requete = parNumero ? { numero: saisie.replace(/^#/, "") } : { nom: saisie, province: province || null };

    const ligneCmd = (c) => `<div><b>${esc(String(c.order_number))}</b>
      <span class="doux">${esc(c.date || "")} · ${esc(c.statut || "")}</span><br>
      ${esc(c.nom || "—")}${c.entreprise ? ` (${esc(c.entreprise)})` : ""}<br>
      <span class="doux">${esc(c.adresse || "")} — ${esc(c.ville || "")}, ${esc(c.province || "")}
      ${esc(c.code_postal || "")} ${esc(c.pays || "")}</span><br>
      <span class="doux">${esc(c.transporteur || "—")} / ${esc(c.service || "—")} ·
      ${num(Math.round(c.poids_g || 0))} g · ${c.lignes} ligne(s)</span></div>`;

    let r;
    try { r = await api("/api/migrate/commande", { method: "POST", body: requete }); }
    catch (e) { return dialogue("Recopie impossible", `<div class="avis">${esc(e.message)}</div>`, null, "Fermer"); }

    if (!r.trouvees) return dialogue("Aucune commande",
      `<p>ShipStation ne renvoie rien pour « ${esc(saisie)} »${province ? ` en ${esc(province)}` : ""}.</p>`,
      null, "Fermer");

    if (r.trouvees > 1) return dialogue(`${r.trouvees} commandes correspondent`,
      `<p class="doux">Relancer avec le numéro voulu.</p>
       ${r.candidates.map(c => `<div class="carte">${ligneCmd(c)}</div>`).join("")}`, null, "Fermer");

    const c = r.commande;
    const exp = r.expeditions.length
      ? r.expeditions.map(e => `<div>${e.suivi ? `<b>${esc(e.suivi)}</b>` : "<i>sans suivi</i>"}
          <span class="doux">${esc(e.transporteur || "—")} / ${esc(e.service || "—")} · ${esc(e.date || "")} ·
          ${e.cout.toFixed(2)} $${e.assurance ? ` + ${e.assurance.toFixed(2)} $ assurance` : ""}
          ${e.annulee ? " · annulée" : ""}${e.deja_en_base ? " · déjà en base" : ""}</span></div>`).join("")
      : `<div class="doux">Aucune expédition chez ShipStation — elle arrivera « à expédier ».</div>`;

    dialogue("Recopier cette commande",
      `<div class="carte">${ligneCmd(c)}</div>
       <div class="carte"><b>Expédition</b>${exp}</div>
       ${r.existante ? `<div class="avis info">Déjà dans le clone (#${r.existante.id},
          ${esc(r.existante.statut)}) — elle sera mise à jour, pas dupliquée.</div>` : ""}
       ${r.boutique ? "" : `<div class="avis">La boutique d'origine est absente du clone : la
          commande n'en aura aucune.</div>`}
       ${r.entrepot ? "" : `<div class="avis">L'entrepôt d'origine est absent du clone : elle
          partira de l'entrepôt par défaut.</div>`}`,
      async () => {
        try {
          const f = await api("/api/migrate/commande", { method: "POST", body: { ...requete, confirmer: true } });
          toast(`Commande ${f.commande.order_number} ${f.creee ? "créée" : "mise à jour"}` +
            `${f.expeditions_ecrites ? ` avec ${f.expeditions_ecrites} expédition(s)` : ""}.`);
          rafraichirCompteurs();
        } catch (e) { $("#dlgC").innerHTML = `<div class="avis">${esc(e.message)}</div>`; return false; }
      }, "Recopier");
  };

  $("#mig").onclick = () => dialogue("Migration depuis ShipStation",
    `<p>Récupère commandes, expéditions, exécutions, lots, produits, clients, retours et
       référentiels par le General Proxy, et les écrit dans cette base.</p>
     <label class="champ"><span>Depuis (facultatif, AAAA-MM-JJ)</span><input id="mdd" placeholder="2025-08-01"></label>
     <div class="avis">Rien n'est supprimé — les objets existants sont mis à jour par leur clé
       d'origine. Mais c'est une écriture de masse : <b>faire une sauvegarde et la relire</b>
       (<code>/api/backup</code> puis <code>/api/backup/verifier</code>) avant de lancer.</div>
     <div class="avis info">Long — comptez une dizaine de minutes sur l'historique complet.
       La fenêtre peut rester ouverte, la migration continue côté serveur.</div>`,
    async () => {
      $("#dlgC").innerHTML = '<p class="doux">Migration en cours…</p>';
      try {
        const r = await api("/api/migrate", { method: "POST", body: { depuis: $("#mdd")?.value || null } });
        $("#dlgC").innerHTML = `<div class="carte"><b>Terminé</b><pre>${esc(JSON.stringify(r.bilan, null, 2))}</pre></div>`;
        rafraichirCompteurs();
      } catch (e) { $("#dlgC").innerHTML = `<div class="avis">${esc(e.message)}</div>`; }
      return false;
    }, "Lancer");
};

// ----------------------------------------------------------------- journal
/**
 * Phrases du journal d'audit — BUG-043, BUG-079.
 *
 * L'écran affichait du JSON brut : `order.update — {"order_number":"#2270"}`. ShipStation
 * écrit des phrases, et c'est ce qu'on lit quand un client demande où en est sa commande.
 * Le nom de l'auteur manquait aussi, alors que l'écran promettait « qui a fait quoi ».
 */
const PHRASES_JOURNAL = {
  "order.create": (d) => `Commande ${d.order_number || ""} créée`,
  "order.update": (d) => `Commande ${d.order_number || ""} modifiée`,
  "order.bulk": (d) => `${d.n} commande${d.n > 1 ? "s" : ""} mise${d.n > 1 ? "s" : ""} à jour — ${(d.champs || []).join(", ")}`,
  "order.configure": (d) => `${d.n} commande${d.n > 1 ? "s" : ""} reconfigurée${d.n > 1 ? "s" : ""} (${d.champs} champ${d.champs > 1 ? "s" : ""})`,
  "order.status": (d) => `Statut passé à « ${STATUT_FR[d.status] || d.status} »`,
  "order.hold": (d) => `Mise en attente jusqu'au ${jour(d.hold_until)}`,
  "order.cancel": (d) => `${d.n || 1} commande${(d.n || 1) > 1 ? "s" : ""} annulée${(d.n || 1) > 1 ? "s" : ""}`,
  "order.tag": (d) => `Étiquette ${d.remove ? "retirée" : "appliquée"} sur ${d.n || 1} commande(s)`,
  "order.customs": (d) => `${d.n} déclaration${d.n > 1 ? "s" : ""} de douane enregistrée${d.n > 1 ? "s" : ""}`,
  "batch.add": (d) => `${d.n} commande${d.n > 1 ? "s" : ""} ajoutée${d.n > 1 ? "s" : ""} au lot ${d.nom ? `« ${d.nom} »` : ""}`,
  "batch.cancel": (d) => `Lot annulé — ${d.commandes_liberees} commande(s) libérée(s)`,
  "batch.update": (d) => d.notes !== undefined ? "Note du lot modifiée" : "Lot renommé",
  "label.buy": (d) => `Étiquette ${d.tracking || ""} achetée — ${money(d.cout || 0)}`,
  "label.void": (d) => `Étiquette ${d.tracking || ""} annulée`,
  "backup.export": (d) => `Sauvegarde exportée — ${num(d.enregistrements || 0)} enregistrements, ${d.tables} tables`,

function phraseJournal(r) {
  const d = r.detail || {};
  const f = PHRASES_JOURNAL[r.action];
  if (f) { try { return f(d); } catch { /* on retombe sur la forme générique */ } }
  // Forme générique lisible : « action — clé : valeur, clé : valeur ».
  const paires = Object.entries(d)
    .filter(([, v]) => v !== null && v !== undefined && typeof v !== "object")
    .map(([k, v]) => `${k.replace(/_/g, " ")} : ${v}`).join(", ");
  return `${r.action}${paires ? ` — ${paires}` : ""}`;
}

/**
 * Compteurs de la barre latérale — appelés 11 fois par minute à l'audit, y compris sur des
 * écrans qui n'affichent aucune commande, avec une latence qui se dégradait de 66 à 393 ms.
 *
 * Deux garde-fous. Les appels rapprochés se fondent en un seul : après une action en masse,
 * trois `charger(); majLots(); rafraichirCompteurs()` se suivent en quelques millisecondes
 * et une seule lecture suffit. Et l'onglet caché ne compte rien : un onglet oublié en
 * arrière-plan interrogeait le service toute la journée.
 */
let _compteursEnVol = null, _compteursAt = 0;
async function rafraichirCompteurs({ force = false } = {}) {
  if (!force && document.hidden) return;
  const maintenant = Date.now();
  if (!force && _compteursEnVol && maintenant - _compteursAt < 1500) return _compteursEnVol;
  _compteursAt = maintenant;
  _compteursEnVol = (async () => {
    try { S.compteurs = await api("/api/orders/counts"); majCompteursMenu(); } catch {}
    finally { _compteursEnVol = null; }
  })();
  return _compteursEnVol;
}

/**
 * Une lecture abandonnée parce qu'on a changé d'écran n'est pas une erreur de programme.
 *
 * Plusieurs appels sont lancés sans être attendus — le panneau latéral, les compteurs, le
 * diagnostic de sécurité. Leur promesse rejetée remontait en « signal is aborted without
 * reason » dans la console, ce qui noie les vraies erreurs. On tait celles-là, et seulement
 * celles-là : tout le reste continue de remonter.
 */
addEventListener("unhandledrejection", (e) => {
  // Deux cas sont normaux et ne doivent pas polluer la console : une requête que nous avons
  // nous-mêmes abandonnée, et une session expirée dont l'écran de connexion est la réponse.
  // Tout le reste doit rester visible — c'est ce qui permet de repérer les vraies pannes.
  if (e.reason && (e.reason.name === "AbortError" || e.reason.traitee)) e.preventDefault();
});

/**
 * Rendu d'un écran, avec ses trois états — BUG-014, BUG-035, BUG-037.
 *
 * L'audit a montré que **aucune erreur d'API n'atteignait jamais l'écran** : les messages
 * étaient rédigés dans `api()` mais aucun appelant ne posait de `.catch`. Un HTTP 500 sur
 * la grille suivi de « ↻ Recharger » ne changeait rien — l'opérateur pouvait imprimer une
 * heure sur une liste périmée.
 *
 * Trois états distincts, jamais confondus : chargement, erreur (avec `Réessayer`), vide.
 */
/**
 * Rendu d'écran — course de navigation.
 *
 * Un écran lent qui finit de se peindre après qu'on est passé au suivant écrase ce dernier :
 * sur la base migrée, cliquer « Lots » puis « Clients » affichait le titre « Lots » au-dessus
 * de la liste des clients, et deux écrans levaient « Cannot set properties of null » en
 * écrivant dans un DOM remplacé. Chaque rendu porte un numéro ; le retardataire se tait.
 */
let generationEcran = 0;
const ecranCourant = () => generationEcran;
const ecranPerime = (n) => n !== generationEcran;

async function rendre() {
  const ma = ++generationEcran;
  if (S.abortEcran) S.abortEcran.abort();
  S.abortEcran = new AbortController();
  document.body.dataset.page = S.page;
  // La classe d'écran est posée par la vue qui en a besoin ; on la retire ici pour qu'elle
  // ne survive pas à un changement de page.
  $("#vue").classList.remove("ecranReglages");
  S.rafraichirEcran = null;
  $("#vue").innerHTML = squelette();
  try {
    await (VUES[S.page] || VUES.commandes)();
  } catch (e) {
    // Écran abandonné parce qu'on a navigué ailleurs : ce n'est pas une panne à afficher.
    if (ecranPerime(ma) || (e && e.name === "AbortError")) return;
    $("#vue").innerHTML = "";
    $("#vue").append(panneauErreur(e, () => rendre()));
  }
}

/** Squelette de chargement : des lignes grises, pas un mot « Chargement… » qui ne bouge pas. */
const squelette = (n = 8) =>
  `<div class="squelette" aria-busy="true" aria-live="polite">
     <span class="visuellement-cache">Chargement en cours</span>
     ${Array.from({ length: n }, () => '<div class="sqL"></div>').join("")}
   </div>`;

/**
 * Panneau d'erreur d'une zone. Il nomme l'erreur, propose de réessayer, et **ne remplace
 * jamais silencieusement** des données valides par un vide trompeur.
 */
function panneauErreur(e, reessayer, titre = "Chargement impossible") {
  const p = el(`<div class="panErr" role="alert">
    <div class="panErrT">${esc(titre)}</div>
    <div class="panErrM">${esc(e && e.message ? e.message : String(e))}</div>
    <div class="barre"><button type="button" class="v" data-r>Réessayer</button></div>
  </div>`);
  p.querySelector("[data-r]").onclick = () => reessayer();
  return p;
}

/**
 * Notification passagère. Utilisée pour les échecs d'actions ponctuelles — celles qui ne
 * remplissent pas une zone et n'ont donc nulle part où afficher leur erreur.
 */
function toast(message, { type = "info", reessayer = null, duree = 6000 } = {}) {
  let z = $("#toasts");
  if (!z) { z = el('<div id="toasts" role="status" aria-live="polite"></div>'); document.body.append(z); }
  const t = el(`<div class="toast ${esc(type)}">
    <span>${esc(message)}</span>
    ${reessayer ? '<button type="button" data-r>Réessayer</button>' : ""}
    <button type="button" class="x" data-x aria-label="Fermer">×</button></div>`);
  z.append(t);
  const partir = () => { t.classList.add("sort"); setTimeout(() => t.remove(), 250); };
  t.querySelector("[data-x]").onclick = partir;
  const r = t.querySelector("[data-r]");
  if (r) r.onclick = () => { partir(); reessayer(); };
  if (duree) setTimeout(partir, duree);
  return t;
}

/** Enveloppe d'action ponctuelle : exécute, et en cas d'échec le dit au lieu de se taire. */
async function tenter(action, { message = "L'action a échoué", apres = null } = {}) {
  try {
    const r = await action();
    if (apres) apres(r);
    return r;
  } catch (e) {
    toast(`${message} : ${e.message}`, { type: "erreur", reessayer: () => tenter(action, { message, apres }) });
    return null;
  }
}

// ══════════════════════════════════════════════════════════════════ démarrage
// ------------------------------------------------------- raccourcis clavier
/**
 * Raccourcis de ShipStation (§2.12), y compris les séquences à deux touches (`G+O`, `M+S`).
 * L'implémentation est un petit automate : une première touche « préfixe » ouvre une fenêtre
 * de 900 ms pendant laquelle la seconde complète la commande.
 *
 * Ajout : les chiffres 1 à 9 appliquent les préréglages d'expédition. Les 17 préréglages du
 * compte ShipStation n'avaient aucun raccourci — c'était l'accélérateur le plus évident et
 * il n'a jamais servi.
 */
const PREFIXES = { g: "Aller à…", m: "Marquer…", p: "Imprimer…", o: "Commandes…" };
const RACCOURCIS = {
  "g o": ["Aller aux commandes", () => aller("commandes")],
  "g s": ["Aller aux expéditions", () => aller("expeditions")],
  "g b": ["Aller aux lots", () => aller("lots")],
  "g r": ["Aller aux retours", () => aller("retours")],
  "g e": ["Aller à la fin de journée", () => aller("manifestes")],
  "g p": ["Aller aux produits", () => aller("produits")],
  "g c": ["Aller aux clients", () => aller("clients")],
  "g a": ["Aller aux réglages", () => aller("reglages")],
  "m s": ["Marquer comme expédiée", () => S.cmdActions?.marquerExpedie()],
  "p s": ["Imprimer les bordereaux", () => S.sel.size && window.open(`/api/packing-slip?ids=${[...S.sel].join(",")}`, "_blank")],
  "p l": ["Imprimer la liste de prélèvement", () => S.sel.size && window.open(`/api/pick-list?ids=${[...S.sel].join(",")}`, "_blank")],
  "o r": ["Recharger la grille", () => S.cmdCharger?.()],
  "u": ["Rafraîchir cet écran", () => $("#btMaj").click()],
  "v": ["Ouvrir le détail", () => S.sel.size && detailCommande(Number([...S.sel][0]))],
  "r": ["Coter la sélection", () => S.cmdActions?.coter()],
  // BUG-010 — « b » appelait `acheterLot()`, la même fonction que « s ». Inoffensif tant que
  // l'achat d'étiquettes est coupé ; le jour où il est activé, c'est une dépense irréversible
  // au premier appui d'une touche de navigation. « b » ouvre la création de lot, rien d'autre.
  "s": ["Créer les étiquettes", () => S.cmdActions?.confirmerAchat()],
  "b": ["Créer un lot", () => S.cmdActions?.creerLot()],
  "v": ["Vérifier (poste de scan)", () => S.scanActions?.verifier()],
  "p": ["Imprimer l'étiquette (poste de scan)", () => S.scanActions?.imprimer()],
  "/": ["Recherche rapide", () => { $("#quick").focus(); }],
  "?": ["Afficher les raccourcis", () => aideRaccourcis()],
};

/**
 * Raccourcis qui modifient quelque chose. Ils sont neutralisés dès qu'une modale ou la fiche
 * de commande est ouverte : appuyer sur « s » en remplissant un formulaire ne doit pas acheter
 * les étiquettes de la grille qu'on ne voit plus (BUG-026).
 */
const RACCOURCIS_MUTANTS = new Set(["s", "b", "m s", "v", "p"]);
const contexteModal = () => !!(document.querySelector("#dlg[open]") || document.querySelector("#fiche"));

let prefixe = null, minuteurPrefixe = null;

function raccourcis(e) {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) {
    if (e.key === "Escape") t.blur();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();

  // Une modale ouverte capte le contexte : aucun raccourci mutant ne doit agir sur l'écran
  // qu'elle recouvre. Les raccourcis de navigation et l'aide restent disponibles.
  const modal = contexteModal();
  if (modal && (RACCOURCIS_MUTANTS.has(k) || /^[0-9]$/.test(k))) return;

  // Les raccourcis du poste de scan n'existent que sur cet écran.
  if ((k === "v" || k === "p") && S.page !== "scan" && !S.sel.size) return;

  if (prefixe) {
    const combo = `${prefixe} ${k}`;
    clearTimeout(minuteurPrefixe); prefixe = null; indice("");
    if (RACCOURCIS[combo]) { e.preventDefault(); RACCOURCIS[combo][1](); }
    return;
  }
  if (PREFIXES[k] && Object.keys(RACCOURCIS).some((c) => c.startsWith(k + " "))) {
    e.preventDefault();
    prefixe = k; indice(PREFIXES[k]);
    minuteurPrefixe = setTimeout(() => { prefixe = null; indice(""); }, 900);
    return;
  }
  // Sept préréglages portent un raccourci : au-delà, la touche ne doit rien faire plutôt que
  // d'appliquer silencieusement un préréglage inexistant (BUG-026).
  if (/^[1-7]$/.test(k)) { e.preventDefault(); S.cmdPresetParTouche?.(k); return; }
  if (RACCOURCIS[e.key] || RACCOURCIS[k]) { e.preventDefault(); (RACCOURCIS[e.key] || RACCOURCIS[k])[1](); }
}

function indice(txt) {
  let b = $("#indiceHk");
  if (!txt) { b?.remove(); return; }
  if (!b) { b = el('<div id="indiceHk" class="menuF" style="bottom:14px;left:14px;top:auto;padding:7px 12px"></div>'); document.body.append(b); }
  b.textContent = txt;
}

/**
 * Indicateur à trois états — BUG-056, BUG-033.
 *
 * « 0 produit sans code SH » s'affichait **en vert** alors que le catalogue était vide : un
 * compteur à zéro sur une table vide est une **absence de donnée**, pas un succès. De même,
 * l'auto-contrôle des réglages peignait « boutiques 12 sur 11 » en vert « complet » alors
 * qu'un excédent est une anomalie. Quatre états, jamais deux.
 */
function indicateur(valeur, { total = null, zeroEstBon = true } = {}) {
  if (total === 0 || total === null && valeur === 0 && zeroEstBon === null)
    return { classe: "gris", etat: "non calculable", note: "aucune donnée de référence" };
  if (total !== null && valeur > total)
    return { classe: "ambre", etat: "excédent", note: `${valeur} pour ${total} attendus` };
  if (total !== null && valeur < total)
    return { classe: "ambre", etat: "incomplet", note: `${valeur} sur ${total}` };
  if (valeur === 0) return zeroEstBon
    ? { classe: "vert", etat: "complet", note: "" }
    : { classe: "gris", etat: "non calculable", note: "" };
  return { classe: "vert", etat: "complet", note: "" };
}

async function demarrer() {
  const m = await api("/api/moi");
  if (!m.user) return montrerConnexion();
  S.moi = m.user;
  S.pref = m.pref || { langue: "fr" };
  appliquerTheme();
  document.documentElement.lang = langue();
  observerLangue();

  S.config = await api("/api/config");
  // Les fournisseurs d'étiquettes, chargés une fois. Un échec ne bloque rien : le premier
  // menu se contentera du fournisseur par défaut, comme avant qu'il existe.
  api("/api/carriers/adapters").then((r) => { S.fournisseurs = r.fournisseurs || []; })
    .catch(() => { S.fournisseurs = []; });
  const tt = (fr, en) => (langue() === "en" ? en : fr);
  const av = [];
  // §4.9 — les bandeaux exposaient `CLONE_ALLOW_LABELS=1` et `CARRIER_ADAPTER=clickship`.
  // Un opérateur d'entrepôt ne peut rien faire d'une variable d'environnement : il lui faut
  // savoir ce qu'il peut faire aujourd'hui, et qui débloque le reste. Le détail technique
  // reste disponible, en info-bulle, pour qui déploie.
  if (!S.config.etiquettes_actives) av.push(tt(
    `<b>Aucune étiquette ne peut être achetée</b> pour l'instant — préparez et cotez normalement, l'impression viendra. <span title="Le service doit être lancé avec CLONE_ALLOW_LABELS=1">Activation par l'administrateur.</span>`,
    `<b>Labels cannot be purchased</b> yet — keep preparing and rating; printing will follow. <span title="Service must run with CLONE_ALLOW_LABELS=1">Enabled by the administrator.</span>`));
  if (S.config.adaptateur === "bouchon") av.push(tt(
    `<b>Prix d'exercice, pas de vrais tarifs.</b> Ne vous en servez pas pour choisir un envoi réel. <span title="Adaptateur transporteur : bouchon. Passer à CARRIER_ADAPTER=clickship à réception des identifiants.">En attente des identifiants transporteur.</span>`,
    `<b>Practice prices, not real rates.</b> Do not use them to choose a real shipment. <span title="Carrier adapter: stub. Switch to CARRIER_ADAPTER=clickship once credentials arrive.">Waiting on carrier credentials.</span>`));
  if (!S.config.config_lasclay) av.push(tt(
    `Configuration Lasclay <b>non chargée</b> — règles, vues, préréglages, colis et étiquettes du compte ShipStation. À charger depuis <a href="#reglages" data-nav="reglages">l'engrenage → Compte, boutiques et import</a>.`,
    `Lasclay configuration <b>not loaded</b> — rules, views, presets, package types and tags from the ShipStation account. Load it from <a href="#reglages" data-nav="reglages">the gear → Account, Stores &amp; Import</a>.`));
  if (S.config.shopify && !S.config.shopify.configure) av.push(tt(
    `<b>Les commandes Shopify n'arrivent pas</b> — la connexion à la boutique n'est pas configurée. <span title="Variables SHOPIFY_STORE et SHOPIFY_CLIENT_ID / SHOPIFY_CLIENT_SECRET manquantes sur le service">À faire par l'administrateur.</span>`,
    `<b>Shopify orders are not coming in</b> — the store connection is not configured. <span title="SHOPIFY_STORE and SHOPIFY_CLIENT_ID / SHOPIFY_CLIENT_SECRET are missing on the service">Administrator action required.</span>`));
  // Les bandeaux d'état tiennent sur une ligne et se referment : ils informent au démarrage,
  // ils ne doivent pas rogner la grille toute la journée.
  // Le bandeau « transporteur bouchon » ne se referme pas : il dit que les prix affichés sont
  // faux, et c'est vrai tant que l'adaptateur n'est pas branché. Les autres se masquent.
  $("#bandeau").innerHTML = av.map((a, i) => {
    const permanent = /bouchon|stub/.test(a);
    return `<div class="avis${permanent ? " permanent" : ""}" data-b="${i}">${a}
      ${permanent ? "" : `<button type="button" class="fermer" data-f="${i}" title="Masquer" aria-label="Masquer cet avis">×</button>`}</div>`;
  }).join("");
  $("#bandeau").querySelectorAll("[data-f]").forEach((b) => b.onclick = () => b.parentNode.remove());
  $("#bandeau").querySelectorAll("[data-nav]").forEach((a) => a.onclick = (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); aller(a.dataset.nav);
  });
  try { S.refs = await api("/api/refs"); } catch { S.refs = {}; }
  indexerRefs();

  // ---- en-tête global, de gauche à droite comme chez ShipStation : marque, modules,
  //      recherche rapide, mise à jour des boutiques, alertes, profil, réglages, aide.
  $("#hMoi").textContent = S.moi.name;
  $("#btMarque").onclick = () => aller("analytique");
  $("#btAide").onclick = aideRaccourcis;
  /**
   * ⟳ rafraîchit, point — BUG-071.
   *
   * Il ouvrait la modale « Importer depuis Shopify », c'est-à-dire un bouton **mutant** à un
   * clic d'une flèche circulaire. Sur l'écran Analytique, où l'on cherche précisément à
   * rafraîchir des chiffres périmés, c'était un piège. L'import garde son entrée, dans
   * « Autres actions » et dans les réglages, là où l'on va quand on veut importer.
   */
  $("#btMaj").onclick = async () => {
    const b = $("#btMaj");
    b.disabled = true; b.classList.add("tourne");
    try {
      await rafraichirCompteurs();
      // Chaque écran sait se recharger ; à défaut on rejoue le rendu de la page courante.
      if (S.rafraichirEcran) await S.rafraichirEcran();
      else if (VUES[S.page]) await VUES[S.page]();
      majFraicheur();
    } finally { b.disabled = false; b.classList.remove("tourne"); }
  };

  /** Depuis quand ce qui est à l'écran date — l'information manquait entièrement. */
  let derniereMaj = Date.now();
  function majFraicheur() {
    derniereMaj = Date.now();
    const e = $("#hFrais");
    if (e) e.textContent = "à l'instant";
  }
  setInterval(() => {
    const e = $("#hFrais");
    if (!e) return;
    const s = Math.round((Date.now() - derniereMaj) / 1000);
    e.textContent = s < 45 ? "à l'instant"
      : s < 3600 ? `il y a ${Math.round(s / 60)} min`
      : `il y a ${Math.round(s / 3600)} h`;
  }, 20000);
  $("#hAlertes").onclick = () => aller("alertes");
  $("#btProfil").onclick = (e) => { e.stopPropagation(); menuProfil($("#btProfil")); };
  $("#btReglages").onclick = (e) => { e.stopPropagation(); menuReglages($("#btReglages")); };
  /**
   * Recherche rapide — BUG-042.
   *
   * Elle ignorait le filtre de statut mais **conservait** les critères de la vue
   * sauvegardée : chercher un numéro depuis « Graines x5 » rendait « Aucune commande » avec
   * un bouton « Importer depuis Shopify », alors que la même recherche depuis « À expédier »
   * en trouvait dix-neuf. L'utilisateur en concluait que la commande n'existait pas.
   *
   * Une recherche rapide **sort de la vue** : statut, boutique, lot, vue et filtres avancés
   * sont effacés, et l'écran le dit dans son en-tête. C'est le comportement de ShipStation,
   * et c'est le seul qui ne mente pas — on ne peut pas prétendre chercher « partout » en
   * gardant la moitié des filtres.
   */
  const rechercheRapide = (q) => {
    const S0 = S.cmd = S.cmd || { colonnes: null, epingles: [], vue: null, dense: S.pref?.dense ?? true, page: 0, taille: 250 };
    S0.statut = ""; S0.store = null; S0.lot = null; S0.vue = null;
    S0.avance = null; S0.f = {}; S0.page = 0;
    S0.recherche = q;                     // l'en-tête s'en sert pour se nommer
    S.sel.clear(); S.toutLeFiltre = false;
    if (S.page !== "commandes") aller("commandes");
    setTimeout(() => {
      const f = $("#fq");
      if (f) { f.value = q; f.dispatchEvent(new Event("input")); }
    }, 120);
  };

  $("#quick").onkeydown = (e) => {
    if (e.key === "Escape") { $("#quick").value = ""; $("#quick").blur(); return; }
    if (e.key !== "Enter") return;
    const q = $("#quick").value.trim();
    if (!q) return;
    rechercheRapide(q);
  };
  $("#quickVider").onclick = () => {
    $("#quick").value = "";
    const S0 = S.cmd;
    if (S0 && S0.recherche) { S0.recherche = null; const f = $("#fq"); if (f) { f.value = ""; f.dispatchEvent(new Event("input")); } }
    $("#quick").focus();
  };
  // Une note de migration s'ouvre au clic, au doigt et à la touche Entrée — pas seulement
  // au survol de la souris. Délégation globale : ces boutons naissent dans plusieurs écrans.
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".noteB");
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    dialogue("Note de migration", `<p>${esc(b.dataset.note || "")}</p>`, null, "Fermer");
  });
  document.addEventListener("keydown", raccourcis);
  // BUG-053 — le routage ignorait l'historique : le bouton Retour changeait l'URL sans changer
  // l'écran, et l'on se retrouvait avec « #tarifs » affichant « Scan ».
  addEventListener("hashchange", suivreHash);
  addEventListener("popstate", suivreHash);
  await rafraichirCompteurs();
  S.page = (location.hash || "").slice(1) || "commandes";
  if (!VUES[S.page]) S.page = "commandes";
  menu();
  rendre();
  traduire();
  if (S.moi.must_change) changerMotDePasse(true);
  else if (!S.moi.totp_enabled && S.config.exiger_2fa) configurer2facteur();
  clearInterval(S.tick);
  S.tick = setInterval(() => rafraichirCompteurs(), 60000);
  // Revenir sur l'onglet doit remettre les compteurs à jour tout de suite : c'est le moment
  // où l'on regarde, et où ils ont le plus vieilli.
  addEventListener("visibilitychange", () => { if (!document.hidden) rafraichirCompteurs({ force: true }); });
}

demarrer().catch(() => montrerConnexion());
</script>
</body>
</html>
